<script>

// ---------- matériel ----------
function eqSub(e, c) {

function eqSheet(id) {

// recherche dans la base tarifaire
function eqSearch() {

        const have = new Map(V().eq.map(e => [e.ref, e]));

    };

}
function addRef(id, n) {
    const r = refOf(id); if (!r) return null; const v = V();

        if (a === 'new') { const n = blankVersion(next()); P.versions.push(n); P.cur = n.id; }
        if (a === 'ren') { const nn = prompt('Nom de la version', v.name); if (nn && nn.trim()) v.name = nn.trim().slice(0, 40); }
        if (a === 'del') { XM.closeSheet(); if (await XM.ask('Supprimer la version ?', '« ' + H(v.name) + ' » sera supprimée de cet estimatif.', [{ label: 'Supprimer', danger: true }, 'Annuler']) !== 0) return; P.versions = P.versions.filter(x => x !== v); P.cur = P.versions[0].id; }
        persist(); XM.closeSheet(); render();
    });
}

// ---------- résumé, impression ----------
function summaryText() {
    const v = V(), T = totals(v), R0 = T.R;
    return '💶 DEVIS ESTIMATIF — ' + (P.name || 'Projet') + (P.versions.length > 1 ? ' (' + v.name + ')' : '') + '\n' + (P.client ? 'Client : ' + P.client + '\n' : '') + (P.debut ? '🗓 ' + frDate(P.debut) + (P.fin && P.fin !== P.debut ? ' → ' + frDate(P.fin) : '') + '\n' : '') +
        '\nTotal HT retenu : ' + eur0(R0.ht) + '  (fourchette ' + rng(T.L.ht, T.H.ht) + ')\nTotal TTC : ' + eur0(R0.ttc) + '\n' +
        '\n🎥 Matériel & location : ' + eur0(T.eq.tot) + ' (' + rng(T.eq.lo, T.eq.hi) + ')' + ECATS.filter(c => T.eq.byCat[c[0]]).map(c => '\n   · ' + c[1] + ' : ' + eur0(T.eq.byCat[c[0]].tot)).join('') +
        '\n👥 Équipe : ' + eur0(T.crew.tot) + ' (' + rng(T.crew.lo, T.crew.hi) + ') — ' + plural(T.crew.n, 'personne') + ', brut ' + eur0(T.crew.gross) + ' + charges ' + eur0(T.crew.charges) +
        '\n🍽️ Frais : ' + eur0(T.fees.tot) +
        '\nFrais généraux ' + P.set.fg + ' % · imprévus ' + P.set.imp + ' %' + (+P.set.marge ? ' · marge ' + P.set.marge + ' %' : '') +
        '\n\nEstimation non contractuelle — DEVISO XIII (tarifs publics des loueurs relevés en ' + TARIFS_DATE + ', ' + CONVS[P.set.conv].s + ').\n';
}
function printRecap() {
    const v = V(), T = totals(v), R0 = T.R; let el = Q('#d-print'); if (!el) { el = document.createElement('div'); el.id = 'd-print'; document.body.appendChild(el); }
    const row = (a, b, c) => '<tr><td>' + a + '</td><td style="text-align:right">' + b + '</td><td style="text-align:right;color:#666">' + (c || '') + '</td></tr>';
    el.innerHTML = '<style>#d-print{display:none}@media print{body.xm>*:not(#d-print){display:none!important}#d-print{display:block!important;color:#111;background:#fff;font:12px/1.45 Arial,sans-serif;padding:0}#d-print table{width:100%;border-collapse:collapse;margin:8px 0 14px}#d-print td,#d-print th{border-bottom:1px solid #ddd;padding:5px 6px;text-align:left}#d-print h1{font-size:20px;margin:0 0 4px}#d-print h2{font-size:13px;margin:14px 0 4px;text-transform:uppercase;letter-spacing:.08em;color:#a8662a}@page{size:A4;margin:16mm}}</style>' +
        '<h1>Devis estimatif — ' + H(P.name || 'Projet') + (P.versions.length > 1 ? ' (' + H(v.name) + ')' : '') + '</h1><div>' + H([P.client && 'Client : ' + P.client, P.lieu, P.debut && frDate(P.debut) + (P.fin && P.fin !== P.debut ? ' → ' + frDate(P.fin) : ''), 'Établi le ' + frDate(todayISO())].filter(Boolean).join(' · ')) + '</div>' +
        '<h2>Matériel & location</h2><table>' + v.eq.filter(e => e.on !== false).map(e => { const x = eqCalc(e); return row(H((+e.qty || 0) + ' × ' + (e.name || (x.ref && x.ref.n) || '')), x.missing ? 'à chiffrer' : eur0(x.tot), x.missing ? '' : rng(x.lo, x.hi)); }).join('') + row('<b>Total matériel</b>', '<b>' + eur0(T.eq.tot) + '</b>', rng(T.eq.lo, T.eq.hi)) + '</table>' +
        '<h2>Équipe</h2><table>' + v.crew.filter(c => c.on !== false).map(c => { const k = crewCalc(c); return row(H(crewName(c) + (c.name ? ' — ' + (c.role || k.p.n) : '') + ' · ' + fmtDays(k.days)), k.missing ? 'à chiffrer' : eur0(k.tot), k.missing ? '' : rng(k.lo, k.hi)); }).join('') + row('<b>Total équipe</b>', '<b>' + eur0(T.crew.tot) + '</b>', rng(T.crew.lo, T.crew.hi)) + '</table>' +
        '<h2>Frais</h2><table>' + v.fees.filter(f => f.on !== false).map(f => { const c = feeCalc(f, T.eq); return row(H(c.n), eur0(c.tot), ''); }).join('') + '</table>' +
        '<h2>Total</h2><table>' + row('Sous-total', eur0(R0.st)) + row('Frais généraux ' + P.set.fg + ' %', eur0(R0.fg)) + row('Imprévus ' + P.set.imp + ' %', eur0(R0.imp)) + (+P.set.marge ? row('Marge ' + P.set.marge + ' %', eur0(R0.mg)) : '') + row('<b>Total HT</b>', '<b>' + eur0(R0.ht) + '</b>', 'fourchette ' + rng(T.L.ht, T.H.ht)) + row('TVA ' + P.set.tva + ' %', eur0(R0.tva)) + row('<b>Total TTC</b>', '<b>' + eur0(R0.ttc) + '</b>') + '</table>' +
        (P.notes ? '<p>' + H(P.notes) + '</p>' : '') + '<p style="color:#666;font-size:10.5px">Estimation non contractuelle — DEVISO XIII (tarifs publics des loueurs relevés en ' + TARIFS_DATE + ', ' + H(CONVS[P.set.conv].s) + ').</p>';
    setTimeout(() => { try { window.print(); } catch (e) { } }, 150);
}

// =====================================================================
//  ÉCHANGES AVEC LE BUREAU
// =====================================================================
async function onEnv(env, via) {
    const d = env.data || {};
    if (env.kind !== 'project' || !d.project) { XM.toast('⚠️ Cet envoi n\'est pas un devis du bureau', 4000); return; }
    const p = normalize(d.project), ex = ST.list.find(x => x.P.id === p.id);
    if (ex && ex.changed) {
        const r = await XM.ask('Remplacer l\'estimatif ?', '« ' + H(ex.P.name || 'Sans nom') + ' » a été modifié sur ce téléphone. Le remplacer par la version reçue du bureau ?', [{ label: 'Remplacer', danger: true }, 'Garder les deux', 'Annuler']);
        if (r === 2 || r < 0) return;
        if (r === 1) { p.id = uid(); p.name = (p.name || 'Devis') + ' (bureau)'; }
    }
    addItem(p, { origin: 'desk', base: d.base || null, recv: Date.now(), changed: false });
    TAB = 'tot'; render(); XM.toast('📥 « ' + (p.name || 'Devis') + ' » reçu' + (via === 'link' ? ' par lien' : ''), 3500);
}
function sendReturn() {
    if (!P) { XM.toast('Ouvrez d\'abord un estimatif'); return; }
    XM.send({ app: APPN, page: 'deviso.html', title: 'DEVISO', kind: 'return', name: P.name || 'Estimatif mobile',
        make: () => { const it = ITEM(); return { project: JSON.parse(JSON.stringify(P)), origin: it ? it.origin : 'mobile' }; },
        note: 'Sur l\'ordinateur, ouvrez ce lien ou importez le fichier dans DEVISO (bouton 📱 → Récupérer) : vous choisirez d\'ajouter les versions au devis ouvert ou de remplacer celui-ci.' });
    const it = ITEM(); if (it) { it.changed = false; it.sent = Date.now(); XM.save(APPN, ST); }
}
function openList() {
    const s = XM.sheet('<div class="m-list" style="margin:0">' + ST.list.map(x => '<button class="m-item" data-id="' + x.P.id + '"><span class="ico">' + (x.P.id === ST.cur ? '✅' : x.origin === 'desk' ? '🖥️' : '📱') + '</span><span class="grow"><b>' + H(x.P.name || 'Sans nom') + '</b><small>' + plural(x.P.versions.length, 'version') + (x.origin === 'desk' ? ' · reçu du bureau' : '') + '</small></span><span class="go">›</span></button>').join('') + '</div>' +
        '<div class="m-actions"><button class="m-btn primary" data-n="1">🗒️ Nouvel estimatif</button>' + (P ? '<button class="m-btn danger" data-del="1">🗑️ Supprimer celui-ci</button>' : '') + '</div>', { title: '📋 Mes estimatifs' });
    QQ('[data-id]', s).forEach(b => b.onclick = () => { selectItem(b.dataset.id); TAB = 'tot'; XM.closeSheet(); render(); });
    Q('[data-n]', s).onclick = () => { XM.closeSheet(); selectItem(''); render(); };
    const del = Q('[data-del]', s); if (del) del.onclick = async () => { XM.closeSheet(); if (await XM.ask('Supprimer cet estimatif ?', '« ' + H(P.name || 'Sans nom') + ' » sera effacé de ce téléphone.', [{ label: 'Supprimer', danger: true }, 'Annuler']) !== 0) return; ST.list = ST.list.filter(x => x.P.id !== ST.cur); selectItem(''); render(); };
}

// =====================================================================
//  ÉVÉNEMENTS
// =====================================================================
Q('#d-tabs').addEventListener('click', e => { const b = e.target.closest('button[data-tab]'); if (!b) return; TAB = b.dataset.tab; render(); window.scrollTo(0, 0); });
Q('#d-sum').onclick = () => { TAB = 'tot'; render(); window.scrollTo(0, 0); };
Q('#d-fab').onclick = () => { if (TAB === 'eq') eqSearch(); else if (TAB === 'crew') crewAdd(); };
Q('#d-list').onclick = openList;
Q('#d-menu').onclick = () => XM.menu({ app: APPN, deskPage: 'deviso.html', items: [
    { icon: '🗒️', label: 'Nouvel estimatif', run: () => { selectItem(''); render(); } },
    { icon: '📐', label: 'Charger l\'exemple', sub: 'Captation live 4 caméras', run: loadExampleM },
    P ? { icon: '📋', label: 'Copier le résumé', run: async () => XM.toast(await XM.copy(summaryText()) ? '📋 Résumé copié' : '⚠️ Copie impossible') } : null,
    P ? { icon: '⬇️', label: 'Exporter le devis (.json)', sub: 'S\'ouvre aussi dans DEVISO sur ordinateur (📂 Ouvrir)', run: () => XM.download('DEVISO_XIII_' + safeName(P.name || 'devis') + '_' + todayISO() + '.json', JSON.stringify(P, null, 1)) } : null
].filter(Boolean), onImport: onEnv, sendReturn: P ? sendReturn : null });
const main = Q('#d-main');
main.addEventListener('click', async e => {
    const t = e.target.closest('[data-act],[data-seg],[data-fee]'); if (!t) return;
    if (t.dataset.fee) return;
    if (t.dataset.seg) { setPath(P, t.dataset.seg, t.dataset.v); if (t.dataset.seg === 'set.conv') P.set.convAuto = false; persist(); render(); return; }
    const a = t.dataset.act, id = t.dataset.id, d = +t.dataset.d;
    if (a === 'new') newEstimate(null);
    else if (a === 'newkit') newEstimate(KITS[+t.dataset.i]);
    else if (a === 'example') loadExampleM();
    else if (a === 'open') { selectItem(id); TAB = 'tot'; render(); }
    else if (a === 'ifile') XM.importFile(APPN, onEnv);
    else if (a === 'ilink') XM.importLink(APPN, onEnv);
    else if (a === 'kit') { applyKit(KITS[+t.dataset.i], !V().eq.length && !V().crew.length); render(); }
    else if (a === 'ver') { P.cur = id; persist(); render(); }
    else if (a === 'vermenu') versionMenu();
    else if (a === 'set') { P.set[id] = Math.max(0, (+P.set[id] || 0) + d); persist(); render(); }
    else if (a === 'eqq') { const x = V().eq.find(y => y.id === id); if (!x) return; x.qty = Math.max(0, (+x.qty || 0) + d); if (!x.qty) { if (await XM.ask('Retirer la ligne ?', '« ' + H(x.name) + ' » passe à 0.', ['Retirer', 'Garder à 0']) === 0) V().eq.splice(V().eq.indexOf(x), 1); } persist(); render(); }
    else if (a === 'crd') { const x = V().crew.find(y => y.id === id); if (!x) return; const cur = x.days != null && x.days !== '' ? +x.days : totalDays(); x.days = Math.max(0.5, cur + d * (cur < 1 || (cur === 1 && d < 0) ? 0.5 : 1)); persist(); render(); }
    else if (a === 'eq') eqSheet(id);
    else if (a === 'crew') crewSheet(id);
    else if (a === 'fee') feeSheet(id);
    else if (a === 'feeadd') { const f = { id: uid(), on: true, name: 'Frais', qty: 1, unit: 'forfait', price: 0 }; V().fees.push(f); persist(); feeSheet(f.id); }
    else if (a === 'share') { const txt = summaryText(); if (navigator.share) { try { await navigator.share({ title: 'Devis estimatif — ' + (P.name || ''), text: txt }); } catch (err) { } } else XM.toast(await XM.copy(txt) ? '📋 Résumé copié (partage indisponible)' : '⚠️ Copie impossible'); }
    else if (a === 'copy') XM.toast(await XM.copy(summaryText()) ? '📋 Résumé copié : collez-le dans un message' : '⚠️ Copie impossible');
    else if (a === 'print') printRecap();
    else if (a === 'ret') sendReturn();
});
main.addEventListener('change', e => {
    const t = e.target;
    if (t.dataset.fee) { const f = V().fees.find(x => x.id === t.dataset.fee); if (f) { f.on = t.checked; persist(); render(); } return; }
    if (!t.dataset.f || !P) return;
    const k = t.dataset.f, num = /^set\.(fg|imp|marge|tva|remise|amp)$/.test(k);
    let v = t.value; if (num) v = numOrNull(v) == null ? 0 : numOrNull(v);
    setPath(P, k, v); if (k === 'set.conv') P.set.convAuto = false;
    if (k === 'debut' && (!P.fin || P.fin < P.debut)) P.fin = P.debut;
    persist(); render();
});

// ---------- démarrage ----------
loadState();
if (P) TAB = 'tot';
render();
XM.fromHash(APPN, onEnv);

</script>
</body>
