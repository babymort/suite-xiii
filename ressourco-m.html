    : (prefs.strict === 'text' ? '<mark class="ph">' + (RLANG === 'en' ? 'TO BE DEFINED' : 'À DÉFINIR') + '</mark>' : '<span class="dots">&hellip;&hellip;&hellip;&hellip;&hellip;&hellip;</span>');
function inline(s, doc, row, mode) {
    let h = esc(s);
    h = h.replace(/\{\{\s*(\w+)\s*\}\}/g, (m, k) => { const v = rawVal(row, k); return String(v).trim() ? '<span class="fv">' + esc(fmtVal(k, v)).replace(/\n/g, '<br>') + '</span>' : PH(k, mode); });

}

    const lines = String(doc.text || '').split(/\r?\n/).filter(l => !/^\s*@lang\b/.test(l)); const out = []; let para = [], list = [];
    const flushP = () => { if (para.length) { out.push('<p>' + para.join('<br>') + '</p>'); para = []; } };
    const flushL = () => { if (list.length) { out.push('<ul>' + list.map(x => '<li>' + x + '</li>').join('') + '</ul>'); list = []; } };
    const flush = () => { flushP(); flushL(); };
    lines.forEach(ln => {
        const t = ln.trim();
        if (!t) { flush(); return; }
        let m;
        if ((m = /^# (.*)$/.exec(t))) { flush(); out.push('<h1>' + inline(m[1], doc, row, mode) + '</h1>'); return; }
        if ((m = /^## (.*)$/.exec(t))) { flush(); out.push('<h2>' + inline(m[1], doc, row, mode) + '</h2>'); return; }
        if ((m = /^- (.*)$/.exec(t))) { flushP(); list.push(inline(m[1], doc, row, mode)); return; }
        if ((m = /^@sign\s+(.*)$/.exec(t))) { flush(); const [a, b] = m[1].split('|').map(x => x.trim()); out.push('<div class="xsig"><div><span>' + inline(a || '', doc, row, mode) + '</span></div><div><span>' + inline(b || '', doc, row, mode) + '</span></div></div>'); return; }
        if ((m = /^@rows\s+(\d+)\s*\|(.*)$/.exec(t))) { flush(); const cols = m[2].split('|').map(x => x.trim()); out.push('<table class="xblank"><tr>' + cols.map(c => '<th>' + inline(c, doc, row, mode) + '</th>').join('') + '</tr>' + Array(+m[1]).fill('<tr>' + cols.map(() => '<td>&nbsp;</td>').join('') + '</tr>').join('') + '</table>'); return; }

        if ((m = /^@note\s+(.*)$/.exec(t))) { flush(); out.push('<p class="xnote">' + inline(m[1], doc, row, mode) + '</p>'); return; }
        flushL(); para.push(inline(ln.replace(/\s+$/, ''), doc, row, mode));

}
const rowLabel = (doc, row, i) => { const n = [rawVal(row, 'prenom'), rawVal(row, 'nom')].join(' ').trim() || rawVal(row, 'nom_complet') || rawVal(row, 'lieu') || rawVal(row, 'destinataire') || rawVal(row, 'oeuvre') || rawVal(row, 'role'); return n || ('Document ' + (i + 1)); };
const liveRows = doc => (doc.rows.length ? doc.rows : [{ id: 'x', on: true, v: {} }]).filter(r => r.on !== false);

const PAGE_CSS = `
.xr-page{box-sizing:border-box;background:#fff;color:#111;font-family:Georgia,'Times New Roman',serif;font-size:11pt;line-height:1.5;padding:18mm 20mm;width:210mm;min-height:297mm;margin:0 auto 16px;box-shadow:0 2px 14px rgba(0,0,0,.35);}
.xr-page h1{font-size:15pt;text-align:center;margin:0 0 16px;letter-spacing:.02em;line-height:1.3}
.xr-page h2{font-size:11.5pt;margin:16px 0 4px;border-bottom:1px solid #bbb;padding-bottom:2px}
.xr-page p{margin:0 0 9px}.xr-page ul{margin:2px 0 9px;padding-left:20px}.xr-page li{margin:1px 0}
.xr-page .fv{font-weight:600}.xr-page .dots{color:#777;letter-spacing:1px}
.xr-page mark.ph{background:#ffe08a;color:#7a4b00;padding:0 4px;border-radius:3px;font-family:Arial,sans-serif;font-size:8.5pt;font-weight:bold}
.xr-page .xsig{display:flex;gap:30px;margin-top:26px;page-break-inside:avoid}.xr-page .xsig>div{flex:1;border-top:1px solid #111;padding-top:4px;min-height:70px;font-size:10pt}
.xr-page table.xblank{width:100%;border-collapse:collapse;margin-top:6px;font-size:10pt}.xr-page table.xblank th,.xr-page table.xblank td{border:1px solid #444;padding:4px 6px;text-align:left}.xr-page table.xblank td{height:7.5mm}.xr-page table.xblank th{background:#eee}
.xr-page .xnote{font-size:8.5pt;color:#555;font-style:italic;margin-top:14px}
.xr-page .xbrk{page-break-after:always;height:0}
`;
function pagesHtml(items, mode) { return items.map(it => '<div class="xr-page">' + renderDoc(it.doc, it.row, mode) + '</div>').join('\n'); }
function itemsOf(docs) { const out = []; docs.forEach(doc => liveRows(doc).forEach((row, i) => out.push({ doc, row, i, label: rowLabel(doc, row, i) }))); return out; }

// ---------- Sauvegarde ----------
let saveT = null, toastT = null;
function dirty() { $('save-state').textContent = 'Modifications…'; clearTimeout(saveT); saveT = setTimeout(() => saveProject(false), 700); }
function saveProject(explicit) {
    clearTimeout(saveT);
    const ok = store.set(KEY_PROJECT, JSON.stringify(P));
    $('save-state').textContent = ok ? 'Enregistré · ' + pad2(new Date().getHours()) + ':' + pad2(new Date().getMinutes()) : '⚠️ Non enregistré (stockage plein ?)';
    if (explicit) toast(ok ? '💾 Enregistré dans ce navigateur' : '⚠️ Enregistrement impossible : exportez le fichier');
}
function savePrefs() { store.set(KEY_PREFS, JSON.stringify(prefs)); }
function saveMy() { store.set(KEY_MY, JSON.stringify(MY)); }
function download(content, name, type) {
    const blob = content instanceof Blob ? content : new Blob([content], { type: type || 'text/plain' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function toast(msg, ms) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), ms || 2800); }

</script>
<script>

}
function badge() { const n = P.docs.reduce((a, d) => a + rowsOn(d).length, 0), b = $('#r-bdg'); b.hidden = !n; b.textContent = n; }

function sigHtml(html, row) {

    return html + '<div class="xsig-end"><img alt="Signature" src="' + row.sig + '"><span>' + esc([rawVal(row, 'prenom'), rawVal(row, 'nom')].join(' ').trim() || row.signer || 'Signataire') + (row.signedAt ? ', le ' + longDate(new Date(row.signedAt).toISOString().slice(0, 10)) : '') + '</span></div>';
}
const pagesFor = (items, mode) => items.map(it => '<div class="xr-page">' + sigHtml(renderDoc(it.doc, it.row, mode), it.row) + '</div>').join('\n');
const itemsFor = docs => itemsOf(docs).filter(x => x.row && x.doc);
function standalone(items, title) {
    return '<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>' + esc(title) + '</title><style>' + PAGE_CSS + SIG_CSS + 'body{background:#e5e5e5;margin:0;padding:12px}@media(max-width:820px){.xr-page{width:auto;min-height:0;padding:16px 14px;margin-bottom:12px}}@media print{body{background:#fff;padding:0}.xr-page{box-shadow:none;margin:0;width:auto;min-height:0;padding:0;page-break-after:always}.xr-page:last-child{page-break-after:auto}@page{size:A4;margin:18mm 20mm}}</style></head><body>' + pagesFor(items, 'print') + '</body></html>';
}

    const css = (PAGE_CSS + SIG_CSS).replace(/box-shadow:[^;}]*;?/g, '').replace(/width:210mm;min-height:297mm;margin:0 auto 16px;/, '').replace(/padding:18mm 20mm;/, '');
    return '﻿<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><title>' + esc(title) + '</title><style>@page{size:21cm 29.7cm;margin:2cm}' + css + '</style></head><body>' + items.map(it => '<div class="xr-page" style="page-break-after:always">' + sigHtml(renderDoc(it.doc, it.row, 'print'), it.row) + '</div>').join('\n') + '</body></html>';

function textOf(doc, row) {
    const sub = s => String(s).replace(/\{\{\s*(\w+)\s*\}\}/g, (m, k) => { const v = rawVal(row, k); return String(v).trim() ? fmtVal(k, v) : '……………'; }).replace(/\*\*([^*]+)\*\*/g, '$1');
    const out = [];
    String(doc.text || '').split(/\r?\n/).forEach(ln => {
        const t = ln.trim(); let m;
        if (!t) { out.push(''); return; }

        if ((m = /^- (.*)$/.exec(t))) { out.push('• ' + sub(m[1])); return; }

// ---------- création de documents ----------
function pullPeople(from, to) {

    from.rows.filter(r => nameKey(r)).forEach(r => { const t = mkRow(); to.rows.push(t); PEOPLE_KEYS.forEach(k => { if (!keys.includes(k) && !['prenom', 'nom'].includes(k)) return; if (r.v[k]) t.v[k] = r.v[k]; }); t.mod = Date.now(); });
}
function addDoc(model) {
    const d = { id: uid(), tpl: model.id, name: model.name, title: model.title || model.name, text: model.text, rows: [mkRow()], mob: 1 };
    const src = P.docs.find(x => x.rows.some(r => nameKey(r)));
    P.docs.push(d); P.cur = d.id;
    if (src) { d.rows = []; pullPeople(src, d); if (!d.rows.length) d.rows = [mkRow()]; }
    return d;
}

    const ex = P.docs.find(d => d.tpl === model.id);
    if (ex) { P.cur = ex.id; save(); setTab('fill'); XM.toast('📄 « ' + model.name + ' » est déjà dans le projet'); return; }

    let n = 0, first = null; pk.ids.forEach(id => { const m = modelOf(id); if (!m) return; const ex = P.docs.find(d => d.tpl === id); if (ex) { first = first || ex; return; } const d = addDoc(m); first = first || d; n++; });
    if (first) P.cur = first.id; save(); S.open = ''; setTab('fill'); XM.toast('📦 ' + pk.name + ' : ' + plural(n, 'document') + ' ajouté' + (n > 1 ? 's' : ''));

// =====================================================================
//  ÉCRANS
// =====================================================================
const main = () => $('#r-main');
function setTab(t) { S.tab = t; render(); window.scrollTo(0, 0); }
function render() {
    $$('#r-tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === S.tab)); badge();
    $('#r-sub').textContent = (P.common.titre || P.name || 'Documents express') + (P.docs.length ? '' : '');

}
function renderNew() {
    const cats = [['packs', '📦', 'Packs']].concat(CATS_M.filter(c => c[0] !== 'mine' || MY.length).map(c => [c[0], c[1], c[2]]));
    main().innerHTML = '<div class="m-card accent"><h3>📝 Des documents en quelques gestes</h3><p style="margin:0 0 4px;font-size:14px">Choisissez un modèle, renseignez la production une seule fois, puis une ligne par personne : aperçu fidèle, signature au doigt, PDF.</p>' +
        (P.fromDesk ? '<p class="m-hint" style="margin:6px 0 0">Projet reçu du bureau : « ' + esc(P.name || P.common.titre || '') + ' ».</p>' : '<p class="m-hint" style="margin:6px 0 0">Pour reprendre un projet du bureau : 📱 dans RESSOURCO XIII, puis scannez le QR code, collez le lien (menu ⋯) ou importez le fichier.</p>') +
        (!P.docs.length ? '<div class="m-actions"><button class="m-btn" id="n-ex">🎬 Essayer avec un exemple</button></div>' : '') + '</div>' +
        '<input type="search" id="n-q" placeholder="Rechercher un modèle (droit à l\'image, contrat, lieu…)" value="' + esc(S.q) + '" style="margin-bottom:10px"><div class="m-chips" id="n-cats">' + cats.map(c => '<button class="m-chip' + (!S.q && S.cat === c[0] ? ' on' : '') + '" data-c="' + c[0] + '">' + c[1] + ' ' + esc(c[2]) + '</button>').join('') + '</div><div id="n-list"></div>';
    if ($('#n-ex')) $('#n-ex').onclick = () => { loadExample(); };
    $('#n-q').oninput = e => { S.q = e.target.value; $$('#n-cats .m-chip').forEach(b => b.classList.toggle('on', !S.q && b.dataset.c === S.cat)); drawModels(); };
    $$('#n-cats .m-chip').forEach(b => b.onclick = () => { S.cat = b.dataset.c; S.q = ''; $('#n-q').value = ''; $$('#n-cats .m-chip').forEach(x => x.classList.toggle('on', x === b)); drawModels(); });

    const box = $('#n-list'), q = fold(S.q.trim()); let html = '';

    const t = Date.now(); P.sentAt = t; P.docs.forEach(d => d.rows.forEach(r => { if (unsentRow(r)) r.sent = t; })); save(true); if (S.tab === 'docs') renderDocs();
