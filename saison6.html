<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Suite XIII saison 6</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;800&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout : une colonne de lecture, phases empilées, lignes d'outil type conducteur TV (TC à gauche, statut à droite) */
:root{--bg:#f3f1ee;--panel:#fff;--fg:#1d1b19;--dim:#6d675f;--line:#ddd7cf;--acc:#b8651f;--ok:#2e7d32;--now:#c26a1c;
--disp:'Archivo',system-ui,sans-serif;--body:'IBM Plex Sans',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1a19;--panel:#252321;--fg:#f1ece6;--dim:#a39b91;--line:#3a3632;--acc:#f0b378;--ok:#81c784;--now:#f0b378;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1a19;--panel:#252321;--fg:#f1ece6;--dim:#a39b91;--line:#3a3632;--acc:#f0b378;--ok:#81c784;--now:#f0b378;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--body);padding:32px 16px 64px}
main{max-width:860px;margin:0 auto;display:grid;gap:28px}
h1{font:800 clamp(28px,5vw,44px)/1.05 var(--disp);letter-spacing:.02em;margin:0;text-wrap:balance}
h1 i{color:var(--acc);font-style:normal}
.lead{color:var(--dim);max-width:62ch;margin:8px 0 0}
.prog{display:flex;gap:14px;align-items:center;font:500 13px var(--mono);color:var(--dim)}
.bar{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}.bar b{display:block;height:100%;background:var(--acc)}
section h2{font:800 13px var(--disp);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:0 0 8px;display:flex;justify-content:space-between}
ol{list-style:none;margin:0;padding:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
li{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;padding:12px 14px;border-top:1px solid var(--line);align-items:start}
li:first-child{border-top:0}
.n{font:500 13px var(--mono);color:var(--dim);padding-top:2px}
.t b{font-weight:600}.t small{display:block;color:var(--dim);font-size:13px}
.tool{font:500 11px var(--mono);letter-spacing:.06em;color:var(--acc);margin-right:6px}
.st{font:500 11px var(--mono);padding:3px 8px;border-radius:99px;border:1px solid var(--line);color:var(--dim);white-space:nowrap}
li.now{background:color-mix(in srgb,var(--now) 10%,var(--panel))}li.now .st{border-color:var(--now);color:var(--now)}
li.done .st{border-color:var(--ok);color:var(--ok)}li.done .t b{text-decoration:line-through;text-decoration-color:var(--dim)}
</style>
<main>
<header><h1>SUITE <i>XIII</i> — saison 6</h1><p class="lead"><b>Saison 6 : le design et l'ergonomie.</b> Un thème sobre, des outils qui se ressemblent et se manient de la même façon partout. Toutes les propositions sont retenues (07/11) ; les retours sont corrigés en premier.</p></header>
<div class="prog"><span id="pc"></span><div class="bar"><b id="pb"></b></div></div>
<div id="r"></div>
</main>
<script>
const P=[["Phase 0 · Corrections (retours)", [["TOUS LES OUTILS", "Visite guidée à la première ouverture", "Fait le 07/11 : depuis la barre d'onglets, les outils s'ouvrent dans un onglet de la suite et la visite ne démarrait plus du tout (elle ne se lançait que dans une fenêtre seule). Elle démarre maintenant dans les onglets, et passe devant le 📖 Guide qui s'ouvrait d'office sur un outil vide.", "done"], ["BARRE DU HAUT", "« Votre nom » ne se fait plus recouvrir", "Fait le 07/11 : le champ du nom (25 outils) devient une pastille compacte (initiales + prénom, ex. « ML Matthieu L. »). Un clic ouvre le champ, l'📇 annuaire et la 🎬 fiche projet. Il reste utile : c'est la signature des PDF, rapports et avis, reprise du profil d'équipe ; il ne prend plus de place dans la barre.", "done"], ["SYNO → PLANO", "Passerelle réparée", "Fait le 07/11 : 📤 Vers Suite XIII › PLANO ne trouvait pas le bouton d'envoi (rangé dans 📋 Liste du matériel) et ouvrait PLANO à vide avec « ⚠️ Ce trajet n'a pas encore d'envoi automatique ». Il envoie maintenant les équipements, qui arrivent dans PLANO à placer sur le plan (vérifié par robot : 8 équipements reçus, aucun doublon au 2e envoi). Le faux avertissement ne s'affiche plus après un envoi direct.", "done"], ["MATOS + CATALOGUE", "Fusionner MATOS et CATALOGUE", "Fait le 07/11 : MATOS contenait déjà le catalogue (onglet « Catalogue générique »). CATALOGUE n'est plus un outil à part : retiré de la recherche, des passerelles et du menu 📤 (ses envois partent désormais de MATOS) ; ses anciennes adresses ouvrent MATOS sur l'onglet Catalogue. Données inchangées (même stockage).", "done"], ["IMPORTO", "Retirer IMPORTO", "Fait le 07/11 : retiré de la recherche, des passerelles et du menu 📤 ; l'adresse importo.html ouvre l'accueil, la fiche projet et « 📥 Importer depuis un logiciel du métier ».", "done"], ["RECHERCHE", "Les outils en tête des résultats", "Fait le 07/11 : dans la recherche (Ctrl K et le nouveau champ de l'accueil), la rubrique « Outils » passe toujours en premier, dans les 34 outils.", "done"], ["ACCUEIL", "Barre de recherche en haut à gauche", "Fait le 07/11 : champ « 🔎 Rechercher… Ctrl K » en haut à gauche de l'accueil (le grand logo descend un peu pour lui laisser la place) ; il ouvre la même recherche.", "done"], ["CONDUCO", "Barre d'outils à la même taille", "Fait le 07/11 : mesuré par robot sur les 29 outils à barres. Avant : barre du haut de 40 à 52 px, seconde barre de 47 à 53 px, boutons de 27 ou 29 px, boutons de CONDUCO, PLANO, GRAPHICO… plus étroits. Après : barre du haut 48 px et seconde barre 51 px partout, boutons de 30 px de haut et même largeur minimale (42 px, 32 px sous 1 280 px de large). Contrôlé à 1 024, 1 366 et 1 920 px : aucun débordement.", "done"], ["TOUTE LA SUITE", "Retours au fil de la saison", "Chaque problème signalé est ajouté ici, corrigé, puis vérifié.", "now"]]], ["Phase A · Design « Sobre » (noir mat, lignes fines, couleurs de la suite)", [["TOUTE LA SUITE", "★ Thème « ◼️ Sobre »", "Fait le 07/11 : nouveau thème dans ⚙️ › Affichage › Thème, pour tous les outils, l'accueil et la barre d'onglets. Fond noir mat, séparateurs d'un trait, en-têtes de colonnes en petites capitales grises, boutons sombres à liseré fin, orange XIII pour l'action et l'état actif. Aucune transparence, aucun flou, aucune lueur, aucun dégradé. La barre d'onglets suit désormais le thème choisi dans les outils (avant : seulement celui du système).", "done"], ["TOUTE LA SUITE", "Sobre clair", "La même rigueur en version claire (fond blanc cassé, traits gris, orange plus foncé pour rester lisible).", ""], ["APP ÉQUIPE / MOBILE", "Sobre sur téléphone", "L'app équipe et les 22 pages téléphone suivent le thème Sobre (aujourd'hui : clair ou sombre seulement).", ""], ["TOUTE LA SUITE", "Icônes au trait partout", "Les émojis restants (menus, panneaux, en-têtes de sections, tuiles de l'accueil) remplacés par les icônes fines déjà utilisées dans les barres ; émojis gardés en option.", ""], ["TOUTE LA SUITE", "Une seule échelle typographique", "Quatre tailles de texte seulement, mêmes graisses partout ; chiffres (horaires, TC, montants, durées) en police à chasse fixe alignée, comme sur la photo de référence.", ""], ["ACCUEIL", "Accueil épuré", "Grand logo plus discret, tableau de bord en une grille régulière, tuiles d'outils en liste compacte (icône, nom, dernière modification).", ""], ["TOUTE LA SUITE", "Densité réglable", "Confortable / Compact : hauteur des lignes, marges et barres resserrées pour voir plus de lignes à l'écran (tableaux de DEVISO, CONDUCO, PACKINGO…).", ""]]], ["Phase B · Ergonomie", [["TOUTE LA SUITE", "★ Barre du haut identique pour tout le monde", "La première barre est la même dans les 34 outils, au pixel près, de gauche à droite : 🏠 Accueil · logo de l'outil · onglets du document (journées, versions…) ＋ │ 🔎 Rechercher │ 🗒️ Nouveau ▾ · 📂 Ouvrir · 💾 Enregistrer · ⬇️ Exporter ▾ (tous les formats et l'impression dans un seul menu) │ 📤 Vers Suite XIII · 🔗 Partager │ 👥 Équipe · ☁️ Drive · pastille du nom. Rien de propre à un outil n'y reste : tout le reste descend dans la seconde barre. — En cours (07/11) : fait dans 24 outils (ordre 🏠 · logo · onglets ＋ │ 🔎 │ 🗒️ Nouveau ▾ · 📂 · 💾 · ⬇️ Exporter ▾ │ 📤 · 🔗 │ 👥 · ☁️ · pastille). Exporter ▾ réunit les formats de rendu, l'impression, les tableaux et le fichier du projet ; Nouveau ▾ réunit document vierge et exemples. Les boutons propres à l'outil sont descendus en tête de la seconde barre (rangement par secteurs en phase B2). Reste : CALENDRIER, PLANNO, CONTROLE, ENCODO et LUDO (barre construite autrement), et 👥 / 🗒️ absents de quelques outils (CADRO, DOSSIER, GRAPHICO, MATOS, REPERO…).", "now"], ["TOUTE LA SUITE", "Inspecteur à droite", "Un seul panneau de propriétés pour l'élément sélectionné, au même endroit et avec la même présentation dans chaque outil (au lieu de fenêtres différentes).", ""], ["TOUTE LA SUITE", "Moins de fenêtres", "Les fenêtres qui couvrent l'écran deviennent des panneaux latéraux quand c'est possible : on garde son travail sous les yeux.", ""], ["TOUTE LA SUITE", "Mode focus", "Une touche masque barres et panneaux pour ne garder que la zone de travail (écriture dans SCRIPTO, plan dans PLANO, conducteur à l'antenne…).", ""], ["TOUTE LA SUITE", "Clic droit cohérent", "Même menu contextuel partout : Modifier, Dupliquer, Copier, Supprimer, puis les actions propres à l'élément.", ""], ["TOUTE LA SUITE", "Raccourcis harmonisés", "Même touche = même action dans tous les outils (N nouveau, D dupliquer, Suppr, F focus, Ctrl+E exporter…), fiche « ? » à jour.", ""], ["TOUTE LA SUITE", "Écrans vides utiles", "Un outil vide propose trois choix clairs : partir d'un exemple, importer, commencer de zéro — au lieu d'une zone blanche.", ""]]], ["Phase B2 · Seconde barre : propre à l'outil, mais rangée pareil partout", [["TOUTE LA SUITE", "★ Cinq secteurs, toujours dans le même ordre", "Proposition (à valider) : ① Créer — ajouter ce que l'outil fabrique (séquence, plan, ligne de devis, équipement, câble…) · ② Modifier — annuler / rétablir, dupliquer, aligner, outils d'édition · ③ Afficher — vues, zoom, filtres, calques, mode focus · ④ Outils métier — ce qui n'existe que dans cet outil (calculs, minutage, TC, météo, puissance électrique…) · ⑤ Assistants — ✨ IA, 🤖 préremplir, vérifications, reprises depuis les autres outils. À droite, séparé : l'état (compteurs, « Enregistré à… »). Un secteur vide n'apparaît pas ; l'ordre ne change jamais.", ""], ["TOUTE LA SUITE", "Repères visuels des secteurs", "Un trait fin entre secteurs, le nom du secteur au survol et dans la visite guidée ; mêmes icônes pour les mêmes gestes d'un outil à l'autre (＋ créer, ⧉ dupliquer, 👁 vue…).", ""], ["TOUTE LA SUITE", "Inventaire bouton par bouton", "Robot : tous les boutons des secondes barres des 34 outils listés avec leur secteur proposé, dans un tableau à relire ensemble avant de déplacer quoi que ce soit.", ""], ["TOUTE LA SUITE", "Application outil par outil", "Par familles : Concevoir (MOODO, STORYBOARDO, SCRIPTO, DECOUP, CADRO, GRAPHICO) → Organiser (PLANNO, CASTO, DEVISO, RESSOURCO, MATOS, REPERO…) → Tourner (CALL SHEETO, CONDUCO, SYNO, PLANO, SONO, LUMO, RUNO…) → Livrer (POSTO, BACKUPO, SOUSTITRO, ENCODO, DOSSIER). Visite guidée et raccourcis mis à jour à chaque famille.", ""], ["TOUTE LA SUITE", "Même hauteur, même taille partout", "Barres de même hauteur, boutons de même taille et mêmes espacements dans les 34 outils, quel que soit le thème ; contrôle par robot à chaque publication.", ""]]], ["Phase C · Code commun", [["TOUTE LA SUITE", "★ Code commun partagé", "Fait le 07/11 : 61 modules communs (≈ 1,1 Mo recopiés dans chaque outil) rangés une seule fois dans 8 fichiers partagés lib/core-*.js, et les 25 modules de la saison 5–6 dans lib/ ; chaque page ne garde que son code propre (SCRIPTO ≈ 1,9 Mo → 0,5 Mo, site ≈ 68 Mo → 35 Mo). Fichiers versionnés (empreinte) et gardés hors ligne par le service worker. Vérifié par robots : test général 79 pages sans erreur ; comparaison avant / après des 34 outils identique (modules, boutons, erreurs) ; zéro plantage sur 32 outils ; 96 passerelles (les 12 de CATALOGUE / IMPORTO retirées) sans erreur ni régression ; hors ligne après une première visite ; ouverture en général plus rapide. Désormais une correction du code commun se fait une fois (xiii-src/core) et s'applique aux 34 outils.", "done"]]], ["Phase ZZ · Optimisation de fin de saison (à refaire à chaque saison, avant de publier)", [["TOUTE LA SUITE", "Numéros de version et notes de mise à jour", "", ""], ["BOUTONS", "Regrouper les nouveaux boutons", "", ""], ["BOUTONS", "Espacement et alignement", "", ""], ["CHARGEMENT", "Barres complètes dès l'ouverture", "", ""], ["FIABILITÉ", "Zéro plantage", "", ""], ["VITESSE", "Tout est rapide", "", ""], ["PASSERELLES", "Les outils se parlent", "", ""], ["MOBILE", "Application et versions téléphone", "", ""], ["ACCESSIBILITÉ", "Confort pour tous", "", ""], ["PUBLICATION", "★ Publier la saison", "Notes de version, versions affichées sur l'accueil, puis « publie » : mise en ligne sur le site public.", ""]]]];
let n=0,d=0,h='';P.forEach(([ph,it])=>{h+='<section><h2><span>'+ph+'</span><span>'+it.length+'</span></h2><ol>';it.forEach(x=>{n++;const s=x[3]||'';if(s==='done')d++;h+='<li class="'+s+'"><span class="n">'+String(n).padStart(2,'0')+'</span><span class="t"><span class="tool">'+x[0]+'</span><b>'+x[1]+'</b>'+(x[2]?'<small>'+x[2]+'</small>':'')+'</span><span class="st">'+(s==='done'?'✓ livré':s==='now'?'en cours':s==='idee'?'proposition':'à faire')+'</span></li>'});h+='</ol></section>'});
document.getElementById('r').innerHTML=h;document.getElementById('pc').textContent=d+' / '+n+' livrées';document.getElementById('pb').style.width=(d/n*100)+'%';
</script>
