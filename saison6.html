<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Suite XIII saison 6</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;800&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout : une colonne de lecture, phases empilées, lignes d'outil type conducteur TV (TC à gauche, statut à droite) */
:root{--bg:#f3f1ee;--panel:#fff;--fg:#1d1b19;--dim:#6d675f;--line:#ddd7cf;--acc:#b8651f;--ok:#2e7d32;--now:#c26a1c;
--disp:'Archivo',system-ui,sans-serif;--body:'IBM Plex Sans',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1a19;--panel:#252321;--fg:#f1ece6;--dim:#a39b91;--line:#3a3632;--acc:#f0b378;--ok:#81c784;--now:#f0b378;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1a19;--panel:#252321;--fg:#f1ece6;--dim:#a39b91;--line:#3a3632;--acc:#f0b378;--ok:#81c784;--now:#f0b378;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--body);padding:32px 16px 64px}
main{max-width:860px;margin:0 auto;display:grid;gap:28px}
h1{font:800 clamp(28px,5vw,44px)/1.05 var(--disp);letter-spacing:.02em;margin:0;text-wrap:balance}
h1 i{color:var(--acc);font-style:normal}
.lead{color:var(--dim);max-width:62ch;margin:8px 0 0}
.prog{display:flex;gap:14px;align-items:center;font:500 13px var(--mono);color:var(--dim)}
.bar{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}.bar b{display:block;height:100%;background:var(--acc)}
section h2{font:800 13px var(--disp);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:0 0 8px;display:flex;justify-content:space-between}
ol{list-style:none;margin:0;padding:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
li{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;padding:12px 14px;border-top:1px solid var(--line);align-items:start}
li:first-child{border-top:0}
.n{font:500 13px var(--mono);color:var(--dim);padding-top:2px}
.t b{font-weight:600}.t small{display:block;color:var(--dim);font-size:13px}
.tool{font:500 11px var(--mono);letter-spacing:.06em;color:var(--acc);margin-right:6px}
.st{font:500 11px var(--mono);padding:3px 8px;border-radius:99px;border:1px solid var(--line);color:var(--dim);white-space:nowrap}
li.now{background:color-mix(in srgb,var(--now) 10%,var(--panel))}li.now .st{border-color:var(--now);color:var(--now)}
li.done .st{border-color:var(--ok);color:var(--ok)}li.done .t b{text-decoration:line-through;text-decoration-color:var(--dim)}
</style>
<main>
<header><h1>SUITE <i>XIII</i> — saison 6</h1><p class="lead"><b>Saison 6 : le design et l'ergonomie.</b> Un thème sobre, des outils qui se ressemblent et se manient de la même façon partout. Les lignes « proposition » sont à choisir : on garde, on retire ou on change l'ordre.</p></header>
<div class="prog"><span id="pc"></span><div class="bar"><b id="pb"></b></div></div>
<div id="r"></div>
</main>
<script>
const P=[["Phase A · Design « Sobre » (noir mat, lignes fines, couleurs de la suite)", [["TOUTE LA SUITE", "★ Thème « ◼️ Sobre »", "Fait le 07/11 : nouveau thème dans ⚙️ › Affichage › Thème, pour tous les outils, l'accueil et la barre d'onglets. Fond noir mat, séparateurs d'un trait, en-têtes de colonnes en petites capitales grises, boutons sombres à liseré fin, orange XIII pour l'action et l'état actif. Aucune transparence, aucun flou, aucune lueur, aucun dégradé. La barre d'onglets suit désormais le thème choisi dans les outils (avant : seulement celui du système).", "done"], ["TOUTE LA SUITE", "Sobre clair", "La même rigueur en version claire (fond blanc cassé, traits gris, orange plus foncé pour rester lisible).", "idee"], ["APP ÉQUIPE / MOBILE", "Sobre sur téléphone", "L'app équipe et les 22 pages téléphone suivent le thème Sobre (aujourd'hui : clair ou sombre seulement).", "idee"], ["TOUTE LA SUITE", "Icônes au trait partout", "Les émojis restants (menus, panneaux, en-têtes de sections, tuiles de l'accueil) remplacés par les icônes fines déjà utilisées dans les barres ; émojis gardés en option.", "idee"], ["TOUTE LA SUITE", "Une seule échelle typographique", "Quatre tailles de texte seulement, mêmes graisses partout ; chiffres (horaires, TC, montants, durées) en police à chasse fixe alignée, comme sur la photo de référence.", "idee"], ["ACCUEIL", "Accueil épuré", "Grand logo plus discret, tableau de bord en une grille régulière, tuiles d'outils en liste compacte (icône, nom, dernière modification).", "idee"], ["TOUTE LA SUITE", "Densité réglable", "Confortable / Compact : hauteur des lignes, marges et barres resserrées pour voir plus de lignes à l'écran (tableaux de DEVISO, CONDUCO, PACKINGO…).", "idee"]]], ["Phase B · Ergonomie", [["TOUTE LA SUITE", "Même barre dans tous les outils", "Ordre identique partout : Fichier · Annuler / Rétablir · Vue · Ajouter · Exporter · Partager / 📤 Vers Suite XIII ; les actions propres à l'outil à droite, toujours au même endroit.", "idee"], ["TOUTE LA SUITE", "Inspecteur à droite", "Un seul panneau de propriétés pour l'élément sélectionné, au même endroit et avec la même présentation dans chaque outil (au lieu de fenêtres différentes).", "idee"], ["TOUTE LA SUITE", "Moins de fenêtres", "Les fenêtres qui couvrent l'écran deviennent des panneaux latéraux quand c'est possible : on garde son travail sous les yeux.", "idee"], ["TOUTE LA SUITE", "Mode focus", "Une touche masque barres et panneaux pour ne garder que la zone de travail (écriture dans SCRIPTO, plan dans PLANO, conducteur à l'antenne…).", "idee"], ["TOUTE LA SUITE", "Clic droit cohérent", "Même menu contextuel partout : Modifier, Dupliquer, Copier, Supprimer, puis les actions propres à l'élément.", "idee"], ["TOUTE LA SUITE", "Raccourcis harmonisés", "Même touche = même action dans tous les outils (N nouveau, D dupliquer, Suppr, F focus, Ctrl+E exporter…), fiche « ? » à jour.", "idee"], ["TOUTE LA SUITE", "Écrans vides utiles", "Un outil vide propose trois choix clairs : partir d'un exemple, importer, commencer de zéro — au lieu d'une zone blanche.", "idee"]]], ["Phase C · Code commun", [["TOUTE LA SUITE", "★ Code commun partagé", "Les modules communs (barres, thèmes, accessibilité, passerelles…) dans un fichier partagé au lieu d'être recopiés dans 34 pages : pages plus légères, ouverture plus rapide, une correction s'applique partout d'un coup.", "idee"], ["OUTILS", "Passer sur Claude Code", "Reporté de la saison 5 : à décider si le chantier du code commun demande beaucoup de vérifications en ligne.", "idee"]]], ["Phase ZZ · Optimisation de fin de saison (à refaire à chaque saison, avant de publier)", [["TOUTE LA SUITE", "Numéros de version et notes de mise à jour", "", ""], ["BOUTONS", "Regrouper les nouveaux boutons", "", ""], ["BOUTONS", "Espacement et alignement", "", ""], ["CHARGEMENT", "Barres complètes dès l'ouverture", "", ""], ["FIABILITÉ", "Zéro plantage", "", ""], ["VITESSE", "Tout est rapide", "", ""], ["PASSERELLES", "Les outils se parlent", "", ""], ["MOBILE", "Application et versions téléphone", "", ""], ["ACCESSIBILITÉ", "Confort pour tous", "", ""], ["PUBLICATION", "★ Publier la saison", "Notes de version, versions affichées sur l'accueil, puis « publie » : mise en ligne sur le site public.", ""]]]];
let n=0,d=0,h='';P.forEach(([ph,it])=>{h+='<section><h2><span>'+ph+'</span><span>'+it.length+'</span></h2><ol>';it.forEach(x=>{n++;const s=x[3]||'';if(s==='done')d++;h+='<li class="'+s+'"><span class="n">'+String(n).padStart(2,'0')+'</span><span class="t"><span class="tool">'+x[0]+'</span><b>'+x[1]+'</b>'+(x[2]?'<small>'+x[2]+'</small>':'')+'</span><span class="st">'+(s==='done'?'✓ livré':s==='now'?'en cours':s==='idee'?'proposition':'à faire')+'</span></li>'});h+='</ol></section>'});
document.getElementById('r').innerHTML=h;document.getElementById('pc').textContent=d+' / '+n+' livrées';document.getElementById('pb').style.width=(d/n*100)+'%';
</script>

</body></html>
