<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Suite XIII saison 6</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;800&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout : une colonne de lecture, phases empilées, lignes d'outil type conducteur TV (TC à gauche, statut à droite) */
:root{--bg:#f3f1ee;--panel:#fff;--fg:#1d1b19;--dim:#6d675f;--line:#ddd7cf;--acc:#b8651f;--ok:#2e7d32;--now:#c26a1c;
--disp:'Archivo',system-ui,sans-serif;--body:'IBM Plex Sans',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1a19;--panel:#252321;--fg:#f1ece6;--dim:#a39b91;--line:#3a3632;--acc:#f0b378;--ok:#81c784;--now:#f0b378;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1a19;--panel:#252321;--fg:#f1ece6;--dim:#a39b91;--line:#3a3632;--acc:#f0b378;--ok:#81c784;--now:#f0b378;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--body);padding:32px 16px 64px}
main{max-width:860px;margin:0 auto;display:grid;gap:28px}
h1{font:800 clamp(28px,5vw,44px)/1.05 var(--disp);letter-spacing:.02em;margin:0;text-wrap:balance}
h1 i{color:var(--acc);font-style:normal}
.lead{color:var(--dim);max-width:62ch;margin:8px 0 0}
.prog{display:flex;gap:14px;align-items:center;font:500 13px var(--mono);color:var(--dim)}
.bar{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}.bar b{display:block;height:100%;background:var(--acc)}
section h2{font:800 13px var(--disp);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:0 0 8px;display:flex;justify-content:space-between}
ol{list-style:none;margin:0;padding:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
li{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;padding:12px 14px;border-top:1px solid var(--line);align-items:start}
li:first-child{border-top:0}
.n{font:500 13px var(--mono);color:var(--dim);padding-top:2px}
.t b{font-weight:600}.t small{display:block;color:var(--dim);font-size:13px}
.tool{font:500 11px var(--mono);letter-spacing:.06em;color:var(--acc);margin-right:6px}
.st{font:500 11px var(--mono);padding:3px 8px;border-radius:99px;border:1px solid var(--line);color:var(--dim);white-space:nowrap}
li.now{background:color-mix(in srgb,var(--now) 10%,var(--panel))}li.now .st{border-color:var(--now);color:var(--now)}
li.done .st{border-color:var(--ok);color:var(--ok)}li.done .t b{text-decoration:line-through;text-decoration-color:var(--dim)}
</style>
<main>
<header><h1>SUITE <i>XIII</i> — saison 6</h1><p class="lead"><b>Saison 6 : le design et l'ergonomie.</b> Un thème sobre, des outils qui se ressemblent et se manient de la même façon partout. Toutes les propositions sont retenues (07/11) ; les retours sont corrigés en premier.</p></header>
<div class="prog"><span id="pc"></span><div class="bar"><b id="pb"></b></div></div>
<div id="r"></div>
</main>
<script>
const P=[["Phase 0 · Corrections (retours)", [["TOUS LES OUTILS", "Visite guidée à la première ouverture", "Fait le 07/11 : depuis la barre d'onglets, les outils s'ouvrent dans un onglet de la suite et la visite ne démarrait plus du tout (elle ne se lançait que dans une fenêtre seule). Elle démarre maintenant dans les onglets, et passe devant le 📖 Guide qui s'ouvrait d'office sur un outil vide.", "done"], ["BARRE DU HAUT", "« Votre nom » ne se fait plus recouvrir", "Fait le 07/11 : le champ du nom (25 outils) devient une pastille compacte (initiales + prénom, ex. « ML Matthieu L. »). Un clic ouvre le champ, l'📇 annuaire et la 🎬 fiche projet. Il reste utile : c'est la signature des PDF, rapports et avis, reprise du profil d'équipe ; il ne prend plus de place dans la barre.", "done"], ["SYNO → PLANO", "Passerelle réparée", "Fait le 07/11 : 📤 Vers Suite XIII › PLANO ne trouvait pas le bouton d'envoi (rangé dans 📋 Liste du matériel) et ouvrait PLANO à vide avec « ⚠️ Ce trajet n'a pas encore d'envoi automatique ». Il envoie maintenant les équipements, qui arrivent dans PLANO à placer sur le plan (vérifié par robot : 8 équipements reçus, aucun doublon au 2e envoi). Le faux avertissement ne s'affiche plus après un envoi direct.", "done"], ["MATOS + CATALOGUE", "Fusionner MATOS et CATALOGUE", "Fait le 07/11 : MATOS contenait déjà le catalogue (onglet « Catalogue générique »). CATALOGUE n'est plus un outil à part : retiré de la recherche, des passerelles et du menu 📤 (ses envois partent désormais de MATOS) ; ses anciennes adresses ouvrent MATOS sur l'onglet Catalogue. Données inchangées (même stockage).", "done"], ["IMPORTO", "Retirer IMPORTO", "Fait le 07/11 : retiré de la recherche, des passerelles et du menu 📤 ; l'adresse importo.html ouvre l'accueil, la fiche projet et « 📥 Importer depuis un logiciel du métier ».", "done"], ["RECHERCHE", "Les outils en tête des résultats", "Fait le 07/11 : dans la recherche (Ctrl K et le nouveau champ de l'accueil), la rubrique « Outils » passe toujours en premier, dans les 34 outils.", "done"], ["ACCUEIL", "Barre de recherche en haut à gauche", "Fait le 07/11 : champ « 🔎 Rechercher… Ctrl K » en haut à gauche de l'accueil (le grand logo descend un peu pour lui laisser la place) ; il ouvre la même recherche.", "done"], ["CONDUCO", "Barre d'outils à la même taille", "Fait le 07/11 : mesuré par robot sur les 29 outils à barres. Avant : barre du haut de 40 à 52 px, seconde barre de 47 à 53 px, boutons de 27 ou 29 px, boutons de CONDUCO, PLANO, GRAPHICO… plus étroits. Après : barre du haut 48 px et seconde barre 51 px partout, boutons de 30 px de haut et même largeur minimale (42 px, 32 px sous 1 280 px de large). Contrôlé à 1 024, 1 366 et 1 920 px : aucun débordement.", "done"], ["BARRE DU HAUT", "👥 Équipe partout, un seul trait entre les groupes", "Fait le 08/11 : le bouton 👥 Équipe manquait dans 6 outils sans délégation par lien (CADRO, DOSSIER, CALENDRIER, CONTRÔLE, ENCODO, LUDO) : il y est, au même endroit, avec un menu adapté (relier le Drive du projet ; « Déléguer » n'est proposé que là où il existe). Les traits en double ou en tête de la barre du haut (CADRO, DOSSIER, LUDO…) sont nettoyés dans tous les outils. Contrôlé par robot sur 28 outils à 1 024 et 1 440 px.", "done"], ["SYNO + PLANO", "Formats d'image dans ⬇️ Exporter ▾", "Fait le 08/11 : le menu propose directement 🖼️ Image PNG (qualité maximale), 🖼️ Image JPEG (fichier plus léger) et 📄 Document PDF ; le format choisi lance le rendu. Téléchargements PNG et JPEG vérifiés dans PLANO.", "done"], ["ONGLETS · PROJETS", "Retirer un projet de la liste (clic droit)", "Fait le 08/11 : clic droit sur un projet dans le menu des projets (en haut à gauche) ou sur la pastille du projet : Ouvrir, ⬇️ Exporter le fichier XIII, ✕ Retirer de la liste, avec la date de dernière modification et de dernière sauvegarde. S'il a été modifié depuis sa dernière sauvegarde (☁️ Drive, fichier .xiii, sauvegarde auto), une fenêtre le signale : ☁️ Tout sauvegarder sur le Drive (si relié) ou ⬇️ Exporter le fichier XIII, puis Retirer ; ou Annuler / Retirer sans sauvegarder. Le projet est seulement masqué (données gardées dans ce navigateur) : « ↶ Projets retirés de la liste » le remet. Le dernier projet de la liste ne peut pas être retiré. Seules comptent les vraies modifications faites à la main (clic ou touche), pas les enregistrements automatiques à l'ouverture.", "done"], ["TOUTE LA SUITE", "Retours au fil de la saison", "Chaque problème signalé est ajouté ici, corrigé, puis vérifié. 08/11 : l'astuce « Toujours au même endroit » est retirée (elle se superposait à la visite guidée, qui présente déjà les deux barres).", "now"]]], ["Phase A · Design « Sobre » (noir mat, lignes fines, couleurs de la suite)", [["TOUTE LA SUITE", "★ Thème « ◼️ Sobre »", "Fait le 07/11 : nouveau thème dans ⚙️ › Affichage › Thème, pour tous les outils, l'accueil et la barre d'onglets. Fond noir mat, séparateurs d'un trait, en-têtes de colonnes en petites capitales grises, boutons sombres à liseré fin, orange XIII pour l'action et l'état actif. Aucune transparence, aucun flou, aucune lueur, aucun dégradé. La barre d'onglets suit désormais le thème choisi dans les outils (avant : seulement celui du système).", "done"], ["TOUTE LA SUITE", "Sobre clair", "La même rigueur en version claire (fond blanc cassé, traits gris, orange plus foncé pour rester lisible).", ""], ["APP ÉQUIPE / MOBILE", "Sobre sur téléphone", "L'app équipe et les 22 pages téléphone suivent le thème Sobre (aujourd'hui : clair ou sombre seulement).", ""], ["TOUTE LA SUITE", "Icônes au trait partout", "Les émojis restants (menus, panneaux, en-têtes de sections, tuiles de l'accueil) remplacés par les icônes fines déjà utilisées dans les barres ; émojis gardés en option.", ""], ["TOUTE LA SUITE", "Une seule échelle typographique", "Quatre tailles de texte seulement, mêmes graisses partout ; chiffres (horaires, TC, montants, durées) en police à chasse fixe alignée, comme sur la photo de référence.", ""], ["ACCUEIL", "Accueil épuré", "Grand logo plus discret, tableau de bord en une grille régulière, tuiles d'outils en liste compacte (icône, nom, dernière modification).", ""], ["TOUTE LA SUITE", "Densité réglable", "Confortable / Compact : hauteur des lignes, marges et barres resserrées pour voir plus de lignes à l'écran (tableaux de DEVISO, CONDUCO, PACKINGO…).", ""]]], ["Phase B · Ergonomie", [["TOUTE LA SUITE", "★ Barre du haut identique pour tout le monde", "La première barre est la même dans les 34 outils, au pixel près, de gauche à droite : 🏠 Accueil · logo de l'outil · onglets du document (journées, versions…) ＋ │ 🔎 Rechercher │ 🗒️ Nouveau ▾ · 📂 Ouvrir · 💾 Enregistrer · ⬇️ Exporter ▾ (tous les formats et l'impression dans un seul menu) │ 📤 Vers Suite XIII · 🔗 Partager │ 👥 Équipe · ☁️ Drive · pastille du nom. Rien de propre à un outil n'y reste : tout le reste descend dans la seconde barre. — Fait (07–08/11) dans les 29 outils à barres, avec le même code (lib/suite-topbar.js) : CALENDRIER, PLANNO, CONTRÔLE, ENCODO et LUDO reçoivent la même mise en ordre (leurs boutons propres descendent dans la seconde barre). Exporter ▾ réunit formats, impression, tableaux et fichier du projet ; Nouveau ▾ réunit document vierge et exemples. Un bouton n'apparaît que si l'outil sait le faire : pas de 📂 / 💾 dans CALENDRIER, PLANNO, CONTRÔLE, ENCODO, LUDO (pas de fichier projet) ; 👥 Équipe absent de CADRO, DOSSIER, GRAPHICO, MATOS et REPERO (pas encore de délégation d'équipe dans ces outils).", "done"], ["TOUTE LA SUITE", "Inspecteur à droite", "Un seul panneau de propriétés pour l'élément sélectionné, au même endroit et avec la même présentation dans chaque outil (au lieu de fenêtres différentes).", ""], ["TOUTE LA SUITE", "Moins de fenêtres", "Fait le 08/11 : les fenêtres de saisie et de réglages qui couvraient l'écran s'ouvrent en panneau à droite, sous les barres : le travail reste visible et cliquable à gauche (ex. ➕ Ajouter du matériel dans MATOS, 📋 Coller une liste dans CASTO, 🏷️ Infos du devis dans DEVISO, 🔗 Lien ou image et 🎬 Référence dans MOODO, Tournage et Article dans PACKINGO, Ajouter un lieu dans REPERO, Coller des retours dans POSTO, Alerte et Chat dans RUNO, Numérotation IP, Vérification et Catalogue dans SYNO). Bouton ▣ Au centre / ◧ Sur le côté sur chaque fenêtre, choix retenu par fenêtre et par outil. Restent au centre : confirmations et petites questions, grandes fenêtres (aperçus, tableaux, exemples), recherche, visite guidée, et tout sous 900 px de large. Correction au passage : 🏷️ Infos du devis de DEVISO levait une erreur (bouton fiche projet).", "done"], ["TOUTE LA SUITE", "Mode focus", "Fait le 08/11 dans les 29 outils à barres : touche F (ou bouton ⛶ Focus dans ② Afficher, ou « focus » dans Ctrl K) masque la barre du haut, la seconde barre, la roue ⚙️, l'onglet d'astuces, le bandeau hors ligne et les panneaux annexes (propriétés de CONDUCO, panneau d'ENCODO, colonne de REPERO). F ou Échap pour revenir ; « Quitter le focus » apparaît 3 s puis quand la souris (ou le doigt) s'approche du bord haut. F ne bascule jamais pendant la frappe ni quand une fenêtre est ouverte. Le mode est retenu le temps de la session.", "done"], ["TOUTE LA SUITE", "Clic droit sur les barres : raccourcis rapides", "Fait le 08/11 dans les 29 outils (demande du jour). ⬇️ Exporter : tous les formats d'un coup, « ⚡ Refaire » le dernier export en tête (ex. Image JPEG) ; 📤 Vers Suite XIII : chaque destination directement (PACKINGO, SYNO, DEVISO, LUMO, MATOS, DOSSIER…) et « ⚡ Renvoyer » vers la dernière ; 🗒️ Nouveau : vierge / exemples ; 💾 : enregistrer, en fichier, versions ; 🏠 : accueil ici ou dans un nouvel onglet. Tout bouton : le lancer, lui associer une touche (Alt + J…, les touches de la suite sont protégées), le masquer pour simplifier la barre. Clic droit sur une zone vide des barres : réafficher les boutons masqués, focus, recherche, raccourcis, paramètres. Maj + clic droit = menu du navigateur. Le menu ⬇️ Exporter est aussi déplié à gauche (plus de sous-menu « Exporter, imprimer »). Robot : 649 menus ouverts dans 28 outils, aucun hors écran.", "done"], ["TOUTE LA SUITE", "Clic droit cohérent", "Fait le 08/11 (partie 2) : dans la zone de travail des 22 outils qui n'avaient pas de menu, même menu partout, dans le même ordre : actions de l'élément cliqué (Modifier, Dupliquer, Copier, Supprimer, puis les siennes), 📋 copier la sélection, ➕ nouvel élément, ↶ annuler / ↷ rétablir, ⬇️ exporter, 📤 envoyer vers un autre outil, ⛶ focus, 🔎 rechercher. CONDUCO, DECOUP, PLANO, SYNO, STORYBOARDO, SONO et LUDO gardent leur menu déjà riche. Maj + clic droit = menu du navigateur ; champs de saisie, images et liens gardent le menu habituel.", "done"], ["TOUTE LA SUITE", "Raccourcis harmonisés", "Fait le 08/11. Mêmes touches partout : Ctrl K rechercher · ? fiche · Ctrl S enregistrer · Ctrl O ouvrir (nouveau) · Ctrl E exporter (nouveau, ouvre ⬇️ Exporter ▾) · Ctrl Z / Ctrl Y · N nouvel élément · Ctrl D dupliquer · Suppr · 1…9 vues · F focus · Échap. Conflits trouvés par robot (touche testée dans les 28 outils) et corrigés : F prenait une photo dans SCRIPTO (→ P) et choisissait la flèche dans PLANO (→ A) ; SCRIPTO duplique aussi avec Ctrl D. N ajouté là où il manquait, via le bouton ➕ du secteur Créer : DOSSIER, MATOS, RUNO, SYNO, CADRO, ENCODO. La fiche « ? » et la fiche imprimée commencent par cette liste commune.", "done"], ["TOUTE LA SUITE", "Écrans vides utiles", "Fait le 08/11 dans 13 outils (CASTO, DEVISO, GRAPHICO, LUMO, MATOS, MOODO, PACKINGO, POSTO, REPERO, SCRIPTO, SONO, TRANSPORTO, et SYNO qui n'avait pas d'écran d'accueil) : même bloc « Pour commencer », dans le même ordre : 📐 Partir d'un exemple · 📥 Importer · ➕ Commencer de zéro, sous chaque tuile le bouton de l'outil qu'elle lance (ex. « Charger l'exemple », « Importer une liste », « Premier plan »). Un choix que l'outil ne sait pas faire n'est pas affiché (GRAPHICO : pas d'exemple). Les boutons d'origine repris sont masqués, les autres restent (modèles de SONO, tablette de SCRIPTO…). Les autres outils s'ouvrent déjà sur un contenu (conducteur, formulaire, calendrier…). Ajout du 08/11 : CONDUCO, DECOUP et PLANO ne chargent plus leur exemple d'office ; à la première ouverture, une fenêtre « Pour commencer » propose 📐 Partir d'un exemple (le même qu'avant), 📥 Charger un fichier ou ➕ Commencer de zéro. Elle attend la fin de la visite guidée (jamais deux fenêtres l'une sur l'autre) et ne s'affiche pas si l'outil a déjà reçu du contenu (passerelle, lien, import). Les outils qui se remplissent depuis le projet (CALL SHEETO, CALENDRIER…) ne changent pas. Passerelles vers et depuis ces trois outils revérifiées par robot (25 trajets, mêmes données reçues qu'avant).", "done"]]], ["Phase B2 · Seconde barre : propre à l'outil, mais rangée pareil partout", [["TOUTE LA SUITE", "★ Cinq secteurs, toujours dans le même ordre", "Fait le 08/11 dans les 29 outils à barres : ① Créer · ② Afficher · ③ Modifier · ④ Outils métier · ⑤ Assistants, état à droite (ordre validé, 5 outils vus un par un puis généralisation demandée). Moteur commun lib/suite-sectors.js.", "done"], ["TOUTE LA SUITE", "Repères visuels des secteurs", "Fait le 08/11 : un seul trait entre deux secteurs visibles (jamais en tête, en fin ni en double, y compris quand la barre se resserre) ; nom du secteur au survol ; la visite guidée présente la seconde barre secteur par secteur (« Barre d'outils · ① Créer »…, avec une phrase sur le rôle du secteur) et la barre du haut par zones (Accueil, Fichier et envois, Équipe) ; l'astuce « Toujours au même endroit » décrit les deux barres actuelles.", "done"], ["TOUTE LA SUITE", "Inventaire bouton par bouton", "Fait le 08/11 : 392 éléments inventoriés (robot inv2.js), page de relecture publiée ; classement validé outil par outil sur MOODO, STORYBOARDO, SCRIPTO, DECOUP, CADRO puis étendu à tous.", "done"], ["TOUTE LA SUITE", "Application outil par outil", "Fait le 08/11 pour les 29 outils. Au passage : le groupe 👥 Équipe / pastille du nom, né dans la seconde barre de GRAPHICO, MATOS et REPERO, remonte dans la barre du haut.", "done"], ["TOUTE LA SUITE", "Même hauteur, même taille partout", "Contrôlé le 08/11 par robot (sect.js + align.js) à 1 024, 1 280, 1 366, 1 440 et 1 920 px : aucun chevauchement, aucun débordement, une seule ligne, séparateurs corrects dans les 29 outils.", "done"]]], ["Phase C · Code commun", [["TOUTE LA SUITE", "★ Code commun partagé", "Fait le 07/11 : 61 modules communs (≈ 1,1 Mo recopiés dans chaque outil) rangés une seule fois dans 8 fichiers partagés lib/core-*.js, et les 25 modules de la saison 5–6 dans lib/ ; chaque page ne garde que son code propre (SCRIPTO ≈ 1,9 Mo → 0,5 Mo, site ≈ 68 Mo → 35 Mo). Fichiers versionnés (empreinte) et gardés hors ligne par le service worker. Vérifié par robots : test général 79 pages sans erreur ; comparaison avant / après des 34 outils identique (modules, boutons, erreurs) ; zéro plantage sur 32 outils ; 96 passerelles (les 12 de CATALOGUE / IMPORTO retirées) sans erreur ni régression ; hors ligne après une première visite ; ouverture en général plus rapide. Désormais une correction du code commun se fait une fois (xiii-src/core) et s'applique aux 34 outils.", "done"]]], ["Phase ZZ · Optimisation de fin de saison (à refaire à chaque saison, avant de publier)", [["TOUTE LA SUITE", "Numéros de version et notes de mise à jour", "", ""], ["BOUTONS", "Regrouper les nouveaux boutons", "", ""], ["BOUTONS", "Espacement et alignement", "", ""], ["CHARGEMENT", "Barres complètes dès l'ouverture", "", ""], ["FIABILITÉ", "Zéro plantage", "", ""], ["VITESSE", "Tout est rapide", "", ""], ["PASSERELLES", "Les outils se parlent", "", ""], ["MOBILE", "Application et versions téléphone", "", ""], ["ACCESSIBILITÉ", "Confort pour tous", "", ""], ["PUBLICATION", "★ Publier la saison", "Notes de version, versions affichées sur l'accueil, puis « publie » : mise en ligne sur le site public.", ""]]]];
let n=0,d=0,h='';P.forEach(([ph,it])=>{h+='<section><h2><span>'+ph+'</span><span>'+it.length+'</span></h2><ol>';it.forEach(x=>{n++;const s=x[3]||'';if(s==='done')d++;h+='<li class="'+s+'"><span class="n">'+String(n).padStart(2,'0')+'</span><span class="t"><span class="tool">'+x[0]+'</span><b>'+x[1]+'</b>'+(x[2]?'<small>'+x[2]+'</small>':'')+'</span><span class="st">'+(s==='done'?'✓ livré':s==='now'?'en cours':s==='idee'?'proposition':'à faire')+'</span></li>'});h+='</ol></section>'});
document.getElementById('r').innerHTML=h;document.getElementById('pc').textContent=d+' / '+n+' livrées';document.getElementById('pb').style.width=(d/n*100)+'%';
</script>
