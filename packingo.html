// Récupère le fichier qu'un export existant de l'outil enregistre (au lieu de le télécharger)
function xiiiCapture(run, ms) {
    return new Promise((res, rej) => {
        const orig = window.saveFile; let done = false, t = null;
        const fin = (fn, v) => { if (done) return; done = true; window.saveFile = orig; clearTimeout(t); fn(v); };
        t = setTimeout(() => fin(rej, new Error('Le rendu n\'a pas abouti')), ms || 120000);
        window.saveFile = async (name, data, type) => {
            const blob = data instanceof Blob ? data : new Blob([data], { type: type || 'application/octet-stream' });
            fin(res, { name, blob, type: blob.type || type || '' }); return true;
        };
        Promise.resolve().then(run).then(() => setTimeout(() => fin(rej, new Error('Aucun document produit (contenu vide ?)')), 600)).catch(e => fin(rej, e));
    });
}
// Rapport imprimable de la suite (bandeau, chiffres clés, sections, tableaux) → HTML simple pour DOSSIER XIII
function xiiiReportToHtml(html) {
    const E = XIII.esc, T = el => (el ? el.textContent : '').replace(/\s+/g, ' ').trim();
    // texte d'un titre composé de plusieurs morceaux (spans) : séparés par « · »
    const TT = el => !el ? '' : el.children.length ? [...el.childNodes].map(n => n.nodeType === 3 ? n.nodeValue : TT(n)).map(x => String(x).replace(/\s+/g, ' ').trim()).filter(Boolean).join(' · ') : T(el);
    const root = document.createElement('div'); root.innerHTML = html;
    root.querySelectorAll('.no-print, .rep-switch, .sh-sign, .sign, script, style, button, select, input, svg').forEach(e => e.remove());
    const out = [];
    const hero = root.querySelector('.sh-hero');
    if (hero) {
        const prod = hero.querySelector('.sh-prod'), brand = hero.querySelector('.sh-brand'), day = hero.querySelector('.sh-day');
        if (brand) out.push('<p><b>' + E(T(brand)) + '</b></p>');
        const band = hero.querySelector('.sh-band');
        if (band) { const extra = [...band.querySelectorAll(':scope > div > div')].filter(d => d !== brand && d !== prod).map(T).filter(Boolean); if (extra.length) out.push('<p>' + E(extra.join(' · ')) + '</p>'); }
        if (day && T(day)) out.push('<p>' + E([T(day.querySelector('b')), T(day.querySelector('span'))].filter(Boolean).join(' · ')) + '</p>');
        const keys = [...hero.querySelectorAll('.sh-key')];
        if (keys.length) out.push('<table><tr>' + keys.map(k => '<th>' + E(T(k.querySelector('span'))) + '</th>').join('') + '</tr><tr>' + keys.map(k => '<td>' + E(T(k.querySelector('b'))) + '</td>').join('') + '</tr></table>');
        const sub = [...hero.querySelectorAll('.sh-sub > span')].map(T).filter(Boolean);
        if (sub.length) out.push('<p>' + E(sub.join('   ·   ')) + '</p>');
    }
    const table = tbl => {
        const head = [...tbl.querySelectorAll('thead tr th')].map(T);
        const parts = []; let rows = [];
        const flush = () => { if (rows.length) parts.push('<table>' + (head.length ? '<tr>' + head.map(h => '<th>' + E(h) + '</th>').join('') + '</tr>' : '') + rows.join('') + '</table>'); rows = []; };
        tbl.querySelectorAll('tbody tr, :scope > tr').forEach(tr => {
            if (tr.classList.contains('case-h')) { flush(); parts.push('<p><b>' + E(TT(tr.children[0] || tr)) + '</b></p>'); return; }
            const cells = [...tr.children].map(T);
            if (cells.length === 1 && head.length > 1) { rows.push('<tr><td>' + E(cells[0]) + '</td>' + '<td></td>'.repeat(head.length - 1) + '</tr>'); return; }
            rows.push('<tr>' + cells.map(c => '<td>' + E(c) + '</td>').join('') + '</tr>');
        });
        flush();
        return parts.join('');
    };
    root.querySelectorAll('.sh-sec').forEach(sec => {
        const h = sec.querySelector('h3'); if (h) out.push('<h3>' + E(TT(h)) + '</h3>');
        const body = sec.querySelector('.sh-body') || sec;
        body.childNodes.forEach(n => {
            if (n.nodeType === 3) { const t = n.nodeValue.replace(/\s+/g, ' ').trim(); if (t) out.push('<p>' + E(t) + '</p>'); return; }
            if (n.nodeType !== 1 || n === h) return;
            if (n.tagName === 'TABLE') out.push(table(n));
            else if (n.tagName === 'UL' || n.tagName === 'OL') out.push('<ul>' + [...n.querySelectorAll('li')].map(li => '<li>' + E(T(li)) + '</li>').join('') + '</ul>');
            else { const tb = n.querySelector('table'); if (tb) out.push(table(tb)); else if (T(n)) out.push('<p>' + E(T(n)) + '</p>'); }
        });
    });
    const foot = root.querySelector('.sh-foot'); if (foot && T(foot)) out.push('<p><i>' + E(T(foot)) + '</i></p>');
    return out.join('\n');
}

// =====================================================================
//  ANNUAIRE COMMUN SUITE XIII — les contacts saisis une fois, disponibles dans tous les outils
//  Stocké dans le navigateur (clé partagée « xiii.annuaire », même site = même annuaire).
//  Contact : { id, name, role, dept, cat, phone, email, address, company, notes, updated }
// =====================================================================
const XBook = (() => {
    const KEY = 'xiii.annuaire';
    const DEPTS = [
        ['prod', 'Production', '#EF5350'], ['real', 'Réalisation', '#AB47BC'], ['image', 'Image', '#42A5F5'], ['elec', 'Électro', '#FFCA28'], ['machino', 'Machinerie', '#8D6E63'],
        ['son', 'Son', '#26A69A'], ['deco', 'Décoration', '#66BB6A'], ['cost', 'Costumes', '#EC407A'], ['hmc', 'Maquillage / Coiffure', '#F48FB1'], ['regie', 'Régie', '#FFA726'],
        ['cast', 'Comédiens / Talents', '#7E57C2'], ['fig', 'Figuration', '#9E9E9E'], ['secu', 'Sécurité / Secours', '#E53935'], ['transport', 'Transport', '#78909C'],
        ['cantine', 'Cantine / Catering', '#C0CA33'], ['post', 'DIT / Post-prod', '#26C6DA'], ['autre', 'Autre', '#BDBDBD']
    ];
    const dept = k => DEPTS.find(d => d[0] === k) || DEPTS[DEPTS.length - 1];
    const fold = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
    const key = s => fold(s).replace(/[^a-z0-9]+/g, ' ').trim();
    const uid = () => 'c' + Math.random().toString(36).slice(2, 10);
    // Département (CALL SHEETO) ↔ catégorie (DOSSIER)
    function deptFromRole(role) {
        const r = fold(role);
        const rules = [['real', /(realisat|scripte|assistant real|1er assistant|2nd assistant)/], ['image', /(cadr|chef op|operat.*prise de vue|image|camera|steadi|focus|pointeur|drone)/], ['son', /(son|perch|mix|audio|micro)/],
            ['elec', /(electr|eclairag|lumiere|chef elec|gaffer)/], ['machino', /(machin|grip|grutier)/], ['deco', /(deco|accessoir|decor)/], ['cost', /(costum|habill)/], ['hmc', /(maquill|coiff)/],
            ['regie', /(regisseu|regie)/], ['post', /(dit|data|monteu|montage|etalon|post)/], ['prod', /(product|charge de prod|administrat|direct.*prod)/], ['secu', /(secur|secour|pompier|infirm)/],
            ['transport', /(chauffeur|transport|conducteur)/], ['cantine', /(cantin|catering|traiteur)/], ['cast', /(comedien|acteur|actrice|musicien|chanteu|animat|presentat|invite|artiste|talent)/], ['fig', /figur/]];
        for (const [k, re] of rules) if (re.test(r)) return k;
        return '';
    }
    function catFromDept(d, role) {
        if (d === 'prod') return 'production';
        if (d === 'cast') return /(animat|presentat)/.test(fold(role)) ? 'animateur' : /invite/.test(fold(role)) ? 'invite' : 'artiste';
        if (d === 'fig') return 'artiste';
        if (d === 'autre' || !d) return /(auteur|scenaris|compositeur|graphiste)/.test(fold(role)) ? 'auteur' : 'autre';
        return 'technicien';
    }
    function deptFromCat(cat, role) {
        const byRole = deptFromRole(role);
        if (cat === 'production') return 'prod';
        if (cat === 'artiste' || cat === 'animateur' || cat === 'invite') return 'cast';
        if (cat === 'technicien') return byRole && byRole !== 'cast' ? byRole : 'autre';
        return byRole || 'autre';
    }
    function complete(c) {
        c.id = c.id || uid();
        ['name', 'role', 'phone', 'email', 'address', 'company', 'notes'].forEach(k => { c[k] = c[k] == null ? '' : String(c[k]).trim(); });
        if (!c.dept) c.dept = c.cat ? deptFromCat(c.cat, c.role) : (deptFromRole(c.role) || 'autre');
        if (!c.cat) c.cat = catFromDept(c.dept, c.role);
        return c;
    }
    function load() { try { const a = JSON.parse(localStorage.getItem(KEY)); return Array.isArray(a) ? a.filter(Boolean) : []; } catch (e) { return []; } }
    function save(list) { try { localStorage.setItem(KEY, JSON.stringify(list)); } catch (e) { throw new Error('Stockage du navigateur plein ou bloqué'); } fire(); }
    function match(list, c) {
        const em = fold(c.email), nm = key(c.name);
        return (em && list.find(x => fold(x.email) === em)) || (nm && list.find(x => key(x.name) === nm)) || null;
    }

            o.querySelector('.xcat-l').innerHTML = L.length ? L.map(it => '<div class="xcat-it" data-id="' + it.id + '"><span class="xcat-c">' + catOf(it.cat)[2] + '</span><span class="xcat-t"><b>' + esc(name(it)) + '</b><small>' + esc([it.kg ? it.kg + ' kg' : '', it.w ? it.w + ' W' : '', it.price ? it.price + ' € / j' : '', it.inp ? '⇥ ' + it.inp : '', it.outp ? '↦ ' + it.outp : ''].filter(Boolean).join(' · ')) + '</small></span>' + (a ? '<button data-add>→ ' + esc(a.lab) + '</button>' : '<button data-cp>📋 Copier</button>') + '</div>').join('') : '<p class="xcat-e">' + (db.items.length ? 'Aucun équipement ne correspond.' : 'Le catalogue est vide : ouvrez le volet 🗃️ Catalogue pour y ajouter votre matériel ou les modèles courants.') + '</p>';
            o.querySelectorAll('.xcat-it').forEach(r => { const it = db.items.find(x => x.id === r.dataset.id); const b = r.querySelector('button');
                b.onclick = () => { if (a) { let m = null; try { m = a.run(it); } catch (e) { console.warn('XCAT', e); m = '⚠️ Insertion impossible dans cet écran'; } try { toast(m || '⚠️ Insertion impossible ici'); } catch (e) { } } else { try { navigator.clipboard.writeText(name(it) + (it.notes ? ' — ' + it.notes : '')); toast('📋 Copié'); } catch (e) { } } }; });
        };
        o.innerHTML = '<div class="xcat-box"><div class="xcat-h"><b>🗃️ Catalogue matériel</b><span class="xcat-n">' + db.items.length + ' équipement(s)</span><a href="catalogue.html" target="_blank">Ouvrir le volet ↗</a><span class="xcat-x">✕</span></div><div class="xcat-f"><input class="xcat-q" placeholder="🔍 marque, modèle, connectique…" autofocus><select class="xcat-s"><option value="">Toutes les familles</option>' + CATS.map(c => '<option value="' + c[0] + '">' + c[2] + ' ' + c[1] + '</option>').join('') + '</select></div><div class="xcat-l"></div>' + (a ? '' : '<p class="xcat-e">Cet outil n\'a pas d\'insertion directe : copiez la fiche.</p>') + '</div>';
        o.querySelector('.xcat-x').onclick = () => o.remove(); o.addEventListener('mousedown', e => { if (e.target === o) o.remove(); });
        o.querySelector('.xcat-q').oninput = e => { q = e.target.value; draw(); }; o.querySelector('.xcat-s').onchange = e => { cat = e.target.value; draw(); };
        const pre = { lumo: 'lum', sono: 'son', syno: '', plano: '', packingo: '', deviso: '', cadro: 'cam' }[app]; if (pre) { cat = pre; o.querySelector('.xcat-s').value = pre; }
        draw(); setTimeout(() => o.querySelector('.xcat-q').focus(), 30);
    }
    function initTool(app) {
        const s = document.createElement('style'); s.textContent = '#xcat-ov{position:fixed;inset:0;z-index:10230;background:rgba(0,0,0,.55);display:flex;align-items:flex-start;justify-content:center;padding:6vh 14px;font:13.5px/1.4 "Segoe UI",system-ui,sans-serif}.xcat-box{width:min(720px,100%);max-height:84vh;display:flex;flex-direction:column;background:var(--bg-menu,#232327);color:var(--text-main,#eee);border:1px solid rgba(240,179,120,.6);border-radius:14px;padding:14px 16px;box-shadow:0 18px 50px rgba(0,0,0,.6)}.xcat-h{display:flex;gap:10px;align-items:center}.xcat-n{color:var(--text-dim,#999);font-size:12px;margin-right:auto}.xcat-h a{color:rgb(240,179,120);font-size:12px}.xcat-x{cursor:pointer;opacity:.7}.xcat-f{display:flex;gap:8px;margin:10px 0}.xcat-f input{flex:1}.xcat-f input,.xcat-f select{font:inherit;color:inherit;background:var(--bg-input,#1b1b1f);border:1px solid var(--border-color,#45454b);border-radius:8px;padding:6px 9px}.xcat-l{overflow:auto}.xcat-it{display:flex;gap:10px;align-items:center;padding:7px 4px;border-bottom:1px solid var(--border-color,#36363c)}.xcat-c{font-size:20px}.xcat-t{flex:1;min-width:0}.xcat-t small{display:block;color:var(--text-dim,#999);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.xcat-it button{font:inherit;font-size:12px;color:inherit;background:rgba(240,179,120,.18);border:1px solid rgba(240,179,120,.6);border-radius:7px;padding:4px 9px;cursor:pointer;white-space:nowrap}.xcat-b{font-style:normal;font-size:10px;color:var(--text-dim,#999);border:1px solid var(--border-color,#555);border-radius:6px;padding:0 4px;margin-left:4px}.xcat-e{color:var(--text-dim,#999);padding:12px 4px}';
        document.head.appendChild(s);
        const go = () => { if (document.getElementById('xcat-btn')) return; const tool = document.getElementById('xb-tool') || document.getElementById('toolbar') || document.getElementById('top-bar'); if (!tool) return; const b = document.createElement('button'); b.id = 'xcat-btn'; b.title = '🗃️ Catalogue matériel commun : insérer un équipement (marque, modèle, ports, poids, puissance, prix)'; b.innerHTML = '<span class="btn-icon">🗃️</span><span class="btn-label">Catalogue</span>'; b.onclick = () => picker(app); tool.appendChild(b); };
        XBOOT.ready(go, 2700);
    }
    return { all, base, baseOn, K, CATS, catOf, load, save, name, ports, search, seedItems, toCsv, parseCsv, COLS, ADD, picker, initTool, uid, esc, fold };
})();

XCAT.initTool('packingo');
</script>
