// =====================================================================
//  Soleil — calcul astronomique local (algorithme type SunCalc)
// =====================================================================
const SUN = (() => {
    const PI = Math.PI, sin = Math.sin, cos = Math.cos, tan = Math.tan, asin = Math.asin, atan = Math.atan2, acos = Math.acos, rad = PI / 180;
    const dayMs = 864e5, J1970 = 2440588, J2000 = 2451545, e = rad * 23.4397, J0 = 0.0009;
    const toJulian = d => d.valueOf() / dayMs - 0.5 + J1970, fromJulian = j => new Date((j + 0.5 - J1970) * dayMs), toDays = d => toJulian(d) - J2000;
    const decl = (l, b) => asin(sin(b) * cos(e) + cos(b) * sin(e) * sin(l));
    const ra = (l, b) => atan(sin(l) * cos(e) - tan(b) * sin(e), cos(l));
    const M = d => rad * (357.5291 + 0.98560028 * d);
    const L = m => { const C = rad * (1.9148 * sin(m) + 0.02 * sin(2 * m) + 0.0003 * sin(3 * m)); return m + C + rad * 102.9372 + PI; };
    const cycle = (d, lw) => Math.round(d - J0 - lw / (2 * PI));
    const approx = (Ht, lw, n) => J0 + (Ht + lw) / (2 * PI) + n;
    const transit = (ds, m, l) => J2000 + ds + 0.0053 * sin(m) - 0.0069 * sin(2 * l);
    const hourAngle = (h, phi, d) => acos((sin(h) - sin(phi) * sin(d)) / (cos(phi) * cos(d)));
    function times(date, lat, lng, angles) {
        const lw = rad * -lng, phi = rad * lat, d = toDays(date), n = cycle(d, lw), ds = approx(0, lw, n), m = M(ds), l = L(m), dec = decl(l, 0), Jnoon = transit(ds, m, l);
        const res = { noon: fromJulian(Jnoon), dec };
        angles.forEach(a => {
            const w = hourAngle(a * rad, phi, dec);
            if (isNaN(w)) { res['r' + a] = null; res['s' + a] = null; return; }
            const Jset = transit(approx(w, lw, n), m, l), Jrise = Jnoon - (Jset - Jnoon);
            res['r' + a] = fromJulian(Jrise); res['s' + a] = fromJulian(Jset);
        });
        return res;
    }
    function position(date, lat, lng) {
        const lw = rad * -lng, phi = rad * lat, d = toDays(date), m = M(d), l = L(m), dc = decl(l, 0), r = ra(l, 0);

        const az = atan(sin(H), cos(H) * sin(phi) - tan(dc) * cos(phi)), alt = asin(sin(phi) * sin(dc) + cos(phi) * cos(dc) * cos(H));

})();

function sunInfo(d) {
    const loc = wxLoc(d); if (!loc || loc.lat == null || !d.date) return null;
    const tz = loc.tz || (d.weather && d.weather.tz) || browserTZ();
    const [y, m, dd] = d.date.split('-').map(Number);
    const mid = new Date(Date.UTC(y, m - 1, dd, 12) - loc.lon / 15 * 3600e3);
    const t = SUN.times(mid, loc.lat, loc.lon, [-0.833, -4, -6, 6]);
    const pr = t['r-0.833'] ? SUN.position(t['r-0.833'], loc.lat, loc.lon) : null, ps = t['s-0.833'] ? SUN.position(t['s-0.833'], loc.lat, loc.lon) : null;
    const pn = SUN.position(t.noon, loc.lat, loc.lon);
    return {
        tz, loc, rise: t['r-0.833'], set: t['s-0.833'], dawn: t['r-6'], dusk: t['s-6'], b4m: t['r-4'], b4e: t['s-4'], g6m: t['r6'], g6e: t['s6'],
        noon: t.noon, maxEl: pn.alt, azRise: pr && pr.az, azSet: ps && ps.az,
        len: t['r-0.833'] && t['s-0.833'] ? t['s-0.833'] - t['r-0.833'] : null

}

async function geocodeLoc(i, btn) {
    const l = D().locations[i], q = (l.address || l.name || '').trim();
    if (!q) { toast("Saisissez d'abord une adresse"); return; }
    const old = btn ? btn.innerHTML : ''; if (btn) btn.innerHTML = '<span class="spin">⏳</span>';
    try {
        const r = await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=6&accept-language=fr&q=' + encodeURIComponent(q));
        const j = await r.json(); if (btn) btn.innerHTML = old;
        if (!j.length) { toast('Adresse introuvable : précisez la ville ou cliquez directement sur la carte'); return; }
        const rect = (btn || document.body).getBoundingClientRect();

<script>
// =====================================================================
//  SUITE XIII — échanges entre outils (module commun, identique dans chaque outil)
//  • Format « Suite XIII » : objet JSON { format:'xiii-link', version, kind, from, app, project, … }
//    enregistrable en fichier .xiii.json (les fichiers joints y sont encodés en base64).
//  • Boîte d'échange : base IndexedDB « xiiiLink » partagée par tous les outils du même site.
//  • Canal « xiii-suite » (BroadcastChannel) : un outil déjà ouvert dans un autre onglet reçoit l'envoi.
// =====================================================================
const XIII = (() => {
    let dbp = null;
    const open = () => dbp || (dbp = new Promise((res, rej) => {
        let r; try { r = indexedDB.open('xiiiLink', 1); } catch (e) { rej(e); return; }
        r.onupgradeneeded = () => { if (!r.result.objectStoreNames.contains('outbox')) r.result.createObjectStore('outbox'); };
        r.onsuccess = () => res(r.result); r.onerror = () => { dbp = null; rej(r.error || new Error('IndexedDB')); }; r.onblocked = () => { dbp = null; rej(new Error('IndexedDB bloquée')); };
    }));
    const tx = async (mode, fn) => {
        const d = await open();
        return new Promise((res, rej) => { const t = d.transaction('outbox', mode); let out; const r = fn(t.objectStore('outbox')); if (r) r.onsuccess = () => { out = r.result; }; t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); });
    };
    const put = p => tx('readwrite', st => st.put(p, p.id));
    const get = id => tx('readonly', st => st.get(id));
    const del = id => tx('readwrite', st => st.delete(id));
    const all = () => tx('readonly', st => st.getAll()).then(l => (l || []).filter(Boolean));
    const chan = typeof BroadcastChannel !== 'undefined' ? new BroadcastChannel('xiii-suite') : null;
    // Propose l'envoi aux onglets ouverts ; vrai si l'outil destinataire a répondu
    const offer = (to, id, ms) => new Promise(res => {
        if (!chan) { res(false); return; }
        let done = false;
        const h = e => { const m = e.data || {}; if (m.type === 'ack' && m.id === id) { done = true; chan.removeEventListener('message', h); res(true); } };
        chan.addEventListener('message', h);
        chan.postMessage({ type: 'offer', to, id });
        setTimeout(() => { if (!done) { chan.removeEventListener('message', h); res(false); } }, ms || 700);
    });
    const b64 = blob => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1] || ''); r.onerror = rej; r.readAsDataURL(blob); });
    async function toFileBlob(p) {
        const o = Object.assign({}, p); delete o.to;
        if (o.file && o.file.blob) o.file = { name: o.file.name, type: o.file.type, data: await b64(o.file.blob) };
        return new Blob([JSON.stringify(o)], { type: 'application/json' });
    }
    function fromObject(o) {
        if (!o || o.format !== 'xiii-link') return null;
        if (o.file && o.file.data && !o.file.blob) {
            const bin = atob(o.file.data); const u8 = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
            o.file = { name: o.file.name, type: o.file.type, blob: new Blob([u8], { type: o.file.type || '' }) };
        }
        return o;
    }
    const id = () => 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    const safe = s => String(s || 'document').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^\w\- ]+/g, ' ').trim().replace(/\s+/g, '_').slice(0, 80) || 'document';
    const dl = (blob, name) => { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000); };
    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    return { put, get, del, all, chan, offer, toFileBlob, fromObject, id, safe, dl, esc };
})();

function xiiiCapture(run, ms) {
    return new Promise((res, rej) => {
        const orig = window.saveFile; let done = false, t = null;
        const fin = (fn, v) => { if (done) return; done = true; window.saveFile = orig; clearTimeout(t); fn(v); };
        t = setTimeout(() => fin(rej, new Error('Le rendu n\'a pas abouti')), ms || 120000);
        window.saveFile = async (name, data, type) => {
            const blob = data instanceof Blob ? data : new Blob([data], { type: type || 'application/octet-stream' });
            fin(res, { name, blob, type: blob.type || type || '' }); return true;
        };
        Promise.resolve().then(run).then(() => setTimeout(() => fin(rej, new Error('Aucun document produit (contenu vide ?)')), 600)).catch(e => fin(rej, e));
    });
}
// Rapport imprimable de la suite (bandeau, chiffres clés, sections, tableaux) → HTML simple pour DOSSIER XIII
function xiiiReportToHtml(html) {
    const E = XIII.esc, T = el => (el ? el.textContent : '').replace(/\s+/g, ' ').trim();

    const TT = el => !el ? '' : el.children.length ? [...el.childNodes].map(n => n.nodeType === 3 ? n.nodeValue : TT(n)).map(x => String(x).replace(/\s+/g, ' ').trim()).filter(Boolean).join(' · ') : T(el);
    const root = document.createElement('div'); root.innerHTML = html;
    root.querySelectorAll('.no-print, .rep-switch, .sh-sign, .sign, script, style, button, select, input, svg').forEach(e => e.remove());
    const out = [];
    const hero = root.querySelector('.sh-hero');
    if (hero) {
        const prod = hero.querySelector('.sh-prod'), brand = hero.querySelector('.sh-brand'), day = hero.querySelector('.sh-day');
        if (brand) out.push('<p><b>' + E(T(brand)) + '</b></p>');
        const band = hero.querySelector('.sh-band');
        if (band) { const extra = [...band.querySelectorAll(':scope > div > div')].filter(d => d !== brand && d !== prod).map(T).filter(Boolean); if (extra.length) out.push('<p>' + E(extra.join(' · ')) + '</p>'); }
        if (day && T(day)) out.push('<p>' + E([T(day.querySelector('b')), T(day.querySelector('span'))].filter(Boolean).join(' · ')) + '</p>');
        const keys = [...hero.querySelectorAll('.sh-key')];
        if (keys.length) out.push('<table><tr>' + keys.map(k => '<th>' + E(T(k.querySelector('span'))) + '</th>').join('') + '</tr><tr>' + keys.map(k => '<td>' + E(T(k.querySelector('b'))) + '</td>').join('') + '</tr></table>');
        const sub = [...hero.querySelectorAll('.sh-sub > span')].map(T).filter(Boolean);
        if (sub.length) out.push('<p>' + E(sub.join('   ·   ')) + '</p>');
    }
    const table = tbl => {
        const head = [...tbl.querySelectorAll('thead tr th')].map(T);
        const parts = []; let rows = [];
        const flush = () => { if (rows.length) parts.push('<table>' + (head.length ? '<tr>' + head.map(h => '<th>' + E(h) + '</th>').join('') + '</tr>' : '') + rows.join('') + '</table>'); rows = []; };
        tbl.querySelectorAll('tbody tr, :scope > tr').forEach(tr => {
            if (tr.classList.contains('case-h')) { flush(); parts.push('<p><b>' + E(TT(tr.children[0] || tr)) + '</b></p>'); return; }
            const cells = [...tr.children].map(T);
            if (cells.length === 1 && head.length > 1) { rows.push('<tr><td>' + E(cells[0]) + '</td>' + '<td></td>'.repeat(head.length - 1) + '</tr>'); return; }
            rows.push('<tr>' + cells.map(c => '<td>' + E(c) + '</td>').join('') + '</tr>');
        });
        flush();
        return parts.join('');
    };
    root.querySelectorAll('.sh-sec').forEach(sec => {
        const h = sec.querySelector('h3'); if (h) out.push('<h3>' + E(TT(h)) + '</h3>');
        const body = sec.querySelector('.sh-body') || sec;
        body.childNodes.forEach(n => {
            if (n.nodeType === 3) { const t = n.nodeValue.replace(/\s+/g, ' ').trim(); if (t) out.push('<p>' + E(t) + '</p>'); return; }
            if (n.nodeType !== 1 || n === h) return;
            if (n.tagName === 'TABLE') out.push(table(n));
            else if (n.tagName === 'UL' || n.tagName === 'OL') out.push('<ul>' + [...n.querySelectorAll('li')].map(li => '<li>' + E(T(li)) + '</li>').join('') + '</ul>');
            else { const tb = n.querySelector('table'); if (tb) out.push(table(tb)); else if (T(n)) out.push('<p>' + E(T(n)) + '</p>'); }
        });
    });
    const foot = root.querySelector('.sh-foot'); if (foot && T(foot)) out.push('<p><i>' + E(T(foot)) + '</i></p>');
    return out.join('\n');
}

    };
    const LNAME = { schedule: 'ligne(s) de programme', crew: 'personne(s)', locations: 'lieu(x)' };

    // ---------- bureau → mobile : projet allégé (sans logo, sans annuaire, sans météo horaire) ----------
    function compact(o) {

    function choose(title, html, labels) {
        return new Promise(res => {
            let done = false; const fin = i => { if (!done) { done = true; mo.disconnect(); res(i); } };
            const ov = modal(title, html, labels.map((l, i) => ({ label: l.label || l, danger: !!l.danger, action: () => { fin(i); } })));

    }

    function panel(scope) {
        XM.desktopPanel({
            app: APP, page: 'callsheeto-m.html', title: 'CALL SHEETO XIII', name: () => P.name || 'Production',

    }

    (function addBtn() {

        const myR = (S.myRisks || []).filter(r => txt(r.n)).map(r => [slug(r.n), txt(r.n), txt(r.txt)]);
        RISKS.length = 0; O_RISKS.concat(myR.filter(r => !ORIG_KEYS.has(r[0]))).forEach(r => RISKS.push(r.slice()));
        const sos = (S.sos || []).filter(r => txt(r.num));
        SOS.length = 0; (sos.length ? sos.map(r => [txt(r.num), txt(r.label)]) : O_SOS).forEach(s => SOS.push(s.slice()));

// =====================================================================
//  SUITE XIII — XUNDO : historique (annuler / rétablir) et versions nommées
//  Pour les outils sans historique propre. Injecté avec les paramètres (inject_settings.py).
//  Principe : après chaque action de l'utilisateur, l'état du projet est comparé au précédent ;
//  s'il a changé, l'ancien état est empilé. Ctrl+Z / Ctrl+Maj+Z (ou Ctrl+Y), boutons ↶ ↷ et 🕘.
// =====================================================================
const XUNDO = (() => {
    const AD = {
        cadro: { get: () => ({ S, PLANS, MY, NAME, AUTH }), set: v => { S = v.S; PLANS = v.PLANS; MY = v.MY; NAME = v.NAME; AUTH = v.AUTH; }, after: () => { try { const a = document.getElementById('project-name'), b = document.getElementById('author-name'); if (a) a.value = NAME; if (b) b.value = AUTH; } catch (e) { } saveState(false); renderAll(); } },
        _P: { get: () => P, set: v => { P = v; }, after: () => { try { [['project-name', 'name'], ['author-name', 'author']].forEach(([id, k]) => { const el = document.getElementById(id); if (el && P && typeof P[k] === 'string') el.value = P[k]; }); } catch (e) { } renderAll(); saveProject(false); } }
    };
    const MAX = 80, LIMIT = 4e6;
    let A = null, app = '', last = '', undo = [], redo = [], uAt = [], rAt = [], lastAt = Date.now(), busy = false, t = null, big = false;
    const snap = () => { try { return JSON.stringify(A.get(), (k, v) => k === 'updated' || k === 'savedAt' || k === 'lastSave' || k === 'fdrPlans' || k === 'fdrPlansAt' ? undefined : v); } catch (e) { return ''; } }; // les dates d'enregistrement ne comptent pas comme une modification
    function check() {
        if (busy || !A) return; const s = snap(); if (!s || s === last) return;
        if (s.length > LIMIT) { big = true; last = s; undo = []; redo = []; ui(); return; }
        big = false; if (last && last !== 'null') { undo.push(last); uAt.push({ at: lastAt, d: s.length - last.length }); if (undo.length > MAX) { undo.shift(); uAt.shift(); } } redo = []; rAt = []; last = s; lastAt = Date.now(); ui();
    }
    const later = () => { clearTimeout(t); t = setTimeout(check, 350); };
    function apply(s) { busy = true; try { A.set(JSON.parse(s)); last = s; A.after(); } catch (e) { console.warn('XUNDO', e); } busy = false; ui(); }
    function doUndo() { check(); if (!undo.length) { msg(big ? 'Historique désactivé : projet trop volumineux' : 'Rien à annuler'); return; } redo.push(last); rAt.push({ at: lastAt }); apply(undo.pop()); lastAt = (uAt.pop() || {}).at || Date.now(); msg('↶ Annulé'); }
    function doRedo() { if (!redo.length) { msg('Rien à rétablir'); return; } undo.push(last); uAt.push({ at: lastAt }); apply(redo.pop()); lastAt = (rAt.pop() || {}).at || Date.now(); msg('↷ Rétabli'); }
