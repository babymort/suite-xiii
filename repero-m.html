// ---------- fiche technique (électricité, camion, réseau) ----------

const dotI = (emoji, color, size) => L.divIcon({ className: '', iconSize: [size, size], iconAnchor: [size / 2, size / 2], html: '<div class="rp-dot" style="width:' + size + 'px;height:' + size + 'px;border-color:' + color + '"><span style="font-size:' + Math.round(size * .55) + 'px">' + emoji + '</span></div>' });

}
function arcPts(lat, lon, a1, a2, r, step) { let d = ((a2 - a1 + 540) % 360) - 180; const n = Math.max(2, Math.ceil(Math.abs(d) / (step || 3))), out = []; for (let i = 0; i <= n; i++) out.push(dest(lat, lon, a1 + d * i / n, r)); return out; }
const wmtsU = (layer, fmt) => 'https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=' + layer + '&STYLE=normal&FORMAT=' + fmt + '&TILEMATRIXSET=PM&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}';

const MapUI = (() => {
    let MAP = null, LP = null, G = {}, baseL = null, moving = false, pend = null, mk = null, lastId = '', tileWarn = false, curS = null;
    const wrap = Q('#mapwrap');
    function ensureL() {
        if (window.L && L.map) return Promise.resolve(true); if (LP) return LP;
        if (navigator.onLine === false) return Promise.resolve(false);
        LP = new Promise(res => {
            let done = false, t; const fin = v => { if (done) return; done = true; clearTimeout(t); if (!v) LP = null; res(v); };
            const css = document.createElement('link'); css.rel = 'stylesheet'; css.href = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css'; document.head.appendChild(css);
            const sc = document.createElement('script'); sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js'; sc.onload = () => fin(!!(window.L && L.map)); sc.onerror = () => { sc.remove(); css.remove(); fin(false); };
            document.head.appendChild(sc); t = setTimeout(() => fin(false), 9000);

    function baseLayer() {

        else l = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' });

    }

        ray(day.azRise, '#FFB300', '🌅 Lever ' + fmtT(day.T.sunrise, day.tz)); ray(day.azSet, '#E64A19', '🌇 Coucher ' + fmtT(day.T.sunset, day.tz)); ray(day.azNoon, '#FFF176', '☀️ Midi solaire ' + fmtT(day.T.solarNoon, day.tz), 2, '2 6');
        const path = sunPath(s, day.date, 15).filter(p => p.alt > 0); if (path.length > 1) L.polyline(path.map(p => dest(s.lat, s.lon, p.az, 300)), { color: '#FFD54F', weight: 2, opacity: .85, interactive: false }).addTo(g);

                poiPins(G.sec, a, ['pharmacy', 'fire', 'aed', 'police'], 3);

        if (moving) mk.on('dragend', () => { const ll = mk.getLatLng(); pend = [ll.lat, ll.lng]; chrome(s); });

    ov.querySelector('.sar-bar').onclick = e => { const b = e.target.closest('[data-x]'); if (!b) return; const k = b.dataset.x;
        if (k === 'close') { cancelAnimationFrame(raf); if (stream) stream.getTracks().forEach(t => t.stop()); window.removeEventListener('deviceorientationabsolute', onOr); window.removeEventListener('deviceorientation', onOr); ov.remove(); }
        else if (k === 'off') off -= 5; else if (k === 'on') off += 5;
        else if (k === 'fov') { fovL = fovL >= 80 ? 55 : fovL + 5; try { localStorage.setItem('xiii.sar.fov', fovL); } catch (er) { } b.textContent = '📐 Champ ' + fovL + '°'; } };
}
})();

</script>
