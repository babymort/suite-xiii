<script>
XM.initTheme();
// =====================================================================
//  MOODO XIII · mobile — relecture des moodboards (envoyés depuis l'ordinateur)
// =====================================================================
const APPN = 'moodo', Q = XM.$, QQ = XM.$$, E = XM.esc;
let M = null, VIEW = { k: 'list' };
// stockage : IndexedDB (les images dépassent vite la limite du localStorage)
function idb() { return new Promise((res, rej) => { const r = indexedDB.open('moodoXIIIm', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function kv(mode, fn) { const d = await idb(); return new Promise((res, rej) => { const t = d.transaction('kv', mode), r = fn(t.objectStore('kv')); t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error); }); }
const saveM = async () => { try { await kv('readwrite', s => s.put(M, 'cur')); } catch (e) { XM.toast('⚠️ Stockage impossible : le moodboard reste affiché tant que la page est ouverte', 4000); } };
const loadM = async () => { try { M = await kv('readonly', s => s.get('cur')) || null; } catch (e) { M = null; } };
const img = id => (M && M.imgs && M.imgs[id]) || '';
const srcOf = it => it.img ? img(it.img) : (it.url || '');
const lum = h => { const m = /^#?([0-9a-f]{6})$/i.exec(h || ''); if (!m) return 0; const n = parseInt(m[1], 16); return ((n >> 16) * .299 + ((n >> 8) & 255) * .587 + (n & 255) * .114) / 255; };
const host = u => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return u; } };
const isUrl = s => /^https?:\/\//i.test(s || '');
function render() {
    const m = Q('#mo-main'), P = M && M.project; Q('#mo-back').style.visibility = VIEW.k === 'list' ? 'hidden' : 'visible';
    if (!P) {
        Q('#mo-sub').textContent = 'Moodboards';
        m.innerHTML = '<div class="m-card accent"><h3>🎞️ Relire un moodboard</h3><p class="m-hint" style="margin:0 0 12px">Sur l\'ordinateur, dans MOODO XIII, touchez <b>📱 Mobile</b> puis « Envoyer vers le mobile » : ouvrez le fichier (AirDrop, mail, cloud…) ou le lien reçu ici.</p><div class="m-actions" style="margin-top:0"><button class="m-btn primary" id="i-f">📂 Ouvrir le fichier</button><button class="m-btn" id="i-l">🔗 Coller un lien</button></div></div><p class="m-hint">La version mobile sert à relire : planches, fiches, palettes, images en plein écran. Les modifications se font sur l\'ordinateur.</p>';
        Q('#i-f').onclick = () => XM.importFile(APPN, onEnv); Q('#i-l').onclick = () => XM.importLink(APPN, onEnv); return;
    }
    if (VIEW.k === 'list') {
        Q('#mo-sub').textContent = P.name || 'Moodboard';
        m.innerHTML = '<div class="m-sec" style="margin-top:4px">' + E(P.name || 'Moodboard') + (P.author ? ' · ' + E(P.author) : '') + '</div><div class="mo-bl">' + P.boards.map((b, i) => { const t = typeOf(b.type), im = b.items.filter(x => x.kind === 'img' && srcOf(x)).sort((x, y) => (y.star ? 1 : 0) - (x.star ? 1 : 0)).slice(0, 6), cols = b.palette.length ? b.palette : b.items.filter(x => x.kind === 'color').map(x => x.color);
            return '<div class="mo-bc" style="--tc:' + t[3] + '" data-b="' + i + '"><div class="mos">' + (im.length ? im.map(x => '<img src="' + E(srcOf(x)) + '" alt="">').join('') + '<div></div>'.repeat(Math.max(0, (im.length > 3 ? 6 : 3) - im.length)) : '<div style="grid-column:1/-1;display:flex;align-items:center;justify-content:center;font-size:28px">' + t[2] + '</div>') + '</div>' + (cols.length ? '<div class="bpal">' + cols.map(c => '<i style="background:' + E(c) + '"></i>').join('') + '</div>' : '') + '<div class="bi"><b>' + t[2] + ' ' + E(b.name) + '</b><small>' + E(t[1]) + ' · ' + b.items.length + ' élément(s)</small></div></div>'; }).join('') + '</div>' +
            '<p class="m-hint" style="text-align:center;margin-top:14px">Reçu ' + (M.recv ? 'le ' + new Date(M.recv).toLocaleDateString('fr-FR') + ' à ' + new Date(M.recv).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }) : '') + '</p>';
        QQ('[data-b]', m).forEach(c => c.onclick = () => { VIEW = { k: 'board', i: +c.dataset.b, tab: 'img' }; render(); window.scrollTo(0, 0); });
        return;
    }
    const b = P.boards[VIEW.i], t = typeOf(b.type); Q('#mo-sub').textContent = t[2] + ' ' + b.name;
    const fk = t[4].filter(f => (b.fiche[f[0]] || '').trim());
    let h = '<div class="m-seg"><button data-t="img" class="' + (VIEW.tab === 'img' ? 'on' : '') + '">🧩 Planche</button><button data-t="fiche" class="' + (VIEW.tab === 'fiche' ? 'on' : '') + '">📝 Fiche' + (fk.length ? ' (' + fk.length + ')' : '') + '</button></div>';
    if (b.palette.length) h += '<div class="mo-pal">' + b.palette.map(c => '<span style="background:' + E(c) + ';color:' + (lum(c) > .55 ? '#111' : '#fff') + '">' + E(c) + '</span>').join('') + '</div>';
    if (VIEW.tab === 'fiche') h += '<div class="m-card"><dl class="mo-fi" style="margin:0">' + (fk.length || b.fiche._notes ? fk.map(f => '<dt>' + E(f[1]) + '</dt><dd>' + E(b.fiche[f[0]]) + '</dd>').join('') + (b.fiche._notes ? '<dt>Notes</dt><dd>' + E(b.fiche._notes) + '</dd>' : '') : '<p class="m-hint" style="margin:0">Fiche vide.</p>') + '</dl></div>';
    else h += b.groups.map(g => { const its = b.items.filter(x => x.group === g.id); if (!its.length) return ''; return '<div class="mo-g"><h3>' + E(g.name) + ' · ' + its.length + '</h3><div class="mo-grid">' + its.map(it => {
        const cap = (it.cap || it.src) ? '<div class="cap">' + (it.star ? '<span class="st">★</span>' : '') + E(it.cap || '') + (it.src ? '<small>' + E(isUrl(it.src) ? host(it.src) : it.src) + '</small>' : '') + '</div>' : '';
        if (it.kind === 'img') return srcOf(it) ? '<div class="mo-it"><img src="' + E(srcOf(it)) + '" alt="" loading="lazy" data-z="' + it.id + '">' + cap + '</div>' : '';
        if (it.kind === 'note') return '<div class="mo-it"><div class="nt">' + E(it.text) + '</div></div>';
        if (it.kind === 'color') return '<div class="mo-it"><div class="cl" style="background:' + E(it.color) + ';color:' + (lum(it.color) > .55 ? '#111' : '#fff') + '">' + E(it.color) + '</div>' + cap + '</div>';
        if (it.kind === 'link') return '<a class="mo-it" style="display:block;color:inherit;text-decoration:none" href="' + E(it.url) + '" target="_blank" rel="noopener"><div class="nt">🔗 ' + E(it.cap || host(it.url)) + '<br><small style="color:var(--accent-text)">' + E(host(it.url)) + '</small></div></a>';
        if (it.kind === 'ref') return '<div class="mo-it"><div class="nt">🎬 <b>' + E(it.title) + '</b><br><small>' + E([it.who, it.year].filter(Boolean).join(' · ')) + '</small>' + (it.cap ? '<br><i>' + E(it.cap) + '</i>' : '') + '</div></div>';
        return ''; }).join('') + '</div></div>'; }).join('') || '<div class="m-empty">Planche vide.</div>';
    h += '<div class="m-actions">' + (VIEW.i > 0 ? '<button class="m-btn" data-n="-1">‹ ' + E(P.boards[VIEW.i - 1].name) + '</button>' : '') + (VIEW.i < P.boards.length - 1 ? '<button class="m-btn" data-n="1">' + E(P.boards[VIEW.i + 1].name) + ' ›</button>' : '') + '</div>';
    m.innerHTML = h;
    QQ('[data-t]', m).forEach(x => x.onclick = () => { VIEW.tab = x.dataset.t; render(); });
    QQ('[data-n]', m).forEach(x => x.onclick = () => { VIEW.i += +x.dataset.n; render(); window.scrollTo(0, 0); });
    QQ('[data-z]', m).forEach(x => x.onclick = () => lightbox(b, x.dataset.z));
}
function lightbox(b, id) {
    const ims = b.items.filter(x => x.kind === 'img' && srcOf(x)); let k = Math.max(0, ims.findIndex(x => x.id === id));
    const o = document.createElement('div'); o.className = 'mo-lb'; document.body.appendChild(o);
    const draw = () => { const it = ims[k]; o.innerHTML = '<button class="x" aria-label="Fermer">✕</button><div class="im"><img src="' + E(srcOf(it)) + '" alt=""></div><div class="ca">' + E(it.cap || '') + '<small>' + E([it.src && (isUrl(it.src) ? host(it.src) : it.src), (k + 1) + ' / ' + ims.length].filter(Boolean).join(' · ')) + '</small></div>'; o.querySelector('.x').onclick = () => o.remove(); };
    let x0 = null; o.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
    o.addEventListener('touchend', e => { if (x0 == null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null; if (Math.abs(dx) > 40) { k = (k + (dx < 0 ? 1 : -1) + ims.length) % ims.length; draw(); } });
    o.addEventListener('click', e => { if (e.target.closest('.x')) return; const r = e.clientX / innerWidth; if (r > .66) { k = (k + 1) % ims.length; draw(); } else if (r < .33) { k = (k - 1 + ims.length) % ims.length; draw(); } });
    draw();
}
async function onEnv(env) {
    const d = env.data || {}; if (!d.project || !Array.isArray(d.project.boards)) { XM.toast('⚠️ Cet envoi n\'est pas un moodboard', 4000); return; }
    M = { project: d.project, imgs: d.imgs || {}, recv: Date.now() }; VIEW = { k: 'list' }; await saveM(); render();
    XM.toast('📥 « ' + (d.project.name || 'Moodboard') + ' » reçu : ' + d.project.boards.length + ' planche(s)', 3500);
}
Q('#mo-back').onclick = () => { VIEW = { k: 'list' }; render(); window.scrollTo(0, 0); };
Q('#mo-menu').onclick = () => XM.menu({ app: APPN, deskPage: 'moodo.html', onImport: onEnv, items: M ? [{ icon: '🗑️', label: 'Effacer ce moodboard du téléphone', run: async () => { if (await XM.ask('Effacer ?', 'Le moodboard reçu sera effacé de ce téléphone (il reste sur l\'ordinateur).', [{ label: 'Effacer', danger: true }, 'Annuler']) !== 0) return; M = null; try { await kv('readwrite', s => s.delete('cur')); } catch (e) { } VIEW = { k: 'list' }; render(); } }] : [] });
(async () => { await loadM(); render(); XM.fromHash(APPN, onEnv); })();

</script>
