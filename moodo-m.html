function lightbox(b, id) {
    const ims = b.items.filter(x => x.kind === 'img' && srcOf(x)); let k = Math.max(0, ims.findIndex(x => x.id === id));
    const o = document.createElement('div'); o.className = 'mo-lb'; document.body.appendChild(o);
    const draw = () => { const it = ims[k]; o.innerHTML = '<button class="x" aria-label="Fermer">✕</button><div class="im"><img src="' + E(srcOf(it)) + '" alt=""></div><div class="ca">' + E(it.cap || '') + '<small>' + E([it.src && (isUrl(it.src) ? host(it.src) : it.src), (k + 1) + ' / ' + ims.length].filter(Boolean).join(' · ')) + '</small></div>'; o.querySelector('.x').onclick = () => o.remove(); };
    let x0 = null; o.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
