<script>
// =====================================================================
//  XQR : générateur de QR code (mode octets, niveaux L/M/Q/H, versions 1 à 40) — sans dépendance
//  XQR.make(texte, 'L') → { size, ver, get(x, y) } ou null si trop long ; XQR.svg(texte, opts) → chaîne SVG ou null
// =====================================================================

    const ECC = [[-1, 7, 10, 15, 20, 26, 18, 20, 24, 30, 18, 20, 24, 26, 30, 22, 24, 28, 30, 28, 28, 28, 28, 30, 30, 26, 28, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30],

        [-1, 13, 22, 18, 26, 18, 24, 18, 22, 20, 24, 28, 26, 24, 20, 30, 24, 28, 28, 26, 30, 28, 30, 30, 30, 30, 28, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30],
        [-1, 17, 28, 22, 16, 22, 28, 26, 26, 24, 28, 24, 28, 22, 24, 24, 30, 28, 28, 26, 28, 30, 24, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30]];
    const BLK = [[-1, 1, 1, 1, 1, 1, 2, 2, 2, 2, 4, 4, 4, 4, 4, 6, 6, 6, 6, 7, 8, 8, 9, 9, 10, 12, 12, 12, 13, 14, 15, 16, 17, 18, 19, 19, 20, 21, 22, 24, 25],
        [-1, 1, 1, 1, 2, 2, 4, 4, 4, 5, 5, 5, 8, 9, 9, 10, 10, 11, 13, 14, 16, 17, 17, 18, 20, 21, 23, 25, 26, 28, 29, 31, 33, 35, 37, 38, 40, 43, 45, 47, 49],
        [-1, 1, 1, 2, 2, 4, 4, 6, 6, 8, 8, 8, 10, 12, 16, 12, 17, 16, 18, 21, 20, 23, 23, 25, 27, 29, 34, 34, 35, 38, 40, 43, 45, 48, 51, 53, 56, 59, 62, 65, 68],
        [-1, 1, 1, 2, 4, 4, 4, 5, 6, 8, 8, 11, 11, 16, 16, 18, 16, 19, 21, 25, 25, 25, 34, 30, 32, 35, 37, 40, 42, 45, 48, 51, 54, 57, 60, 63, 66, 70, 74, 77, 81]];
    const ECL = { L: [0, 1], M: [1, 0], Q: [2, 3], H: [3, 2] };
    const raw = v => { let r = (16 * v + 128) * v + 64; if (v >= 2) { const n = Math.floor(v / 7) + 2; r -= (25 * n - 10) * n - 55; if (v >= 7) r -= 36; } return r; };

            '<div class="big"><span class="k">Séquence</span><span class="v">' + scEsc(s ? s.seq : '—') + '</span></div><div class="big"><span class="k">Plan</span><span class="v">' + scEsc(s ? s.plan : '—') + '</span></div><div class="big"><span class="k">Prise</span><span class="v">' + scEsc(take) + '</span></div>' +

            '<div class="sm"><span class="k">' + (ie ? scEsc(ie[1].toUpperCase()) + '. ' : '') + (dn ? scEsc(dn[1].toUpperCase()) : 'Décor') + '</span><span class="v">' + scEsc(s ? (s.decor || '—').replace(/^\s*(int|ext)\.?\s*/i, '') : '—') + '</span></div>' +
            '<div class="sm"><span class="k">Image · Son</span><span class="v">' + scEsc([cam, son].filter(Boolean).join(' / ')) + '</span></div>' +
            '<div class="nm"><span class="k">' + scEsc([P.director && 'Réal. ' + P.director, P.author && 'Scripte ' + P.author, P.client].filter(Boolean).join(' · ') || 'Plan') + '</span><span class="v">' + scEsc(s ? s.name || '' : 'Aucun plan') + '</span></div>' +
            '</div><div class="cl-ui"><button data-a="pp" title="Plan précédent (←)">‹ Plan</button><button data-a="np" title="Plan suivant (→)">Plan ›</button><span class="sep"></span><button data-a="tm" title="Prise − (↓)">− Prise</button><button data-a="tp" title="Prise + (↑)">Prise +</button><span class="sep"></span><button class="go" data-a="clap" title="Clap ! (Espace)">CLAP !</button><button class="x" data-a="x" title="Quitter le mode Clap (Échap)">✕ Quitter</button></div>';
        o.querySelectorAll('[data-a]').forEach(b => b.onclick = e => { e.stopPropagation(); act(b.dataset.a); });

    draw();

function bindShot(s) {
    const box = wide() ? Q('#sc-main .r') : Q('#sc-main');
    QQ('[data-f]', box).forEach(el => el.addEventListener(el.tagName === 'SELECT' ? 'change' : 'input', () => { s[el.dataset.f] = el.value; touch(s); if (wide() && ['seq', 'plan', 'name'].includes(el.dataset.f)) { clearTimeout(bindShot.t); bindShot.t = setTimeout(refreshList, 500); } }));
    QQ('[data-tag]', box).forEach(b => b.onclick = () => { const a = s[b.dataset.tag] = s[b.dataset.tag] || [], v = b.dataset.v, i = a.indexOf(v); if (i < 0) a.push(v); else a.splice(i, 1); b.classList.toggle('on', i < 0); touch(s); });
    QQ('[data-st]', box).forEach(b => b.onclick = () => { s.status = b.dataset.st; touch(s); render(); });
    QQ('[data-tk]', box).forEach(el => el.addEventListener('input', () => { const t = s.takes.find(x => x.id === el.dataset.tk); if (t) { t[el.dataset.k] = el.value; touch(s); } }));
    QQ('[data-ts]', box).forEach(b => b.onclick = () => { const t = s.takes.find(x => x.id === b.dataset.ts); if (!t) return; t.st = t.st === b.dataset.v ? '' : b.dataset.v; if (t.st === 'ok') s.status = 'done'; touch(s); render(); });
    QQ('[data-td]', box).forEach(b => b.onclick = async () => { if (await XM.ask('Supprimer la prise ?', '', [{ label: 'Supprimer', danger: true }, 'Annuler']) !== 0) return; s.takes = s.takes.filter(t => t.id !== b.dataset.td); touch(s); render(); });
    Q('#tk-add', box).onclick = addTake;
    Q('#ph-cam', box).onclick = () => Q('#sc-cam').click(); Q('#ph-gal', box).onclick = () => Q('#sc-gal').click();
    QQ('[data-ph]', box).forEach(f => f.onclick = () => photoView(s, f.dataset.ph));
    QQ('[data-go]', box).forEach(f => f.onclick = () => { P.cur.shot = f.dataset.go; render(); });
    QQ('[data-nav]', box).forEach(b => b.onclick = () => { const l = dayShots(), i = l.findIndex(x => x.id === s.id) + +b.dataset.nav; if (l[i]) { P.cur.shot = l[i].id; persist(); render(); window.scrollTo(0, 0); } });
    Q('#sh-next', box).onclick = () => newShot();
    Q('#sh-dup', box).onclick = () => { const n = JSON.parse(JSON.stringify(s)); n.id = scUid(); n.plan = scNext(s.plan); n.takes = []; n.photos = []; n.status = 'todo'; n.t = Date.now(); P.shots.push(n); P.cur.shot = n.id; touch(n); render(); XM.toast('⧉ ' + scLabel(n) + ' (sans prises ni photos)'); };
    Q('#sh-del', box).onclick = async () => { if (await XM.ask('Supprimer ' + scLabel(s) + ' ?', 'Ses prises et photos seront supprimées.', [{ label: 'Supprimer', danger: true }, 'Annuler']) !== 0) return; P.shots = P.shots.filter(x => x.id !== s.id); const l = dayShots(); P.cur.shot = l.length ? l[l.length - 1].id : ''; VIEW = 'list'; touch(); render(); IMG.gc(P); };
}
function refreshList() { const l = Q('#sc-main .l'); if (l) { const y = l.scrollTop; l.innerHTML = listHtml(); bindList(); l.scrollTop = y; } }
function newShot() { const s = scBlankShot(P, P.cur.day); P.shots.push(s); P.cur.shot = s.id; VIEW = 'shot'; touch(s); render(); window.scrollTo(0, 0); setTimeout(() => { const i = Q('[data-f="name"]'); if (i) i.focus(); }, 60); XM.toast('➕ ' + scLabel(s)); }
function addTake() { const s = SH(); if (!s) return; const t = scBlankTake(s); s.takes.push(t); if (s.status === 'todo') s.status = 'wip'; touch(s); VIEW = 'shot'; render(); XM.toast('🎞️ Prise ' + t.n, 1200); }
async function addPhotos(files) {
    const s = SH(); if (!s) return; let n = 0;
    for (const f of files) { try { const d = await scCompress(await scFileURL(f), 1400, 0.8), id = 'ph' + scUid(); await IMG.put(id, d); s.photos.push({ id, cap: '', t: Date.now() }); n++; } catch (e) { } }
    if (n) { touch(s); render(); XM.toast('📷 ' + n + ' photo(s) de raccord'); } else XM.toast('⚠️ Image illisible');
}
function photoView(s, id) {
    const p = s.photos.find(x => x.id === id); if (!p) return;
    const o = document.createElement('div'); o.className = 'sc-lb'; o.innerHTML = '<img src="' + IMG.get(id) + '" alt=""><input type="text" id="lb-c" value="' + E(p.cap) + '" placeholder="Légende (ex. sac épaule gauche)"><div class="m-actions"><button class="m-btn danger" id="lb-d">🗑️ Supprimer</button><button class="m-btn primary" id="lb-o">OK</button></div>';
    document.body.appendChild(o);
    o.querySelector('#lb-o').onclick = () => { p.cap = o.querySelector('#lb-c').value.trim(); touch(s); o.remove(); render(); };
    o.querySelector('#lb-d').onclick = () => { s.photos = s.photos.filter(x => x.id !== id); touch(s); o.remove(); render(); IMG.gc(P); };
}
// ---------- menu, journées, production ----------
function editDay(id) {
    const d = P.days.find(x => x.id === id); if (!d) return;
    const s = XM.sheet('<label class="m-field"><span>Nom</span><input type="text" id="ed-l" value="' + E(d.label) + '"></label><label class="m-field"><span>Date</span><input type="date" id="ed-d" value="' + E(d.date) + '"></label><label class="m-field"><span>Notes de la journée</span><textarea id="ed-n" placeholder="Météo, retards, incidents…">' + E(d.notes) + '</textarea></label><div class="m-actions">' + (P.days.length > 1 ? '<button class="m-btn danger" id="ed-x">Supprimer</button>' : '') + '<button class="m-btn primary" id="ed-ok">OK</button></div>', { title: '📅 Journée' });
    Q('#ed-ok', s).onclick = () => { d.label = Q('#ed-l', s).value.trim() || d.label; d.date = Q('#ed-d', s).value; d.notes = Q('#ed-n', s).value; d.mod = Date.now(); touch(); XM.closeSheet(); render(); };
    const x = Q('#ed-x', s); if (x) x.onclick = async () => { XM.closeSheet(); if (await XM.ask('Supprimer ' + d.label + ' ?', 'Tous ses plans seront supprimés de la tablette.', [{ label: 'Supprimer', danger: true }, 'Annuler']) !== 0) return; P.shots = P.shots.filter(s2 => s2.day !== id); P.days = P.days.filter(x2 => x2.id !== id); P = scNormalize(P); touch(); render(); IMG.gc(P); };
}
function editProject() {
    const s = XM.sheet('<label class="m-field"><span>Titre de la production</span><input type="text" id="ep-n" value="' + E(P.name) + '" placeholder="NUIT BLANCHE — court métrage"></label><label class="m-field"><span>Production</span><input type="text" id="ep-c" value="' + E(P.client) + '"></label><label class="m-field"><span>Réalisation</span><input type="text" id="ep-r" value="' + E(P.director || '') + '"></label><label class="m-field"><span>Scripte</span><input type="text" id="ep-a" value="' + E(P.author) + '"></label><div class="m-actions"><button class="m-btn primary" id="ep-ok">OK</button></div>', { title: '🎬 Production' });
    Q('#ep-ok', s).onclick = () => { P.name = Q('#ep-n', s).value.trim(); P.client = Q('#ep-c', s).value.trim(); P.director = Q('#ep-r', s).value.trim(); P.author = Q('#ep-a', s).value.trim(); touch(); XM.closeSheet(); render(); };
}
function imgsOf(p) { const o = {}; p.shots.forEach(s => s.photos.forEach(ph => { const d = IMG.get(ph.id); if (d) o[ph.id] = d; })); return o; }
function sendReturn() {
    if (!P) { XM.toast('Aucun script'); return; }
    XM.send({ app: APPN, page: 'scripto.html', title: 'SCRIPTO', kind: 'return', name: P.name || 'Script tablette', make: () => ({ project: JSON.parse(JSON.stringify(P)), imgs: imgsOf(P) }),
        note: 'Sur l\'ordinateur, ouvrez ce fichier dans SCRIPTO XIII (📂 Ouvrir ou glisser-déposer) : le script est fusionné avec celui du bureau, prises et photos comprises. Avec des photos, préférez le fichier (AirDrop, mail, cloud).' });
    P.changed = false; persist();
}
async function report() {
    const body = await scReportHtml(P, { days: [P.cur.day] }, async id => IMG.get(id));
    const w = window.open('', '_blank'); if (!w) { XM.toast('⚠️ Autorisez les fenêtres pour le rapport'); return; }
    w.document.write('<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rapport ' + E(DAY().label) + '</title><style>body{max-width:900px;margin:16px auto;padding:0 12px;background:#fff}' + SC_RCSS + '@page{size:A4;margin:11mm}</style></head><body>' + body + '<script>setTimeout(()=>print(),500)<\/script></body></html>'); w.document.close();
}
async function onEnv(env) {
    const d = env.data || {}; if (!d.project || !Array.isArray(d.project.shots)) { XM.toast('⚠️ Cet envoi n\'est pas un script SCRIPTO', 4000); return; }
    for (const [k, v] of Object.entries(d.imgs || {})) await IMG.put(k, v);
    const inc = scNormalize(d.project);
    if (P && P.shots.length) {
        const c = await XM.ask('Script reçu du bureau', '« ' + E(inc.name || 'Script') + ' » : ' + inc.shots.length + ' plan(s). ' + (inc.id === P.id ? 'C\'est le même script : la fusion garde la version la plus récente de chaque plan.' : 'La tablette contient déjà un autre script.'), ['🔀 Fusionner', { label: '♻️ Remplacer', danger: true }, 'Annuler']);
        if (c === 0) { const r = scMerge(P, inc); P = r.P; XM.toast('🔀 ' + r.added + ' plan(s) ajouté(s), ' + r.upd + ' mis à jour', 3500); }
        else if (c === 1) { P = inc; XM.toast('📥 Script remplacé'); } else return;
    } else { P = inc; XM.toast('📥 « ' + (P.name || 'Script') + ' » reçu : ' + P.shots.length + ' plan(s)', 3500); }
    VIEW = 'list'; persist(); render(); IMG.gc(P);
}
Q('#sc-back').onclick = () => { VIEW = 'list'; render(); window.scrollTo(0, 0); };
Q('#sc-fab').onclick = newShot;
Q('#sc-take').onclick = addTake;
const CLAPK = 'scriptoXIIIm.clap', clapCfg = () => { try { return Object.assign({ ms: 500, log: true }, JSON.parse(localStorage.getItem(CLAPK) || '{}')); } catch (e) { return { ms: 500, log: true }; } };
function openClap() {
    if (!P || !dayShots().length) { XM.toast('Ajoutez d\'abord un plan'); return; }
    if (!SH() || SH().day !== P.cur.day) P.cur.shot = dayShots()[0].id;
    scClapOpen({ P: () => P, shots: dayShots, cur: () => P.cur.shot, select: id => { P.cur.shot = id; persist(); }, dur: () => clapCfg().ms, light: () => document.body.classList.contains('light-theme'), log: () => clapCfg().log,
        logTake: (s, n) => { const t = scBlankTake(s); t.n = n; s.takes.push(t); if (s.status === 'todo') s.status = 'wip'; touch(s); }, onClose: render });
}
function clapSettings() {
    const c = clapCfg(), s = XM.sheet('<label class="m-field"><span>Durée du bip et du flash (ms)</span><input type="number" id="cs-ms" min="100" max="3000" step="50" value="' + c.ms + '"></label><label style="display:flex;gap:10px;align-items:center;margin:4px 0 14px"><input type="checkbox" id="cs-log"' + (c.log ? ' checked' : '') + '> Noter la prise à chaque clap</label><div class="m-actions"><button class="m-btn" id="cs-t">🔊 Tester</button><button class="m-btn primary" id="cs-ok">OK</button></div>', { title: '🎬 Réglages du clap' });
    Q('#cs-t', s).onclick = () => scBeep(Math.max(100, +Q('#cs-ms', s).value || 500));
    Q('#cs-ok', s).onclick = () => { try { localStorage.setItem(CLAPK, JSON.stringify({ ms: Math.max(100, Math.min(3000, +Q('#cs-ms', s).value || 500)), log: Q('#cs-log', s).checked })); } catch (e) { } XM.closeSheet(); XM.toast('🎬 Réglages du clap enregistrés'); };
}
Q('#sc-clapb').onclick = openClap;
Q('#sc-cam').onchange = e => { const f = Array.from(e.target.files); e.target.value = ''; addPhotos(f); };
Q('#sc-gal').onchange = e => { const f = Array.from(e.target.files); e.target.value = ''; addPhotos(f); };
Q('#sc-menu').onclick = () => XM.menu({ app: APPN, deskPage: 'scripto.html', onImport: onEnv, sendReturn: P ? sendReturn : null, items: P ? [
    { icon: '🎬', label: 'Titre et production', sub: P.name || 'Sans titre', run: editProject },
    { icon: '📅', label: 'Journée ' + DAY().label, sub: 'Nom, date, notes de la journée', run: () => editDay(P.cur.day) },
    { icon: '🎬', label: 'Réglages du clap', sub: 'Durée du bip et du flash : ' + clapCfg().ms + ' ms', run: clapSettings },
    { icon: '📋', label: 'Rapport de la journée', sub: 'Aperçu imprimable / PDF', run: report },
    { icon: '🗑️', label: 'Effacer le script de la tablette', sub: P.changed ? '⚠️ Modifications non renvoyées au bureau' : 'Il reste sur l\'ordinateur s\'il a été renvoyé', run: async () => { if (await XM.ask('Effacer le script ?', P.changed ? 'Des modifications n\'ont pas été renvoyées au bureau : elles seront perdues.' : 'Le script sera effacé de cette tablette.', [{ label: 'Effacer', danger: true }, 'Annuler']) !== 0) return; P = null; try { localStorage.removeItem(KEY); } catch (e) { } await IMG.gc({ shots: [] }); render(); } }
] : [] });
let rw = wide(); window.addEventListener('resize', () => { if (wide() !== rw) { rw = wide(); render(); } });
(async () => { load(); await IMG.load(); render(); XM.fromHash(APPN, onEnv); })();

</script>
</body>
