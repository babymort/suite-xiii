    const tick = async () => { const r = await api(c.url, { tok: c.tok }, 'ping'); if (r.ok) { const d = J('xiii.drive', c); d.perm = r.me && r.me.droit || 'read'; d.apps = r.me && r.me.outils || null; d.secteur = r.me && r.me.secteur || ''; delete d.wait; W('xiii.drive', d); main.innerHTML = '<div class="card hl" style="text-align:center"><h2 class="ok">✅ Accès validé</h2><p>Bienvenue dans l\'équipe !</p></div>'; setTimeout(() => { let rt = ''; try { rt = sessionStorage.getItem('xiii.ret') || ''; sessionStorage.removeItem('xiii.ret'); } catch (e) { } location.replace(rt || 'index.html'); }, 1200); return; }
        const w = $('w-r'); if (w) w.textContent = r.err === 'pending' ? 'En attente… (vérifié ' + new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit', second: '2-digit' }) + ')' : r.err === 'revoked' ? 'Le Master a refusé la demande.' : (ERR[r.err] || r.err); if (r.err !== 'revoked') setTimeout(tick, 10000); };
    tick();
}
function joinGen(p) {

function join(p) {
    if (p.gen && p.gk) return joinGen(p);

        '<div id="j-res" style="margin-top:12px"></div></div>';
    if (!same && (p.auto || p.self) && p.nom && $('j-go')) setTimeout(() => $('j-go').click(), 300); // lien nominatif : connexion directe
    const show = async () => { const r = await api(p.url, au(p), 'ping'); $('j-res').innerHTML = r.ok ? '<p><a class="btn" href="dossier.html" style="background:#f0b378">📚 DOSSIER · documents de l\'équipe</a></p><p><b>Ouvrez un outil pour commencer :</b></p>' + (Object.keys(r.apps || {}).length ? toolLinks(r.apps) : '<p class="dim">Le Master n\'a encore rien enregistré.</p>' + toolLinks()) : '<span class="err">❌ ' + esc(ERR[r.err] || r.err) + '</span>'; };
    if (same) { show(); return; }
    $('j-go').onclick = async () => { if (p.self && !$('j-me').value.trim()) $('j-me').value = p.nom || p.master || 'Master';
        const name = $('j-me').value.trim(); if (!name) { $('j-me').focus(); toast('Indiquez votre nom'); return; }
        $('j-go').disabled = true; $('j-res').innerHTML = '<span class="dim">Connexion au Drive…</span>';
        if (p.sec && p.stok) { const q = await api(p.url, {}, 'sec_join', { tok: p.stok, nom: name }); if (!q.ok) { $('j-go').disabled = false; $('j-res').innerHTML = '<span class="err">❌ ' + esc(ERR[q.err] || q.err) + '</span>'; return; } p = Object.assign({}, p, { tok: q.tok, perm: q.droit, apps: q.outils, secteur: q.secteur, sec: 0, stok: '' }); }
        const r = await api(p.url, au(p), 'ping'); $('j-go').disabled = false;
        if (!r.ok) { $('j-res').innerHTML = '<span class="err">❌ ' + esc(ERR[r.err] || r.err) + '</span>'; return; }
        Object.keys(localStorage).filter(k => /^xiii\.drive\.base\./.test(k)).forEach(k => localStorage.removeItem(k));
        const s = J('xiii.projets', { active: '', list: [] }); s.list = s.list || []; const prevActive = s.active || '';
        if (p.fiche && p.fiche.id) { if (!s.list.find(f => f && f.id === p.fiche.id)) s.list.push(p.fiche); s.active = p.fiche.id; W('xiii.projets', s); }
        W('xiii.drive', p.self ? { url: p.url, code: p.code, pid: p.pid || '', proj: p.proj, role: 'master', me: { name }, master: name, at: Date.now() } : p.sm ? { url: p.url, code: p.code, sm: true, pid: p.pid || '', proj: p.proj, role: 'master', me: { name }, master: name, chef: p.master, at: Date.now() } : { url: p.url, code: p.code, tok: p.tok, secteur: p.secteur || '', perm: p.perm || 'edit', apps: p.apps || null, kh: p.kh || '', pid: p.pid || '', proj: p.proj, role: 'member', me: { name }, master: p.master, at: Date.now(), prevActive: c && c.role === 'member' ? c.prevActive : prevActive });
        const me = J('xiii.deleg.me', {}) || {}; if (!me.name) W('xiii.deleg.me', Object.assign(me, { name }));
        history.replaceState(null, '', 'drive.html'); if (p.auto || p.go || p.self) { $('j-res').innerHTML = '<p class="ok" style="font-size:18px">✅ Connecté au projet « ' + esc(p.proj || '') + ' »</p>'; setTimeout(() => { try { sessionStorage.removeItem('xiii.ret'); } catch (e) { } location.replace(p.go || 'index.html'); }, 900); return; } join(p);
    };
}
