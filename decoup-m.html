        const counted = !it.reserve && it.status !== 'cut'; n++; const num = it.reserve ? 'R' : (it.num || n), start = cur; if (counted) cur += +it.dur || 0;
        const ty = typ(it.type), who = tal(it.talents);
        const txt = [it.title, it.script, it.audio, it.notes, who, it.decor, ty.name].join(' ').toLowerCase(); if (q && !txt.includes(q)) return;
        const tags = [lab(L.angles, it.angle) && it.angle ? '📐 ' + lab(L.angles, it.angle) : '', it.move ? '🎥 ' + lab(L.moves, it.move) : '', it.focale ? '🔭 ' + it.focale : '', who ? '🎭 ' + who : '', it.decor ? '🏠 ' + it.decor : ''].filter(Boolean);
        h += '<div class="dc-pl' + (counted ? '' : ' cut') + '" style="--vc:' + E(it.color || ty.col) + '"><div class="h"><span class="n">' + E(num) + '</span><span class="v" title="' + E(ty.name) + '">' + E(ty.short) + '</span><span class="tc"><b>' + fmtDur(it.dur) + '</b>' + fmtTC(start) + '</span></div>' +
            (it.title ? '<div class="a">' + E(it.title) + '</div>' : '') + (tags.length ? '<div class="t">' + tags.map(x => '<span>' + E(x) + '</span>').join('') + '</div>' : '') +
            (it.script ? '<div class="dl">' + E(it.script) + '</div>' : '') + (it.audio ? '<div class="sm">🎙️ ' + E(it.audio) + '</div>' : '') + (it.notes ? '<div class="sm">📝 ' + E(it.notes) + '</div>' : '') + '</div>';
        if (!q) h += '<div class="dc-tr">' + E(lab(L.trans, it.trans || 'cut')) + '</div>';
    });
    h += '<p class="m-hint" style="text-align:center;margin-top:14px">Reçu ' + (ST.recv ? 'le ' + new Date(ST.recv).toLocaleDateString('fr-FR') + ' à ' + new Date(ST.recv).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }) : '') + '</p>';
    m.innerHTML = h;
    QQ('[data-t]', m).forEach(b => b.onclick = () => { TI = +b.dataset.t; render(); window.scrollTo(0, 0); });
    const f = Q('#dc-find'); f.oninput = () => { FIND = f.value; const p = f.selectionStart; render(); const g = Q('#dc-find'); g.focus(); try { g.setSelectionRange(p, p); } catch (e) { } };
}
function onEnv(env) {
    const d = env.data || {}; if (!d.project || !Array.isArray(d.project.tabs)) { XM.toast('⚠️ Cet envoi n\'est pas un découpage', 4000); return; }
    ST = { project: d.project, lists: d.lists || {}, recv: Date.now() }; TI = d.active || 0; XM.save(APPN, ST); render();
    XM.toast('📥 « ' + (d.project.name || 'Découpage') + ' » reçu', 3000);
}
Q('#dc-menu').onclick = () => XM.menu({ app: APPN, deskPage: 'decoup.html', onImport: onEnv, items: ST ? [{ icon: '🗑️', label: 'Effacer ce découpage du téléphone', run: async () => { if (await XM.ask('Effacer ?', 'Le découpage reçu sera effacé de ce téléphone.', [{ label: 'Effacer', danger: true }, 'Annuler']) !== 0) return; ST = null; XM.drop(APPN); render(); } }] : [] });
render(); XM.fromHash(APPN, onEnv);

</script>
