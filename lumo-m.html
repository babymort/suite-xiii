// =====================================================================
//  SUITE XIII — moteur mobile générique (PLANNO, CASTO, POSTO, SONO, LUMO, TRANSPORTO, SOUSTITRO, RUNO)
//  Décrit par CFG (cfg.js de chaque outil) : listes à onglets, filtres par statut, groupes, fiche détaillée
//  modifiable, ajout, exemple. Reçoit le projet du bureau (QR / lien / fichier) et renvoie un PATCH par identifiants.
// =====================================================================
function GM(CFG) {
    'use strict';
    const $ = XM.$, $$ = XM.$$, esc = XM.esc, uid = XM.uid, APP = CFG.app;
    const clone = o => JSON.parse(JSON.stringify(o)), same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
    const fold = s => String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
    const vib = () => { try { navigator.vibrate && navigator.vibrate(10); } catch (e) { } };
    const frD = s => { if (!s || !/^\d{4}-\d{2}-\d{2}/.test(s)) return s || ''; const d = new Date(s.slice(0, 10) + 'T12:00:00'); return d.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' }); };
    let S = null; const UI = { tab: CFG.cols[0].key, q: '', st: '' };
    const col = k => CFG.cols.find(c => c.key === k), items = k => (S.cols[k] = S.cols[k] || []);
    const persist = () => XM.save(APP, S);
    const H = { esc, frD, fold };
    // ---------- patch : ce qui a changé ou été créé depuis la réception ----------
    function patch() {
        const out = { cols: {} }; let n = 0;
        CFG.cols.forEach(c => { const base = new Map(((S.base || {})[c.key] || []).map(x => [x.id, x])), L = [];
            items(c.key).forEach(it => { const b = base.get(it.id); if (!b) { L.push(Object.assign({ _new: 1 }, it)); n++; return; }
                const d = { id: it.id }; let ch = false; c.fields.forEach(f => { if (!same(it[f.k], b[f.k])) { d[f.k] = it[f.k]; ch = true; } }); if (ch) { L.push(d); n++; } });
            if (L.length) out.cols[c.key] = L; });
        out.count = n; return n ? out : null;
    }
    const nChanges = () => { try { const p = patch(); return p ? p.count : 0; } catch (e) { return 0; } };
    // ---------- affichage ----------
    function stOpt(c, it) { if (!c.status) return null; const v = it[c.status.k]; return c.status.opts.find(o => o[0] === (typeof v === 'boolean' ? String(v) : v)) || null; }
    function pill(c, it) { const o = stOpt(c, it); return o ? '<button class="gm-pill" data-cyc="' + esc(it.id) + '" style="--c:' + (o[2] || '#90a4ae') + '">' + esc(o[1]) + '</button>' : ''; }
    function list() {
        const c = col(UI.tab); let L = items(c.key).slice();
        if (c.sort) L.sort(c.sort);
        const q = fold(UI.q); if (q) L = L.filter(it => fold(JSON.stringify(it)).indexOf(q) > -1);
        if (UI.st && c.status) L = L.filter(it => String(it[c.status.k]) === UI.st);
        const chips = c.status ? '<div class="gm-chips"><button class="m-chip' + (UI.st ? '' : ' on') + '" data-st="">Tous · ' + items(c.key).length + '</button>' + c.status.opts.map(o => { const n = items(c.key).filter(it => String(it[c.status.k]) === o[0]).length; return n ? '<button class="m-chip' + (UI.st === o[0] ? ' on' : '') + '" data-st="' + esc(o[0]) + '"><i style="background:' + (o[2] || '#999') + '"></i>' + esc(o[1]) + ' · ' + n + '</button>' : ''; }).join('') + '</div>' : '';
        const row = it => '<div class="m-item" data-open="' + esc(it.id) + '">' + (c.icon2 ? '<span class="ico">' + c.icon2(it, H) + '</span>' : '') + '<span class="grow"><b>' + esc(c.title(it, H) || '—') + '</b>' + (c.sub ? '<small>' + c.sub(it, H) + '</small>' : '') + '</span>' + pill(c, it) + '</div>';
        let body = '';
        if (c.group) { const G = new Map(); L.forEach(it => { const g = c.group(it, H) || '—'; if (!G.has(g)) G.set(g, []); G.get(g).push(it); }); G.forEach((v, g) => { body += '<div class="m-sec">' + esc(g) + ' <small>' + v.length + '</small></div><div class="m-list">' + v.map(row).join('') + '</div>'; }); }
        else body = '<div class="m-list">' + L.map(row).join('') + '</div>';
        return (c.head ? '<div class="m-card gm-head">' + c.head(S, H) + '</div>' : '') + '<input class="gm-q" id="gm-q" type="search" placeholder="Rechercher…" value="' + esc(UI.q) + '">' + chips + (L.length ? body : '<div class="m-empty"><b>' + (items(c.key).length ? 'Aucun résultat' : 'Rien pour l\'instant') + '</b>' + (c.add && !items(c.key).length ? '<p>Touchez ＋ pour ajouter.</p>' : '') + '</div>');
    }
    function home() {
        return '<div class="m-empty" style="margin-top:8vh"><div style="font-size:44px">' + CFG.icon + '</div><b>' + esc(CFG.title) + ' sur le téléphone</b><p>' + esc(CFG.pitch) + '</p><p class="m-hint">Sur l\'ordinateur : ouvrez ' + esc(CFG.title) + ', touchez <b>📱 Mobile</b> puis scannez le QR code.</p></div>' +
            '<div class="m-actions"><button class="m-btn" data-act="link">🔗 Coller un lien</button><button class="m-btn" data-act="file">📂 Importer un fichier</button>' + (CFG.sample ? '<button class="m-btn primary block" data-act="sample">📐 Essayer avec un exemple</button>' : '') + (CFG.blank ? '<button class="m-btn block" data-act="new">✨ Nouveau</button>' : '') + '</div>';
    }
    function render() {
        const m = $('#gm-main'), tabs = $('#gm-tabs'), n = S ? nChanges() : 0;
        $('#gm-sub').textContent = S ? (S.name || CFG.sub) : CFG.sub;
        $('#gm-ret').style.display = n ? '' : 'none'; $('#gm-retn').textContent = n;
        if (!S) { m.innerHTML = home(); tabs.hidden = true; $('#gm-fab').hidden = true; return; }
        tabs.hidden = CFG.cols.length < 2; tabs.innerHTML = CFG.cols.map(c => '<button data-tab="' + c.key + '" class="' + (UI.tab === c.key ? 'on' : '') + '"><span class="ti">' + c.icon + '</span>' + esc(c.label) + '</button>').join('');
        const c = col(UI.tab); $('#gm-fab').hidden = !c.add;
        const y = scrollY, hadQ = document.activeElement && document.activeElement.id === 'gm-q';
        m.innerHTML = list(); if (hadQ) { const q = $('#gm-q'); q.focus(); q.setSelectionRange(q.value.length, q.value.length); } scrollTo(0, y);
    }
    // ---------- fiche ----------
    function fieldHtml(f, v) {
        const id = 'gf-' + f.k;
        if (f.t === 'seg') return '<div class="m-field"><span>' + esc(f.l) + '</span><div class="m-seg gm-seg" data-k="' + f.k + '">' + f.opts.map(o => '<button data-v="' + esc(o[0]) + '" class="' + (String(v) === o[0] ? 'on' : '') + '">' + esc(o[1]) + '</button>').join('') + '</div></div>';
        if (f.t === 'select') return '<label class="m-field"><span>' + esc(f.l) + '</span><select id="' + id + '">' + f.opts.map(o => '<option value="' + esc(o[0]) + '"' + (String(v) === o[0] ? ' selected' : '') + '>' + esc(o[1]) + '</option>').join('') + '</select></label>';
        if (f.t === 'check') return '<label class="m-field gm-ck"><input type="checkbox" id="' + id + '"' + (v ? ' checked' : '') + '><span>' + esc(f.l) + '</span></label>';
        if (f.t === 'area') return '<label class="m-field"><span>' + esc(f.l) + '</span><textarea id="' + id + '" rows="' + (f.rows || 3) + '">' + esc(v || '') + '</textarea></label>';
        if (f.t === 'csv') return '<label class="m-field"><span>' + esc(f.l) + ' <small>(séparés par des virgules)</small></span><input id="' + id + '" value="' + esc((v || []).join(', ')) + '"></label>';
        if (f.t === 'list') return '<div class="m-field"><span>' + esc(f.l) + '</span><div class="gm-sub" data-k="' + f.k + '">' + (v || []).map((x, i) => '<div class="gm-si' + (x[f.done] ? ' done' : '') + '"><label><input type="checkbox" data-sd="' + i + '"' + (x[f.done] ? ' checked' : '') + '></label><span>' + f.show(x, H) + '</span></div>').join('') + '</div>' + (f.addField ? '<div class="gm-sadd"><input id="gs-new" placeholder="' + esc(f.ph || 'Ajouter…') + '"><button class="m-btn sm" id="gs-add">＋</button></div>' : '') + '</div>';
        const ty = { date: 'date', time: 'time', num: 'number', tel: 'tel', mail: 'email' }[f.t] || 'text';
        return '<label class="m-field"><span>' + esc(f.l) + '</span><input id="' + id + '" type="' + ty + '"' + (f.step ? ' step="' + f.step + '"' : '') + (ty === 'number' ? ' inputmode="decimal"' : '') + ' value="' + esc(v == null ? '' : (f.fmt ? f.fmt(v) : v)) + '"></label>';
    }
    function read(f, s, it) {
        if (f.t === 'seg' || f.t === 'list') return;
        const e = $('#gf-' + f.k, s); if (!e) return;
        if (f.t === 'check') it[f.k] = e.checked; else if (f.t === 'num') it[f.k] = e.value === '' ? '' : +String(e.value).replace(',', '.'); else if (f.t === 'csv') it[f.k] = e.value.split(',').map(x => x.trim()).filter(Boolean); else it[f.k] = f.parse ? f.parse(e.value, it[f.k]) : e.value;
    }
    function open(id, isNew) {
        const c = col(UI.tab), it = items(c.key).find(x => x.id === id); if (!it) return;
        const s = XM.sheet('<div class="gm-form">' + c.fields.filter(f => !f.hide).map(f => fieldHtml(f, it[f.k])).join('') + '</div><div class="m-actions"><button class="m-btn primary" id="gm-ok">✓ Enregistrer</button>' + (isNew ? '<button class="m-btn danger" id="gm-del">Annuler</button>' : '') + '</div>' + (c.info ? '<p class="m-hint">' + c.info(it, H) + '</p>' : ''), { title: esc(c.title(it, H) || c.label) });
        $$('.gm-seg', s).forEach(g => $$('button', g).forEach(b => b.onclick = () => { $$('button', g).forEach(x => x.classList.toggle('on', x === b)); const f = c.fields.find(x => x.k === g.dataset.k), v = b.dataset.v; it[f.k] = v === 'true' ? true : v === 'false' ? false : v; vib(); }));
        $$('.gm-sub', s).forEach(g => { const f = c.fields.find(x => x.k === g.dataset.k); $$('[data-sd]', g).forEach(cb => cb.onchange = () => { const x = it[f.k][+cb.dataset.sd]; x[f.done] = cb.checked; cb.closest('.gm-si').classList.toggle('done', cb.checked); vib(); }); });
        const ad = $('#gs-add', s); if (ad) ad.onclick = () => { const f = c.fields.find(x => x.t === 'list'), v = $('#gs-new', s).value.trim(); if (!v) return; it[f.k] = it[f.k] || []; it[f.k].push(f.addField(v, H, uid)); c.fields.forEach(x => read(x, s, it)); persist(); XM.closeSheet(); open(id); };
        $('#gm-ok', s).onclick = () => { c.fields.forEach(f => read(f, s, it)); persist(); XM.closeSheet(); render(); XM.toast('✓ Enregistré'); };
        const dl = $('#gm-del', s); if (dl) dl.onclick = () => { S.cols[c.key] = items(c.key).filter(x => x.id !== id); persist(); XM.closeSheet(); render(); };
    }
    function cycle(id) { const c = col(UI.tab), it = items(c.key).find(x => x.id === id); if (!it || !c.status) return; const O = c.status.opts, i = O.findIndex(o => o[0] === String(it[c.status.k])), nx = O[(i + 1) % O.length][0]; it[c.status.k] = nx === 'true' ? true : nx === 'false' ? false : nx; vib(); persist(); render(); }
    // ---------- échanges ----------
    async function onEnv(env) {
        if (env.kind !== 'project') { XM.toast('⚠️ Ce fichier est un retour, pas un projet'); return; }
        const d = env.data; if (!d || !d.cols) throw new Error('Envoi vide');
        if (S && !S.example) { const n = nChanges(); if (n && (await XM.ask('Remplacer ?', '<b>' + n + ' changement(s)</b> non renvoyé(s) seront remplacés par le nouveau projet.', [{ label: 'Remplacer', danger: true }, 'Annuler'])) !== 0) return; }
        S = { name: env.name || d.name || '', ts: Date.now(), cols: clone(d.cols), base: clone(d.cols), extra: d.extra || {} }; UI.tab = CFG.cols[0].key; UI.st = ''; UI.q = ''; persist(); render();
        XM.toast('✓ Reçu : ' + (S.name || CFG.title) + ' · ' + CFG.cols.map(c => items(c.key).length + ' ' + c.label.toLowerCase()).join(' · '), 3500);
    }
    function sendReturn() {
        if (!S) return;
        XM.send({ app: APP, page: CFG.deskPage, title: CFG.title, kind: 'return', name: S.name, make: () => { const p = patch(); return p; }, empty: 'Aucun changement à renvoyer',
            note: 'Sur l\'ordinateur : ouvrez ' + CFG.title + ', bouton 📱 Mobile puis « Importer un fichier » ou « Coller un lien ». Seuls vos changements et ajouts sont fusionnés.' });
    }
    function menu() {
        const items2 = S ? [{ icon: '↺', label: 'Repartir de la version reçue', sub: 'Annule les changements non renvoyés', run: async () => { if ((await XM.ask('Annuler vos changements ?', 'Les modifications faites sur le téléphone depuis la réception seront perdues.', [{ label: 'Annuler les changements', danger: true }, 'Garder'])) !== 0) return; S.cols = clone(S.base); persist(); render(); } },
            { icon: '🗑️', label: 'Effacer le projet du téléphone', run: async () => { if ((await XM.ask('Effacer ?', 'Le projet sera supprimé de ce téléphone.', [{ label: 'Effacer', danger: true }, 'Annuler'])) !== 0) return; S = null; XM.drop(APP); render(); } }] : [];
        XM.menu({ app: APP, deskPage: CFG.deskPage, items: items2, onImport: onEnv, sendReturn: S ? sendReturn : null });
    }
    // ---------- événements ----------
    document.addEventListener('click', e => {
        const t = e.target.closest('[data-tab]'); if (t && t.closest('#gm-tabs')) { UI.tab = t.dataset.tab; UI.st = ''; UI.q = ''; render(); scrollTo(0, 0); return; }
        const cy = e.target.closest('[data-cyc]'); if (cy) { e.stopPropagation(); cycle(cy.dataset.cyc); return; }
        const o = e.target.closest('[data-open]'); if (o) { open(o.dataset.open); return; }
        const st = e.target.closest('[data-st]'); if (st) { UI.st = st.dataset.st; render(); return; }
        const a = e.target.closest('[data-act]'); if (!a) return;
        if (a.dataset.act === 'link') XM.importLink(APP, onEnv); else if (a.dataset.act === 'file') XM.importFile(APP, onEnv);
        else if (a.dataset.act === 'sample') { const d = CFG.sample(uid); S = { name: d.name, ts: Date.now(), cols: d.cols, base: clone(d.cols), example: true }; persist(); render(); XM.toast('📐 Exemple chargé'); }
        else if (a.dataset.act === 'new') { const d = CFG.blank(); S = { name: d.name, ts: Date.now(), cols: d.cols, base: clone(d.cols), standalone: true }; persist(); render(); }
    });
    document.addEventListener('input', e => { if (e.target.id === 'gm-q') { UI.q = e.target.value; render(); } });
    $('#gm-fab').onclick = () => { if (!S) return; const c = col(UI.tab); if (!c.add) return; const it = Object.assign({ id: uid() }, c.add(S, H)); items(c.key).unshift(it); persist(); render(); open(it.id, true); };
    $('#gm-ret').onclick = sendReturn; $('#gm-menu').onclick = menu;
    document.title = CFG.title + ' XIII · Mobile'; $('#gm-name').innerHTML = esc(CFG.title.replace(/ XIII$/, '')) + ' <i>XIII</i>';
    (async function () { const s = XM.load(APP); if (s && s.cols) S = s; await XM.fromHash(APP, onEnv); render(); })();
    window.GMS = { get S() { return S; }, patch, render };
}
GM(GMCFG.lumo);})();
