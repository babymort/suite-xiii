    if (!list.length) { main().innerHTML = '<div class="m-empty"><b>📂</b>Vous n\'avez pas encore ajouté de pièce.<br><span class="m-hint">Ce que vous ajoutez reste sur ce téléphone jusqu\'au renvoi au bureau.</span></div><button class="m-btn primary block" id="m-go">➕ Ajouter une pièce</button>'; $('#m-go').onclick = () => setTab('add'); return; }
    const unsent = list.filter(i => !i.sent), size = unsent.reduce((a, i) => a + (i.size || 0), 0);
    main().innerHTML = '<div class="m-card accent"><h3>📤 À renvoyer au bureau</h3><dl class="m-kv"><dt>Pièces ajoutées</dt><dd>' + list.length + '</dd><dt>Pas encore renvoyées</dt><dd>' + unsent.length + ' · ' + fmtSize(size) + '</dd></dl><button class="m-btn primary block" id="m-send" style="margin-top:12px">📤 Renvoyer au bureau</button><p class="m-hint" style="margin:8px 0 0">' + (size > QR_BYTES ? 'Volume important : l\'envoi se fera par fichier (AirDrop, mail, cloud…).' : 'Petit volume : QR code, lien ou fichier.') + '</p></div><div class="m-sec">Mes ajouts</div><div class="m-list" id="m-list"></div>';
    const box = $('#m-list');
    list.forEach(it => { const b = document.createElement('button'); b.className = 'm-item'; b.innerHTML = thumbHtml(it) + '<span class="grow"><b>' + esc(it.title) + '</b><small>' + esc([secLabel(it.secId) || 'À classer', frDate(it.date), fmtSize(it.size || 0)].filter(Boolean).join(' · ')) + '</small></span>' + (it.sent ? '<span class="m-pill ok">Renvoyé</span>' : '') + '<span class="go">›</span>'; b.onclick = () => openViewer({ it }); box.appendChild(b); });
    $('#m-send').onclick = () => sendReturn(false);
}

// =====================================================================
//  RETOUR AU BUREAU (kind:'return')
// =====================================================================
async function buildReturn(list) {
    const items = [];
    for (const it of list) {
        const f = it.secId && findSec(it.secId), blob = it.kind === 'text' ? new Blob([it.text || ''], { type: 'text/plain;charset=utf-8' }) : it.blob;
        items.push({ mid: it.id, title: it.title, sec: it.secId || '', st: f ? f.s.t : (it.secTitle || ''), pe: it.personId || '', pn: personName(it.personId), dt: it.date, kd: it.kind, nm: itemFileName(it), mt: it.kind === 'text' ? 'text/plain' : (it.mime || ''), sz: blob.size, pg: it.pages || 0, b: await b64(blob) });
    }
    return { v: 1, pid: S.proj ? S.proj.pid : '', pname: S.proj ? S.proj.name : '', ptype: S.proj ? S.proj.type : '', items };
}
async function sendReturn(all) {
    const done = S.items.filter(i => !i.draft);
    if (!done.length) { XM.toast('Aucune pièce à renvoyer'); return; }
    let list = done.filter(i => all || !i.sent);
    if (!list.length) { if ((await XM.ask('Tout est déjà renvoyé', 'Toutes vos pièces ont déjà été préparées pour le bureau. Les renvoyer quand même ? (le bureau ignore les doublons)', ['Tout renvoyer', 'Annuler'])) !== 0) return; list = done; }
    XM.toast('⏳ Préparation de ' + plural(list.length, 'pièce') + '…', 30000);
    let data; try { data = await buildReturn(list); } catch (e) { XM.toast('⚠️ Préparation impossible', 4000); return; }
    const bytes = list.reduce((a, i) => a + (i.size || 0), 0), pname = S.proj ? S.proj.name : 'dossier', fname = 'DOSSIER_XIII_retour_' + XM.safe(pname) + '_' + todayISO() + '.xiii-m.json';
    const mark = async () => { for (const it of list) { it.sent = Date.now(); await saveItem(it, true); } if (S.tab === 'mine') render(); };
    if (bytes <= QR_BYTES) {
        await XM.send({ app: APP, page: 'dossier.html', title: 'DOSSIER XIII', kind: 'return', name: pname, make: () => data, file: fname, note: plural(list.length, 'pièce') + ' à importer dans DOSSIER XIII : elles seront rangées dans les catégories choisies, comme si vous les aviez déposées.' });
        mark(); return;
    }
    const env = XM.envelope(APP, 'return', pname, data), blob = new Blob([JSON.stringify(env)], { type: 'application/json' }), file = new File([blob], fname, { type: 'application/json' });
    const canShare = !!(navigator.canShare && navigator.canShare({ files: [file] }));
    XM.closeSheet(); XM.toast('', 1);
    const s = XM.sheet('<div class="m-card" style="margin-top:0"><b>Volume important : envoi par fichier</b><p class="m-hint" style="margin:6px 0 0">' + plural(list.length, 'pièce') + ' · ' + fmtSize(blob.size) + '. Un QR code ou un lien ne peuvent pas contenir autant de données : enregistrez le fichier puis envoyez-le à l\'ordinateur (AirDrop, mail, cloud…). Sur le bureau : DOSSIER XIII → 📱 → Importer un fichier.</p></div><div class="m-actions" style="margin-top:0">' + (canShare ? '<button class="m-btn" id="bs-share">📤 Partager…</button>' : '') + '<button class="m-btn primary" id="bs-file">⬇️ Enregistrer le fichier</button></div>', { title: '📱 Renvoyer au bureau' });
    $('#bs-file', s).onclick = () => { XM.download(fname, blob, 'application/json'); XM.toast('⬇️ Fichier enregistré'); mark(); };
    if (canShare) $('#bs-share', s).onclick = async () => { try { await navigator.share({ files: [file], title: 'DOSSIER XIII' }); mark(); } catch (e) { } };
}

// =====================================================================
//  DÉMARRAGE
// =====================================================================
async function onEnv(env, via) {
    if (env.kind === 'return') { XM.toast('Cet envoi est un retour destiné à DOSSIER XIII sur l\'ordinateur : importez-le là-bas (📱 → Importer).', 6000); return; }
    const P = await setProject(env.data || {}, env);
    XM.toast('📑 Dossier « ' + P.name + ' » reçu · ' + plural(P.ch.reduce((a, c) => a + c.s.length, 0), 'élément'), 3500);
}
function openMenu() {
    XM.menu({ app: APP, deskPage: 'dossier.html', onImport: onEnv, sendReturn: () => sendReturn(false),
        items: [
            S.proj ? { icon: '🗑️', label: 'Retirer le dossier chargé', sub: 'Garde vos pièces ajoutées', run: async () => { if ((await XM.ask('Retirer le dossier ?', 'Le sommaire reçu sera effacé de ce téléphone. Vos pièces ajoutées sont conservées.', [{ label: 'Retirer', danger: true }, 'Annuler'])) === 0) { S.proj = null; S.sec = null; await IDB.del('meta', 'project'); setTab('sum'); } } } : null,
            S.items.some(i => i.sent) ? { icon: '🧹', label: 'Supprimer les pièces déjà renvoyées', sub: 'Libère de la place sur le téléphone', run: async () => { const l = S.items.filter(i => i.sent && !i.draft); if ((await XM.ask('Supprimer ' + plural(l.length, 'pièce') + ' ?', 'Elles ont déjà été préparées pour le bureau. Vérifiez qu\'elles y sont avant de les effacer d\'ici.', [{ label: 'Supprimer', danger: true }, 'Annuler'])) === 0) { for (const it of l) await removeItem(it); render(); } } } : null
        ].filter(Boolean) });
}
async function init() {
    await IDB.open();
    try { S.proj = (await IDB.get('meta', 'project')) || null; } catch (e) { S.proj = null; }
    if (S.proj && !Array.isArray(S.proj.ch)) S.proj = null;
    try { S.items = ((await IDB.all('items')) || []).filter(Boolean).sort((a, b) => a.ts - b.ts); } catch (e) { S.items = []; }
    $$('#d-tabs button').forEach(b => b.onclick = () => { S.target = ''; setTab(b.dataset.t); });
    $('#d-menu').onclick = openMenu;
    $('#in-cam').onchange = e => { const f = [...e.target.files]; e.target.value = ''; addFiles(f, { camera: true }); };
    $('#in-file').onchange = e => { const f = [...e.target.files]; e.target.value = ''; addFiles(f); };
    $('#in-scan').onchange = e => { const f = e.target.files[0]; e.target.value = ''; scanPage(f); };
    render();
    await XM.fromHash(APP, onEnv);
    window.__dm = { S, classify, jpegsToPdf, compressImage }; // aide aux tests
}
init();
})();

</script>
