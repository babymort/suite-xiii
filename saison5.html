<style>
/* Layout : une colonne de lecture, phases empilées, lignes d'outil type conducteur TV (TC à gauche, statut à droite) */
:root{--bg:#f3f1ee;--panel:#fff;--fg:#1d1b19;--dim:#6d675f;--line:#ddd7cf;--acc:#b8651f;--ok:#2e7d32;--now:#c26a1c;

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1a19;--panel:#252321;--fg:#f1ece6;--dim:#a39b91;--line:#3a3632;--acc:#f0b378;--ok:#81c784;--now:#f0b378;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1a19;--panel:#252321;--fg:#f1ece6;--dim:#a39b91;--line:#3a3632;--acc:#f0b378;--ok:#81c784;--now:#f0b378;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--body);padding:32px 16px 64px}
main{max-width:860px;margin:0 auto;display:grid;gap:28px}
h1{font:800 clamp(28px,5vw,44px)/1.05 var(--disp);letter-spacing:.02em;margin:0;text-wrap:balance}
h1 i{color:var(--acc);font-style:normal}
.lead{color:var(--dim);max-width:62ch;margin:8px 0 0}
.prog{display:flex;gap:14px;align-items:center;font:500 13px var(--mono);color:var(--dim)}
.bar{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}.bar b{display:block;height:100%;background:var(--acc)}
section h2{font:800 13px var(--disp);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:0 0 8px;display:flex;justify-content:space-between}
ol{list-style:none;margin:0;padding:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}

li.now{background:color-mix(in srgb,var(--now) 10%,var(--panel))}li.now .st{border-color:var(--now);color:var(--now)}
li.done .st{border-color:var(--ok);color:var(--ok)}li.done .t b{text-decoration:line-through;text-decoration-color:var(--dim)}
</style>
<main>
<header><h1>SUITE <i>XIII</i> — saison 5</h1><p class="lead"><b>Saison 5 : des outils qui se mettent à jour seuls et qui parlent à vos services (Google, Canva, AccuWeather, Supabase, Netlify…).</b> Principe : boutons centralisés au maximum, chaque nouveauté se range dans un bouton ou un menu existant.</p></header>
<div class="prog"><span id="pc"></span><div class="bar"><b id="pb"></b></div></div>
<div id="r"></div>
</main>
<script>
const P=[["Phase A · Données vivantes (mises à jour automatiques)", [["XIII DATA", "★ Flux de données central data/*.json", "Table publique de flux sur Supabase (mise à jour côté serveur, sans republier le site), lecture 1×/jour par outil, cache local, repli hors ligne puis fichier data/*.json livré ; badge « à jour du … ».", "done"], ["XIII DATA", "★ Tâche planifiée hebdomadaire", "Tâche planifiée chaque lundi 7 h 51 (Paris) : vérifie SMIC / plafond Sécu, minima des conventions (IDCC 2642, 2717, 3090, 1285) et la feuille Google « SUITE XIII — Tarifs loueurs », n'écrit que des valeurs lues sur une source officielle, journalise chaque changement et t'envoie un récapitulatif Gmail. Feuille Google « SUITE XIII — Tarifs loueurs » créée (mode d'emploi + onglet modèle).", "done"], ["RESSOURCO", "★ Minima conventionnels à jour", "Onglet 💼 Intermittents : choix de la convention collective, alerte ⚠️ si un tarif journalier est sous le minimum de la grille pour la fonction, ⛔ si un taux horaire est sous le SMIC ; date de la grille affichée.", "done"], ["RESSOURCO", "Cotisations et plafonds", "Taux des cotisations intermittents (chômage annexes 8/10, Congés Spectacles, Audiens, AFDAS…) et PSS tenus chaque lundi depuis les sources officielles ; RESSOURCO affiche un coût employeur estimé (charges plafonnées au PSS journalier).", "done"], ["DEVISO / MATOS", "★ Tarifs loueurs", "REPERO : à l'ouverture d'un lieu, l'analyse OpenStreetMap (secours, hôpitaux, défibrillateurs, parkings, stations, bruit, lieux sensibles…) est relancée seule si elle a plus de 7 jours, et la météo si elle a plus de 6 h.", "done"], ["REPERO / CALL SHEETO", "Cartes et points utiles en direct", "Tâche mensuelle (le 3 à 8 h 17) : jusqu'à 20 nouveautés par mois d'après les fiches officielles des fabricants (connectique, poids, conso), ajoutées au catalogue commun avec l'étiquette « 🆕 Nouveauté » dans SYNO, PLANO, LUMO, SONO, PACKINGO, DEVISO, CADRO.", "done"], ["CATALOGUE", "Catalogue matériel enrichi", "DEVISO : 669 références (+387 modèles précis : caméras, 60 optiques et séries, mélangeurs, moniteurs, micros, consoles, enceintes, lumières, énergie, murs LED). Fourchette min–max par modèle : « relevé » chez les loueurs ou « estimée » (loueur pro, recalée sur les prix relevés). Reste : confirmer les estimations par les relevés mensuels.", "done"], ["DEVISO", "★ Détail de la fourchette", "Clic sur la tuile « fourchette » : ligne par ligne, prix le plus bas (chez quel loueur) et le plus haut (chez quel autre), équipe (minimum conventionnel → haut de l'usage), frais, jusqu'au total HT ; loueurs les plus souvent moins chers / plus chers ; « retenir » le moins cher.", "done"], ["CATALOGUE", "★ Images des appareils", "Illustration dessinée pour chaque appareil (60 types : caméras, PTZ, mélangeurs, micros, consoles, projecteurs…), photo libre de droits (Wikimedia Commons / Openverse, avec crédit) cherchée automatiquement depuis le navigateur, ou photo perso partagée par le catalogue. Vignettes dans 🗃️ Catalogue, SYNO (l'image arrive avec le nœud), DEVISO. Reste : vérifier la recherche réelle chez vous (bloquée dans mon environnement).", "done"]]], ["Phase B · Connecteurs Google", [["CALENDRIER", "★ Google Agenda dans les deux sens", "App équipe : « 📅 Ajouter à mon agenda » (toutes mes convocations, rappel la veille et 1 h 30 avant) + lien Google Agenda direct. CALENDRIER : « 🗓️ Mon agenda » importe votre agenda perso (.ics) pour voir vos disponibilités, visible par vous seul. L'abonnement iCal du projet reste en place.", "done"], ["CALL SHEETO", "★ Envoi de la feuille par Gmail", "Envoi groupé des convocations : nouveau canal « 📧 Gmail (navigateur) » qui ouvre un brouillon Gmail personnel par équipier (tous ses jours + lien de sa feuille), avec suivi « envoyé ». Fichier agenda à joindre. Sur demande, Claude peut aussi créer les brouillons Gmail avec le PDF joint.", "done"], ["DRIVE XIII", "Sauvegarde Google Drive automatique", "La copie nocturne (3 h, 14 dernières) existait ; page Drive XIII : nouvelle carte « 🛟 Sauvegardes de la nuit » (Master) pour restaurer tout le projet ou un seul outil, avec copie de sécurité avant restauration et trace au journal. Script Google v17.", "done"], ["DEVISO", "Devis → Google Sheets / Docs", "Créer Rendu : « Devis tableur avec formules » (.xlsx : quantités × jours × prix, sous-totaux, frais généraux / imprévus / marge / TVA en % modifiables, tout se recalcule ; s'ouvre dans Google Sheets) et « Devis document » (.doc modifiable dans Word / Google Docs).", "done"], ["RESSOURCO", "Annuaire depuis Google Contacts / Microsoft 365", "Annuaire 📇 : l'import reconnaît les exports Google Contacts (CSV « Phone 1 - Value », vCard avec item1.EMAIL) et Outlook (CSV « Job Title », « Mobile Phone »…), adresses sur plusieurs lignes comprises. Sur demande, Claude peut aussi importer via Gmail / Microsoft 365.", "done"]]], ["Phase C · Météo, terrain, déplacements", [["REPERO / JOUR", "★ Météo heure par heure et pluie dans l'heure", "REPERO › Météo : pluie des 3 prochaines heures au quart d'heure (jour même, rafraîchie toutes les heures), tableau heure par heure (ciel, °C, pluie, vent + direction, rafales) avec repère drone ✓ / ⚠️ / ⛔, lien Vigilance Météo-France. Source Open-Meteo (modèles Météo-France), sans clé : l'API AccuWeather exigerait un abonnement payant.", "done"], ["TRANSPORTO", "Heure de départ conseillée", "App équipe › carte convocation : chacun règle son adresse de départ (gardée sur son téléphone), le trajet voiture vers le lieu est calculé (OpenStreetMap) et l'app affiche « Partir vers HH:MM » (trajet + marge 10 min + 25 %), avec lien Google Maps pour le trafic en direct.", "done"], ["REPERO", "Accès à pied (lieux en pleine nature)", "REPERO : carte « 🥾 Accès à pied » — sentiers OSM à moins de 800 m (difficulté, revêtement, pistes carrossables), parking le plus proche, distance, dénivelé et temps de marche à vide / chargé ; liens AllTrails et carte IGN randonnée.", "done"]]], ["Phase D · Image, habillage, diffusion", [["GRAPHICO / MOODO", "★ Canva", "Charte graphique : « 🎨 Couleurs depuis une image » (kit de marque Canva exporté en PNG, logo, affiche) → couleurs de la charte de tous les PDF. GRAPHICO : rendu « Vers Canva » (PNG + ouverture de Canva) ; MOODO : rendu « Vers Canva » (PDF importable, une page par planche).", "done"], ["MOODO / STORYBOARDO", "Photos de référence libres de droits", "MOODO : recherche intégrée à « 🔗 Lien ou image en ligne » ; STORYBOARDO : « 🔎 Image libre » à côté de « Importer une image » (fond du plan). Source Openverse (Wikimedia, Flickr CC… sans clé, l'API Unsplash exige une clé) ; auteur + licence ajoutés automatiquement. Boutons centralisés : CALENDRIER « 📆 Agendas ▾ » (export + mon agenda), app équipe « 📅 Ajouter à mon agenda ▾ ».", "done"], ["SITE", "Hébergement Netlify", "Fait : en-têtes Netlify (sécurité, HTTPS strict, cache des pages / données / logos) — ils n'étaient jamais publiés car exclus du zip —, page 404 et raccourcis /app, /compte. Reste : déploiement direct par Claude (sans zip) sur feu vert, logos à intégrer, domaine personnalisé. Logos officiels intégrés (35 outils + Suite XIII / XIII) — manquent MELANGO et MOODO. En attente du feu vert « publie ». Publication directe : en attente de l'accès (dépôt GitHub relié à Netlify).", ""], ["MOODO / CONDUCO", "Musique : référence et relevé SACEM", "MOODO : un lien Spotify (playlist, album, morceau) s'affiche en lecteur sur la planche — ambiance de référence, écoute privée. CONDUCO : champ « Musiques » par élément et rendu « Relevé des musiques (SACEM, CSV) ». La lecture Spotify à l'antenne est écartée (interdite par les conditions Spotify, droits non couverts).", "done"]]], ["Phase E · Équipe en temps réel (Supabase)", [["APP ÉQUIPE", "★ Synchro instantanée (outils, accueil, page du jour)", "Signal temps réel Supabase entre les appareils d'un même projet : dès qu'un équipier enregistre, les autres relisent le Drive en moins d'une seconde (au lieu de 4 à 20 s). Le Drive reste la seule source des données ; rien du projet ne transite par Supabase. Repli automatique sur la relecture périodique.", "done"], ["APP ÉQUIPE", "★ App équipe en temps réel + notification de convocation", "App équipe branchée sur le signal temps réel : convocation, annonces et accueil relus aussitôt qu'un outil enregistre ; notification « ⏰ Convocation modifiée » (vibration + notification du téléphone) quand l'heure, le jour ou le lieu change. Application fermée : alerte à la réouverture (vraie notification à distance = étape suivante possible).", "done"], ["APP ÉQUIPE", "Émargement / pointage d'arrivée", "App équipe : le jour J, bouton « 📍 Je suis arrivé(e) » sur la carte de convocation → l'arrivée s'inscrit dans l'onglet Arrivées du Drive et apparaît aussitôt en régie (CALL SHEETO, page du jour), comme le pointage par QR code. Script Drive v18.", "done"], ["IFTTT", "Automatisations", "⚙️ › 🎬 Projet XIII › « 🔗 Automatisations IFTTT » : clé Webhooks + choix des événements — fin d'émission (CONDUCO), carte copiée et vérifiée (BACKUPO), convocations envoyées (CALL SHEETO) ; bouton Tester. IFTTT enchaîne SMS, e-mail, Slack… (Webhooks peut demander IFTTT Pro).", "done"]]], ["Phase F · Fiabilité", [["SITE", "Tests automatiques", "Parcours automatique avant chaque « publie » : les 76 pages s'ouvrent sans erreur, modules communs chargés, fonctions clés présentes (exports DEVISO / CONDUCO, MOODO, REPERO, CALENDRIER, CALL SHEETO, app équipe…). Premier passage : 76 / 76 après correction de la page Compte (message clair si le service de comptes est injoignable).", "done"], ["SITE", "Journal des erreurs", "Les erreurs rencontrées par les utilisateurs (beta et site public) remontent dans Supabase, anonymes : outil, message tronqué (adresses e-mail et numéros masqués), fichier:ligne, navigateur, beta / public — 5 au plus par page, doublons regroupés, aucune lecture publique. Claude les consulte et les corrige.", "done"]]], ["Phase G · Mise en ligne : la beta", [["GITHUB", "★ Dépôt « suite-xiii » (Matthieu)", "Dépôt babymort/suite-xiii (public) relié à Netlify : main = site public, beta = site d'essai.", "done"], ["NETLIFY", "★ La beta", "beta--suite-xiii.netlify.app opérationnelle avec bandeau BETA (invisible sur le site public). « On enchaîne » = beta gratuite ; « publie » = une mise en ligne groupée.", "done"], ["SUPABASE", "Adresse de la beta autorisée", "Ajouter l'adresse de la beta aux redirections Supabase pour y tester les comptes et la monétisation sans bloquer le site public.", ""]]], ["Phase H · IA : brancher Claude, Gemini ou ChatGPT en un clic", [["IA", "★ Diagnostic Gemini", "Cause trouvée : les modèles Gemini 2.5 ont été retirés par Google ; la SUITE XIII appelait un modèle qui n'existe plus. Corrigé : modèle « toujours la dernière version », détection automatique des modèles disponibles et bascule seule sur le plus récent si un modèle disparaît (tous les services).", "done"], ["IA", "★ Connexion en un clic avec son compte", "⚙️ › Connexion IA : boutons Claude / Gemini / ChatGPT / Automatique → connexion avec un compte (OpenRouter, sécurisé), aucune clé à copier ; on change de famille d'IA d'un clic. La clé API personnelle reste possible dans « Avancé », avec « Détecter les modèles disponibles ».", "done"], ["IA", "Choix du modèle et repli", "Choix de la famille, modèle le plus récent sélectionné automatiquement, repli sur un modèle disponible si celui choisi est retiré.", "done"], ["IA", "Mêmes fonctions IA partout", "Le module IA est chargé dans tous les outils ; ⚙️ (en bas à droite) a sa section « 🤖 Intelligence artificielle » en tête, avec l'état de la connexion. Ajout du choix 🆓 Gratuit (modèles gratuits OpenRouter, sans carte bancaire).", "done"], ["IA", "Tests automatiques", "Banc d'essai IA lancé avant chaque « publie » : Claude, Gemini, ChatGPT et la connexion en un clic (format d'appel, lecture de la réponse, bascule automatique si un modèle est retiré, familles Claude / Gemini / Gratuit, message clair sans clé) — 12 / 12. Validé en réel par Matthieu (modèle gratuit + recherche d'équipement SYNO).", "done"]]], ["Phase I · Animations d'attente", [["LOGO", "★ Animation XIII : barres ⇄ X", "Les trois barres « III » du logo se rejoignent en « X » puis se séparent, en boucle (1,8 s), orange XIII avec halo, au-dessus du nom de l'outil — dans les 33 outils, à la place de l'anneau. Le GIF personnalisé du dossier logos reste prioritaire.", "done"], ["LOGO", "Variantes", "Attentes longues : chaque message « ⏳ … » d'un outil (rendu PDF, export, préparation…) affiche l'animation XIII dans une fenêtre verre dépoli, qui disparaît au message suivant. App équipe : écran de démarrage avec l'animation et « ÉQUIPE ».", "done"]]], ["Phase J · Accueil en tableau de bord (Glassglow)", [["ACCUEIL", "★ Barre latérale d'onglets Glassglow", "Onglets verticaux en verre dépoli à gauche (logo Suite, halo orange sur l'onglet actif), fond noir à lueurs orangées ; sur téléphone, barre d'onglets en bas (icônes, nom de l'onglet actif). Onglet mémorisé.", "done"], ["ACCUEIL", "★ Onglet Dashboard", "Widgets (projet en cours, échéances, retours de l'équipe, message du Master… ＋ pour en ajouter) désormais affichés par défaut, outils épinglés (clic droit sur une tuile), Mode Tournage et pause LUDO.", "done"], ["ACCUEIL", "Un onglet par catégorie d'outils", "Concevoir, Organiser, Tourner, Livrer : chaque outil devient une tuile en verre avec son logo néon, sa fonction et un halo à sa couleur.", "done"], ["ACCUEIL", "Onglet Réglages du projet XIII", "Projet XIII, charte graphique, Drive, sauvegardes de la nuit, IA, automatisations IFTTT, thème, installation : en tuiles, au même endroit.", "done"], ["ACCUEIL", "Onglet Gestion d'équipe (Master)", "Visible seulement pour le Master (masqué sur les appareils des équipiers) : membres et droits, app équipe, convocations, annonces, arrivées du jour.", "done"]]], ["Phase K · PLANO : lumière indirecte", [["PLANO", "★ Réflexion des faisceaux", "Des rayons partent de chaque projecteur : les faisceaux s'arrêtent sur les murs et les surfaces, et chaque surface touchée renvoie une lueur douce côté éclairé (couleur du projecteur teintée par la surface), puis un rayon réfléchi repart.", "done"], ["PLANO", "Réglages et rendu", "Murs et objets : réglages ✨ Réflexion (0 à 1) et Diffusion (miroir → mat) ; réflecteurs, toiles, poly reconnus d'office. Calque ✨ et 🔁 nombre de rebonds (1 à 3) dans le menu des calques ; repris dans les exports PDF / PNG.", "done"]]], ["Phase L · DOSSIER : présentation 16/9", [["DOSSIER", "★ Export PowerPoint 16/9", "Le dossier devient une présentation .pptx 16/9 : couverture (logo, visuel, infos), sommaire, intercalaire par partie, rubriques (texte découpé sur plusieurs diapositives, images en grand / par 2 / en grille), charte et thème repris. S'ouvre aussi dans Keynote et Google Slides.", "done"], ["DOSSIER", "Export vers Canva", "« 🎨 Vers Canva » : télécharge la présentation et ouvre Canva (Créer un design › Importer un fichier) ; chaque diapositive reste modifiable. Boutons dans la fenêtre « Générer le dossier ».", "done"]]], ["Phase M · Application mobile : vérifications", [["APP", "★ Heure du suivi CONDUCO", "Correction faite le 27/10 (heure du serveur Google) mais pas encore en ligne et liée au script Drive v16/v17 : à vérifier sur la beta — Matthieu constate encore plusieurs minutes de trop sur le site actuel.", "now"], ["APP", "★ Convocation sur l'accueil + notification", "Carte « ⏰ Votre convocation » faite le 27/10 (pas encore en ligne) ; ajouter une vraie notification sur le téléphone quand le prénom + nom de l'équipier connecté correspond à la feuille de service, et à chaque changement d'heure.", "done"], ["SCRIPTO", "★ TC caméra & marqueurs", "⏱️ : la caméra du téléphone lit le TC du viseur dans un cadre orange (ou saisie + « Top »), TC en free run (23,976 → 60 i/s, drop frame), ajustement ±1 i / ±1 s ; marqueurs par catégorie avec commentaire, photo et plan ; résumé PDF ; envoi au SCRIPTO du bureau (fusion).", "done"], ["APP", "★ Transfert QR sans réseau", "D'après « airgapped-qr-code-transfer » (MIT), version fiable : QR animés en boucle, reprise des morceaux manqués, empreinte CRC ; bouton « 📲 QR animé » dans toutes les fenêtres d'envoi mobile, « 📲 Transfert QR » sur l'accueil bureau, « 📷 Scanner » et « 📁 Fichiers reçus » sur l'accueil de l'application.", "done"], ["DOSSIER", "★ Images dans le PowerPoint", "Les PDF (plans au sol, synoptiques) deviennent des images HD, une page par diapositive ; SVG / WebP convertis ; image perdue dans les rubriques sans texte corrigée.", "done"]]], ["Phase N · Application mobile : nouvelle direction artistique", [["APP", "★ DA « vraie application » Glassglow", "Fond noir à lueurs orangées, cartes en verre dépoli arrondies avec relief, en-tête translucide, boutons principaux en dégradé orange lumineux, apparition douce des cartes.", "done"], ["APP", "★ Onglets comme l'accueil PC", "Barre d'onglets flottante en verre : 🏠 Accueil · 🧰 Outils · 💬 Échanges (Échanges / Mentions / Activité) · 👤 Profil, surlignage qui glisse d'un onglet à l'autre (courbe de Bézier) ; 👥 Gestion d'équipe dans Profil pour le Master.", "done"], ["APP", "★ Tous les outils en tuiles", "Onglet Outils : tous les outils en tuiles (logo néon de l'outil, nom, rôle), puis les outils de terrain (colisage, photos, rushes, signatures, dossier, matos…) en tuiles.", "done"], ["APP", "Cartes du jour", "Accueil : convocation, notifications et dépense du jour en cartes ; installation et profil dans l'onglet Profil.", "done"]]], ["Phase O · Finitions graphiques", [["TOUS LES OUTILS", "★ Espacement régulier des boutons", "Contrôle automatique dans tous les outils : deux boutons collés (moins de 3 px) reçoivent un léger espace de 6 px, y compris dans les barres qui changent ; onglets et sélecteurs segmentés laissés soudés. Corrigés : SYNO (barre du haut, barre équipe), MOODO, SCRIPTO, MÉLANGO…", "done"]]], ["Phase P · Exports par onglet et noms de fichiers", [["SYNO", "★ Vers DOSSIER : onglet en cours seulement", "Nouvelle option « Rapport complet de l'onglet » : synoptique, liste matériel, adressage IP et diagnostic, seulement pour l'onglet affiché.", "done"], ["PLANO", "★ Vers DOSSIER : onglet en cours seulement", "Deux nouvelles options : « Dossier complet de l'onglet » et « Dossier complet (tous les plans) » : chaque plan suivi de son patch lumière (codes, puissances, DMX) et de sa liste de matériel, en un PDF.", "done"], ["DOSSIER", "Nom du PDF selon la version", "Le PDF s'appelle …_Full_…, …_Client_… ou …_Technique_… selon la version choisie.", "done"]]], ["Phase Q · ENCODO XIII : nouvel outil de conversion", [["ENCODO", "★ Convertisseur tous formats", "Vidéo (MP4, MOV, MKV, WebM, MXF, AVI, TS, MPG), audio (WAV, AIFF, MP3, AAC, FLAC, Opus, OGG, AC-3), images (PNG, JPEG, WebP, AVIF, TIFF, BMP, ICO, GIF, lecture HEIC), PDF (→ images, images →, assembler, compresser). Moteur FFmpeg dans le navigateur, téléchargé une fois puis en cache ; multicœur quand le navigateur le permet. Rien n'est envoyé sur internet.", "done"], ["ENCODO", "★ Réglages vidéo avancés", "Codecs H.264, H.265, ProRes (Proxy → 4444 XQ), DNxHR (LB → 444), VP9, VP8, MPEG-2, MPEG-4, MJPEG, GIF, copie ; conteneur ; qualité constante / CBR / VBR / taille maximale (débit calculé, 2 passes) ; vitesse ; résolution (adapter, remplir, étirer) ; cadence ; rotation ; désentrelacement ; recadrage ; coupe ; son (codec, débit, fréquence, canaux, gain, normalisation EBU R128 / web / podcast) ; commande FFmpeg affichée.", "done"], ["ENCODO", "File d'attente et préréglages", "File d'attente (glisser-déposer, coller), progression, vitesse et temps restant, arrêt, reconversion, 21 préréglages vidéo (ProRes, DNxHR, réseaux sociaux, YouTube, e-mail ≤ 15 Mo, GIF, coupe sans réencodage, extraire une image), 12 audio, préréglages personnels ⭐, taille estimée, téléchargement en .zip.", "done"], ["ENCODO", "Logo et place dans la suite", "Tuile dans Livrer (Montage & post) avec le logo ENCODO fourni par Matthieu.", "done"]]], ["Phase R · Charte typographique", [["TOUTE LA SUITE", "Police Astoria pour les titres", "Astoria (fournie par Matthieu, livrée avec le site) pour les titres de catégories de l'accueil, en orange lumineux comme les logos. La police n'a pas de lettres accentuées : elle est réservée aux titres sans accent. ⚠️ Licence gratuite pour un usage personnel seulement : licence commerciale à acheter avant la monétisation.", "done"]]], ["Phase S · ENCODO : conversions en arrière-plan et moteur multicœur", [["ENCODO", "★ Conversion en arrière-plan", "La conversion continue quand on passe dans un autre outil (la page ENCODO reste ouverte dans son onglet) ; « Ouvrir ENCODO » ramène à sa fenêtre.", "done"], ["TOUTE LA SUITE", "★ Onglet de suivi sur le bord droit", "Onglet 🔄 sous le panier, dans tous les outils : pourcentage sur l'onglet ; au clic, fichier en cours, barre, étape et temps restant, fichiers terminés à télécharger d'un clic.", "done"], ["ENCODO", "★ Diagnostic du moteur multicœur", "🩺 Diagnostic (clic sur la pastille du moteur ou ⚙️ › Moteur) : isolation de la page, mémoire partagée, cœurs, encodage d'essai chronométré en monocœur puis multicœur à 1, 2, 4, 8 fils ; active automatiquement le meilleur réglage.", "done"], ["ENCODO", "★ Réparation du multicœur", "Réparé : le nombre de fils de l'encodeur est limité (au-delà, il attendait indéfiniment). Diagnostic du 29/10 sur l'ordinateur de Matthieu : multicœur fonctionnel, 4 fils retenus (1,6 × plus rapide sur le test court).", "done"]]], ["Phase T · ENCODO : éditeur de PDF", [["ENCODO", "★ Pages : supprimer, réordonner, pivoter", "Fait : vignettes, glisser pour réordonner, pivoter, dupliquer, supprimer, ➕ insérer un autre PDF. Bouton ✏️ sur chaque PDF de la file ou fonction « Modifier un PDF ».", "done"], ["ENCODO", "★ Ajouts sur les pages", "Fait : blocs de couleur (blanc, noir, surligneur…, opacité), texte (police, taille, couleur, gras, italique), images PNG / JPEG ; déplacer, redimensionner (coin), Suppr pour effacer ; gravés à l'enregistrement.", "done"], ["ENCODO", "★ Extraire et modifier le texte", "Fait : 📄 Extraire le texte (copie, .txt, lecture optique en français pour les pages scannées) ; 🔤 Modifier le texte : lignes encadrées, clic = réécriture au même endroit, couleurs du texte et du fond relevées sur la page. Le texte d'origine est masqué (il reste dans le fichier sous le masque).", "done"], ["ENCODO / IA", "★ Police d'origine", "Fait : police reconnue par son nom (Arial → Arimo, Calibri → Carlito, Times → Tinos…, 37 familles libres) ; sinon 🤖 l'IA connectée reçoit l'image de la ligne et choisit la plus proche (graisse et italique compris).", "done"]]], ["Phase U · Améliorations ergonomie et graphisme (validées)", [["TOUTE LA SUITE", "Barre d'outils Glassglow", "Fait : barres en verre, boutons arrondis, lueur orange au survol et sur le bouton actif, dans tous les outils (sombre et clair ; habillages rétro intacts).", "done"], ["TOUTE LA SUITE", "Palette de commandes", "Fait : Ctrl K propose aussi « ⚡ Actions dans les autres outils » (ex. « patch lumière » depuis SYNO ouvre PLANO et lance l'export) ; chaque outil mémorise ses commandes à l'ouverture.", "done"], ["TOUTE LA SUITE", "Annuler / rétablir partout", "Fait : MATOS rejoint l'historique commun (Ctrl Z / Ctrl Y, ↶ ↷ 🕘) ; SYNO, PLANO, CONDUCO, GRAPHICO, STORYBOARDO et DECOUP gardent leur propre historique.", "done"], ["TOUTE LA SUITE", "Raccourcis visibles", "Fait : touche « ? » partout (et ⚙️ › Aide) : raccourcis de la suite et de l'outil ouvert.", "done"], ["TOUTE LA SUITE", "Notifications regroupées", "Regroupé avec le volet « Démarrer » (phase W) : onglet 🔔 notifications.", "done"], ["TOUTE LA SUITE", "Mode « présentation client »", "Fait : Ctrl+Maj+P (ou ⚙️ › Aide) masque barres, panneaux et boutons flottants de n'importe quel outil ; Échap pour revenir.", "done"], ["TOUTE LA SUITE", "Thème clair repensé", "Fait : barres en verre blanc, accents orange, fond crème chaud avec lueurs (accueil et outils).", "done"], ["ACCUEIL", "Projets récents", "Fait : widget « Outils récents » ajouté par défaut au Dashboard (les derniers outils ouverts, reprenables en un clic).", "done"], ["ACCUEIL", "Tuiles « vivantes »", "Fait : chaque tuile indique sa dernière ouverture (« il y a 2 h ») ; ENCODO affiche sa conversion en cours avec un voyant vert.", "done"], ["ACCUEIL", "Widgets redimensionnables", "Fait : poignée en bas à droite de chaque widget, glisser pour passer de 1 à 3 colonnes (mémorisé par personne).", "done"], ["ENCODO", "Glisser vers les autres outils", "Fait : chaque fichier converti a « 📚 Vers DOSSIER » (rangé dans la bonne rubrique).", "done"], ["ENCODO", "Lecteur avant / après", "Fait : « 👁️ Avant / après » côte à côte, lecture synchronisée pour les vidéos et sons, poids de chaque fichier.", "done"], ["APP ÉQUIPE", "Mode hors ligne visible", "Fait : bandeau « 📴 Hors réseau » avec les envois en attente, message au retour du réseau.", "done"], ["APP ÉQUIPE", "Grandes cibles tactiles", "Fait : boutons d'au moins 48 px, tuiles plus hautes, petit retour vibrant au toucher.", "done"], ["TOUTE LA SUITE", "Accessibilité", "Fait : focus clavier visible partout ; taille du texte (90 à 140 %) et contraste renforcé dans la fiche « ? », pour toute la suite.", "done"], ["TOUTE LA SUITE", "Chargement plus rapide", "Mesuré le 30/10 : les outils s'ouvrent en 0,2 à 0,5 s (fichiers compressés par Netlify). Seul point lent : CATALOGUE (plus de 3 s de calcul à l'ouverture), traité en phase W.", "done"]]], ["Phase V · Onglets d'outils (plusieurs outils dans une seule fenêtre)", [["TOUTE LA SUITE", "★ Barre d'onglets tout en haut", "Ouvrir plusieurs outils à la fois dans la même fenêtre : un onglet par outil ouvert (logo + nom), fermeture ×, ＋ pour ajouter un outil ; style du bandeau de l'accueil (verre, onglet actif en pilule orange lumineuse, surlignage qui glisse en courbe de Bézier).", "done"], ["TOUTE LA SUITE", "★ Outils gardés en mémoire", "Chaque onglet garde son outil ouvert tel quel (rien n'est rechargé en passant d'un onglet à l'autre) ; onglets rouverts au redémarrage.", "done"], ["TOUTE LA SUITE", "Raccourcis et confort", "Ctrl+Tab / Ctrl+1…9 pour changer d'onglet, glisser pour réordonner, clic molette pour fermer, pastille sur l'onglet d'un outil qui travaille (conversion ENCODO, synchro).", "done"]]], ["Phase W · Accueil, volet « Démarrer » et finitions", [["ACCUEIL", "★ Réorganiser les outils épinglés", "Glisser pour changer l'ordre des outils épinglés (comme les widgets).", "done"], ["TOUTE LA SUITE", "★ Roue ⚙️ cliquable partout", "La roue des paramètres en haut à droite des outils réagit sur toute la surface du bouton.", "done"], ["TOUTE LA SUITE", "★ Bouton « Démarrer » et volet de droite", "Bouton en haut à droite de l'espace de travail ouvrant un volet identique au bandeau de gauche, avec onglets : 🔔 notifications, 💬 chat avec les membres, 🚀 lancement rapide des outils épinglés, 🧩 vue widgets.", "done"], ["ACCUEIL", "Lueurs derrière les tuiles", "Les lueurs orange (haut gauche, bas droite) passent derrière les tuiles des outils.", "done"], ["SYNO", "★ Câble sélectionné au premier plan", "Le câble sélectionné passe automatiquement au-dessus des autres pour attraper facilement ses poignées.", "done"], ["SUITE", "Retrait d'IMPORTO et de CATALOGUE", "IMPORTO fait doublon avec la page du projet, CATALOGUE avec MATOS : les deux tuiles partent (fonctions conservées dans Projet XIII et MATOS).", "done"], ["MATOS", "★ Catalogue rapide", "L'ouverture du catalogue est très lente et fait planter : chargement progressif et recherche optimisée.", "done"]]], ["Phase X · MATOS : matériel du projet en cours", [["MATOS", "★ Nouvel onglet « Matériel du projet »", "À côté du matos perso et du catalogue : la liste du projet en cours.", "done"], ["MATOS", "★ Remplir la liste", "Depuis le catalogue, depuis le matos perso, en important depuis un autre outil (PLANO, SYNO, LUMO, SONO, CADRO, PACKINGO…) ou à la main.", "done"], ["MATOS", "Envoyer vers les autres outils et DOSSIER", "La liste du projet part vers PACKINGO, DEVISO, CALL SHEETO… et dans le dossier.", "done"], ["MATOS / DEVISO", "★ Trouver chez un loueur", "Pour chaque matériel de la liste, recherche chez les loueurs (tarifs et données de DEVISO) ; passerelle vers le devis.", "done"], ["MATOS", "★ Export « Demande de prêt » Excel", "Remplissage du modèle Excel fourni (catégories IMAGE / SON / LUMIÈRE / CONSOMMABLES) : date de la demande = jour de génération, sortie = veille du projet, retour = lendemain de la fin. Questions à poser à Matthieu au démarrage de l'étape.", "done"]]], ["Phase Y · Multi-projets : plusieurs projets XIII en parallèle", [["PROJET XIII", "★ Espaces projet cloisonnés", "Chaque projet XIII a ses propres données dans tous les outils (stockage du navigateur, bases de photos et fichiers, canaux entre onglets). Le projet existant devient le premier projet, sans migration ni perte. Restent communs : réglages d'affichage, bibliothèques, catalogue, tarifs DEVISO, parc MATOS, annuaire, IA.", "done"], ["PROJET XIII", "★ Drive et accréditations par projet", "Connexion Drive, équipe, compte et partages propres à chaque projet : un nouveau projet démarre sans Drive ni équipe, à connecter séparément.", "done"], ["PROJET XIII", "★ Sélecteur de projet rapide", "Pastille du projet en cours dans la barre d'onglets (changer, créer, ouvrir la fiche) et liste « Changer de projet… » de la fiche projet ; nouveau projet → démarrage guidé ; suppression d'un projet dans 📦 Fichier.", "done"], ["ONGLETS", "★ Liseré de couleur par projet", "Couleur choisie dans la fiche projet (10 teintes ou couleur libre) : liseré et teinte sur chaque onglet, pastille dans la barre ; hors espace onglets, fin liseré en haut de la page.", "done"], ["ONGLETS", "Onglets par projet", "Chaque onglet garde son projet ; changer de projet rouvre son dernier onglet ; clic droit sur un onglet → l'ouvrir dans un autre projet.", "done"]]], ["Phase AA · Ergonomie : navigation et espace onglets", [["SUITE", "Palette de commandes (Ctrl+K) partout", "Ctrl+K (aussi depuis la barre d'onglets) : outils, commandes de la page, actions des autres outils, contenu des projets, et maintenant onglets ouverts et projets XIII ; les outils s'ouvrent en onglet.", "done"], ["ONGLETS", "Onglets ancrés", "Clic droit sur un onglet → 📌 Ancrer : logo seul, placé juste après l'Accueil.", "done"], ["ONGLETS", "Écran partagé", "Clic droit → ◫ Afficher à droite : deux outils côte à côte, séparateur déplaçable, ⇄ inverser, ✕ fermer.", "done"], ["ONGLETS", "Aperçu au survol", "Fiche au survol : outil, projet, lieu, état du Drive, dernière visite (pas de miniature d'image : impossible pour une page intégrée sans bibliothèque de capture).", "done"], ["ONGLETS", "Pastilles d'état", "Vert : Drive à jour · orange : envoi au Drive en attente · rouge : erreur Drive ou erreur dans l'onglet.", "done"], ["ONGLETS", "Rouvrir l'onglet fermé", "Alt+Maj+T, menu clic droit, et « Récemment fermés » (10 derniers) dans le clic droit du ＋.", "done"], ["ONGLETS", "Fil d'Ariane du projet", "Sous les onglets : Projet › Lieu › Outil, dates du tournage ; clic sur le projet = changer, sur le lieu = fiche ; masquable depuis la pastille projet.", "done"]]], ["Phase AB · Ergonomie : Accueil, Démarrer et confort", [["ACCUEIL", "Accueil adaptatif", "Phase du projet d'après les dates de la fiche (préparation J-n, tournage jour n/N, post-production) : les tuiles utiles passent en tête de leur catégorie (★) et un bandeau « Phase » les propose.", "done"], ["ACCUEIL", "« Reprendre là où j'en étais »", "Carte sur l'accueil : les derniers outils ouverts dans ce projet (vue gardée), à rouvrir un par un ou « Tout rouvrir » en onglets.", "done"], ["DÉMARRER", "Onglet Agenda", "Démarrer › 📅 Agenda : échéances des 45 prochains jours de tous les outils (PLANNO, CALL SHEETO, CONDUCO, REPERO, MATOS, DEVISO, POSTO…).", "done"], ["DÉMARRER", "Onglet Fichiers", "Démarrer › 📁 Fichiers : les 20 derniers PDF / Excel / images exportés dans ce projet, gardés dans le navigateur, à retélécharger.", "done"], ["DÉMARRER", "Widgets déplaçables dans Démarrer", "Démarrer › 🧩 Widgets : glisser-déposer ; même ordre sur l'accueil.", "done"], ["SUITE", "Annuler / rétablir global", "Panneau 🕘 des outils : liste visuelle des étapes (heure, taille du changement), clic = revenir à cet état. Les outils qui ont leur propre historique (SYNO, PLANO…) gardent le leur.", "done"], ["SUITE", "Brouillons automatiques", "Un texte en cours de frappe est gardé ; après un plantage, bandeau « Brouillon récupéré » : Restaurer / Ignorer.", "done"], ["SUITE", "Mode tournage", "Démarrer › Outils ou touche « ? » : gros boutons, contraste élevé, écran toujours allumé ; s'applique à tous les outils.", "done"], ["SUITE", "Raccourcis personnalisables", "Touche « ? » : une combinaison → un bouton de l'outil ; fiche des raccourcis imprimable.", "done"], ["SUITE", "Mode hors ligne visible", "Pastille dans la barre d'onglets : 📴 Hors ligne ou ⏳ envois Drive en attente ; clic = ce qui marche hors ligne et la file des envois.", "done"]]], ["Phase AC · Design glassglow", [["DESIGN", "Thème unifié dans les outils", "Fait : barre d'outils en verre orangé dans tous les outils ; « Exporter ▾ » (ou l'export principal) en pilule orange lumineuse.", "done"], ["DESIGN", "Fond d'onglet animé", "Fait : l'onglet actif respire lentement à la couleur de la catégorie de l'outil (Artistique, Production, Multicam…), filet assorti sous la barre.", "done"], ["DESIGN", "Transitions entre onglets", "Fait : fondu et léger glissement de 150 ms au changement d'onglet.", "done"], ["DESIGN", "Progression lumineuse", "Fait : barre orange sous l'onglet pendant un export (s'éteint au téléchargement) et pendant une conversion ENCODO (avec le pourcentage).", "done"], ["DESIGN", "Écran de chargement unifié", "Fait : logo de l'outil et nom en Astoria avec balayage lumineux, sur une lueur à la couleur de la catégorie.", "done"], ["DESIGN", "Panneaux latéraux identiques", "Fait : ⚙️ Paramètres au même verre que Démarrer (coins arrondis, pilule orange qui glisse sur les choix), bandeau des passerelles assorti.", "done"], ["DESIGN", "Mode clair « papier chaud »", "Fait : barres en verre beige, lueur ambre, bandeau d'onglets et Démarrer assortis.", "done"], ["DESIGN", "Icônes maison", "Fait : icônes au trait fin à la place des émojis dans les barres d'outils (≈ 60 émojis courants) ; retour aux émojis dans la fiche « ? ».", "done"], ["DESIGN", "Couverture de projet", "Fait : champ « Couverture » dans la fiche projet ; bannière floutée en haut de l'Accueil et sur la page de garde des PDF (sinon le logo).", "done"], ["MOBILE", "Version téléphone", "Fait : onglets en barre du bas glissable (icône, nom de l'onglet actif), Démarrer en feuille qui monte du bas (glisser vers le bas pour fermer).", "done"], ["DÉMARRER", "Widgets un par ligne", "Fait : dans Démarrer › 🧩 Widgets, chaque widget occupe toute la largeur, plus lisible.", "done"]]], ["Phase AD · Passerelles : matériel", [["TOUS LES OUTILS", "★ Copier un outil vers un autre projet XIII", "Fait : 📤 Vers Suite XIII propose en premier « OUTIL vers un autre projet XIII » (ex. MATOS du projet 1 → MATOS du projet 2) : copie complète, images comprises, remplacement annulable, puis « Ouvrir dans le projet 2 ».", "done"], ["MATOS ↔ CALENDRIER", "Dates de prêt en événements", "Fait : 📤 Sortie / 📥 Retour dans « Matériel du projet » de MATOS (par défaut la veille et le lendemain du tournage) → événements dans CALENDRIER, avec un rappel la veille de chacun.", "done"], ["MATOS → CALL SHEETO", "Matériel par journée de tournage", "Fait : le « Matériel du projet » coché (entre sa sortie et son retour) rejoint les réservations dans les notes de chaque journée de la feuille de service.", "done"], ["MATOS ↔ CATALOGUE", "Ajout au catalogue", "Fait : après une saisie à la main, MATOS propose « Ajouter au catalogue » ; les lignes saisies absentes du catalogue ont un bouton 🗃️＋.", "done"], ["PACKINGO → TRANSPORTO", "Poids et volume des caisses", "Fait : PACKINGO envoie poids et volume des caisses ; TRANSPORTO conseille le véhicule (voiture, utilitaire 6 / 12 / 20 m³, porteur) avec 30 % de marge de calage.", "done"], ["LUMO / SONO → DEVISO", "Chiffrage direct", "Fait : bouton 💶 Chiffrer dans LUMO et SONO (et dans 📤 Vers Suite XIII) : la liste part dans DEVISO, qui la compare aux tarifs des loueurs.", "done"], ["LUMO ↔ SYNO", "Éclairage dans le synoptique", "Fait : LUMO → SYNO ajoute la console lumière, le switch et les nœuds Art-Net / sACN (1 pour 4 univers) et un splitter DMX.", "done"], ["CADRO → MATOS", "Boîtier et optique", "Fait : le boîtier et la série d'optiques choisis dans CADRO rejoignent le « Matériel du projet ».", "done"], ["DECOUP → MATOS", "Matériel par séquence", "Fait : steadicam, grue, drone, travelling, câblecam, PTZ… repérés dans les caméras et les mouvements du découpage, avec les séquences concernées.", "done"], ["REPERO → MATOS", "Contraintes du lieu", "Fait : pas de courant → groupe électrogène et distribution ; pas de réseau → routeur 4G/5G ; bruit → HF et bonnettes ; accès difficile → chariots ; risques → EPI (lieux retenus de REPERO).", "done"]]], ["Phase AE · Passerelles : préparation, tournage, direct, post, transverse", [["REPERO → TRANSPORTO", "Lieux en destinations", "Fait : les adresses des lieux retenus de REPERO sont proposées comme destinations des navettes, et une navette est créée à la date de tournage de chaque lieu.", "done"], ["CASTO → CALL SHEETO", "Convocations des talents", "Fait : convocation de chaque talent confirmé sur ses jours de tournage (HMC à l'heure générale, plateau 1 h après), avec mention des mineurs.", "done"], ["RESSOURCO → CALL SHEETO", "Équipe sous contrat", "Fait : les personnes des contrats RESSOURCO rejoignent les journées comprises dans leur contrat, avec département, téléphone, e-mail et horaire.", "done"], ["SCRIPTO → DOSSIER", "Rapports script quotidiens", "Fait : choix « 📅 Rapports quotidiens » dans l'envoi vers DOSSIER : un document par journée, remplacé à chaque renvoi.", "done"], ["CONDUCO → GRAPHICO", "Synthés depuis le conducteur", "Fait : un synthé (modèle Classique) par intervenant du conducteur, nom et fonction déjà remplis.", "done"], ["CONDUCO → SONO", "Micros par intervenant", "Fait : une voie de patch par intervenant ; micro cravate HF par défaut, avec son émetteur HF à fréquencer.", "done"], ["SYNO → CONDUCO", "Sources disponibles", "Fait : les caméras et enregistreurs reconnus dans le synoptique s'ajoutent aux listes Caméras et Sources du conducteur (MAG1, MAG2…).", "done"], ["BACKUPO → ENCODO", "Proxies automatiques", "Fait : bouton « 🎞️ Proxies dans ENCODO » sous le bilan du roll (option automatique) : les vidéos de la carte partent en ProRes Proxy, conversion lancée.", "done"], ["ENCODO → POSTO", "Fichiers prêts au dérushage", "Fait : les fichiers convertis sont reliés aux prises du dérushage (« 🎞️ prêt : … ») ou ajoutés s'ils sont inconnus.", "done"], ["POSTO → SOUSTITRO", "Marqueurs en sous-titres", "Fait : les retours horodatés de la version en cours deviennent des sous-titres aux bons temps (3 s, à ajuster).", "done"], ["SUITE", "Envois visibles dans Notifs", "Fait : Démarrer › 🔔 Notifs liste « PLANO a envoyé 36 équipements à MATOS » (envois pas encore intégrés), compteur sur le bouton Démarrer.", "done"], ["SUITE", "Passerelle groupée", "Fait : « ⚡ Tout envoyer » en tête de 📤 Vers Suite XIII (PLANO, SYNO, PACKINGO, LUMO, SONO) : MATOS + PACKINGO + DEVISO en un clic, chacun propose l'intégration.", "done"], ["ONGLETS", "Aperçu au survol qui restait affiché", "Corrigé : l'aperçu se ferme quand l'onglet est fermé, au clic, ou quand la souris quitte la barre d'onglets.", "done"]]], ["Phase AI · Assistant IA audiovisuel (avec l'IA de l'utilisateur)", [["SHELL", "★ Bouton IA à droite du ＋", "Visible seulement quand une IA est connectée (⚙️ › Intelligence artificielle). Ouvre un volet à droite, comme Démarrer.", ""], ["SHELL", "★ Volet de chat IA", "Conversation persistante par projet XIII, réponses en continu, pièces jointes (photo, PDF, croquis), copier / envoyer vers un outil.", ""], ["IA", "★ Assistant orienté audiovisuel et SUITE XIII", "Consignes métier (tournage, direct, post, conventions collectives, sécurité) et connaissance des outils XIII ; contexte automatique : fiche projet, outil ouvert, dates, équipe.", ""], ["IA", "Actions dans les outils", "L'IA propose, l'utilisateur valide : créer des tâches PLANNO, remplir une feuille de service, lister le matériel MATOS, préparer un devis, envoyer par passerelle.", ""], ["CONNEXION", "★ ChatGPT Plus / Pro : « Se connecter avec ChatGPT »", "Disponible depuis fin septembre 2026 (OpenAI) : l'abonnement de l'utilisateur paie les réponses. Inscription d'OpenAI requise pour un site hébergé (formulaire), à faire par le Master.", ""], ["CONNEXION", "Gemini : clé gratuite Google AI Studio", "Pas de partage d'abonnement Gemini pour les applications tierces ; la clé gratuite (compte Google, 1 minute) suffit pour un usage courant.", ""], ["CONNEXION", "Claude : clé API, ou SUITE XIII dans Claude", "Anthropic interdit l'abonnement Pro / Max hors de ses propres apps : clé API (paiement à l'usage) dans XIII, ou l'inverse — un connecteur SUITE XIII dans Claude.ai qui utilise l'abonnement.", ""], ["CONNEXION", "Connecteur SUITE XIII pour Claude et ChatGPT", "Serveur MCP sur Supabase (données du projet via Drive / équipe) : depuis Claude.ai ou ChatGPT, lire et modifier le projet XIII avec son abonnement.", ""], ["CONNEXION", "Toujours possibles", "OpenRouter en un clic (paiement à l'usage), Mistral (France), Ollama en local hors ligne, clés API classiques — déjà en place.", ""], ["IA", "Confidentialité", "Rien n'est envoyé sans IA connectée ; indication claire de ce qui part (fiche, outil ouvert) ; option « ne jamais envoyer les données de l'équipe ».", ""]]], ["Phase AF · Fonctionnalités : MATOS et projet", [["MATOS", "Disponibilité du parc", "« Matériel du projet » : chaque ligne est vérifiée contre le parc entre la sortie et le retour (⛔ il en manque, réservé pour tel projet, en panne / ✓ libre), bandeau récapitulatif et bouton « Réserver les unités libres » (option).", "done"], ["MATOS", "Kits réutilisables", "« Matériel du projet » › 🧰 Kits : 6 kits types (interview, multicam 3 caméras, captation / live, documentaire léger, clip, podcast vidéo), multiplicateur (×2 équipes), « Enregistrer la liste comme kit », renommer / supprimer ses kits.", "done"], ["MATOS", "Liste de retour", "Réservations › 📥 Retour : chaque unité sortie est pointée (✓ rendu / ✗ manquant / ⚠ abîmé) avec remarque ; casse → « en panne » + historique, manquant reste « sorti » ; récapitulatif sur la carte, liste imprimable avec signatures, réservation clôturée quand tout est rentré.", "done"], ["MATOS", "QR par caisse", "Le QR de l'étiquette PACKINGO, scanné dans MATOS : au départ, sort toute la caisse (unités reconnues par n° de série ou nom, priorité à celles réservées pour le projet, en panne décochées, rattachement à la réservation) ; au retour, pointage rendu / manquant / abîmé.", "done"], ["MATOS", "Historique des demandes de prêt", "« Matériel du projet » › 🕘 Historique : chaque demande de prêt générée est gardée (projet, sortie / retour, site, matériel) ; voir, « Dupliquer ici » (ajoute au projet actif), « Remplacer », supprimer.", "done"], ["PROJET", "Tableau de bord projet", "Carte « 📈 Pilotage du projet » sur l'accueil + page complète : J-x, avancement global et par phase (PLANNO, tâches en retard), budget du devis retenu vs dépenses réelles par poste (DEVISO), échéances de tous les outils avec retards en tête ; imprimable.", "done"], ["PROJET", "Modèles de projet", "8 types (concert, émission TV, fiction, doc, pub/clip, corporate, événementiel, artistique) × 19 outils : plan au sol, synoptique, conducteur, devis, feuilles de service, casting, transports, caisses, storyboard, moodboard… même équipe, mêmes lieux, calés sur la fiche projet. « Pré-remplir tous les outils » depuis la fiche et à la création du projet.", "done"], ["PROJET", "Checklist prépa automatique", "✅ Jusqu’à 50 tâches générées d’après le type de projet et ce que contiennent les outils (voie publique, drone, mineurs, nuit, pyrotechnie, hauteur, eau, musique, déplacements) : assurances, autorisations, contrats et DPAE, sécurité, logistique, livraison. Échéances en J-x, détection de ce qui est déjà fait, liens officiels ; dans la fiche projet, ⚙️, carte du tableau de bord, agenda et jalons PLANNO.", "done"], ["PROJET", "Partage client en lecture seule", "🌐 Vitrine à commenter : le projet, le planning (frise), les intentions et le moodboard (images comprises) et les documents des outils (storyboard, plan, conducteur…, récupérés d’un clic ou depuis « 🔗 Partager »). Lien court + QR ; le client commente, valide ✓ ou demande une modification par partie ; réponses et suivi depuis la fiche projet et le tableau de bord. Base Supabase activée le 1/11 (vérifiée : publication, commentaire, réponse, clé refusée si fausse).", "done"]]], ["Phase AK · TRANSPORTO : feuilles de route & équipe du projet", [["FICHE PROJET", "★ Profil d’équipe complet", "Prénom, Nom, Équipe, Poste (liste + postes personnalisés ⚙️), e-mail, téléphone, adresse localisée, n° de sécu (masqué, vérifié). Repris par CALL SHEETO, TRANSPORTO, RESSOURCO (bouton 👥 Équipe du projet : contrats, DPAE avec adresse et n° de sécu), l’annuaire (sans le n° de sécu).", "done"], ["TRANSPORTO", "★ Feuilles de route depuis la feuille de service", "Journée reprise de CALL SHEETO (lieu, parking, convocations, fin) ; qui vient comment (conduit, passager, transports, à pied, vélo, ses moyens), retour différent possible ; passagers confiés au conducteur au plus petit détour ; pick-ups dans l’ordre le plus rapide (OSRM) ; horaires à rebours de la convocation avec marge, parking et marche ; feuille ALLER / RETOUR modifiable et imprimable (A4 paysage), carte.", "done"], ["TRANSPORTO", "★ Plan de route personnel", "Pour chaque membre : heure de pick-up, conducteur et son téléphone, parking, marche, transports (lignes), retour, liens d’itinéraire ; copie, e-mail, SMS, WhatsApp, impression 1 par page, trajet ajouté dans sa ligne de CALL SHEETO.", "done"], ["TRANSPORTO", "Transports en commun détaillés", "Avec une clé Navitia gratuite (⚙️ Réglages) : lignes, horaires et correspondances réels pour arriver à l’heure ; sans clé : estimation + liens Citymapper / Google Maps.", "done"], ["APP ÉQUIPE", "Mon plan de route dans l’application", "Carte « ⏰ Votre convocation » : section « 🗺️ Mon trajet » (aller, retour, conducteur et son téléphone, parking, transports, liens d’itinéraire, copie), lue depuis TRANSPORTO via le Drive du projet ; notification « 🚐 Transports modifiés » à chaque changement.", "done"]]], ["Phase AG · Équipe et IA", [["ÉQUIPE", "Chat par projet et mentions @", "Chat partagé de toute l'équipe (Démarrer, chaque outil via 💬 Avis, app équipe) avec lien vers l'outil d'origine ; @ avec autocomplétion (fiche équipe + annuaire) partout ; @ surlignés, les vôtres en orange ; badge @ sur l'outil où l'on vous mentionne. Script Drive v19. Onglet « 🔒 Au Master seulement » pour les messages privés.", "done"], ["ÉQUIPE", "Disponibilités de l'équipe", "Chacun coche ses jours (✅ ❔ ❌, en glissant) depuis Démarrer, CALENDRIER ou l'app équipe ; grille de l'équipe filtrable, 💡 meilleurs créneaux sur 1 à 7 jours ; 🗳️ propositions de dates avec vote, relances @, date retenue → PLANNO, CALENDRIER et chat. Script Drive v20.", "done"], ["ÉQUIPE", "Rôles et permissions", "Grille outils × secteurs dans 🎬 Projet › Personnalisation : « Tous » ou par secteur (image, production, client…, secteurs perso). Outil fermé : masqué à l'accueil, écran 🔐 dans l'outil, données refusées par le Drive (script v21). Restrictions affichées au Master sur la tuile Projet XIII et la carte Projet en cours.", "done"], ["ÉQUIPE", "Présence en direct", "Avatars de qui est dans chaque outil : onglets de l'espace de travail, cartes de l'accueil, widget « En ligne » du tableau de bord et Démarrer › Notifs (personne → outils, ✏️ s'il modifie). Instantané via le canal temps réel + Drive toutes les 20 s, départ signalé à la fermeture.", "done"], ["IA", "Assistant de projet dans Démarrer", "Démarrer › 🤖 Assistant : « Prépare la demande de prêt pour jeudi » → plan d'étapes montré avant d'agir (passerelles exécutées dans des cadres cachés, envois de matériel, jalons PLANNO, dates, message au chat, demande de prêt MATOS pré-remplie), puis ouverture du bon outil. Avec IA connectée : demandes libres ; sans IA : 15 recettes par mots-clés et dates en français.", "done"], ["IA", "Lecture de scénario / note d'intention", "📄 Déposer un scénario (PDF, Final Draft, Fountain, Word, texte) ou une note d'intention : séquences (INT/EXT, décor, jour/nuit, personnages, pages), rôles, décors et besoins techniques repérés, à vérifier par onglets ; puis ✨ pré-remplissage de DECOUP, CASTO, REPERO, MATOS (matériel du projet), fiche projet, et en option STORYBOARDO, SCRIPTO, CALL SHEETO, PLANNO (sans coordonnées inventées). IA connectée : résumés, rôles décrits, notes d'intention. Accès : Réglages, Démarrer › 🤖 Assistant.", "done"], ["IA", "Vérification de cohérence", "🧭 Relecture de tous les outils du projet : équipements branchés à rien, câbles orphelins, IP en double (SYNO) ; projecteurs sans alimentation (PLANO) ; puissance, circuits, phases, DMX qui se chevauchent ou > 512 (LUMO) ; HF sans fréquence ou en double (SONO) ; talent confirmé non convoqué ou sans transport, arrivée après la convocation, chambre manquante (CASTO / CALL SHEETO / TRANSPORTO) ; mineurs sans autorisation, contrats non signés à J-7 ; caisses et véhicules surchargés (PACKINGO) ; lieux sans adresse, hôpital manquant, jours hors dates. Rien n'est modifié : ↗ Ouvrir l'outil, ou Ignorer. Accès : Réglages (compteur sur la tuile), Démarrer › 🤖 Assistant.", "done"], ["IA", "Résumé de fin de journée", "📰 Démarrer › 🔔 Notifs › « Résumé du jour » (et l'assistant) : ce qui a changé dans chaque outil depuis le matin (séquences, talents, caisses, tâches faites…), enregistrements de l'équipe tirés du journal du Drive (qui, quoi), messages et mentions, propositions de dates, incohérences et échéances à surveiller, ce qui est prévu demain. Copier, envoyer dans le chat, e-mail ; ✨ version rédigée par l'IA. Rappel discret à partir de 18 h.", "done"]]], ["Phase AH · ENCODO et fiabilité", [["ENCODO", "Automatisations", "⚡ Automatisations (barre ENCODO) : files nommées (« Proxies J2 », « Livraison client »…) chacune avec sa fonction, traitées l'une après l'autre par ▶ Convertir ; dossier surveillé par file (Chrome / Edge) : chaque nouveau fichier se convertit seul, résultat écrit dans un dossier de sortie ou téléchargé ; préréglage choisi d'après le client de la fiche projet ; fin de conversion signalée même dans un autre onglet (notification, titre qui clignote, son).", "done"], ["FIABILITÉ", "Sauvegarde Drive automatique", "Script Drive v22 : sauvegarde de nuit et envois programmés activés d'office (plus besoin de l'éditeur) ; 🕰️ versions datées par outil (copie avant modification au plus toutes les 20 min, 40 récentes puis 1 par jour sur 60 jours, dossier « SUITE XIII — versions ») ; dans chaque outil, ☁️ Drive › « 🕰️ Versions datées » : liste, 📌 point de restauration nommé, ↺ restaurer pour toute l'équipe (l'état actuel part dans 🕘 Historique).", "done"], ["FIABILITÉ", "Fichier projet .xiii", "Déjà en place : 🎬 Projet XIII › 📦 Fichier — « Tout exporter » (tous les outils, fiches, annuaire, photos) et « Ouvrir un projet complet (.xiii) ».", "done"], ["FIABILITÉ", "Journal des erreurs dans Démarrer", "🩺 Chaque outil note ses erreurs dans le navigateur (50 dernières, doublons regroupés, e-mails et téléphones masqués). Démarrer › 🔔 Notifs : « 🩺 n erreur(s) récente(s) » → détail par outil, 📋 copier le rapport, 🐞 envoi en un clic dans Bug & Suggestion (message pré-rempli avec le journal, navigateur, écran). Le bouton 🐞 de l'accueil joint aussi le journal.", "done"]]], ["Phase AJ · PLANO 3D PRO (réalisme)", [["PLANO", "★ Moteur 3D PRO", "Matériaux PBR, éclairage physique (candela, ombres, faisceaux volumétriques), ambiances studio/travail/jour/soirée, environnement de réflexions.", "done"], ["PLANO", "Modèles réels : lumières & caméras", "Fresnels, HMI, PAR, découpes, lyres, poursuite, LED, Kino Flo…, caméras studio/cinéma/épaule/PTZ/grue/steadicam.", "done"], ["PLANO", "Sujets, décor, mobilier, audio, technique, structure", "Mannequins posés (présentateur, public, cadreur…), trusses, praticables, mur LED, cyclo, rideaux, mobilier, piano, batterie, console son, rack, portes, fenêtres, escaliers.", "done"], ["PLANO", "Passe de finition 3D", "Multicam et vue caméra corrigés (la caméra ne se masque plus elle-même), sélecteur Rendu Réaliste/Classique, formes en marquages au sol, grue et Technocrane vérifiées.", "done"], ["PLANO", "Validation sur GPU réel", "Fluidité sur votre ordinateur, ombres en qualité Max, export PDF 3D — à faire de votre côté avant « publie ».", "now"]]], ["Phase AL · Personnages 3D (PLANO, STORYBOARDO)", [["PLANO", "★ Silhouettes humaines réalistes en 3D", "D'après BaseMesh_Man_Simple (OBJ, ~5 500 points) et Character_Template (Male / Female, FBX) : personnages à l'échelle (1,80 m / 1,65 m) dans la vue 3D de PLANO, au choix à la place des silhouettes simplifiées ; quelques poses (debout, assis, de dos), couleur par rôle (équipe, artiste, public).", "now"], ["STORYBOARDO", "★ Mannequin 3D à cadrer dans une case", "Mini-scène 3D dans une case : placer 1 à 4 personnages, choisir focale, hauteur et angle de caméra, rendu en image dans la case (trait ou ombré) pour poser un cadre juste avant de dessiner.", ""], ["3D", "StickMan (Blender)", "Le .blend (Blender 4, compressé) doit être exporté en glTF / FBX pour le web : export depuis Blender, ou installation de Blender dans l'atelier de Claude.", ""], ["3D", "Licences des modèles", "Site public : seuls des modèles libres de redistribution peuvent être intégrés (source et licence à confirmer). Écartés : ZBuilder 2 (plugin ZBrush commercial) et l'étude anatomique .ZTL (format ZBrush, 46 Mo, illisible hors ZBrush).", ""]]], ["Phase ZZ · Optimisation de fin de saison (à refaire à chaque saison, avant de publier)", [["BOUTONS", "★ Regrouper les nouveaux boutons", "Inventaire de tous les boutons ajoutés pendant la saison, dans chaque outil : doublons supprimés, fonctions proches réunies dans le même menu (⚙️, Démarrer, Exporter, Vers Suite XIII…), libellés et icônes harmonisés.", ""], ["BOUTONS", "★ Espacement et alignement", "Contrôle automatique des écarts, alignements et retours à la ligne des barres d'outils, sur ordinateur, tablette et téléphone, thèmes clair et sombre.", ""], ["CHARGEMENT", "★ Barres complètes dès l'ouverture", "Plus de boutons qui apparaissent un à un : les modules communs se placent avant le premier affichage (ou l'outil s'affiche d'un bloc), sans saut de mise en page.", ""], ["FIABILITÉ", "★ Zéro plantage", "Parcours automatique de chaque outil : ouverture, les 8 exemples types, exports (PDF, Excel, PowerPoint…), passerelles, version mobile, projet vide ou très chargé ; journal des erreurs utilisateurs passé en revue et vidé.", ""], ["VITESSE", "★ Tout est rapide", "Mesure du temps d'ouverture et du poids de chaque page, modules lourds chargés à la demande, cache hors ligne vérifié ; objectif < 1 s pour ouvrir un outil.", ""], ["PASSERELLES", "★ Les outils se parlent", "Chaque passerelle testée de bout en bout (fiche projet → tous les outils, CALL SHEETO ⇄ TRANSPORTO, MATOS, DEVISO, DOSSIER, vitrine, application équipe…) ; données jamais perdues ni en double.", ""], ["MOBILE", "Application et versions téléphone", "Affichage, tactile, hors ligne, notifications, transfert QR : vérifiés sur petit écran.", ""], ["ACCESSIBILITÉ", "Confort pour tous", "Contrastes, tailles de texte, clavier, lecteurs d'écran, textes d'aide et visites guidées à jour des nouveautés.", ""], ["PUBLICATION", "★ Publier la saison", "Notes de version, mise à jour des versions affichées sur l'accueil, puis « publie » : mise en ligne groupée sur le site public.", ""]]]];
let n=0,d=0,h='';P.forEach(([ph,it])=>{h+='<section><h2><span>'+ph+'</span><span>'+it.length+'</span></h2><ol>';it.forEach(x=>{n++;const s=x[3]||'';if(s==='done')d++;h+='<li class="'+s+'"><span class="n">'+String(n).padStart(2,'0')+'</span><span class="t"><span class="tool">'+x[0]+'</span><b>'+x[1]+'</b>'+(x[2]?'<small>'+x[2]+'</small>':'')+'</span><span class="st">'+(s==='done'?'✓ livré':s==='now'?'en cours':s==='idee'?'proposition':'à faire')+'</span></li>'});h+='</ol></section>'});
document.getElementById('r').innerHTML=h;document.getElementById('pc').textContent=d+' / '+n+' livrées';document.getElementById('pb').style.width=(d/n*100)+'%';
