const $ = id => document.getElementById(id), esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const fr = s => s ? new Date(s + 'T12:00:00').toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' }) : '';
(async () => {
    const c = J('xiii.drive', null), s = J('xiii.projets', null), f = s && s.list ? s.list.find(x => x && x.id === ((c && c.pid) || s.active)) : null;
