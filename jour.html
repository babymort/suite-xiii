    function card() { const s = st(); if (!s.id) return '<p class="xd-e">Pas de vitrine publiée. Partagez le planning, les intentions et les documents avec votre client, en lecture seule.</p><button class="xd-l" onclick="XVIT.open()">🌐 Créer la vitrine client →</button>'; const id = 'xvtc' + Date.now(); setTimeout(async () => { const el = document.getElementById(id); if (!el) return; const L = await comments(); if (!L) { el.textContent = 'Retours indisponibles'; return; } const nw = L.filter(c => c.id > (s.seen || 0)).length, open_ = L.filter(c => !c.resolved).length; el.innerHTML = '<b>' + L.length + '</b> retour(s) · ' + (nw ? '<b style="color:#64b5f6">' + nw + ' nouveau(x)</b> · ' : '') + open_ + ' à traiter' + (L.length ? '<br><small>Dernier : ' + esc((L[L.length - 1].author || '') + ' — ' + (L[L.length - 1].body || (L[L.length - 1].kind === 'ok' ? 'validé ✓' : ''))).slice(0, 90) + '</small>' : ''); }, 30); return '<div id="' + id + '" style="font-size:13px">…</div><button class="xd-l" onclick="XVIT.open()">🌐 Vitrine & retours du client →</button>'; }
    return { init, open, close, publish, payload, card, addDoc, comments };
})();
XVIT.init();


// =====================================================================
//  SUITE XIII — 🌦️ alertes météo et plan B de REPERO, repris dans CALL SHEETO et MODE TOURNAGE
//  Lit localStorage « xiii.meteo » { 'AAAA-MM-JJ': [{ lieu, lv, alerts, tmin, tmax, rain, planB: { lieu, addr, note } }] }
// =====================================================================
const XWXS = (() => {
    const E = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const F = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
    const get = date => { try { const m = JSON.parse(localStorage.getItem('xiii.meteo') || '{}'); return (m[date] || []).filter(x => Date.now() - (x.at || 0) < 4 * 864e5); } catch (e) { return []; } };
    function block(date, names) {
        let L = get(date); if (names && names.length) { const N = names.map(F).filter(Boolean); const M = L.filter(x => N.some(n => n && (F(x.lieu).includes(n) || n.includes(F(x.lieu))))); if (M.length) L = M; }
        L = L.filter(x => x.lv || x.planB); if (!L.length) return '';
        return '<div class="xwxs">' + L.map(x => '<div class="xwxs-i lv' + x.lv + '"><b>' + ['✅', '⚠️', '⛔'][x.lv] + ' ' + E(x.lieu) + '</b> · ' + x.tmin + '° / ' + x.tmax + '°' + (x.alerts.length ? '<br>' + x.alerts.map(E).join(' · ') : '') + (x.planB ? '<div class="xwxs-pb">🔁 <b>Plan B : ' + E(x.planB.lieu) + '</b>' + (x.planB.addr ? ' — ' + E(x.planB.addr) : '') + (x.planB.note ? '<br>' + E(x.planB.note) : '') + '</div>' : '') + '</div>').join('') + '<small class="xwxs-s">Source : REPERO XIII · ' + (L[0].kind === 'c' ? 'climat moyen' : 'prévision Open-Meteo') + ' du ' + new Date(L[0].at).toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) + '</small></div>';
    }
    const CSS = '.xwxs{margin:8px 0;display:flex;flex-direction:column;gap:6px}.xwxs-i{border-left:4px solid #66bb6a;padding:6px 10px;border-radius:6px;background:rgba(102,187,106,.10);font-size:13px}.xwxs-i.lv1{border-left-color:#ffb74d;background:rgba(255,183,77,.12)}.xwxs-i.lv2{border-left-color:#ef5350;background:rgba(239,83,80,.12)}.xwxs-pb{margin-top:4px;padding-top:4px;border-top:1px dashed rgba(128,128,128,.4)}.xwxs-s{opacity:.6;font-size:11px}';
    function init(app) {
        const s = document.createElement('style'); s.textContent = CSS; document.head.appendChild(s);
        if (app === 'callsheeto' && typeof renderSheet === 'function') {
            const _r = renderSheet; renderSheet = function (meta, d) { let h = _r.apply(this, arguments); try { const b = block(d.date, (d.locations || []).map(l => l.name || l.address)); if (b) { const i = h.indexOf('<h3>🌦️ Météo</h3><div class="sh-body">'); if (i > -1) { const k = i + '<h3>🌦️ Météo</h3><div class="sh-body">'.length; h = h.slice(0, k) + b + h.slice(k); } } } catch (e) { } return h; };
            addEventListener('storage', e => { if (e.key === 'xiii.meteo') try { renderContent(); } catch (x) { } });
        }
        if (app === 'jour' && typeof render === 'function') {
            const _r = render; render = function () { const r = _r.apply(this, arguments); try { const m = document.getElementById('main'), sel = typeof SEL !== 'undefined' ? SEL : ''; if (m && sel && !m.querySelector('.xwxs')) { const b = block(sel); if (b) m.insertAdjacentHTML('afterbegin', '<div class="card" style="margin-bottom:10px"><div style="font-weight:700;margin-bottom:4px">🌦️ Météo et plan B</div>' + b + '</div>'); } } catch (e) { } return r; };
            addEventListener('storage', e => { if (e.key === 'xiii.meteo') try { render(); } catch (x) { } }); try { render(); } catch (e) { }
        }
    }
    return { init, block, get };
})();

XWXS.init('jour');
</script>
