</script>
<script>
XM.initTheme();
// =====================================================================
//  PACKINGO XIII — version mobile : check-out (sortie / chargement) et check-in (retour) du matériel
//  Reçoit une structure légère du bureau (cases, éléments, état des contrôles), renvoie un PATCH par identifiants.
// =====================================================================
(function () {
'use strict';
const $ = XM.$, $$ = XM.$$, esc = XM.esc, uid = XM.uid, APP = 'packingo';
const ST = { ok: ['✓', 'Présent'], miss: ['✗', 'Manquant'], dmg: ['⚠', 'Abîmé'] };
const COLORS = ['#E53935', '#1E88E5', '#43A047', '#FB8C00', '#8E24AA', '#00ACC1', '#FDD835', '#6D4C41', '#D81B60', '#3949AB', '#7CB342', '#F4511E', '#546E7A', '#C0CA33', '#5E35B1', '#00897B'];
const nf = (n, d = 0) => (isFinite(n) ? n : 0).toLocaleString('fr-FR', { minimumFractionDigits: d, maximumFractionDigits: d });
const pad2 = n => String(n).padStart(2, '0');
const nowHM = () => { const d = new Date(); return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); };
const todayISO = () => { const d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); };
const addDays = (iso, n) => { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); };
const frDate = iso => { if (!iso) return ''; const [y, m, d] = iso.split('-'); return d + '/' + m + '/' + y; };
const fold = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : 0; };
const fmtKg = kg => { kg = +kg || 0; return kg >= 1000 ? nf(kg / 1000, 2) + ' t' : nf(kg, kg < 100 ? 1 : 0) + ' kg'; };
function ink(hex) { const m = /^#?([0-9a-f]{6})$/i.exec(hex || ''); if (!m) return '#fff'; const n = parseInt(m[1], 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255; return (0.299 * r + 0.587 * g + 0.114 * b) > 170 ? '#111' : '#fff'; }
const chipSt = col => 'background:' + esc(col) + ';color:' + ink(col);
const clone = o => JSON.parse(JSON.stringify(o));
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const vib = ms => { try { if (navigator.vibrate) navigator.vibrate(ms || 12); } catch (e) { } };

// ---------- Photos : IndexedDB (hors du stockage principal) ----------
const PH = new Map(); let idb = null;
const idbOpen = () => new Promise(res => { try { const r = indexedDB.open('xiii-m-packingo', 1); r.onupgradeneeded = () => r.result.createObjectStore('ph'); r.onsuccess = () => res(r.result); r.onerror = () => res(null); } catch (e) { res(null); } });
async function phLoad() { idb = await idbOpen(); if (!idb) return; await new Promise(res => { try { const rq = idb.transaction('ph').objectStore('ph').openCursor(); rq.onsuccess = () => { const c = rq.result; if (c) { PH.set(c.key, c.value); c.continue(); } else res(); }; rq.onerror = () => res(); } catch (e) { res(); } }); }
function phSet(k, v) { if (v) PH.set(k, v); else PH.delete(k); if (!idb) return; try { const st = idb.transaction('ph', 'readwrite').objectStore('ph'); if (v) st.put(v, k); else st.delete(k); } catch (e) { } }
function phClear(prefix) { Array.from(PH.keys()).filter(k => !prefix || k.startsWith(prefix)).forEach(k => phSet(k, null)); }
function compress(file) {
    return new Promise((res, rej) => {
        const url = URL.createObjectURL(file), img = new Image();
        img.onload = () => { const s = Math.min(1, 800 / Math.max(img.width, img.height)), c = document.createElement('canvas'); c.width = Math.max(1, Math.round(img.width * s)); c.height = Math.max(1, Math.round(img.height * s)); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.6)); };
        img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Image illisible')); }; img.src = url;
    });
}

// ---------- Modèle ----------
let S = null;   // { name, ts, example, standalone, prod, cps, curCp, vehicles, cases, checks, base }
const UI = { tab: 'chk', f: 'all', q: '', col: {} };
const curCp = () => S.cps.find(c => c.id === S.curCp) || S.cps[0];
const caseOf = id => S.cases.find(c => c.id === id);
const vehOf = id => S.vehicles.find(v => v.id === id);
const vehCases = v => S.cases.filter(c => c.veh === (v ? v.id : null)).sort((a, b) => (a.ord || 0) - (b.ord || 0));
const cpMap = cp => S.checks[cp] || (S.checks[cp] = {});
const recOf = (cp, iid) => (S.checks[cp] || {})[iid] || null;
const stOf = (cp, iid) => (recOf(cp, iid) || {}).s || '';
const itemKg = i => (+i.kg || 0) * (+i.qty || 0), caseKg = c => (+c.tare || 0) + c.items.reduce((s, i) => s + itemKg(i), 0);
function cpStats(cp) { const s = { total: 0, ok: 0, miss: 0, dmg: 0, pend: 0 }; S.cases.forEach(c => c.items.forEach(i => { s.total++; const st = stOf(cp, i.id); if (st) s[st]++; else s.pend++; })); return s; }
function caseStats(cp, c) { const s = { total: c.items.length, ok: 0, miss: 0, dmg: 0, pend: 0 }; c.items.forEach(i => { const st = stOf(cp, i.id); if (st) s[st]++; else s.pend++; }); return s; }
function caseLoaded(cp, c) { const pr = c.items.filter(i => ['ok', 'dmg'].includes(stOf(cp, i.id))); return pr.length ? (+c.tare || 0) + pr.reduce((s, i) => s + itemKg(i), 0) : 0; }
function weights(cp) { let exp = 0, load = 0; S.cases.forEach(c => { exp += caseKg(c); load += caseLoaded(cp, c); }); return { exp, load }; }
function normalize(d, name, flags) {
    const prod = Object.assign({ name: '', client: '', lieu: '', depart: '', retour: '', resp: '', paxKg: 75 }, d.prod || {});
    const cps = (d.cps && d.cps.length ? d.cps : [{ id: uid(), name: 'Sortie', icon: '🚚', date: todayISO() }, { id: uid(), name: 'Retour', icon: '🏁', date: addDays(todayISO(), 2) }]).map(c => ({ id: c.id, name: c.name || 'Contrôle', icon: c.icon || '📍', date: c.date || '' }));
    const vehicles = (d.vehicles || []).map(v => Object.assign({ name: '', plate: '', driver: '', payload: 0, pax: 0, color: '#42A5F5' }, v));
    const cases = (d.cases || []).map((c, k) => ({ id: c.id, code: c.code || 'FC-' + (k + 1), name: c.name || '', color: c.color || COLORS[k % COLORS.length], veh: c.veh && vehicles.some(v => v.id === c.veh) ? c.veh : null, ord: c.ord || 0, fragile: !!c.fragile, tare: +c.tare || 0, mob: c.mob ? 1 : 0,
        items: (c.items || []).map(i => Array.isArray(i) ? { id: i[0], name: i[1] || '', qty: +i[2] || 1, kg: +i[3] || 0, sn: i[4] || '' } : { id: i.id, name: i.name || '', qty: +i.qty || 1, kg: +i.kg || 0, sn: i.sn || '', mob: i.mob ? 1 : 0 }) }));
    const checks = {}; Object.keys(d.checks || {}).forEach(cp => { checks[cp] = {}; Object.keys(d.checks[cp]).forEach(k => { const r = d.checks[cp][k]; if (r && (r.s || r.sealed)) checks[cp][k] = clone(r); }); });
    const curCp = cps.some(c => c.id === d.curCp) ? d.curCp : cps[0].id;
    return Object.assign({ name: name || prod.name || '', ts: Date.now(), example: false, standalone: false, prod, cps, curCp, vehicles, cases, checks, base: clone(checks) }, flags || {});
}
function persist() { if (S && !XM.save(APP, S) && !UI.full) { UI.full = 1; XM.toast('⚠️ Stockage du téléphone plein : renvoyez vos pointages au bureau', 5000); } badge(); }

// ---------- Patch de retour (différences par rapport à l'envoi du bureau) ----------
function buildPatch(withPh) {
    if (!S) return null; let n = 0; const cps = {};
    S.cps.forEach(cp => {
        const cur = S.checks[cp.id] || {}, base = S.base[cp.id] || {}, set = {}, del = [];
        new Set(Object.keys(cur).concat(Object.keys(base))).forEach(k => {
            const a = base[k], b = cur[k]; if (same(a, b)) return;
            if (!b) { del.push(k); return; }
            const r = clone(b); if (r.ph) { const data = PH.get(cp.id + '|' + k); r.ph = withPh && data ? data : 'keep'; } set[k] = r;
        });
        if (Object.keys(set).length || del.length) { cps[cp.id] = { set, del }; n += Object.keys(set).length + del.length; }
    });
    const arr = i => [i.id, i.name, i.qty, i.kg, i.sn || ''];
    const newCases = S.cases.filter(c => c.mob).map(c => ({ id: c.id, code: c.code, name: c.name, color: c.color, veh: c.veh, fragile: c.fragile, tare: c.tare, items: c.items.filter(i => !i.ed).map(arr) }));
    const newItems = []; S.cases.filter(c => !c.mob).forEach(c => c.items.filter(i => i.mob).forEach(i => newItems.push({ case: c.id, id: i.id, name: i.name, qty: i.qty, kg: i.kg, sn: i.sn || '' })));
    const edits = []; S.cases.forEach(c => c.items.filter(i => i.ed && !i.mob).forEach(i => edits.push({ id: i.id, qty: i.qty, case: c.id })));
    n += newCases.length + newItems.length + edits.length;
    if (!n) return null;
    const out = { v: 1, project: S.prod.name || S.name, sent: S.ts, count: n, cps, newCases, newItems, edits, photos: !!withPh };
    if (S.standalone) { out.standalone = true; out.prod = S.prod; out.newCps = S.cps; }
    return out;
}
function badge() { let n = 0; try { const p = S ? buildPatch(false) : null; n = p ? p.count : 0; } catch (e) { } const b = $('#pk-ret'); b.hidden = !n; $('#pk-retn').textContent = n; b.title = n + ' changement(s) à renvoyer au bureau'; }

// ---------- Actions de pointage ----------
function setRec(cpId, iid, rec) {
    const m = cpMap(cpId); if (rec) m[iid] = rec; else delete m[iid];
    persist();
}
function tick(iid) {
    const cp = curCp().id, r = recOf(cp, iid); vib(r && r.s === 'ok' ? 8 : 14);
    if (r && r.s === 'ok') { setRec(cp, iid, null); phSet(cp + '|' + iid, null); }
    else { const n = { s: 'ok', t: nowHM(), by: S.prod.resp || '' }; if (r && r.n) n.n = r.n; if (r && r.ph) n.ph = 1; setRec(cp, iid, n); }
    render(iid);
}
function checkCase(cid) {

    c.items.forEach(i => { if (all) { delete cpMap(cp)[i.id]; phSet(cp + '|' + i.id, null); } else if (!recOf(cp, i.id)) cpMap(cp)[i.id] = { s: 'ok', t: nowHM(), by: S.prod.resp || '' }; });

}
function toggleSeal(cid) {
    const cp = curCp().id, m = cpMap(cp), k = 'c:' + cid; vib(14);
    if (m[k]) delete m[k]; else { const s = caseStats(cp, caseOf(cid)); if (s.pend) XM.toast('🔒 Case fermé alors que ' + s.pend + ' élément(s) ne sont pas pointés', 3200); m[k] = { sealed: 1, t: nowHM() }; }

}
function detail(iid) {

    let s = r0.s || '', photo = r0.ph ? (PH.get(cp.id + '|' + iid) || 'remote') : '', note = r0.n || '', phChanged = false;
    const sh = XM.sheet(`<p class="m-hint" style="margin:-4px 0 10px"><span class="pk-code" style="${chipSt(c.color)}">${esc(c.code)}</span> ${esc(c.name)} · ${esc(cp.icon)} ${esc(cp.name)}${it.sn ? ' · n° ' + esc(it.sn) : ''}</p>
      <div class="pk-st">${Object.keys(ST).map(k => `<button data-s="${k}" class="${s === k ? 'on' : ''}"><span>${ST[k][0]}</span>${ST[k][1]}</button>`).join('')}</div>
      <div class="m-grid2"><label class="m-field"><span>Quantité</span><input type="number" id="d-qty" min="1" inputmode="numeric" value="${+it.qty || 1}"></label><label class="m-field"><span>Flight case</span><select id="d-case">${S.cases.map(x => `<option value="${x.id}" ${x.id === c.id ? 'selected' : ''}>${esc(x.code + ' — ' + x.name)}</option>`).join('')}</select></label></div>
      <label class="m-field"><span>Note (facultatif)</span><textarea id="d-note" rows="3" placeholder="ex. objectif rayé, batterie à 40 %, remplacé par…">${esc(note)}</textarea></label>
      <div class="pk-ph" id="d-ph"></div>
      <div class="m-actions" style="margin-top:0"><button class="m-btn" id="d-photo">📷 Photo</button><button class="m-btn primary" id="d-ok">✓ Enregistrer</button></div>`, { title: esc((+it.qty > 1 ? it.qty + '× ' : '') + it.name) });
    const drawPh = () => { $('#d-ph', sh).innerHTML = photo ? `<img src="${photo === 'remote' ? '' : photo}" alt="Photo" ${photo === 'remote' ? 'hidden' : ''}>${photo === 'remote' ? '<span class="m-hint">📷 Photo enregistrée sur le bureau</span>' : ''}<button class="m-btn sm danger" id="d-rmph">Retirer</button>` : ''; const rm = $('#d-rmph', sh); if (rm) rm.onclick = () => { photo = ''; phChanged = true; drawPh(); }; };
    drawPh();
    $$('.pk-st button', sh).forEach(b => b.onclick = () => { s = s === b.dataset.s ? '' : b.dataset.s; $$('.pk-st button', sh).forEach(x => x.classList.toggle('on', x.dataset.s === s)); vib(10); });
    $('#d-photo', sh).onclick = () => { const inp = $('#pk-photo'); inp.value = ''; inp.onchange = async () => { const f = inp.files[0]; if (!f) return; try { photo = await compress(f); phChanged = true; drawPh(); } catch (e) { XM.toast('⚠️ ' + e.message); } }; inp.click(); };
    $('#d-ok', sh).onclick = () => {
        note = $('#d-note', sh).value.trim();
        const nq = Math.max(1, Math.round(num($('#d-qty', sh).value) || 1)), nc = $('#d-case', sh).value;
        if (nq !== (+it.qty || 1) || nc !== c.id) { if (!it.mob && !it.ed) it.ed = { q0: +it.qty || 1, c0: c.id }; it.qty = nq; if (nc !== c.id) { const to = caseOf(nc); if (to) { c.items.splice(c.items.indexOf(it), 1); to.items.push(it); UI.col[to.id] = false; } } if (it.ed && it.ed.q0 === it.qty && it.ed.c0 === nc) delete it.ed; persist(); XM.toast('✏️ ' + it.name + ' : ' + it.qty + '× → ' + (caseOf(nc) || c).code); }

        if (!s) { setRec(cp.id, iid, null); phSet(cp.id + '|' + iid, null); }
        else { const n = { s, t: r0.s === s && r0.t ? r0.t : nowHM(), by: S.prod.resp || '' }; if (note) n.n = note; if (photo) n.ph = 1; setRec(cp.id, iid, n); if (phChanged) phSet(cp.id + '|' + iid, photo && photo !== 'remote' ? photo : null); if (!photo && r0.ph) phSet(cp.id + '|' + iid, null); }

    };
}

// ---------- Rendu ----------
const main = $('#pk-main');
function render(flash) {
    const y = window.scrollY, has = !!S;
    $('#pk-tabs').hidden = !has; $('#pk-fab').hidden = !(has && UI.tab === 'chk'); main.classList.toggle('no-tabs', !has);
    if (!has) { $('#pk-sub').textContent = 'Check-out / check-in du matériel'; main.innerHTML = vHome(); badge(); return; }
    $$('#pk-tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === UI.tab));
    const cp = curCp(); $('#pk-sub').textContent = [S.prod.name || S.name, cp.icon + ' ' + cp.name].filter(Boolean).join(' · ');
    main.innerHTML = ({ chk: vChk, veh: vVeh, sum: vSum }[UI.tab] || vChk)();
    window.scrollTo(0, y); badge();
    if (flash) { const el = $('#row-' + flash); if (el) el.classList.add('pk-flash'); }
}
function vHome() {
    return `<div class="m-card"><h3>📦 Aucune liste de colisage sur ce téléphone</h3><p style="margin:0 0 6px;color:var(--text-muted)">Emportez-la depuis l'ordinateur :</p>
      <ol class="pk-steps"><li>Dans PACKINGO XIII (bureau), touchez le bouton <b>📱</b> de la barre d'outils.</li><li><b>Scannez le QR code</b> avec l'appareil photo du téléphone, ou envoyez-vous le lien / le fichier.</li>

}
function modeBar(cp) {

    if (S.cps.length > 2 || S.cps.length === 1) h += `<div class="pk-cps">${S.cps.map(c => `<button class="m-chip ${c.id === cp.id ? 'on' : ''}" data-cp="${c.id}">${esc(c.icon)} ${esc(c.name)}${c.date ? ' · ' + esc(frDate(c.date).slice(0, 5)) : ''}</button>`).join('')}</div>`;
    return h + '</div>';
}
function vChk() {
    const cp = curCp(), s = cpStats(cp.id), f = UI.f, q = fold(UI.q).trim(), w = weights(cp.id), pct = x => s.total ? x / s.total * 100 : 0;
    if (!S.cases.length) return modeBar(cp) + `<div class="m-empty"><b>📦</b>Aucun case.<br>Touchez ＋ pour ajouter un case et son matériel.</div>`;
    let h = modeBar(cp) + `<div class="m-card"><div class="pk-big"><b>${s.ok + s.dmg}/${s.total}</b><span>pointés · ${nf(s.total ? (s.ok + s.dmg) / s.total * 100 : 0)} %</span></div>
      <div class="m-progress pk-p"><i class="ok" style="width:${pct(s.ok)}%"></i><i class="dmg" style="width:${pct(s.dmg)}%"></i><i class="miss" style="width:${pct(s.miss)}%"></i></div>

      <input type="search" id="pk-q" placeholder="Rechercher un élément, un n° de série, un case…" value="${esc(UI.q)}" aria-label="Rechercher">
      <div class="pk-filters">${[['all', 'Tout'], ['pend', 'Restant à traiter'], ['pb', 'Problèmes']].map(x => `<button class="m-chip ${f === x[0] ? 'on' : ''}" data-f="${x[0]}">${x[1]}</button>`).join('')}</div><div id="pk-list">${caseList()}</div>`;

}
function caseList() {
    const cp = curCp(), f = UI.f, q = fold(UI.q).trim(); let h = '', shown = 0;
    const groups = S.vehicles.map(v => [v, vehCases(v)]).concat([[null, vehCases(null)]]).filter(g => g[1].length);
    groups.forEach(([v, cs]) => {
