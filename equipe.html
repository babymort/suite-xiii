<body>
<div class="w">
<header><img src="xiii-logo.png" alt="XIII"><div class="t"><small>XIII Équipe</small><b id="pj">Application de l'équipe</b></div><span id="st" class="dim"></span></header>

<script>
// =====================================================================
//  XIII ÉQUIPE — l'application de l'équipe de tournage (PWA installable)
//  Scanner le QR code du Master / référent → accès personnel au ☁️ Drive du projet + canal Régie ⇄ équipe,
//  tous les outils partagés à portée de pouce, et de vraies notifications (Web Push) même application fermée.
// =====================================================================
const $ = id => document.getElementById(id), esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const J = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } };
const W = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } };
const ub64 = s => { s = String(s || '').replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; return Uint8Array.from(atob(s), c => c.charCodeAt(0)); };
const toast = (t, ms) => { const e = $('toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('on'), ms || 2800); };
const SECT = [['', '—'], ['production', 'Production'], ['realisation', 'Réalisation'], ['image', 'Image'], ['son', 'Son'], ['lumiere', 'Lumière'], ['regie', 'Régie'], ['technique', 'Technique'], ['decor', 'Décor'], ['hmc', 'HMC'], ['post', 'Post-production'], ['artistes', 'Artistes'], ['client', 'Client']];
const TOOLS = [['annonces', '📣', 'Régie', 'Annonces, demandes, chat'], ['jour', '🎬', 'Tournage', 'La journée en direct'], ['callsheeto', '📋', 'Feuille', 'Feuille de service'], ['planno', '📅', 'Planning', 'Planning de production'], ['transporto', '🚐', 'Transports', 'Navettes, hôtels'], ['scripto', '📝', 'Script', 'Plans et rapports'], ['documents', '📂', 'Documents', 'Partagés avec vous'], ['casto', '🎭', 'Casting', 'Talents'], ['repero', '📍', 'Lieux', 'Repérages'], ['conduco', '🎬', 'Conducteur', 'Direct'], ['sono', '🎚️', 'Son', 'Patch et HF'], ['lumo', '💡', 'Lumière', 'Plan de feu'], ['packingo', '🧳', 'Matériel', 'Colisage'], ['calendrier', '🗓️', 'Agenda', 'Toutes les dates']];
let ME = J('xiii.app.me', null), PEND = null, REG = null, NL = [], TAB = 'home';
if (!ME) { const d0 = J('xiii.drive', null); if (d0 && d0.url && (d0.tok || d0.code) && !d0.wait) { ME = { p: d0.proj || '', nom: (d0.me && d0.me.name) || d0.master || 'Moi', secteur: String(d0.secteur || '').split(',')[0], v: (J('xiii.app.cfg', {}) || {}).v || '', d: { u: d0.url, master: !!d0.code, droit: d0.perm }, at: Date.now() }; try { localStorage.setItem('xiii.app.me', JSON.stringify(ME)); } catch (e) { } } } // relié par 👥 Équipe : l'application reprend la connexion du poste
const standalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = () => /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
// ---------- lecture du QR / du lien ----------
function parse(txt) {
    txt = String(txt || '').trim(); let h = ''; try { h = new URL(txt, location.href).hash; } catch (e) { h = txt.indexOf('#') > -1 ? txt.slice(txt.indexOf('#')) : ''; }
    const q = new URLSearchParams(h.slice(1));
    if (q.get('j')) { try { const o = JSON.parse(new TextDecoder().decode(ub64(q.get('j')))); return o; } catch (e) { return null; } }
    if (q.get('r') && q.get('k')) return { p: q.get('p') || '', a: { r: q.get('r'), k: q.get('k'), b: q.get('b') || '' } };
    return null;
}
// ---------- scanner ----------
let stream = null, scanning = false;
async function scan() {
    try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }); } catch (e) { toast('📷 Caméra refusée ou indisponible : collez le lien à la place', 4000); return; }
    const v = $('vid'); v.srcObject = stream; await v.play().catch(() => { }); $('cam').classList.add('on'); scanning = true;
    let det = null; if ('BarcodeDetector' in window) { try { det = new BarcodeDetector({ formats: ['qr_code'] }); } catch (e) { det = null; } }
    if (!det && !window.jsQR) await new Promise(r => { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js'; s.onload = r; s.onerror = r; document.head.appendChild(s); });
    const cv = document.createElement('canvas'), cx = cv.getContext('2d', { willReadFrequently: true });
    const loop = async () => {
        if (!scanning) return; let val = null;
        try {
            if (det) { const r = await det.detect(v); if (r && r[0]) val = r[0].rawValue; }
            else if (window.jsQR && v.videoWidth) { const w = Math.min(640, v.videoWidth), hh = Math.round(v.videoHeight * w / v.videoWidth); cv.width = w; cv.height = hh; cx.drawImage(v, 0, 0, w, hh); const r = jsQR(cx.getImageData(0, 0, w, hh).data, w, hh); if (r) val = r.data; }
        } catch (e) { }
        if (val && MTSCAN && !/caisse\.html#/.test(val)) { stopScan(); MTSCAN = false; navigator.vibrate && navigator.vibrate(80); const g = await api('get', { app: 'matos', since: -1 }); let P = {}; try { P = JSON.parse((g.data || {})['matosXIII.parc'] || '{}'); } catch (e) { } const u = mtFind(P, val); if (u) { MTU = u.id; TAB = 'mt'; render(); } else toast('⚠️ Code inconnu dans le parc : ' + val, 4000); return; }
        if (val && /\/(tally|remote)\.html/.test(val)) { stopScan(); navigator.vibrate && navigator.vibrate(80); try { localStorage.setItem('xiii.tally.url', val); } catch (e) { } location.href = val; return; }
        if (val) { if (/caisse\.html#/.test(val)) { stopScan(); navigator.vibrate && navigator.vibrate(80); location.href = 'caisse.html' + val.slice(val.indexOf('#')); return; } if (/#j=[zjp]\./.test(val)) { stopScan(); navigator.vibrate && navigator.vibrate(80); try { sessionStorage.setItem('xiii.ret', location.pathname.split('/').pop() || 'equipe.html'); } catch (e) { } location.href = 'drive.html' + val.slice(val.indexOf('#')); return; } const o = parse(val); if (o) { stopScan(); navigator.vibrate && navigator.vibrate(80); PEND = o; render(); return; } toast('Ce QR code n\'est pas celui de la régie XIII'); }
        setTimeout(loop, 220);
    }; loop();
}
function stopScan() { scanning = false; $('cam').classList.remove('on'); if (stream) stream.getTracks().forEach(t => t.stop()); stream = null; }
$('cam-x').onclick = stopScan;
// ---------- Drive ----------
async function api(a, p, url) { const d = J('xiii.drive', null), u = url || (d && d.url); if (!u) return { ok: false, err: 'off' }; try { const r = await fetch(u, { method: 'POST', body: JSON.stringify(Object.assign({ a }, url ? {} : d.tok ? { tok: d.tok } : { code: d.code, by: (d.me && d.me.name) || (ME && ME.nom) || 'Master' }, p || {})), redirect: 'follow' }); const j = await r.json(); if (j && j.err === 'action') j.err = 'script Google du Master à mettre à jour (page Drive XIII)'; return j; } catch (e) { return { ok: false, err: 'net' }; } }
async function join(nom, secteur) {
    const o = PEND; if (!o) return; const me = { p: o.p || '', a: o.a || null, v: o.v || '', nom, secteur, at: Date.now() };
    if (o.d && o.d.u && o.d.j) {
        const cur = J('xiii.drive', null);
        if (cur && cur.code && cur.url === o.d.u) { me.d = { u: o.d.u, master: true }; toast('Vous êtes le Master sur cet appareil : accès conservé'); }
        else {
            $('m').querySelector('#jn').disabled = true; $('m').querySelector('#jn').textContent = '⏳ Connexion au Drive du projet…';
            const r = await api('join', { jk: o.d.j, nom, secteur }, o.d.u);
            if (!r.ok) { toast(r.err === 'code' ? '⚠️ QR code expiré ou application équipe désactivée : demandez le nouveau QR à la régie' : '⚠️ Drive injoignable (' + (r.err || 'réseau') + ')', 5000); render(); return; }
            Object.keys(localStorage).filter(k => /^xiii\.drive\.base\./.test(k)).forEach(k => localStorage.removeItem(k));
            W('xiii.drive', { url: o.d.u, tok: r.tok, secteur, perm: r.droit || 'read', apps: null, proj: o.p || r.name || '', role: 'member', me: { name: nom }, master: o.m || '', at: Date.now(), app: 1 }); me.d = { u: o.d.u, droit: r.droit };
        }
    }
    if (o.a) W('xiii.ann.me.' + o.a.r, Object.assign(J('xiii.ann.me.' + o.a.r, {}) || {}, { n: nom, d: secteur }));
    ME = me; W('xiii.app.me', ME); PEND = null; history.replaceState(null, '', location.pathname); render(); setTimeout(perms, 600);
}
// ---------- outils accessibles ----------
let OUT = null;
async function perms() { if (!ME || !ME.d || ME.d.master) return; const r = await api('ping'); if (r.ok && r.vk && ME.v !== r.vk) ME.v = r.vk; if (r.ok && r.me) { OUT = r.me.outils; ME.d.droit = r.me.droit; W('xiii.app.me', ME); const d = J('xiii.drive', null); if (d && d.tok) { d.perm = r.me.droit; d.apps = r.me.outils || null; W('xiii.drive', d); } render(); } else if (r.err === 'revoked' || r.err === 'expired') { toast('⚠️ Votre accès au Drive a été ' + (r.err === 'revoked' ? 'retiré' : 'expiré') + ' : scannez le nouveau QR code', 6000); } }
const url = t => {
    if (t === 'annonces') return ME.a ? 'annonces.html#r=' + ME.a.r + '&k=' + ME.a.k + (ME.p ? '&p=' + encodeURIComponent(ME.p) : '') + (ME.a.b ? '&b=' + ME.a.b : '') : null;
    if (['jour', 'documents', 'calendrier'].indexOf(t) > -1) return t + '.html';
    return t + '-m.html';
};
// ---------- 🔔 notifications ----------
async function swReg() { if (!('serviceWorker' in navigator)) return null; if (REG) return REG; const mode = (() => { try { return localStorage.getItem('xiii.pwa.mode') || 'offline'; } catch (e) { return 'offline'; } })(); try { REG = await navigator.serviceWorker.register('sw.js' + (mode === 'online' ? '?mode=online' : '')); await navigator.serviceWorker.ready; REG = await navigator.serviceWorker.getRegistration() || REG; } catch (e) { REG = null; } return REG; }
async function pushState() { if (!('PushManager' in window) || !('Notification' in window)) return 'unsupported'; if (Notification.permission === 'denied') return 'denied'; const r = await swReg(); if (!r) return 'unsupported'; const s = await r.pushManager.getSubscription(); return s ? 'on' : 'off'; }
async function enablePush() {
    if (isIOS() && !standalone()) { toast('Sur iPhone : ajoutez d\'abord l\'application à l\'écran d\'accueil (Partager → Sur l\'écran d\'accueil), puis ouvrez-la', 7000); return; }
    if (!ME.v) { const r0 = await api('ping'); if (r0 && r0.vk) { ME.v = r0.vk; W('xiii.app.me', ME); } }
    if (!ME.v) { toast('Notifications pas encore prêtes : elles s\'activeront dès que le Master aura ouvert la suite XIII sur son ordinateur. Réessayez plus tard.', 6000); return; }
    const p = await Notification.requestPermission(); if (p !== 'granted') { toast('Notifications refusées : autorisez-les dans les réglages du téléphone', 5000); render(); return; }
    const r = await swReg(); if (!r) { toast('⚠️ Service indisponible sur ce navigateur'); return; }
    let s = await r.pushManager.getSubscription();
    try { if (s && s.options && s.options.applicationServerKey && btoa(String.fromCharCode(...new Uint8Array(s.options.applicationServerKey))) !== btoa(String.fromCharCode(...ub64(ME.v)))) { await s.unsubscribe(); s = null; } } catch (e) { }
    if (!s) s = await r.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: ub64(ME.v) });
    const x = await api('push_sub', { sub: s.toJSON(), nom: ME.nom, secteur: ME.secteur });
    if (x.ok) { ME.push = Date.now(); W('xiii.app.me', ME); toast('🔔 Notifications activées : la régie peut vous prévenir même application fermée', 4500); } else toast('⚠️ Abonnement non enregistré dans le Drive (' + (x.err || 'réseau') + ')', 5000);
    render();
}
async function notifs() { try { const c = await caches.open('xnotifs'), r = await c.match('list'); NL = r ? await r.json() : []; } catch (e) { NL = []; } }
if (navigator.serviceWorker) navigator.serviceWorker.addEventListener('message', e => { const d = e.data || {}; if (d.t === 'xiii-push') { toast((d.m.lvl === 'urg' ? '🚨 ' : '🔔 ') + (d.m.title || '') + (d.m.body ? ' — ' + d.m.body : ''), 5000); notifs().then(render); } });
// ---------- installation ----------
let BIP = null; addEventListener('beforeinstallprompt', e => { e.preventDefault(); BIP = e; render(); instBar(); });
// 📲 bandeau d'installation (raccourci application sur l'écran d'accueil) : visible tant que l'application n'est pas installée
function instBar() {
    let b = document.getElementById('ib'); if (standalone() || !/Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || sessionStorage.getItem('xiii.ib.no')) { if (b) b.remove(); return; }
    if (!b) { b = document.createElement('div'); b.id = 'ib'; b.style.cssText = 'position:sticky;top:0;z-index:20;background:#f0b378;color:#1d1b19;padding:10px 14px;display:flex;gap:10px;align-items:center;font:600 14px/1.3 system-ui,sans-serif'; document.body.prepend(b); }
    b.innerHTML = '<span style="flex:1">📲 Installez XIII sur l\'écran d\'accueil : elle s\'ouvrira comme une application.</span>' + (BIP ? '<button id="ib-go" style="font:700 14px system-ui;padding:8px 12px;border-radius:10px;border:0;background:#1d1b19;color:#f0b378">Installer</button>' : isIOS() ? '<small style="max-width:140px">Partager ⎋ puis « Sur l\'écran d\'accueil »</small>' : '<small style="max-width:150px">Menu ⋮ › « Installer l\'application »</small>') + '<button id="ib-x" style="border:0;background:transparent;font-size:18px">✕</button>';
    const g = document.getElementById('ib-go'); if (g) g.onclick = async () => { BIP.prompt(); await BIP.userChoice.catch(() => { }); BIP = null; instBar(); render(); };

addEventListener('appinstalled', () => { BIP = null; instBar(); }); setTimeout(instBar, 300);
// ---------- 💬 échanges d'équipe : avis des outils, message au Master, mentions, activité ----------
const NM = { callsheeto: 'Feuille de service', planno: 'Planning', calendrier: 'Calendrier', deviso: 'Devis', dossier: 'Dossier', moodo: 'Moodboard', repero: 'Repérages', storyboardo: 'Storyboard', decoup: 'Découpage', scripto: 'Script', posto: 'Post-prod', casto: 'Casting', plano: 'Plan', syno: 'Synoptique', conduco: 'Conducteur', transporto: 'Transports', packingo: 'Colisage', backupo: 'Rushes', matos: 'Matos', lumo: 'Lumière', sono: 'Son', runo: 'Déroulé', ressourco: 'Contrats', cadro: 'Cadre', soustitro: 'Sous-titres', catalogue: 'Catalogue', jour: 'Tournage' };
const nm = a => NM[a] || String(a || '').toUpperCase();
function tabBar() {
    let b = document.getElementById('tb'); if (!ME || !ME.d) { if (b) b.remove(); return; }
    if (!b) { b = document.createElement('nav'); b.id = 'tb'; b.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:15;display:grid;grid-template-columns:repeat(4,1fr);background:#1d1b19;border-top:1px solid #3a3632;padding:6px 4px calc(50px + env(safe-area-inset-bottom))'; document.body.appendChild(b); document.body.style.paddingBottom = '130px'; }
    const T = [['home', '🏠', 'Accueil'], ['ex', '💬', 'Échanges'], ['me', '📣', 'Mentions'], ['act', '🔄', 'Activité']];
    b.innerHTML = T.map(t => '<button data-t="' + t[0] + '" style="background:transparent;border:0;color:' + (TAB === t[0] ? '#f0b378' : '#a39b91') + ';font:600 11px system-ui;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative"><span style="font-size:22px">' + t[1] + '</span>' + t[2] + (t[0] === 'me' && MCOUNT ? '<i style="position:absolute;top:0;right:22%;background:#ef5350;color:#fff;border-radius:99px;font:700 10px system-ui;padding:1px 5px;font-style:normal">' + MCOUNT + '</i>' : '') + '</button>').join('');
    b.querySelectorAll('[data-t]').forEach(x => x.onclick = () => { TAB = x.dataset.t; scrollTo(0, 0); render(); });

let MCOUNT = 0; async function mCount() { if (!ME || !ME.d) return; const r = await api('ment_list'); MCOUNT = r.ok ? (r.ments || []).length : 0; tabBar(); } setTimeout(mCount, 1500); setInterval(mCount, 60000);
const card = (t, b) => '<div class="card"><h2>' + t + '</h2>' + b + '</div>';
// 💬 avis récents de tous les outils + message au Master
async function vEx() {

function depShrink(file, mx) { return new Promise((res, rej) => { const u = URL.createObjectURL(file), im = new Image(); im.onload = () => { const k = Math.min(1, (mx || 1200) / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(u); res(c.toDataURL('image/jpeg', .72)); }; im.onerror = rej; im.src = u; }); }

        ['casto', 'CASTO — casting', 'casting talent comedien role candidat cachet disponibilite'], ['transporto', 'TRANSPORTO — logistique', 'transport navette hotel chambre voyage vehicule logistique'],
        ['calendrier', 'CALENDRIER — planning', 'calendrier planning production date tache jalon gantt'], ['matos', 'MATOS — parc matériel', 'matos materiel parc reservation sortie retour scan catalogue inventaire'],
        ['lumo', 'LUMO — lumière', 'lumiere projecteur plan de feu dmx'], ['sono', 'SONO — son', 'son patch micro hf console audio'], ['runo', 'RUNO — déroulé live', 'deroule live run of show'], ['soustitro', 'SOUSTITRO — sous-titres', 'sous-titres srt traduction live ndi'], ['graphico', 'GRAPHICO — habillage', 'habillage graphique overlay ndi obs vmix synthe'], ['jour', 'MODE TOURNAGE', 'tournage jour j check-in arrivee qr kiosque regie']];
    const fold = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
    function search(q) { const W = fold(q).split(/[^a-z0-9]+/).filter(w => w.length > 1); if (!W.length) return []; return TOPICS.map(t => { const hay = fold(t[1] + ' ' + t[2] + ' ' + ((T[t[0]] || {}).i || '')); let sc = 0; W.forEach(w => { if (hay.indexOf(w) > -1) sc += (fold(t[1]).indexOf(w) > -1 ? 3 : 1); else if (w.length > 3 && hay.indexOf(w.slice(0, -1)) > -1) sc += .5; }); return [sc, t]; }).filter(x => x[0] > 0).sort((a, b) => b[0] - a[0]).slice(0, 8).map(x => x[1]); }
    function go(k) { if (k === APP) { start(true); return; } if (k === 'projet') { if (APP === 'index' && typeof XPROJET !== 'undefined') { XPROJET.open(); setTimeout(() => run('projet', T.projet, true), 300); } else location.href = 'index.html#xtour=projet'; return; } location.href = (k === 'index' ? 'index' : k) + '.html#xtour'; }
    return { start, run, T, search, go, TOPICS, app: APP, reset() { try { localStorage.removeItem(KEY); } catch (e) { } } };
})();

(function () {
    if (window.__xinapp) return; window.__xinapp = 1;
    var page = (location.pathname.split('/').pop() || 'index.html').toLowerCase();
    try { if (page === 'equipe.html' && (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (window.matchMedia && matchMedia('(display-mode: standalone)').matches))) sessionStorage.setItem('xiii.inapp', '1'); } catch (e) { }

    if (!inApp()) return;
    if (page === 'index.html' || page === '') { location.replace('equipe.html'); return; }
    document.addEventListener('click', function (e) {
        var a = e.target.closest && e.target.closest('a[href]'); if (!a) return;
        var u; try { u = new URL(a.getAttribute('href'), location.href); } catch (er) { return; }
        if (u.origin !== location.origin) return;
        var f = (u.pathname.split('/').pop() || 'index.html').toLowerCase();
        if (f === 'index.html' || f === '') { e.preventDefault(); e.stopPropagation(); location.href = 'equipe.html'; return; }
        if (a.target === '_blank') { a.removeAttribute('target'); }
    }, true);
