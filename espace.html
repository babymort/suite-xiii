<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SUITE XIII — Espace onglets</title>
<link rel="icon" href="logos/index.png">
<style>
@font-face{font-family:Astoria;src:url(fonts/astoria.woff) format("woff");font-display:swap}
:root{--tabon:#2a2219;--bg:#0e0e12;--glass:rgba(26,26,34,.72);--line:rgba(255,255,255,.10);--txt:#f2f2f2;--dim:#a9a9b3;--acc:#f0b429;--acc2:#ff8a3d}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]){--tabon:#fff6ea;--bg:#f4efe6;--glass:rgba(255,255,255,.72);--line:rgba(0,0,0,.10);--txt:#1d1a16;--dim:#6d675e}}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:14px "Segoe UI",system-ui,sans-serif;overflow:hidden}
#bar{position:relative;z-index:5;display:flex;align-items:flex-end;gap:2px;height:46px;padding:0 8px;background:linear-gradient(180deg,rgba(255,138,61,.10),rgba(240,180,41,.03)),var(--glass);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);box-shadow:0 1px 0 rgba(240,180,41,.35),0 0 40px rgba(240,180,41,.08)}
#home{all:unset;cursor:pointer;display:flex;align-items:center;align-self:center;padding:0 10px 0 4px;height:34px}#home img{height:28px;filter:drop-shadow(0 0 8px rgba(240,180,41,.45))}
#tabs{position:relative;flex:1;display:flex;align-items:flex-end;overflow-x:auto;scrollbar-width:none;height:46px;padding:0 10px}#tabs::-webkit-scrollbar{display:none}

.t{all:unset;position:relative;z-index:1;flex:0 1 220px;min-width:56px;display:flex;align-items:center;gap:8px;height:36px;padding:0 8px 0 12px;margin-bottom:0;border-radius:10px 10px 0 0;cursor:pointer;color:var(--dim);font-weight:600;font-size:13px;white-space:nowrap;transition:background .18s,color .18s}
.t::after{content:'';position:absolute;right:-1px;top:9px;bottom:9px;width:1px;background:var(--line)}.t.on::after,.t:hover::after,.t:has(+.t.on)::after,.t:has(+.t:hover)::after{opacity:0}
.t:hover{background:rgba(255,160,70,.10);color:var(--txt)}
.t.on{z-index:2;color:var(--txt);background:var(--tabon);box-shadow:0 -1px 0 rgba(240,180,41,.55) inset,0 -6px 18px rgba(240,180,41,.18)}
.t.on::before,.t.on>b::before{content:'';position:absolute;bottom:0;width:10px;height:10px;pointer-events:none}
.t.on::before{left:-10px;background:radial-gradient(circle at 0 0,transparent 9.5px,var(--tabon) 10px)}
.t.on>b{position:absolute;inset:auto 0 0 auto;width:0;height:0}.t.on>b::before{right:-10px;background:radial-gradient(circle at 100% 0,transparent 9.5px,var(--tabon) 10px)}
.t img{width:18px;height:18px;object-fit:contain;flex:0 0 auto}.t span{flex:1;overflow:hidden;text-overflow:ellipsis}
.t .x{all:unset;flex:0 0 auto;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;opacity:.6}.t .x:hover{opacity:1;background:rgba(255,255,255,.12)}

.t.drag{opacity:.4}
.t{--pc:transparent;box-shadow:inset 0 3px 0 var(--pc);background-image:linear-gradient(180deg,color-mix(in srgb,var(--pc) 14%,transparent),transparent 75%)}
.t.on{box-shadow:inset 0 3px 0 var(--pc),0 -1px 0 rgba(240,180,41,.55) inset,0 -6px 18px rgba(240,180,41,.18)}
#proj{all:unset;cursor:pointer;align-self:center;display:flex;align-items:center;gap:7px;max-width:190px;height:28px;padding:0 10px 0 9px;margin-right:4px;border-radius:999px;font-size:12px;font-weight:700;color:var(--txt);border:1px solid color-mix(in srgb,var(--pc,#f0b429) 55%,transparent);background:color-mix(in srgb,var(--pc,#f0b429) 12%,transparent);box-shadow:0 0 14px color-mix(in srgb,var(--pc,#f0b429) 22%,transparent)}
#proj i{flex:0 0 auto;width:9px;height:9px;border-radius:50%;background:var(--pc,#f0b429);box-shadow:0 0 8px var(--pc,#f0b429)}#proj span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#proj:hover{background:color-mix(in srgb,var(--pc,#f0b429) 20%,transparent)}
.t em{position:absolute;left:24px;top:20px;width:8px;height:8px;border-radius:50%;display:none;border:1.5px solid var(--tabon);box-sizing:border-box}.t em.ok{display:block;background:#4caf50}.t em.wait{display:block;background:#ff9800;box-shadow:0 0 6px #ff9800}.t em.err{display:block;background:#f44336;box-shadow:0 0 7px #f44336}
.t.anc{flex:0 0 auto;min-width:0;padding:0 13px}.t.anc span,.t.anc .x{display:none}.t.sp span::before{content:'◫ ';color:var(--acc)}
#crumb{position:absolute;top:46px;left:0;right:0;height:26px;display:flex;align-items:center;gap:4px;padding:0 12px;font-size:12px;color:var(--dim);background:var(--tabon);border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden}body.nocrumb #crumb{display:none}
#crumb .c{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:2px 7px;border-radius:7px;max-width:260px;overflow:hidden;text-overflow:ellipsis}#crumb .c:hover{background:rgba(255,160,70,.12);color:var(--txt)}#crumb i{flex:0 0 auto;width:8px;height:8px;border-radius:50%}#crumb img{width:14px;height:14px;object-fit:contain}#crumb .s{opacity:.4}#crumb b{color:var(--txt);font-weight:700}#crumb .r{margin-left:auto;opacity:.7}
#sdiv{position:absolute;top:0;bottom:0;width:12px;z-index:3;display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:col-resize;background:linear-gradient(90deg,transparent 5px,rgba(240,180,41,.6) 5px,rgba(240,180,41,.6) 7px,transparent 7px)}#sdiv button{all:unset;cursor:pointer;width:24px;height:24px;flex:0 0 auto;border-radius:50%;background:var(--glass);border:1px solid rgba(240,180,41,.5);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--txt);backdrop-filter:blur(12px)}#sdiv button:hover{background:rgba(255,160,70,.25)}
#prev{position:fixed;z-index:15;display:none;width:260px;padding:12px 14px;border-radius:14px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:0 18px 50px rgba(0,0,0,.45);font-size:12px;pointer-events:none;color:var(--txt)}#prev.on{display:block}#prev .h{display:flex;align-items:center;gap:10px;margin-bottom:8px}#prev .h img{width:34px;height:34px;object-fit:contain}#prev .h b{font:700 15px "Segoe UI",sans-serif;display:block}#prev .h small{color:var(--dim)}#prev p{margin:5px 0;display:flex;align-items:center;gap:7px;color:var(--dim)}#prev p i{width:8px;height:8px;border-radius:50%;flex:0 0 auto}#prev p b{color:var(--txt);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pick .rc{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-bottom:6px;border-bottom:1px solid var(--line)}#pick .rc small{width:100%;color:var(--dim);font-size:11px;letter-spacing:.06em;text-transform:uppercase}#pick .rc button{flex-direction:row;padding:5px 10px 5px 6px;border-radius:999px;gap:6px}#pick .rc img{width:18px;height:18px}#pick .rc i{width:7px;height:7px;border-radius:50%}
#net{all:unset;cursor:pointer;align-self:center;display:none;align-items:center;gap:6px;height:26px;padding:0 11px;margin-left:6px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}#net.on{display:flex}#net.off{color:#fff;background:rgba(229,115,115,.25);border:1px solid rgba(229,115,115,.7);box-shadow:0 0 14px rgba(229,115,115,.3)}#net.wait{color:var(--txt);background:rgba(255,152,0,.16);border:1px solid rgba(255,152,0,.6)}
#pmenu{position:fixed;z-index:20;display:none;min-width:250px;max-width:340px;padding:8px;border-radius:16px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:0 20px 60px rgba(0,0,0,.45)}#pmenu.on{display:block}
#pmenu h6{margin:4px 8px 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}#pmenu hr{border:0;border-top:1px solid var(--line);margin:6px 4px}
#pmenu button{all:unset;cursor:pointer;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:10px;font-size:13px;font-weight:600}#pmenu button:hover{background:rgba(255,160,70,.12)}
#pmenu button.on{background:rgba(255,160,70,.16)}#pmenu button.on span::after{content:'  ✓';color:var(--acc)}#pmenu i{flex:0 0 auto;width:11px;height:11px;border-radius:50%}#pmenu span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#pmenu small{color:var(--dim);font-size:11px}
#add{all:unset;cursor:pointer;align-self:center;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--txt);margin-left:4px}#add:hover{background:rgba(255,160,70,.16)}
#pick{position:absolute;top:50px;right:10px;z-index:9;width:min(560px,94vw);max-height:70vh;overflow:auto;display:none;grid-template-columns:repeat(4,1fr);gap:8px;padding:14px;border-radius:20px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:0 20px 60px rgba(0,0,0,.45)}#pick.on{display:grid}
#pick button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:14px;border:1px solid var(--line);font-size:11px;font-weight:700;text-align:center}#pick button:hover{border-color:var(--acc)}#pick img{width:38px;height:38px;object-fit:contain}
#pick input{grid-column:1/-1;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.2);color:inherit;font:inherit}
#stage{position:absolute;inset:72px 0 0 0}body.nocrumb #stage{inset:46px 0 0 0}#stage.drag iframe{pointer-events:none}#stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg);visibility:hidden}#stage iframe.on{visibility:visible}
body.nocrumb #empty{inset:46px 0 0}#empty{position:absolute;inset:72px 0 0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:var(--dim)}#empty b{font:40px Astoria,serif;color:var(--acc)}
</style></head><body>
<div id="bar"><button id="home" title="Accueil SUITE XIII"><img src="logos/index.png" alt="" onerror="this.replaceWith(document.createTextNode('XIII'))"></button><button id="proj" title="Projet XIII en cours · changer, créer"><i></i><span></span>▾</button><div id="tabs"><span id="ind"></span></div><button id="net" title=""></button><button id="add" title="Nouvel onglet (Accueil) · clic droit : choisir un outil">＋</button></div>
<div id="crumb"></div><div id="pick"></div><div id="pmenu"></div><div id="prev"></div>
<div id="stage"><div id="sdiv"><button data-s="swap" title="Inverser les deux outils">⇄</button><button data-s="x" title="Fermer l'écran partagé">✕</button></div></div><div id="empty"><b>Espace onglets</b><span>＋ pour ouvrir un outil</span></div>
<script>
window.__xtshell = 1;
const T = { index: 'Accueil', moodo: 'MOODO', storyboardo: 'STORYBOARDO', decoup: 'DECOUP', scripto: 'SCRIPTO', casto: 'CASTO', planno: 'PLANNO', calendrier: 'CALENDRIER', callsheeto: 'CALL SHEETO', transporto: 'TRANSPORTO', deviso: 'DEVISO', ressourco: 'RESSOURCO', controle: 'CONTROLE', dossier: 'DOSSIER', repero: 'REPERO', cadro: 'CADRO', syno: 'SYNO', plano: 'PLANO', conduco: 'CONDUCO', graphico: 'GRAPHICO', melango: 'MELANGO', runo: 'RUNO', sono: 'SONO', lumo: 'LUMO', matos: 'MATOS', packingo: 'PACKINGO', posto: 'POSTO', soustitro: 'SOUSTITRO', backupo: 'BACKUPO', encodo: 'ENCODO' };
const $ = id => document.getElementById(id), K = 'xiii.tabs';
const appOf = u => (String(u).split(/[?#]/)[0].split('/').pop() || 'index').replace(/\.html$/, '') || 'index';
let S = (() => { try { return JSON.parse(localStorage.getItem(K)) || null; } catch (e) { return null; } })() || { list: [], act: null };
const save = () => { try { localStorage.setItem(K, JSON.stringify({ list: S.list.map(t => ({ id: t.id, url: t.url, ws: t.pin ? undefined : (t.ws || 'main'), ts: t.ts, anc: t.anc || undefined, pin: t.pin || undefined })), split: S.split || undefined, sw: S.sw || undefined, act: S.act })); } catch (e) { } };
const uid = () => Math.random().toString(36).slice(2, 9);
const KC = 'xiii.tabs.closed', closedL = () => { try { return JSON.parse(localStorage.getItem(KC)) || []; } catch (e) { return []; } };
const esc = x => String(x == null ? '' : x).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// ---- projets XIII (registre commun « xiii.ws », écrit aussi par les outils) ----
const RK = 'xiii.ws', PAL = ['#f0b429', '#4fc3f7', '#81c784', '#e57373', '#ba68c8', '#ff8a3d', '#4db6ac', '#f06292', '#9575cd', '#d4e157'];
const putReg = r => { try { localStorage.setItem(RK, JSON.stringify(r)); } catch (e) { } };
function reg() { let r = null; try { r = JSON.parse(localStorage.getItem(RK)); } catch (e) { } if (!r || !Array.isArray(r.list) || !r.list.length) { let n = 'Projet XIII'; try { const p = JSON.parse(localStorage.getItem('xiii.projets')), f = p && p.list && p.list.find(x => x && x.id === p.active); if (f && f.title) n = f.title; } catch (e) { } r = { list: [{ id: 'main', name: n, color: PAL[0], created: Date.now() }], cur: 'main' }; putReg(r); } return r; }
const wsm = i => { const r = reg(); return r.list.find(w => w.id === i) || r.list[0]; };
const wsOf = t => t.pin ? S.ws : (t.ws || 'main');
function setCur(i) { S.ws = i; const r = reg(); if (r.cur !== i) { r.cur = i; putReg(r); } }
function frame(t) { let f = $('f-' + t.id); if (!f) { f = document.createElement('iframe'); f.id = 'f-' + t.id; f.dataset.ws = wsOf(t); f.src = t.url; f.setAttribute('allow', 'clipboard-read; clipboard-write; camera; microphone; fullscreen; display-capture'); f.onload = () => hook(t, f); $('stage').appendChild(f); } return f; }
function hook(t, f) { try { const w = f.contentWindow; if (t.pin && !/^index\.html/.test(w.location.pathname.split('/').pop())) { const u = w.location.pathname.split('/').pop() + w.location.search; f.src = 'index.html'; open(u); return; } t.url = w.location.pathname.split('/').pop() + w.location.search; save(); draw();
    w.addEventListener('keydown', key, true); } catch (e) { } }
function reloadF(t) { const f = $('f-' + t.id); if (!f) return; f.dataset.ws = wsOf(t); try { f.contentWindow.location.reload(); } catch (e) { f.src = t.url; } }
function draw() {
    const cw = wsm(S.ws), pj = $('proj'); pj.style.setProperty('--pc', cw.color); pj.querySelector('span').textContent = cw.name; pj.title = 'Projet XIII en cours : ' + cw.name + ' · changer, créer';
    const box = $('tabs'); box.querySelectorAll('.t').forEach(x => x.remove());
    S.list.forEach((t, k) => { const a = appOf(t.url), b = document.createElement('button'); b.className = 't' + (t.id === S.act ? ' on' : '') + (t.pin ? ' pin' : '') + (t.anc ? ' anc' : '') + (t.id === S.split ? ' sp' : ''); b.dataset.id = t.id; b.draggable = !t.pin; b.title = (T[a] || a.toUpperCase()) + (k < 9 ? ' (Alt+' + (k + 1) + ')' : '');
        b.innerHTML = '<img src="logos/' + a + '.png?v=3" alt="" onerror="this.style.visibility=\'hidden\'"><span>' + (T[a] || a.toUpperCase()) + '</span>' + (t.pin ? '' : '<button class="x" title="Fermer (clic molette)">✕</button>') + '<i></i><em></em><b></b>';
        const w = wsm(wsOf(t)); b.style.setProperty('--pc', w.color); b.title = (t.pin ? 'Accueil (toujours ouvert)' : b.title) + ' · Projet : ' + w.name; b.oncontextmenu = e => { e.preventDefault(); hidePrev(); pmenu(e.clientX, e.clientY, t); }; b.onmouseenter = () => prevSoon(t, b); b.onmouseleave = hidePrev; b.onclick = e => { if (e.target.classList.contains('x')) { e.stopPropagation(); close(t.id); } else show(t.id); };
        b.onauxclick = e => { if (e.button === 1) { e.preventDefault(); if (!t.pin) close(t.id); } };
        b.ondragstart = e => { e.dataTransfer.setData('text/xt', t.id); b.classList.add('drag'); }; b.ondragend = () => b.classList.remove('drag');
        b.ondragover = e => e.preventDefault(); b.ondrop = e => { e.preventDefault(); const from = e.dataTransfer.getData('text/xt'); if (!from || from === t.id) return; const i = S.list.findIndex(x => x.id === from), it = S.list.splice(i, 1)[0], r = b.getBoundingClientRect(); let j = S.list.findIndex(x => x.id === t.id); if (e.clientX > r.left + r.width / 2 || t.pin) j++; S.list.splice(j, 0, it); save(); draw(); };
        box.appendChild(b); });
    $('empty').style.display = S.list.length ? 'none' : 'flex'; busy(); states(); crumb(); requestAnimationFrame(place);
}
function place() { const b = $('tabs').querySelector('.t.on'), i = $('ind'); if (!b) { i.style.width = 0; return; } i.style.left = b.offsetLeft + 'px'; i.style.width = b.offsetWidth + 'px'; b.scrollIntoView({ block: 'nearest', inline: 'nearest' }); }
function show(id) { const t = S.list.find(x => x.id === id); if (!t) return; if (!t.pin) { if ((t.ws || 'main') !== S.ws) setCur(t.ws || 'main'); t.ts = Date.now(); } if (S.split === id) S.split = S.act; S.act = id; save(); const f = frame(t); if (t.pin && f.dataset.ws !== S.ws) reloadF(t); layout(); save(); draw(); try { f.contentWindow.focus(); } catch (e) { } document.title = (T[appOf(t.url)] || 'SUITE') + ' — SUITE XIII'; }
function open(url, bg, ws) { ws = ws || S.ws; const a = appOf(url), ex = S.list.find(x => !x.pin && appOf(x.url) === a && (x.ws || 'main') === ws && !/#/.test(url)); if (ex && a !== 'index') { if (!bg) show(ex.id); return; } const t = { id: uid(), url, ws }; const i = S.list.findIndex(x => x.id === S.act); S.list.splice(i + 1, 0, t); save(); if (bg) { frame(t); draw(); } else show(t.id); }
function close(id) { const i = S.list.findIndex(x => x.id === id); if (i < 0 || S.list[i].pin) return; const c = S.list[i]; try { const L = closedL().filter(x => x.url !== c.url || x.ws !== c.ws); L.unshift({ url: c.url, ws: c.ws || 'main', at: Date.now() }); localStorage.setItem(KC, JSON.stringify(L.slice(0, 10))); } catch (e) { } if (S.split === id) S.split = null; S.list.splice(i, 1); const f = $('f-' + id); if (f) f.remove(); if (S.act === id) { const n = (S.split && S.list.find(x => x.id === S.split)) || S.list[i] || S.list[i - 1]; S.act = n ? n.id : null; save(); if (n) show(n.id); else draw(); } else { save(); layout(); draw(); } }
function step(d) { const i = S.list.findIndex(x => x.id === S.act); if (S.list.length) show(S.list[(i + d + S.list.length) % S.list.length].id); }
function key(e) { if ((e.ctrlKey && e.key === 'Tab')) { e.preventDefault(); step(e.shiftKey ? -1 : 1); }
    else if (e.altKey && /^[1-9]$/.test(e.key)) { const t = S.list[+e.key - 1]; if (t) { e.preventDefault(); show(t.id); } }
    else if (e.altKey && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) { e.preventDefault(); step(e.key === 'ArrowRight' ? 1 : -1); }
    else if (e.altKey && e.shiftKey && e.key.toLowerCase() === 't') { e.preventDefault(); reopen(0); }
    else if (e.altKey && e.key.toLowerCase() === 'w') { e.preventDefault(); if (S.act) close(S.act); }
    else if ((e.ctrlKey || e.metaKey) && !e.altKey && !e.shiftKey && e.key.toLowerCase() === 'k' && e.currentTarget === window) { e.preventDefault(); palette(); } }
addEventListener('keydown', key, true);
function busy() { let j = null; try { j = JSON.parse(localStorage.getItem('xiii.encodo.job')); } catch (e) { } const on = j && j.name && !j.done && Date.now() - (j.ts || Date.now()) < 6e5; document.querySelectorAll('.t').forEach(b => { const t = S.list.find(x => x.id === b.dataset.id); b.classList.toggle('busy', !!(on && t && appOf(t.url) === 'encodo')); }); }
setInterval(busy, 3000); addEventListener('storage', e => { if (e.key === 'xiii.encodo.job') busy(); if (e.key === RK) onReg(); });
addEventListener('message', e => { if (e.origin !== location.origin || !e.data || !e.data.xtab) return; const d = e.data.xtab, st = srcTab(e.source); if (d.open) open(d.open, d.bg, st ? wsOf(st) : S.ws); if (d.ws && reg().list.some(w => w.id === d.ws)) moveTab(st || S.list.find(x => x.id === S.act), d.ws); if (d.close && S.act) close(S.act); if (d.nav) { const t = S.list.find(x => x.id === S.act); if (t && !t.pin) { t.url = d.nav; save(); } } });
// sélecteur d'outil
