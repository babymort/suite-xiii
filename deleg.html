<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUITE XIII - Travail partagé</title>
<style>
:root { color-scheme: dark; }
body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #1d1b19; color: #eee; font: 15px/1.55 "Segoe UI", system-ui, sans-serif; padding: 16px; box-sizing: border-box; }
.box { width: min(560px, 100%); background: #26241f; border: 1px solid rgba(240,179,120,.55); border-radius: 14px; padding: 22px 24px; box-shadow: 0 18px 50px rgba(0,0,0,.5); }
.logo { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: 3px; font-size: 13px; color: #f0b378; margin-bottom: 14px; }
.logo img { width: 38px; }
h1 { font-size: 20px; margin: 0 0 8px; }
.q { margin: 12px 0; padding: 10px 14px; border-left: 3px solid #f0b378; background: rgba(240,179,120,.08); border-radius: 0 8px 8px 0; white-space: pre-line; }
.dim { color: #a9a49c; font-size: 13px; }
button { font: inherit; font-weight: 700; color: #1d1b19; background: #f0b378; border: 0; border-radius: 10px; padding: 11px 18px; cursor: pointer; margin-top: 12px; }
.err { color: #ffb74d; }
</style>
<link rel="icon" type="image/png" href="xiii-icon-192.png">
</head>
<body>
<div class="box" id="box"><div class="logo"><img src="xiii-logo.png" alt="">SUITE XIII</div><p class="dim">Lecture du lien…</p></div>
<script>
(async function () {
    const NAMES = { backupo: 'BACKUPO', callsheeto: 'CALL SHEETO', casto: 'CASTO', conduco: 'CONDUCO', decoup: 'DECOUP', deviso: 'DEVISO', graphico: 'GRAPHICO', lumo: 'LUMO', moodo: 'MOODO', packingo: 'PACKINGO', planno: 'PLANNO', plano: 'PLANO', posto: 'POSTO', repero: 'REPERO', ressourco: 'RESSOURCO', runo: 'RUNO', scripto: 'SCRIPTO', sono: 'SONO', soustitro: 'SOUSTITRO', storyboardo: 'STORYBOARDO', syno: 'SYNO', transporto: 'TRANSPORTO' };
    const box = document.getElementById('box'), esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const head = '<div class="logo"><img src="xiii-logo.png" alt="">SUITE XIII</div>';
    const fmt = ts => { const d = new Date(ts); return d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' }) + ' à ' + d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }); };
    const fail = m => { box.innerHTML = head + '<h1>Lien illisible</h1><p class="err">' + esc(m) + '</p><p class="dim">Le lien a peut-être été coupé par la messagerie : demandez à l\'expéditeur de vous le renvoyer, ou copiez-le en entier dans la barre d\'adresse.</p>'; };
    const unb = s => { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; };
    async function unpack(s) { const t = s.slice(0, 2), u = unb(s.slice(2)); if (t === 'j.') return JSON.parse(new TextDecoder().decode(u)); const st = new Blob([u]).stream().pipeThrough(new DecompressionStream('deflate-raw')); return JSON.parse(await new Response(st).text()); }
    const m = /^#([ir])=(.+)$/.exec(location.hash || '');
    if (!m) return fail('Aucun travail dans ce lien.');
    let p; try { p = await unpack(decodeURIComponent(m[2])); } catch (e) { return fail('Contenu incomplet ou abîmé.'); }
    if (!p || !p.app || !NAMES[p.app]) return fail('Outil inconnu.');
    const tool = NAMES[p.app], go = () => { try { localStorage.setItem('xiii.deleg.inbox', JSON.stringify(p)); } catch (e) { return fail('Stockage du navigateur indisponible (navigation privée ?).'); } location.href = p.app + '.html?desktop=1'; };
    if (p.t === 'i') {
        box.innerHTML = head + '<h1>🤝 ' + esc(p.master && (p.master.name || p.master.email) || 'La production') + ' vous demande de compléter ' + tool + '</h1>' + (p.proj ? '<p><b>Projet :</b> ' + esc(p.proj) + '</p>' : '') + (p.scope ? '<p><b>Partie à compléter :</b> ' + esc(p.scope.label) + '</p>' : '') + (p.msg ? '<div class="q">' + esc(p.msg) + '</div>' : '') +
            '<p class="dim">L\'outil s\'ouvre dans votre navigateur, rien n\'est envoyé sur un serveur. Quand vous avez fini, cliquez sur « 📤 Renvoyer au Master » : un e-mail se prépare avec votre travail. Gardez ce lien : il vous permet de reprendre et de renvoyer une nouvelle version.</p><button id="go">Ouvrir ' + tool + '</button>';
    } else {
        box.innerHTML = head + '<h1>📥 Travail reçu : ' + tool + '</h1><p><b>De :</b> ' + esc(p.from && (p.from.name || p.from.email) || 'un membre de l\'équipe') + (p.proj ? '<br><b>Projet :</b> ' + esc(p.proj) : '') + '<br><b>Version du</b> ' + fmt(p.ts) + '</p>' +
            '<p class="dim">' + tool + ' va s\'ouvrir et vous proposer d\'importer ce travail dans votre projet, en comparant sa date avec la dernière version importée.</p><button id="go">Ouvrir dans ' + tool + '</button>';
    }
    document.getElementById('go').onclick = go;
})();
</script>
<script>
// 📱 XIII Équipe : une fois dans l'application, on y reste (l'accueil ramène à l'application, pas au site)
(function () {
    if (window.__xinapp) return; window.__xinapp = 1;
    var page = (location.pathname.split('/').pop() || 'index.html').toLowerCase();
    try { if (page === 'equipe.html' && (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (window.matchMedia && matchMedia('(display-mode: standalone)').matches))) sessionStorage.setItem('xiii.inapp', '1'); } catch (e) { }
    function inApp() { try { return sessionStorage.getItem('xiii.inapp') === '1'; } catch (e) { return false; } }
    if (!inApp()) return;
    if (page === 'index.html' || page === '') { location.replace('equipe.html'); return; }
    document.addEventListener('click', function (e) {
        var a = e.target.closest && e.target.closest('a[href]'); if (!a) return;
        var u; try { u = new URL(a.getAttribute('href'), location.href); } catch (er) { return; }
        if (u.origin !== location.origin) return;
        var f = (u.pathname.split('/').pop() || 'index.html').toLowerCase();
        if (f === 'index.html' || f === '') { e.preventDefault(); e.stopPropagation(); location.href = 'equipe.html'; return; }
        if (a.target === '_blank') { a.removeAttribute('target'); }
    }, true);
})();
</script>
</body>
</html>
