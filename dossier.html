            const e = r.e; target = e.page; pnum = target != null ? pageLabel(target) : '';
            const isP = r.kind === 'person';
            const size = isP ? 9.5 : 10.5, font = isP ? F.i : F.r;
            const x0 = M.left + 30 + (isP ? 14 : 0);
            let tx = x0;
            if (!isP && e.num) { pg.drawText(T(e.num), { x: x0, y: y - size - 3, size: 9, font: F.hb, color: C.muted }); tx = x0 + Math.max(30, tw(T(e.num), F.hb, 9) + 10); }
            const pw = pnum ? tw(pnum, F.r, 10) : 0;
            const t = fitText(isP ? e.title : e.s.title, font, size, right - tx - pw - 26);
            pg.drawText(t, { x: tx, y: y - size - 3, size, font, color: isP ? C.muted : C.ink });
            const dotsX = tx + tw(t, font, size) + 6, dotsEnd = right - pw - 6;
            for (let x = dotsX; x < dotsEnd; x += 4) pg.drawCircle({ x, y: y - size - 1.5, size: 0.45, color: C.rule });
            if (pnum) pg.drawText(pnum, { x: right - pw, y: y - size - 3, size: 10, font: F.r, color: C.ink });
            if (target != null) addLink(pg, [x0, y - h + 1, right, y + 1], doc.getPage(target));
            y -= h;
        });
    });

    // ---------- Décor des pages : en-têtes, pieds, onglets, filigrane ----------
    const N = doc.getPageCount();
    for (let i = 0; i < N; i++) {
        const pg = doc.getPage(i), m = meta[i] || { kind: 'imported' };
        const { width: w, height: h } = pg.getSize();
        const rot = (pg.getRotation() || { angle: 0 }).angle % 360;
        if (m.kind === 'cover') continue;
        if (m.kind === 'toc' || m.kind === 'gen') {
            if (d.headers) {
                drawSpaced(pg, fitText(headTitle, F.hr, 7, w / 2 - M.left - 10), { x: M.left, y: h - 40, size: 7, font: F.hr, color: C.muted, sp: 1 });
                const ct = fitText((m.chap || '').toUpperCase(), F.hr, 7, w / 2 - M.right - 10);
                drawSpaced(pg, ct, { x: w - M.right - spacedW(ct, F.hr, 7, 1), y: h - 40, size: 7, font: F.hr, color: C.muted, sp: 1 });
                pg.drawLine({ start: { x: M.left, y: h - 48 }, end: { x: w - M.right, y: h - 48 }, thickness: 0.4, color: C.rule });
                const foot = T([cv.production, cv.subtitle || TEMPLATES[p.type].label].filter(Boolean).join('  ·  '));
                pg.drawText(fitText(foot, F.hr, 7, w - M.left - M.right - 80), { x: M.left, y: 34, size: 7, font: F.hr, color: C.muted });
                const pn = String(i + 1), pt = ' / ' + N;
                pg.drawRectangle({ x: w - M.right - tw(pn, F.hb, 9) - tw(pt, F.hr, 7) - 10, y: 34, width: 4, height: 4, color: C.accent });
                pg.drawText(pn, { x: w - M.right - tw(pn, F.hb, 9) - tw(pt, F.hr, 7), y: 33, size: 9, font: F.hb, color: C.ink });
                pg.drawText(pt, { x: w - M.right - tw(pt, F.hr, 7), y: 33, size: 7, font: F.hr, color: C.muted });
            } else {
                const pn = String(i + 1); pg.drawText(pn, { x: (w - tw(pn, F.hr, 9)) / 2, y: 30, size: 9, font: F.hr, color: C.muted });
            }
        } else if (m.kind === 'divider') {
            const pn = String(i + 1); pg.drawText(pn, { x: w - M.right - tw(pn, F.hr, 9), y: 34, size: 9, font: F.hr, color: C.dText, opacity: 0.55 });
        } else if (m.kind === 'imported' && d.numberImported && rot === 0) {
            const pn = String(i + 1);
            const bw = tw(pn, F.hb, 8) + 14;
            pg.drawRectangle({ x: w - bw - 14, y: 10, width: bw, height: 15, color: C.white, opacity: 0.92, borderColor: C.accent, borderWidth: 0.8 });
            pg.drawText(pn, { x: w - bw - 7, y: 14.5, size: 8, font: F.hb, color: C.ink });
            if (m.secNum || m.secTitle) {
                const tabH = 70, ty = h - 90 - ((m.chapIdx || 0) % 7) * (tabH + 6);
                pg.drawRectangle({ x: w - 11, y: ty - tabH, width: 11, height: tabH, color: C.accent, opacity: 0.95 });
                const lab = fitText(m.secNum || '', F.hb, 7, tabH - 8);
                if (lab) pg.drawText(lab, { x: w - 3, y: ty - tabH + (tabH - tw(lab, F.hb, 7)) / 2, size: 7, font: F.hb, color: th.accent.toLowerCase() === '#161616' ? C.white : C.ink, rotate: degrees(90) });
            }
        }
        if (d.watermark && m.kind !== 'cover') {
            const wm = T(d.watermark.toUpperCase()); const s = Math.min(90, (Math.hypot(w, h) * 0.7) / Math.max(1, tw(wm, F.hb, 1)));
            const ww = tw(wm, F.hb, s);
            pg.drawText(wm, { x: w / 2 - ww / 2 * Math.cos(Math.PI / 4) + s * 0.35 * Math.sin(Math.PI / 4), y: h / 2 - ww / 2 * Math.sin(Math.PI / 4) - s * 0.35 * Math.cos(Math.PI / 4), size: s, font: F.hb, color: L.rgb(0.5, 0.5, 0.5), opacity: 0.08, rotate: degrees(45) });
        }
    }

    // ---------- Signets ----------
    try { buildOutline(doc, L, [...(tocPages.length ? [{ title: 'Sommaire', page: 1, children: [] }] : []), ...outline]); } catch (e) { console.warn('outline', e); }

    step('Enregistrement du PDF…', 0.97);
    const bytes = await doc.save({ useObjectStreams: true });
    return { bytes, pages: N, warnings };

    // =================== sous-fonctions (hissées) ===================
    async function drawCover() {
        const pg = doc.addPage([PW, PH]); meta.push({ kind: 'cover' });
        pg.drawRectangle({ x: 0, y: 0, width: PW, height: PH, color: C.cover });
        let vis = null, logo = null;
        if (cv.visual) { const rec = await DB.get('files', cv.visual); if (rec) vis = await embedImgRaw(rec.blob); }
        if (cv.logo) { const rec = await DB.get('files', cv.logo); if (rec) logo = await embedImgRaw(rec.blob); }
        const X = 60, CW = PW - 120;
        let y;
        if (vis) {
            const bandH = PH * 0.5, by = PH - bandH;
            const s = Math.max(PW / vis.width, bandH / vis.height), w = vis.width * s, h = vis.height * s;
            pg.pushOperators(pushGraphicsState(), rectangle(0, by, PW, bandH), clip(), endPath());
            pg.drawImage(vis, { x: (PW - w) / 2, y: by + (bandH - h) / 2, width: w, height: h });
            pg.pushOperators(popGraphicsState());
            pg.drawRectangle({ x: 0, y: by - 6, width: PW, height: 6, color: C.accent });
            y = by - 52;
        } else {
            pg.drawRectangle({ x: 0, y: PH - 8, width: PW, height: 8, color: C.accent });
            y = PH * 0.64;
        }
        if (cv.mention) {
            const my = vis ? y : PH - 70;
            drawSpaced(pg, fitText(cv.mention.toUpperCase(), F.hb, 8, CW - (logo && !vis ? 140 : 0)), { x: X, y: my, size: 8, font: F.hb, color: C.accent, sp: 1.8 });
            if (vis) y -= 26;
        }
        if (logo) {
            const s = Math.min(130 / logo.width, 64 / logo.height), w = logo.width * s, h = logo.height * s;
            if (vis) pg.drawImage(logo, { x: PW - 60 - w, y: 44, width: w, height: h });
            else pg.drawImage(logo, { x: PW - 60 - w, y: PH - 60 - h, width: w, height: h });
        }
        const type = (cv.subtitle || TEMPLATES[p.type].label).toUpperCase();
        const blockTop = y;
        drawSpaced(pg, fitText(type, F.hb, 11, CW), { x: X, y, size: 11, font: F.hb, color: C.accent, sp: 2.4 }); y -= 18;
        const ttl = cv.title || p.name;
        const ts = ttl.length > 42 ? 28 : ttl.length > 24 ? 34 : 40;
        wrapPlain(ttl, F.b, ts, CW).slice(0, 4).forEach(ln => { y -= ts * 1.02; pg.drawText(ln, { x: X, y, size: ts, font: F.b, color: C.coverText }); });
        if (!vis) pg.drawRectangle({ x: X - 22, y: y - 6, width: 4, height: blockTop - y + 18, color: C.accent });
        y -= 34;
        const info = [['Production', cv.production], ['Réalisation', cv.realisation], ['Producteur·rice', cv.producteur], ['Durée / format', cv.duree], ['Diffuseur', cv.diffuseur], ['Tournage', cv.dates], ['Lieu', cv.lieu]].filter(x => x[1]);
        const colW = CW / 2;
        info.forEach((x, k) => {
            const cx = X + (k % 2) * colW, cy = y - Math.floor(k / 2) * 38;
            if (cy < 90) return;
            drawSpaced(pg, x[0].toUpperCase(), { x: cx, y: cy, size: 7, font: F.hb, color: C.accent, sp: 1.4 });
            pg.drawText(fitText(x[1], F.r, 11.5, colW - 14), { x: cx, y: cy - 15, size: 11.5, font: F.r, color: C.coverText });
        });
        const foot = [cv.version, cv.contact].filter(Boolean).join('   ·   ');
        if (foot) pg.drawText(fitText(foot, F.r, 8, CW - (logo && vis ? 150 : 0)), { x: X, y: 48, size: 8, font: F.r, color: C.coverText, opacity: 0.62 });
    }
    async function embedImgRaw(blob) { try { const pi = await prepImage(blob); return pi.type === 'png' ? await doc.embedPng(pi.bytes) : await doc.embedJpg(pi.bytes); } catch (e) { return null; } }
    function drawDivider(c) {
        const pg = doc.addPage([PW, PH]); meta.push({ kind: 'divider', chap: c.ch.title });
        pg.drawRectangle({ x: 0, y: 0, width: PW, height: PH, color: C.divider });
        pg.drawRectangle({ x: 0, y: 0, width: 10, height: PH, color: C.accent });
        let y = PH * 0.62;
        if (c.num && d.bigNum) { const big = PH * 0.62, tx = pad2(c.num); pg.drawText(tx, { x: 18, y: PH * 0.5 - big * 0.36, size: big, font: F.hb, color: C.accent, opacity: 0.75 }); y -= 40; } // 🔢 style graphique : numéro géant derrière le titre
        else if (c.num) { pg.drawText(pad2(c.num), { x: 70, y, size: 110, font: F.hb, color: C.accent }); y -= 40; }

        wrapPlain(c.ch.title, F.b, 32, PW - 140).forEach(ln => { y -= 36; pg.drawText(ln, { x: 70, y, size: 32, font: F.b, color: C.dText }); });
        y -= 20; pg.drawRectangle({ x: 70, y, width: 44, height: 3, color: C.accent }); y -= 34;
        c.entries.slice(0, 22).forEach(e => {
            const lab = e.type === 'person' ? e.title : e.s.title;
            if (e.type !== 'person' && e.num) pg.drawText(T(e.num), { x: 70, y, size: 9.5, font: F.hb, color: C.accent });
            pg.drawText(fitText(lab, F.r, 11, PW - 200), { x: 116, y, size: 11, font: F.r, color: C.dText, opacity: 0.88 }); y -= 19;
        });
        if (c.entries.length > 22) pg.drawText('…', { x: 116, y, size: 11, font: F.r, color: C.dText });
        drawSpaced(pg, fitText(headTitle, F.hr, 7, PW - 200), { x: 70, y: 34, size: 7, font: F.hr, color: C.dText, sp: 1, opacity: 0.55 });
    }
    function buildOutline(doc, L, items) {
        const ctx = doc.context;
        items = items.filter(it => it.page != null);
        if (!items.length) return;
        const rootRef = ctx.nextRef();
        const make = (list, parentRef, openLevel) => {
            list = list.filter(it => it.page != null);
            const refs = list.map(() => ctx.nextRef());
            let visible = 0;
            list.forEach((it, i) => {
                const dict = { Title: PDFHexString.fromText(T(it.title) || '—'), Parent: parentRef, Dest: [doc.getPage(Math.min(it.page, doc.getPageCount() - 1)).ref, 'XYZ', null, null, null] };
                if (i > 0) dict.Prev = refs[i - 1];
                if (i < list.length - 1) dict.Next = refs[i + 1];
                const kids = (it.children || []).filter(k => k.page != null);
                if (kids.length) { const r = make(kids, refs[i], openLevel - 1); dict.First = r.refs[0]; dict.Last = r.refs[r.refs.length - 1]; dict.Count = openLevel > 0 ? r.visible : -r.refs.length; if (openLevel > 0) visible += r.visible; }
                ctx.assign(refs[i], ctx.obj(dict));
                visible++;
            });
            return { refs, visible };
        };
        const r = make(items, rootRef, 1);
        ctx.assign(rootRef, ctx.obj({ Type: 'Outlines', First: r.refs[0], Last: r.refs[r.refs.length - 1], Count: r.visible }));
        doc.catalog.set(PDFName.of('Outlines'), rootRef);
        doc.catalog.set(PDFName.of('PageMode'), PDFName.of('UseOutlines'));
    }
}

// =====================================================================
//  LANCEMENT DE LA GÉNÉRATION (fenêtre de progression + aperçu)
// =====================================================================
let lastPdfUrl = null;
async function startGenerate() {
    await saveProject(false);
    const st = stats();
    if (!st.inc) { toast('Aucun élément inclus dans le dossier'); return; }
    const o = modal('<h3>📕 Génération du dossier</h3><div id="gen-t" style="font-size:13px;">Préparation…</div><div class="gen-bar"><div id="gen-b"></div></div><div class="gen-steps" id="gen-log"></div>', 'wide');
    o.dataset.lock = '1';
    const log = [];
    const onStep = (t, f) => { $('gen-t').textContent = t; $('gen-b').style.width = Math.round(f * 100) + '%'; log.push(t); const lg = $('gen-log'); lg.textContent = log.slice(-60).join('\n'); lg.scrollTop = lg.scrollHeight; };
    try {
        const t0 = Date.now();
        const res = await buildDossierPdf(P, onStep);
        const blob = new Blob([res.bytes], { type: 'application/pdf' });
        if (lastPdfUrl) URL.revokeObjectURL(lastPdfUrl);
        lastPdfUrl = URL.createObjectURL(blob);
        const fname = safeName((P.cover.title || P.name)) + '_' + safeName(TEMPLATES[P.type].short) + '_' + ({ client: 'Client', tech: 'Technique' }[window.XDOSS_VERS] || 'Full') + '_' + todayISO() + '.pdf';
        delete o.dataset.lock; closeModal();
        modal('<h3>📕 ' + esc(P.cover.title || P.name) + ' — ' + plural(res.pages, 'page') + ' · ' + fmtSize(blob.size) + '<span class="close-x" onclick="closeModal()">✕</span></h3>' +
            (res.warnings.length ? '<div class="alerts" style="margin-bottom:10px;">' + [...new Set(res.warnings)].map(w => '<div class="alert">⚠️ ' + esc(w) + '</div>').join('') + '</div>' : '') +
            '<iframe class="pdf-frame" src="' + lastPdfUrl + '#view=FitH"></iframe>' +
            '<div class="mb-actions"><span class="hint" style="margin-right:auto;align-self:center;">Généré en ' + Math.max(1, Math.round((Date.now() - t0) / 1000)) + ' s · rien n\'a quitté votre ordinateur.</span><button onclick="window.open(lastPdfUrl, \'_blank\')">↗ Ouvrir dans un onglet</button><button class="btn-big" id="gen-dl">⬇️ Télécharger le PDF</button></div>', 'xwide');
        $('gen-dl').onclick = () => download(blob, fname);
    } catch (e) {
        console.error(e);
        delete o.dataset.lock; closeModal();
        modal('<h3>⚠️ Génération impossible<span class="close-x" onclick="closeModal()">✕</span></h3><p>' + esc(e && e.message ? e.message : String(e)) + '</p><p class="hint">Vérifiez votre connexion internet (les modules PDF sont chargés à la demande), puis réessayez. Si un document pose problème, retirez-le ou réexportez-le en PDF.</p><div class="mb-actions"><button onclick="closeModal()">Fermer</button></div>');
    }
}

init();
</script>

<script>
// =====================================================================
//  → DEVISO XIII : fenêtre d'envoi commune (PACKINGO, CALL SHEETO, CONDUCO)
//  cfg = { title, rows: [[libellé, valeur]], note, file, make: () => payload | null, empty }
// =====================================================================
function xiiiToDeviso(cfg) {
    const old = document.getElementById('xd-send'); if (old) old.remove();
    const E = XIII.esc, o = document.createElement('div'); o.id = 'xd-send';
    o.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.65);z-index:10050;display:flex;align-items:center;justify-content:center;';
    const btnA = 'border-color:rgba(var(--accent,240,179,120),.85);background:rgba(var(--accent,240,179,120),.28);';
    const say = (m, ms) => { try { if (typeof toast === 'function') { toast(m, ms); return; } } catch (e) { } XProj.toast(m, ms); };
    const draw = () => {
        o.innerHTML = '<div style="background:var(--bg-menu,#2d2d2d);color:var(--text-main,#fff);width:560px;max-width:94vw;max-height:88vh;overflow-y:auto;border-radius:8px;border:1px solid var(--border-color,#444);padding:20px;box-shadow:0 4px 15px rgba(0,0,0,.5);font-size:13px;">' +
            '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;border-bottom:1px solid var(--border-color,#444);padding-bottom:8px;"><b style="font-size:15px;">💶 ' + E(cfg.title) + '</b><span id="xd-x" style="cursor:pointer;font-weight:bold;color:var(--text-muted,#aaa);padding:0 4px;">✕</span></div>' +
            (cfg.options ? '<div style="display:flex;flex-direction:column;gap:6px;margin-bottom:12px;">' + cfg.options() + '</div>' : '') +
            '<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;padding:10px 12px;border:1px solid var(--border-color,#444);border-radius:6px;background:var(--bg-panel-alt,#252525);margin-bottom:14px;">' +
            cfg.rows().map(([k, v]) => '<div><div style="font-size:10.5px;color:var(--text-dim,#888);text-transform:uppercase;letter-spacing:.04em;">' + E(k) + '</div><div>' + E(String(v)) + '</div></div>').join('') + '</div>' +
            '<div style="display:flex;gap:8px;flex-wrap:wrap;"><button id="xd-go" style="flex:2;padding:10px;font-size:13.5px;' + btnA + '">💶 Envoyer vers DEVISO XIII</button><button id="xd-file" style="flex:1;padding:10px;" title="Fichier Suite XIII à importer dans DEVISO XIII (📥 Importer), à transmettre ou archiver">⬇️ Fichier Suite XIII</button></div>' +
            '<p style="font-size:11px;color:var(--text-dim,#888);margin:12px 0 0;line-height:1.45;">' + cfg.note + '</p></div>';
        o.querySelector('#xd-x').onclick = () => o.remove();
        o.querySelectorAll('[data-xd]').forEach(el => el.onchange = () => { cfg.onOpt && cfg.onOpt(el); draw(); });
        o.querySelector('#xd-file').onclick = () => { const d = cfg.make(); if (!d) { o.remove(); say(cfg.empty); return; } d.id = XIII.id(); XIII.dl(new Blob([JSON.stringify(d)], { type: 'application/json' }), cfg.file(d) + '.xiii.json'); o.remove(); say('⬇️ Fichier Suite XIII téléchargé : importez-le dans DEVISO XIII (📥 Importer)'); };
        o.querySelector('#xd-go').onclick = () => {
            const d = cfg.make(); if (!d) { o.remove(); say(cfg.empty); return; }
            d.id = XIII.id(); d.to = 'deviso';
            try {
                let box = []; try { box = JSON.parse(localStorage.getItem('xiii.link.outbox')) || []; } catch (e) { box = []; }
                const week = 7 * 24 * 3600 * 1000;
                box = box.filter(x => x && Date.now() - (x.ts || 0) < week && !(x.to === d.to && x.from === d.from && x.kind === d.kind)).slice(-8);
                box.push(d); localStorage.setItem('xiii.link.outbox', JSON.stringify(box));
            } catch (e) { o.remove(); say('⚠️ Envoi direct impossible : utilisez « ⬇️ Fichier Suite XIII »'); return; }
            const w = window.open('deviso.html#xlink=' + d.id, '_blank'); o.remove();
            if (!w) say('Prêt : ouvrez DEVISO XIII, l\'envoi vous sera proposé (📥 Importer)', 6000);
        };
    };
    o.addEventListener('mousedown', e => { if (e.target === o) o.remove(); });
    document.body.appendChild(o); draw();
}

// =====================================================================
//  DOSSIER XIII → DEVISO XIII : l'équipe du dossier chiffrée
// =====================================================================
function xdTeamPayload() {
    const DEPT = { production: 'prod', technicien: '', artiste: 'cast', animateur: 'cast', auteur: 'real' };
    const people = P.team.filter(m => String(m.name || m.role || '').trim()).map(m => ({ name: String(m.name || '').trim(), role: String(m.role || '').trim(), dept: DEPT[m.cat] || '', phone: m.phone || '', email: m.email || '' }));
    if (!people.length) return null;
    let fiche; try { fiche = XProj.current() || undefined; } catch (e) { }
    return { format: 'xiii-link', version: 1, kind: 'crew', from: 'dossier', app: 'DOSSIER XIII', ts: Date.now(), created: new Date().toISOString(), project: { name: P.name || '' }, people, fiche };
}
function openSendTeamToDeviso() {
    xiiiToDeviso({ title: 'Chiffrer l\'équipe — DEVISO XIII', empty: 'Aucune personne dans l\'équipe du dossier',
        rows: () => { const d = xdTeamPayload() || { people: [] }; return [['Dossier', P.name || '—'], ['Personnes', d.people.length], ['Avec fonction', d.people.filter(x => x.role).length], ['Sans fonction', d.people.filter(x => !x.role).length]]; },
        note: 'Chaque personne arrive avec sa fonction, rattachée à la grille de salaires du secteur (minimum conventionnel, usage, charges). Précisez le nombre de jours dans DEVISO. Renvoyez après modification : l\'équipe reçue de DOSSIER est remplacée.',
        file: d => 'Equipe_' + XIII.safe(d.project.name || 'dossier'), make: xdTeamPayload });
}
(function () {
    const rc = renderContent;
    renderContent = function () {
        const r = rc.apply(this, arguments);
        const g = document.querySelector('.sec-tools #tm-push');
        if (g && !document.getElementById('tm-deviso')) { const b = document.createElement('button'); b.id = 'tm-deviso'; b.textContent = '💶 Chiffrer (DEVISO)'; b.title = 'Estimer salaires et charges de l\'équipe dans DEVISO XIII (grilles du secteur)'; b.onclick = openSendTeamToDeviso; g.parentNode.insertBefore(b, g.nextSibling); }
        return r;
    };
    try { renderContent(); } catch (e) { }
})();

<script>
// =====================================================================
//  → RESSOURCO XIII : fenêtre d'envoi commune (PACKINGO, CALL SHEETO, CONDUCO)
//  cfg = { title, rows: [[libellé, valeur]], note, file, make: () => payload | null, empty }
// =====================================================================
function xiiiToRessourco(cfg) {
    const old = document.getElementById('xr-send'); if (old) old.remove();
    const E = XIII.esc, o = document.createElement('div'); o.id = 'xr-send';
    o.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.65);z-index:10050;display:flex;align-items:center;justify-content:center;';
    const btnA = 'border-color:rgba(var(--accent,240,179,120),.85);background:rgba(var(--accent,240,179,120),.28);';
