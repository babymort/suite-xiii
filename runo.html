<style>

:root {
    color-scheme: dark;
    --bg-main: #1e1e1e; --bg-panel: #2d2d2d; --bg-panel-alt: #252525; --bg-header: #1a1a1a; --bg-topbar: #222;
    --bg-input: #444; --bg-menu: #2d2d2d; --border-color: #444; --border-soft: #333;
    --text-main: #ffffff; --text-muted: #aaaaaa; --text-dim: #888888;
    --lib-item-bg: #333; --lib-item-border: #444; --tab-bg: #333;
    --row-bg: #262626; --row-alt: #2a2a2a; --row-hover: #303030;
    --accent: 240, 179, 120; --accent-text: rgb(240,179,120);
    --btn-bg: rgba(var(--accent), 0.12); --btn-bg-hover: rgba(var(--accent), 0.24);
    --btn-border: rgba(var(--accent), 0.35); --btn-border-hover: rgba(var(--accent), 0.7);
    --btn-bg-active: rgba(var(--accent), 0.4); --btn-border-active: rgba(var(--accent), 0.95);
    --blue: #007acc; --danger: #e53935; --warn: #ffa726; --ok: #66bb6a;
    --wm: rgba(255,255,255,0.25); --wm2: rgba(255,255,255,0.15);
}
body.light-theme {
    color-scheme: light;
    --bg-main: #eef0f2; --bg-panel: #ffffff; --bg-panel-alt: #f5f6f7; --bg-header: #e4e6e8; --bg-topbar: #ffffff;
    --bg-input: #e4e6e8; --bg-menu: #ffffff; --border-color: #d5d8db; --border-soft: #ddd;
    --text-main: #1a1a1a; --text-muted: #555555; --text-dim: #777777;
    --lib-item-bg: #fafafa; --lib-item-border: #ddd; --tab-bg: #e8e8e8;
    --row-bg: #ffffff; --row-alt: #f8f9fa; --row-hover: #f0f3f6;
    --accent-text: #b8651f; --wm: rgba(0,0,0,0.22); --wm2: rgba(0,0,0,0.13); --ok: #2e7d32;
}
html, body { height: 100%; }
body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-main); color: var(--text-main); overflow: hidden; display: flex; flex-direction: column; transition: background-color 0.2s, color 0.2s; }
a { color: var(--accent-text); }
#top-bar { background: var(--bg-topbar); padding: 5px 15px; border-bottom: 1px solid var(--border-soft); display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
#toolbar { padding: 10px 15px; background: var(--bg-panel); border-bottom: 1px solid var(--border-color); display: flex; gap: 10px; align-items: center; z-index: 100; flex-wrap: wrap; }
input[type="text"], input[type="number"], input[type="date"], input[type="search"], select, textarea { padding: 6px 10px; border: none; border-radius: 4px; background: var(--bg-input); color: var(--text-main); outline: none; font-size: 13px; font-family: inherit; }

button {
    display: inline-flex; align-items: center; justify-content: center; position: relative;

    cursor: pointer; font-weight: 600; border: 1px solid var(--btn-border); border-radius: 8px;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 1px 2px rgba(0,0,0,0.12);
    transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
}
button:hover, button:focus-visible { background: var(--btn-bg-hover); border-color: var(--btn-border-hover); box-shadow: 0 0 10px rgba(var(--accent), 0.3); outline: none; }

.btn-active, .btn-active:hover { background: var(--btn-bg-active); border-color: var(--btn-border-active); box-shadow: 0 0 8px rgba(var(--accent), 0.5); }
.btn-icon { display: inline-block; line-height: 1; }
.btn-label { display: inline-block; max-width: 0; overflow: hidden; white-space: nowrap; opacity: 0; margin-left: 0; vertical-align: middle; transition: max-width 0.25s ease, opacity 0.2s ease, margin-left 0.25s ease; }
button:hover .btn-label, button:focus-visible .btn-label, .btn-active .btn-label.keep, .btn-label.show { max-width: 220px; opacity: 1; margin-left: 6px; }
.btn-group { display: inline-flex; align-items: center; gap: 10px; flex: 0 0 auto; }
.btn-sm { padding: 3px 8px; font-size: 12px; border-radius: 6px; }
.btn-big { padding: 11px 22px; font-size: 15px; border-radius: 10px; border-color: rgba(var(--accent),0.85); background: rgba(var(--accent),0.28); }
.btn-danger { border-color: rgba(229,57,53,0.5); background: rgba(229,57,53,0.12); }
.btn-danger:hover { background: rgba(229,57,53,0.3); border-color: rgba(229,57,53,0.95); box-shadow: 0 0 10px rgba(229,57,53,0.35); }
.divider { width: 1px; height: 25px; background: var(--border-color); margin: 0 5px; }
.tb-label { font-size: 13px; color: var(--text-muted); }

#tabs-container { display: flex; gap: 5px; overflow-x: auto; max-width: 45%; padding-bottom: 5px; padding-top: 4px; align-items: center; }
.tab { background: var(--tab-bg); color: var(--text-main); border-radius: 4px; border: 1px solid var(--border-color); white-space: nowrap; padding: 5px 10px; }
.tab.active { background: var(--blue); border-color: var(--blue); color: #fff; }
.tab:hover:not(.active) { background: var(--bg-input); }
.tab-content { display: flex; align-items: center; gap: 10px; }
.tab-title { cursor: pointer; font-weight: bold; flex: 1; font-size: 13px; }
.tab-title small { font-weight: normal; opacity: .75; margin-left: 4px; }
.tab-btn { font-size: 11px; cursor: pointer; opacity: 0.5; transition: 0.2s; }
.tab-btn:hover { opacity: 1; transform: scale(1.2); }
.tab-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-left: 6px; vertical-align: middle; }

#main-layout { display: flex; flex: 1; overflow: hidden; position: relative; min-height: 0; }
#library-panel { width: 280px; background: var(--bg-panel-alt); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; z-index: 50; transition: width 0.2s; flex-shrink: 0; }

#library-header { padding: 12px; font-weight: bold; background: var(--bg-header); border-bottom: 1px solid var(--border-soft); text-align: center; white-space: nowrap; overflow: hidden; display: flex; justify-content: center; align-items: center; gap: 8px; }

#lib-categories-bar { width: 26px; background: var(--bg-header); border-right: 1px solid var(--border-soft); display: flex; flex-direction: column; gap: 4px; padding: 6px 2px; overflow-y: auto; align-items: center; flex-shrink: 0; }
.cat-tab { width: 20px; min-height: 50px; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: bold; text-align: center; cursor: pointer; border: 2px solid transparent; overflow: hidden; padding: 4px 2px; transition: 0.15s; writing-mode: vertical-rl; transform: rotate(180deg); color: #fff; background: #555; box-sizing: border-box; flex-shrink: 0; text-shadow: 0 1px 1px rgba(0,0,0,0.5); }
.cat-tab:hover { filter: brightness(1.2); }
.cat-tab.active { border-color: var(--text-main); box-shadow: 0 0 6px rgba(255,255,255,0.6); }
#lib-main-pane { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--bg-panel-alt); min-width: 0; }
#lib-search-container { padding: 8px 10px; background: var(--bg-header); border-bottom: 1px solid var(--border-soft); display: flex; gap: 6px; }
#lib-search { flex: 1; min-width: 0; box-sizing: border-box; background: var(--bg-input); border: 1px solid var(--border-color); border-radius: 4px; padding: 5px 8px; color: var(--text-main); font-size: 12px; }
#lib-cat-title { padding: 8px 10px 0; font-size: 11px; font-weight: bold; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-dim); display: flex; justify-content: space-between; align-items: center; gap: 6px; }
#lib-target { padding: 6px 10px 0; font-size: 11px; color: var(--text-muted); }
#lib-target b { color: var(--accent-text); }
#lib-list { flex: 1; overflow-y: auto; padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 6px; }
.lib-item { background: var(--lib-item-bg); padding: 7px 26px 7px 11px; border-radius: 6px; border: 1px solid var(--lib-item-border); cursor: pointer; position: relative; font-size: 12px; transition: 0.12s; }
.lib-item:hover { border-color: rgba(var(--accent),0.8); box-shadow: 0 0 8px rgba(var(--accent),0.25); }
.lib-item::before { content: ''; position: absolute; left: 0; top: 6px; bottom: 6px; width: 4px; border-radius: 0 3px 3px 0; background: var(--dc, #888); }
.lib-item b { display: block; font-size: 12.5px; }
.lib-item .li-sub { color: var(--text-muted); font-size: 11px; }
.lib-item .li-add { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); opacity: 0; font-size: 15px; transition: .15s; }
.lib-item:hover .li-add { opacity: 1; }
.lib-item .li-del { position: absolute; right: 6px; top: 5px; font-size: 11px; opacity: .45; padding: 2px; }
.lib-item .li-del:hover { opacity: 1; }
.lib-item .li-del + .li-add { top: 66%; }
#lib-footer { padding: 8px 10px; border-top: 1px solid var(--border-soft); display: flex; gap: 6px; flex-wrap: wrap; background: var(--bg-header); font-size: 11px; color: var(--text-dim); line-height: 1.4; }
.lib-empty { color: var(--text-dim); font-size: 12px; text-align: center; padding: 20px 8px; line-height: 1.5; }

#workspace-container { flex: 1; position: relative; overflow: hidden; background: var(--bg-main); display: flex; flex-direction: column; min-width: 0; }
#ws-head { position: relative; display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; padding: 18px 30px 6px; flex-wrap: wrap; flex-shrink: 0; }
#ui-watermark { position: relative; pointer-events: none; display: flex; flex-direction: column; padding: 4px 40px 10px 0; box-sizing: border-box; min-width: 0; }
#ui-title { font-size: 40px; font-weight: bold; letter-spacing: 5px; white-space: nowrap; margin-bottom: 5px; color: var(--wm); text-shadow: 1px 1px 2px rgba(0,0,0,0.5); line-height: 1.05; }
#ui-subtitle { font-size: 14px; font-weight: bold; letter-spacing: 2px; text-transform: uppercase; color: var(--wm2); text-shadow: 1px 1px 2px rgba(0,0,0,0.3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 60vw; }
#ws-stats { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding-top: 8px; }
.stat { background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 8px; padding: 6px 12px; font-size: 12px; color: var(--text-muted); text-align: center; }
.stat b { display: block; font-size: 16px; color: var(--text-main); font-variant-numeric: tabular-nums; }
.stat.red { border-color: rgba(229,57,53,0.8); background: rgba(229,57,53,0.14); }
.stat.red b { color: #ef5350; }
.stat.ok b { color: var(--ok); }
.stat.warn b { color: var(--warn); }
.stat.click { cursor: pointer; }
.stat.click:hover { border-color: rgba(var(--accent),0.8); }
#save-state { font-size: 11px; color: var(--text-dim); }
#content { flex: 1; overflow: auto; padding: 6px 30px 60px; }

/* ---------- Cartes génériques ---------- */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 16px; align-items: start; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 16px; align-items: start; }
.span2 { grid-column: 1 / -1; }

.card-h .ch-t { display: flex; align-items: center; gap: 8px; font-size: 14px; }

.fld.w2 { grid-column: span 2; }
.fld.full { grid-column: 1 / -1; }
.hint { font-size: 11.5px; color: var(--text-dim); line-height: 1.45; }
.sub-h { font-size: 11px; font-weight: bold; text-transform: uppercase; letter-spacing: .05em; color: var(--text-dim); margin: 14px 0 6px; display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.mono { font-family: Consolas, 'Courier New', monospace; }
.empty { color: var(--text-dim); font-size: 12.5px; padding: 14px; text-align: center; border: 1px dashed var(--border-color); border-radius: 8px; line-height: 1.5; }
.keys { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.key { background: rgba(var(--accent),0.08); border: 1px solid rgba(var(--accent),0.3); border-radius: 8px; padding: 9px 10px; text-align: center; }
.key > span { display: block; font-size: 10.5px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .05em; }
.key b { display: block; font-family: Consolas, 'Courier New', monospace; font-size: 24px; color: var(--accent-text); margin: 3px 0 1px; font-variant-numeric: tabular-nums; }
.key small { font-size: 11px; color: var(--text-dim); }
.key.red { background: rgba(229,57,53,0.1); border-color: rgba(229,57,53,0.55); }
.key.red b { color: #ef5350; }
.alerts { display: flex; flex-direction: column; gap: 6px; }
.alert { font-size: 12.5px; padding: 7px 10px; border-radius: 6px; border: 1px solid rgba(255,167,38,0.6); background: rgba(255,167,38,0.12); line-height: 1.45; }
.alert.red { border-color: rgba(229,57,53,0.7); background: rgba(229,57,53,0.13); }
.alert.ok { border-color: rgba(102,187,106,0.6); background: rgba(102,187,106,0.1); }
.alert.info { border-color: rgba(var(--accent),0.5); background: rgba(var(--accent),0.08); }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: bold; padding: 2px 8px; border-radius: 10px; border: 1px solid var(--border-color); white-space: nowrap; user-select: none; }
.pill.ok { border-color: rgba(102,187,106,0.7); background: rgba(102,187,106,0.14); color: var(--ok); }
.pill.ko { border-color: rgba(229,57,53,0.8); background: rgba(229,57,53,0.16); color: #ef5350; }
.pill.warn { border-color: rgba(255,167,38,0.7); background: rgba(255,167,38,0.12); color: var(--warn); }
.pill.acc { border-color: rgba(var(--accent),0.7); background: rgba(var(--accent),0.12); color: var(--accent-text); }
.pill.click { cursor: pointer; }
.pill.click:hover { filter: brightness(1.15); box-shadow: 0 0 6px rgba(var(--accent),0.35); }

.pills { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
.chip { display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 5px; color: #fff; font-weight: bold; font-size: 11.5px; box-sizing: border-box; text-shadow: 0 1px 1px rgba(0,0,0,.55); white-space: nowrap; font-family: Consolas, monospace; }
.gauge { height: 10px; border-radius: 5px; background: var(--bg-input); overflow: hidden; border: 1px solid var(--border-color); position: relative; }
.gauge > div { height: 100%; background: var(--ok); transition: width .25s; }
.gauge.warn > div { background: var(--warn); }
.gauge.red > div { background: #ef5350; }
.gauge-l { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-muted); margin: 6px 0 3px; gap: 8px; }
.gauge-l b { color: var(--text-main); font-variant-numeric: tabular-nums; }
.share { display: flex; height: 26px; border-radius: 6px; overflow: hidden; border: 1px solid var(--border-color); }
.share > div { height: 100%; min-width: 2px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 11px; font-weight: bold; text-shadow: 0 1px 1px rgba(0,0,0,.6); overflow: hidden; white-space: nowrap; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11.5px; color: var(--text-muted); margin-top: 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: middle; margin-right: 4px; }

/* ---------- Tableaux ---------- */
.etable { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.etable th { text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-dim); font-weight: 600; padding: 4px 4px 6px; border-bottom: 1px solid var(--border-color); white-space: nowrap; }
.etable th.r, .etable td.r { text-align: right; }
.etable td { padding: 2px 3px; border-bottom: 1px solid var(--border-soft); vertical-align: middle; }
.etable tr:nth-child(even) td { background: var(--row-alt); }
.etable tr:hover td { background: var(--row-hover); }
.etable input, .etable select { width: 100%; box-sizing: border-box; background: transparent; padding: 5px 6px; border-radius: 3px; }
.etable input:focus, .etable select:focus { background: var(--bg-input); }
.etable input[type=number] { text-align: right; }
.etable .act { white-space: nowrap; text-align: right; width: 1%; }
.etable .act span { cursor: pointer; opacity: .55; padding: 0 3px; font-size: 13px; }
.etable .act span:hover { opacity: 1; }
.etable .calc { font-family: Consolas, monospace; white-space: nowrap; text-align: right; padding: 2px 8px; font-variant-numeric: tabular-nums; }
.etable .calc.hl { color: var(--accent-text); font-weight: bold; }
.etable tr.tot td { background: var(--bg-header) !important; font-weight: bold; }
.etable .grip { cursor: grab; opacity: .35; width: 12px; text-align: center; user-select: none; font-size: 12px; }
.etable tr:hover .grip { opacity: .8; }
.etable tr.dragging td { opacity: .35; }
.etable tr.flash td { animation: rowflash 1.4s ease; }
@keyframes rowflash { 0%, 45% { background: rgba(var(--accent),0.35); } 100% { background: transparent; } }
.etable tr.w0 input.kgu { color: var(--warn); }
.table-wrap { overflow-x: auto; }

/* ---------- Caisses ---------- */
.case-card { border-top: 4px solid var(--cc, #888); transition: box-shadow .15s, border-color .15s; }
.case-card.active { box-shadow: 0 0 0 2px rgba(var(--accent),0.85), 0 0 18px rgba(var(--accent),0.25); }
.case-card.drop { box-shadow: 0 0 0 2px var(--blue), 0 0 18px rgba(0,122,204,0.35); }
.case-card .card-h { cursor: pointer; border-radius: 0; }
.ch-code { width: 64px; font-weight: bold; font-family: Consolas, monospace; text-align: center; }
.ch-name { flex: 1; min-width: 120px; font-weight: bold; }
.case-top { display: flex; gap: 8px; align-items: center; flex: 1; min-width: 0; }
.case-top input[type=color] { width: 26px; height: 26px; padding: 0; border: none; background: none; cursor: pointer; flex: 0 0 auto; }
.case-tools { display: flex; gap: 4px; }
.case-tools button { padding: 3px 7px; font-size: 12px; border-radius: 6px; }
.case-meta { display: flex; gap: 8px 12px; flex-wrap: wrap; align-items: center; padding: 8px 14px; border-bottom: 1px solid var(--border-soft); font-size: 12px; color: var(--text-muted); }
.case-meta label { display: inline-flex; align-items: center; gap: 4px; }
.case-meta input[type=number] { width: 52px; padding: 4px 6px; text-align: right; }
.case-meta select { padding: 4px 6px; max-width: 170px; }
.case-meta .dims input { width: 44px; }
.tog { cursor: pointer; user-select: none; }
.tog.on { border-color: rgba(229,57,53,0.8); background: rgba(229,57,53,0.16); color: #ef5350; }
.case-items { padding: 4px 8px 0; }
.case-items .etable td { padding: 1px 2px; }
.case-items .qty { width: 46px; }
.case-items .kgu { width: 58px; }
.case-items .sn { width: 110px; }
.qa-row { display: flex; gap: 6px; padding: 8px 8px 10px; align-items: center; }
.qa-row input { flex: 1; min-width: 0; }
.case-foot { padding: 8px 14px 12px; border-top: 1px solid var(--border-soft); }
.case-foot .cf-line { display: flex; justify-content: space-between; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--text-muted); }
.case-foot .cf-kg { font-family: Consolas, monospace; font-size: 20px; font-weight: bold; color: var(--accent-text); }
.welcome { max-width: 760px; margin: 30px auto; text-align: center; }
.welcome h2 { font-size: 22px; margin: 0 0 8px; letter-spacing: 1px; }
.welcome p { color: var(--text-muted); line-height: 1.55; font-size: 14px; }
.welcome .wb { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 20px; }
.steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-top: 26px; text-align: left; }
.steps div { background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 8px; padding: 12px; font-size: 12.5px; color: var(--text-muted); line-height: 1.45; }
.steps b { display: block; color: var(--text-main); font-size: 13.5px; margin-bottom: 4px; }
.remind { margin-bottom: 16px; }
.remind .card-b { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 9px 14px; }

/* ---------- Chargement ---------- */
.load-board { display: flex; gap: 14px; align-items: flex-start; overflow-x: auto; padding-bottom: 12px; }
.veh-col { flex: 0 0 330px; background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 8px; display: flex; flex-direction: column; min-height: 200px; border-top: 4px solid var(--vc, #888); }
.veh-col.drop { box-shadow: 0 0 0 2px var(--blue); }
.veh-col.unassigned { border-top-color: var(--text-dim); border-style: dashed; }
.veh-h { padding: 10px 12px; background: var(--bg-header); border-bottom: 1px solid var(--border-soft); }
.veh-h .vh-top { display: flex; gap: 6px; align-items: center; }
.veh-h .vh-top input[type=text] { flex: 1; min-width: 0; font-weight: bold; }
.veh-h .vh-top input[type=color] { width: 24px; height: 24px; padding: 0; border: none; background: none; cursor: pointer; }
.veh-h .vh-sub { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 11px; color: var(--text-muted); margin-top: 6px; }
.veh-h .vh-sub input { width: 58px; padding: 3px 5px; text-align: right; font-size: 12px; }
.volbar { display: flex; height: 16px; border-radius: 4px; overflow: hidden; border: 1px solid var(--border-color); background: var(--bg-input); margin-top: 3px; }
.volbar > div { height: 100%; border-right: 1px solid rgba(0,0,0,.35); box-sizing: border-box; }
.veh-list { padding: 8px; display: flex; flex-direction: column; gap: 6px; flex: 1; min-height: 60px; }
.veh-foot { padding: 8px 10px; border-top: 1px solid var(--border-soft); display: flex; gap: 6px; flex-wrap: wrap; font-size: 11.5px; color: var(--text-dim); align-items: center; }
.cchip { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-panel-alt); cursor: grab; border-left: 5px solid var(--cc, #888); font-size: 12px; }
.cchip:hover { border-color: rgba(var(--accent),0.7); }
.cchip.dragging { opacity: .35; }
.cchip.drop-before { box-shadow: 0 -3px 0 var(--blue); }
.cchip .ord { font-family: Consolas, monospace; font-size: 11px; color: var(--text-dim); width: 18px; text-align: right; flex: 0 0 auto; }
.cchip .cc-main { flex: 1; min-width: 0; }
.cchip .cc-main b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cchip .cc-main span { font-size: 11px; color: var(--text-muted); }
.cchip .cc-kg { font-family: Consolas, monospace; font-weight: bold; white-space: nowrap; }
.cchip .cc-arr { display: flex; flex-direction: column; }
.cchip .cc-arr span { cursor: pointer; opacity: .5; font-size: 10px; line-height: 1.1; padding: 0 3px; }
.cchip .cc-arr span:hover { opacity: 1; }
.cchip select { padding: 2px 4px; font-size: 11px; max-width: 26px; }
body.light-theme .veh-h input[type=text], body.light-theme .veh-h input[type=number] { background: #fff; border: 1px solid var(--border-color); }

/* ---------- Vérification ---------- */
.scan-box { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.scan-box input { flex: 1; min-width: 200px; font-size: 16px; padding: 10px 12px; border: 1px solid rgba(var(--accent),0.5); }
.progress { height: 14px; border-radius: 7px; background: var(--bg-input); overflow: hidden; border: 1px solid var(--border-color); display: flex; }
.progress > div { height: 100%; transition: width .2s; }
.pg-ok { background: linear-gradient(90deg, #43a047, #66bb6a); }
.pg-dmg { background: var(--warn); }
.pg-miss { background: #e53935; }
.chk-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 14px; align-items: start; }
.chk-veh { grid-column: 1 / -1; font-size: 12px; font-weight: bold; text-transform: uppercase; letter-spacing: .08em; color: var(--text-dim); margin-top: 8px; display: flex; align-items: center; gap: 8px; }
.chk-veh i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; }
.chk-case { border-left: 4px solid var(--cc, #888); }
.chk-case.done { border-color: rgba(102,187,106,0.6); border-left-color: var(--cc, #888); }
.chk-case.bad { border-color: rgba(229,57,53,0.6); border-left-color: var(--cc, #888); }
.chk-case.flash { animation: flash 1.2s ease; }
@keyframes flash { 0%, 60% { box-shadow: 0 0 0 3px rgba(var(--accent),0.9), 0 0 24px rgba(var(--accent),0.5); } 100% { box-shadow: none; } }
.chk-row { display: flex; align-items: center; gap: 8px; padding: 5px 12px; border-bottom: 1px solid var(--border-soft); font-size: 13px; }
.chk-row:last-child { border-bottom: none; }
.chk-row .cr-name { flex: 1; min-width: 0; cursor: pointer; }
.chk-row .cr-name small { color: var(--text-dim); font-family: Consolas, monospace; margin-left: 6px; }
.chk-row .cr-q { font-family: Consolas, monospace; color: var(--text-muted); width: 30px; text-align: right; flex: 0 0 auto; }
.chk-row .cr-t { font-size: 10.5px; color: var(--text-dim); width: 38px; text-align: right; flex: 0 0 auto; }
.chk-row.s-ok .cr-name { color: var(--text-muted); text-decoration: line-through; text-decoration-color: rgba(102,187,106,.6); }
.chk-row.s-miss { background: rgba(229,57,53,0.1); }
.chk-row.s-dmg { background: rgba(255,167,38,0.1); }
.chk-row.flash { animation: flash 1.2s ease; }
.chk-row .prev { font-size: 10.5px; color: #ef5350; font-weight: bold; }
.cb { width: 30px; height: 28px; padding: 0; font-size: 14px; border-radius: 6px; flex: 0 0 auto; opacity: .55; }
.cb:hover { opacity: 1; }
.cb.on.ok { background: rgba(102,187,106,0.35); border-color: #66bb6a; opacity: 1; }
.cb.on.miss { background: rgba(229,57,53,0.4); border-color: #e53935; opacity: 1; }
.cb.on.dmg { background: rgba(255,167,38,0.4); border-color: #ffa726; opacity: 1; }
.seal { cursor: pointer; }

/* ---------- Rapport ---------- */
.sheet { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.sh-hero { background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 10px; overflow: hidden; }
.sh-band { background: #1a1a1a; color: #fff; padding: 14px 18px; display: flex; justify-content: space-between; gap: 14px; flex-wrap: wrap; align-items: center; border-bottom: 3px solid rgb(var(--accent)); }
.sh-brand { font-weight: bold; letter-spacing: 3px; color: rgb(var(--accent)); font-size: 12px; }
.sh-prod { font-size: 24px; font-weight: bold; letter-spacing: 1px; }
.sh-day { text-align: right; }
.sh-day b { font-size: 16px; display: block; }
.sh-day span { color: #ccc; font-size: 13px; }
.sh-keys { display: grid; grid-template-columns: repeat(5, 1fr); }
.sh-key { padding: 12px; text-align: center; border-right: 1px solid var(--border-soft); }
.sh-key:last-child { border-right: none; }
.sh-key > span { display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); }
.sh-key b { font-size: 22px; font-family: Consolas, 'Courier New', monospace; color: var(--accent-text); }
.sh-key.red b { color: #ef5350; }
.sh-sub { padding: 8px 18px; font-size: 12px; color: var(--text-muted); border-top: 1px solid var(--border-soft); display: flex; gap: 14px; flex-wrap: wrap; }
.sh-sec { background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 10px; overflow: hidden; }
.sh-sec > h3 { margin: 0; padding: 9px 14px; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; background: var(--bg-header); border-bottom: 1px solid var(--border-soft); display: flex; align-items: center; gap: 8px; border-left: 4px solid var(--sc, rgb(var(--accent))); justify-content: space-between; }
.sh-body { padding: 12px 14px; }
.sh-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.sh-table th { text-align: left; font-size: 10.5px; text-transform: uppercase; color: var(--text-dim); padding: 6px 8px; border-bottom: 1px solid var(--border-color); letter-spacing: .04em; }
.sh-table td { padding: 5px 8px; border-bottom: 1px solid var(--border-soft); vertical-align: top; }
.sh-table td.r, .sh-table th.r { text-align: right; }
.sh-table td.c, .sh-table th.c { text-align: center; }
.sh-table tr.ko td { background: rgba(229,57,53,0.1); }
.sh-table tr.tot td { font-weight: bold; background: var(--bg-header); }
.sh-table tr.case-h td { background: var(--bg-panel-alt); font-weight: bold; border-top: 2px solid var(--border-color); }
.box { display: inline-block; width: 13px; height: 13px; border: 1.5px solid var(--text-dim); border-radius: 2px; vertical-align: middle; }
.st-ok { color: var(--ok); font-weight: bold; } .st-miss { color: #ef5350; font-weight: bold; } .st-dmg { color: var(--warn); font-weight: bold; }
.sign { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.sign div { border: 1px solid var(--border-color); border-radius: 6px; height: 80px; padding: 6px 10px; font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .05em; }
.sh-foot { text-align: center; font-size: 11px; color: var(--text-dim); padding: 6px 0 20px; }
.rep-switch { display: flex; gap: 8px; justify-content: center; margin-bottom: 4px; flex-wrap: wrap; }

/* ---------- Étiquettes ---------- */
.labels { display: grid; grid-template-columns: repeat(auto-fill, minmax(460px, 1fr)); gap: 16px; }
.label { background: #fff; color: #111; border: 2px solid #111; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; min-height: 340px; font-family: 'Segoe UI', Tahoma, sans-serif; }
.lb-band { background: var(--cc, #555); color: #fff; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; text-shadow: 0 1px 2px rgba(0,0,0,.5); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.lb-code { font-family: Consolas, monospace; font-size: 46px; font-weight: bold; letter-spacing: 2px; line-height: 1; }
.lb-name { font-size: 18px; font-weight: bold; text-align: right; }
.lb-mid { display: flex; border-bottom: 2px solid #111; }
.lb-mid > div { flex: 1; padding: 8px 12px; border-right: 1px solid #bbb; }
.lb-mid > div:last-child { border-right: none; }
.lb-mid span { display: block; font-size: 9.5px; text-transform: uppercase; letter-spacing: .08em; color: #666; }
.lb-mid b { font-size: 20px; font-family: Consolas, monospace; }
.lb-list { padding: 8px 14px; font-size: 12px; columns: 2; column-gap: 18px; flex: 1; line-height: 1.45; }
.lb-list div { break-inside: avoid; }
.lb-list .q { font-family: Consolas, monospace; font-weight: bold; display: inline-block; min-width: 26px; }
.lb-picto { display: flex; gap: 8px; padding: 8px 14px; border-top: 2px solid #111; align-items: center; flex-wrap: wrap; font-size: 12px; }
.lb-picto .pp { border: 2px solid #111; border-radius: 4px; padding: 3px 8px; font-weight: bold; letter-spacing: .05em; }
.lb-picto .pp.red { border-color: #c62828; color: #c62828; }
.lb-picto .prod { margin-left: auto; color: #555; font-size: 11px; text-align: right; }

/* ---------- Modales, toast ---------- */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 5000; }
.modal-box { background: var(--bg-menu); color: var(--text-main); width: 580px; max-width: 92vw; max-height: 86vh; overflow-y: auto; border-radius: 8px; border: 1px solid var(--border-color); padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); position: relative; box-sizing: border-box; }
.modal-box.wide { width: 900px; }
.modal-box h3 { margin: 0 0 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.modal-box .close-x { cursor: pointer; color: var(--text-muted); font-weight: bold; padding: 0 2px; }
.modal-box .mb-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }
.modal-box h4 { margin: 14px 0 4px; color: var(--accent-text); }
.modal-box ul { margin: 4px 0; padding-left: 20px; font-size: 13px; line-height: 1.55; }
.modal-box p { font-size: 13px; line-height: 1.5; }
.modal-box.danger { border-color: rgba(229,57,53,0.8); }
.tpl-list { display: flex; flex-direction: column; gap: 8px; }
.tpl { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border: 1px solid var(--border-color); border-left: 4px solid var(--cc, #888); border-radius: 6px; background: var(--bg-panel-alt); }
.tpl .t-main { flex: 1; min-width: 0; font-size: 12px; color: var(--text-muted); }
.tpl .t-main b { display: block; color: var(--text-main); font-size: 13px; }
.icon-pick { display: flex; gap: 6px; flex-wrap: wrap; }
.icon-pick span { cursor: pointer; font-size: 20px; padding: 3px 6px; border-radius: 6px; border: 1px solid transparent; }
.icon-pick span.on { border-color: rgba(var(--accent),0.9); background: rgba(var(--accent),0.2); }
.xi-opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 6px 16px; font-size: 12.5px; margin-bottom: 12px; }
.xi-opts label { display: flex; gap: 7px; align-items: flex-start; cursor: pointer; line-height: 1.35; }
.xi-wrap { max-height: 50vh; overflow: auto; border: 1px solid var(--border-color); border-radius: 8px; }
.xi-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.xi-table th { position: sticky; top: 0; background: var(--bg-header); text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-dim); padding: 7px 6px; z-index: 1; }
.xi-table td { padding: 4px 6px; border-bottom: 1px solid var(--border-soft); vertical-align: top; }
.xi-table td input[type=text], .xi-table td input[type=number], .xi-table td select { font-size: 12px; padding: 4px 6px; box-sizing: border-box; }
.xi-table td select { max-width: 150px; }
.xi-table .hint { font-size: 10.5px; margin-top: 2px; }
.xi-table tr.xi-off td { opacity: .4; }
.xi-table tr.xi-sec td { background: var(--bg-panel-alt); font-weight: bold; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--accent-text); padding: 7px 8px; }
#toast { position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%) translateY(20px); background: rgba(20,20,20,0.92); color: #fff; padding: 9px 16px; border-radius: 8px; font-size: 13px; z-index: 10001; opacity: 0; pointer-events: none; transition: 0.25s; border: 1px solid rgba(var(--accent),0.6); max-width: 80vw; }
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

#dev-credit { position: absolute; right: 30px; bottom: 16px; z-index: 40; pointer-events: none; font-size: 11px; color: #ccc; font-style: italic; opacity: 0.9; text-shadow: 1px 1px 2px rgba(0,0,0,0.8); }
body.light-theme #dev-credit { color: #555; text-shadow: none; }
@media print { #dev-credit { display: none !important; } }
@media (max-width: 760px) {
    #dev-credit { display: none; }
    .grid, .grid2, .chk-grid { grid-template-columns: 1fr; }
    #content { padding: 6px 12px 40px; }
    #ws-head { padding: 12px 12px 4px; }
    #ui-title { font-size: 28px; }
    .sh-keys { grid-template-columns: repeat(2, 1fr); }
    .sign { grid-template-columns: 1fr; }
    .labels { grid-template-columns: 1fr; }
    .veh-col { flex-basis: 85vw; }
    #tabs-container { max-width: 100%; }
    #library-panel { position: absolute; top: 0; bottom: 0; left: 0; box-shadow: 4px 0 12px rgba(0,0,0,.4); }
}
@media print {
    @page { size: A4; margin: 10mm; }
    body, body.light-theme { --bg-main: #fff; --bg-panel: #fff; --bg-panel-alt: #f7f7f7; --bg-header: #eee; --text-main: #111; --text-muted: #444; --text-dim: #666; --border-color: #ccc; --border-soft: #ddd; --accent-text: #b8651f; --row-alt: #fafafa; --ok: #2e7d32; }
    #toast, .modal-overlay, .no-print { display: none !important; }
    * { transition: none !important; animation: none !important; }
    html { background: #fff; }
    .sheet { max-width: none; }
    .sh-table { font-size: 10.5px; }
    .sh-table td, .sh-table th { padding: 3px 5px; }
    body { overflow: visible; height: auto; display: block; background: #fff; color: #111; }
    #top-bar, #toolbar, #library-panel, #ws-head { display: none !important; }
    #main-layout, #workspace-container, #content { overflow: visible; display: block; padding: 0; background: #fff; }
    .sh-hero, .sh-sign { break-inside: avoid; border-color: #bbb; background: #fff; }
    .sh-sec { border-color: #bbb; }
    .sh-sec > h3 { background: #eee; color: #111; break-after: avoid; }
    .sh-table tr { break-inside: avoid; }
    .sh-key b { color: #b8651f; }
    .sh-table td, .sh-table th { border-color: #ddd; color: #111; }
    .sh-band, .chip, .sh-table tr.ko td, .sh-sec > h3 { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .labels { display: block; }
    .label { height: 131mm; min-height: 0; margin: 0 0 5mm; break-inside: avoid; page-break-inside: avoid; border-radius: 0; }
    .label:nth-child(2n) { break-after: page; page-break-after: always; }
}

<script>

// =====================================================================
//  SUITE XIII — échanges entre outils (module commun, identique dans chaque outil)
//  • Format « Suite XIII » : objet JSON { format:'xiii-link', version, kind, from, app, project, … }
//    enregistrable en fichier .xiii.json (les fichiers joints y sont encodés en base64).
//  • Boîte d'échange : base IndexedDB « xiiiLink » partagée par tous les outils du même site.
//  • Canal « xiii-suite » (BroadcastChannel) : un outil déjà ouvert dans un autre onglet reçoit l'envoi.
// =====================================================================
const XIII = (() => {
    let dbp = null;
    const open = () => dbp || (dbp = new Promise((res, rej) => {
        let r; try { r = indexedDB.open('xiiiLink', 1); } catch (e) { rej(e); return; }
        r.onupgradeneeded = () => { if (!r.result.objectStoreNames.contains('outbox')) r.result.createObjectStore('outbox'); };
        r.onsuccess = () => res(r.result); r.onerror = () => { dbp = null; rej(r.error || new Error('IndexedDB')); }; r.onblocked = () => { dbp = null; rej(new Error('IndexedDB bloquée')); };
    }));
    const tx = async (mode, fn) => {
        const d = await open();
        return new Promise((res, rej) => { const t = d.transaction('outbox', mode); let out; const r = fn(t.objectStore('outbox')); if (r) r.onsuccess = () => { out = r.result; }; t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); });
    };
    const put = p => tx('readwrite', st => st.put(p, p.id));
    const get = id => tx('readonly', st => st.get(id));
    const del = id => tx('readwrite', st => st.delete(id));
    const all = () => tx('readonly', st => st.getAll()).then(l => (l || []).filter(Boolean));
    const chan = typeof BroadcastChannel !== 'undefined' ? new BroadcastChannel('xiii-suite') : null;
    // Propose l'envoi aux onglets ouverts ; vrai si l'outil destinataire a répondu
    const offer = (to, id, ms) => new Promise(res => {
        if (!chan) { res(false); return; }
        let done = false;
        const h = e => { const m = e.data || {}; if (m.type === 'ack' && m.id === id) { done = true; chan.removeEventListener('message', h); res(true); } };
        chan.addEventListener('message', h);
        chan.postMessage({ type: 'offer', to, id });
        setTimeout(() => { if (!done) { chan.removeEventListener('message', h); res(false); } }, ms || 700);
    });
    const b64 = blob => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1] || ''); r.onerror = rej; r.readAsDataURL(blob); });
    async function toFileBlob(p) {
        const o = Object.assign({}, p); delete o.to;
        if (o.file && o.file.blob) o.file = { name: o.file.name, type: o.file.type, data: await b64(o.file.blob) };
        return new Blob([JSON.stringify(o)], { type: 'application/json' });
    }
    function fromObject(o) {
        if (!o || o.format !== 'xiii-link') return null;
        if (o.file && o.file.data && !o.file.blob) {
            const bin = atob(o.file.data); const u8 = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
            o.file = { name: o.file.name, type: o.file.type, blob: new Blob([u8], { type: o.file.type || '' }) };
        }
        return o;
    }
    const id = () => 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    const safe = s => String(s || 'document').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\w\- ]+/g, ' ').trim().replace(/\s+/g, '_').slice(0, 80) || 'document';
    const dl = (blob, name) => { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000); };
    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    return { put, get, del, all, chan, offer, toFileBlob, fromObject, id, safe, dl, esc };
})();


// ---------- Envoi d'un document vers DOSSIER XIII (fenêtre commune) ----------
// cfg = { app, from, project, choices: [{ id, label, sub, title, keywords, key, make: async () => ({ blob, name, type }) | ({ html }) }] }
function xiiiSendToDossier(cfg) {

        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;border-bottom:1px solid var(--border-color,#444);padding-bottom:8px;"><b style="font-size:15px;">📚 Envoyer à DOSSIER XIII</b><span id="xs-x" style="cursor:pointer;font-weight:bold;color:var(--text-muted,#aaa);padding:0 4px;">✕</span></div>' +
        '<div style="display:flex;flex-direction:column;gap:6px;margin-bottom:14px;">' + cfg.choices.map((c, i) =>
            '<label style="display:flex;gap:9px;align-items:flex-start;cursor:pointer;padding:8px 10px;border:1px solid var(--border-color,#444);border-radius:6px;background:var(--bg-panel-alt,#252525);"><input type="radio" name="xs-c" value="' + i + '"' + (i === 0 ? ' checked' : '') + ' style="margin-top:2px;"><span><b>' + E(c.label) + '</b>' + (c.sub ? '<br><span style="color:var(--text-dim,#888);font-size:11.5px;">' + E(c.sub) + '</span>' : '') + '</span></label>').join('') + '</div>' +
        '<div style="display:flex;gap:8px;flex-wrap:wrap;"><button id="xs-send" style="flex:2;padding:10px;font-size:13.5px;border-color:rgba(var(--accent,240,179,120),.85);background:rgba(var(--accent,240,179,120),.28);">📚 Envoyer à DOSSIER XIII</button>' +
        '<button id="xs-file" style="flex:1;padding:10px;" title="Fichier .xiii.json à déposer dans DOSSIER XIII (à transmettre, archiver, ou si les outils ne sont pas ouverts sur le même site)">⬇️ Fichier Suite XIII</button></div>' +
        '<div id="xs-st" style="display:none;margin-top:12px;padding:10px 12px;border-radius:6px;border:1px solid var(--border-color,#444);background:var(--bg-panel-alt,#252525);line-height:1.5;"></div>' +
        '<p style="font-size:11px;color:var(--text-dim,#888);margin:12px 0 0;line-height:1.45;">Le document arrive dans DOSSIER XIII, qui propose la rubrique adaptée. S\'il a déjà été envoyé, la nouvelle version remplace l\'ancienne : renvoyez-le à chaque modification pour garder le dossier à jour.</p></div>';
    document.body.appendChild(o);
    const close = () => o.remove();
    o.addEventListener('mousedown', e => { if (e.target === o) close(); });
    document.getElementById('xs-x').onclick = close;
    const st = (html) => { const s = document.getElementById('xs-st'); if (!s) return; s.style.display = 'block'; s.innerHTML = html; };
    const busy = b => { ['xs-send', 'xs-file'].forEach(id => { const el = document.getElementById(id); if (el) el.disabled = b; }); };
    const choice = () => cfg.choices[+((o.querySelector('input[name=xs-c]:checked') || {}).value || 0)];
    async function build() {
        const c = choice();
        const r = await c.make();
        if (!r || (!r.blob && !r.html)) throw new Error('Aucun document produit');
        return {
            format: 'xiii-link', version: 1, kind: 'document', id: XIII.id(), from: cfg.from, app: cfg.app, ts: Date.now(), created: new Date().toISOString(),
            project: { name: cfg.project || '' }, title: c.title, target: { title: c.title, keywords: c.keywords || [] }, key: c.key || '',
            file: r.blob ? { name: r.name || (XIII.safe(c.title) + '.pdf'), type: r.type || r.blob.type || 'application/pdf', blob: r.blob } : null,
            html: r.html || null
        };
    }
    document.getElementById('xs-send').onclick = async () => {
        const t0 = Date.now(); busy(true); st('⏳ Préparation du document…');
        try {
            const p = await build(); p.to = 'dossier';
            await XIII.put(p);
            const ack = await XIII.offer('dossier', p.id);
            if (ack) { st('✅ <b>Reçu par DOSSIER XIII</b>, déjà ouvert dans un autre onglet : choisissez-y la rubrique.'); busy(false); return; }
            const url = 'dossier.html#xlink=' + p.id;
            const w = Date.now() - t0 < 4000 ? window.open(url, '_blank') : null;
            if (w) st('✅ <b>Envoyé.</b> DOSSIER XIII s\'est ouvert dans un nouvel onglet pour le ranger.');
            else st('✅ <b>Document prêt.</b> <button id="xs-open" style="margin-left:8px;">📚 Ouvrir DOSSIER XIII</button><br><span style="font-size:11.5px;color:var(--text-dim,#888);">Il vous attend aussi dans « 📥 À classer » de DOSSIER XIII.</span>');
            const b = document.getElementById('xs-open'); if (b) b.onclick = () => { window.open(url, '_blank'); close(); };
        } catch (e) {
            st('⚠️ ' + E(e && e.message ? e.message : 'Envoi impossible') + (e && /IndexedDB|quota/i.test(String(e.message || e.name)) ? '<br>Utilisez « Fichier Suite XIII » puis déposez-le dans DOSSIER XIII.' : ''));
        }
        busy(false);
    };
    document.getElementById('xs-file').onclick = async () => {
        busy(true); st('⏳ Préparation du fichier…');
        try {
            const p = await build();
            XIII.dl(await XIII.toFileBlob(p), XIII.safe(p.title) + '.xiii.json');
            st('⬇️ <b>Fichier Suite XIII téléchargé.</b> Déposez-le n\'importe où dans DOSSIER XIII : il sera rangé dans la bonne rubrique.');
        } catch (e) { st('⚠️ ' + E(e && e.message ? e.message : 'Export impossible')); }
        busy(false);
    };
}
// Récupère le fichier qu'un export existant de l'outil enregistre (au lieu de le télécharger)
function xiiiCapture(run, ms) {
    return new Promise((res, rej) => {
        const orig = window.saveFile; let done = false, t = null;
        const fin = (fn, v) => { if (done) return; done = true; window.saveFile = orig; clearTimeout(t); fn(v); };
        t = setTimeout(() => fin(rej, new Error('Le rendu n\'a pas abouti')), ms || 120000);
        window.saveFile = async (name, data, type) => {
            const blob = data instanceof Blob ? data : new Blob([data], { type: type || 'application/octet-stream' });
            fin(res, { name, blob, type: blob.type || type || '' }); return true;
        };
        Promise.resolve().then(run).then(() => setTimeout(() => fin(rej, new Error('Aucun document produit (contenu vide ?)')), 600)).catch(e => fin(rej, e));
    });
}
// Rapport imprimable de la suite (bandeau, chiffres clés, sections, tableaux) → HTML simple pour DOSSIER XIII
function xiiiReportToHtml(html) {
    const E = XIII.esc, T = el => (el ? el.textContent : '').replace(/\s+/g, ' ').trim();
    const root = document.createElement('div'); root.innerHTML = html;
    root.querySelectorAll('.no-print, .rep-switch, .sh-sign, .sign, script, style, button, select, input, svg').forEach(e => e.remove());
    const out = [];
    const hero = root.querySelector('.sh-hero');
    if (hero) {
        const prod = hero.querySelector('.sh-prod'), brand = hero.querySelector('.sh-brand'), day = hero.querySelector('.sh-day');
        if (brand) out.push('<p><b>' + E(T(brand)) + '</b></p>');
        const band = hero.querySelector('.sh-band');
        if (band) { const extra = [...band.querySelectorAll(':scope > div > div')].filter(d => d !== brand && d !== prod).map(T).filter(Boolean); if (extra.length) out.push('<p>' + E(extra.join(' · ')) + '</p>'); }
        if (day && T(day)) out.push('<p>' + E([T(day.querySelector('b')), T(day.querySelector('span'))].filter(Boolean).join(' · ')) + '</p>');
        const keys = [...hero.querySelectorAll('.sh-key')];
        if (keys.length) out.push('<table><tr>' + keys.map(k => '<th>' + E(T(k.querySelector('span'))) + '</th>').join('') + '</tr><tr>' + keys.map(k => '<td>' + E(T(k.querySelector('b'))) + '</td>').join('') + '</tr></table>');
        const sub = [...hero.querySelectorAll('.sh-sub > span')].map(T).filter(Boolean);
        if (sub.length) out.push('<p>' + E(sub.join('   ·   ')) + '</p>');
    }
    const table = tbl => {
        const head = [...tbl.querySelectorAll('thead tr th')].map(T);
        const parts = []; let rows = [];
        const flush = () => { if (rows.length) parts.push('<table>' + (head.length ? '<tr>' + head.map(h => '<th>' + E(h) + '</th>').join('') + '</tr>' : '') + rows.join('') + '</table>'); rows = []; };
        tbl.querySelectorAll('tbody tr, :scope > tr').forEach(tr => {
            if (tr.classList.contains('case-h')) { flush(); parts.push('<p><b>' + E(T(tr)) + '</b></p>'); return; }
            const cells = [...tr.children].map(T);
            if (cells.length === 1 && head.length > 1) { rows.push('<tr><td>' + E(cells[0]) + '</td>' + '<td></td>'.repeat(head.length - 1) + '</tr>'); return; }
            rows.push('<tr>' + cells.map(c => '<td>' + E(c) + '</td>').join('') + '</tr>');
        });
        flush();
        return parts.join('');
    };
    root.querySelectorAll('.sh-sec').forEach(sec => {
        const h = sec.querySelector('h3'); if (h) out.push('<h3>' + E(T(h)) + '</h3>');
        const body = sec.querySelector('.sh-body') || sec;
        body.childNodes.forEach(n => {
            if (n.nodeType === 3) { const t = n.nodeValue.replace(/\s+/g, ' ').trim(); if (t) out.push('<p>' + E(t) + '</p>'); return; }
            if (n.nodeType !== 1 || n === h) return;
            if (n.tagName === 'TABLE') out.push(table(n));
            else if (n.tagName === 'UL' || n.tagName === 'OL') out.push('<ul>' + [...n.querySelectorAll('li')].map(li => '<li>' + E(T(li)) + '</li>').join('') + '</ul>');
            else { const tb = n.querySelector('table'); if (tb) out.push(table(tb)); else if (T(n)) out.push('<p>' + E(T(n)) + '</p>'); }
        });
    });
    const foot = root.querySelector('.sh-foot'); if (foot && T(foot)) out.push('<p><i>' + E(T(foot)) + '</i></p>');
    return out.join('\n');
}

// =====================================================================
//  RUNO XIII — direct stream (Twitch, YouTube…) : déroulé minuté, chat Twitch en lecture (sans compte),

// =====================================================================
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 10);

const GK = [['don', 'Dons (€)', '€'], ['sub', 'Abonnés', 'abos'], ['bits', 'Bits', 'bits'], ['follow', 'Follows', 'follows'], ['member', 'Membres YouTube', 'membres'], ['custom', 'Manuel', '']];
const SRC = [['', '—'], ['name', 'Nom de l\'objectif'], ['label', 'Texte « 120 / 500 € »'], ['cur', 'Valeur actuelle'], ['target', 'Objectif'], ['pct', 'Pourcentage'], ['last', 'Dernier contributeur'], ['left', 'Reste à atteindre']];
const TPL = [['Just chatting / talk', [['Écran d\'attente', 5], ['Intro & bonjour au chat', 5], ['Sujet 1', 25], ['Questions du chat', 15], ['Sujet 2', 25], ['Pause', 5], ['Jeu / interaction', 20], ['Remerciements & raid', 5]]], ['Gaming', [['Écran d\'attente', 5], ['Intro', 5], ['Partie 1', 45], ['Pause', 10], ['Partie 2', 45], ['Bilan & raid', 10]]], ['Marathon caritatif', [['Ouverture & objectif', 10], ['Bloc 1', 60], ['Point dons', 10], ['Bloc 2', 60], ['Défi débloqué', 20], ['Bloc 3', 60], ['Clôture & total', 15]]]];
let P = null, prefs = { view: 'live' }, saveT = null, toastT = null, CHAT = [], PIN = null;
function blank() { return { app: 'RUNO XIII', v: 1, name: '', start: '20:00', segs: [], goals: [], alerts: [], live: { on: false, idx: 0, segStart: 0, showStart: 0, done: {} }, set: { channel: '', alertGid: '', alertMap: {}, alertSec: 6, chatGid: '', chatMap: {} }, updated: Date.now() }; }

const J = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const fiche = () => { const s = J('xiii.projets'); return s && s.list ? s.list.find(f => f && f.id === s.active) || null : null; };
const p2 = n => String(n).padStart(2, '0'), dur = s => { s = Math.max(0, Math.round(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return (h ? h + ':' + p2(m) : m) + ':' + p2(s % 60); };
const hm = t => new Date(t).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });

// ---------- canaux locaux ----------

GX.onmessage = e => { const m = e.data || {}; if (m.t === 'catalog') { const first = !CAT; CAT = m; if (first && prefs.view === 'goals') render(); } };
GX.postMessage({ t: 'list' }); setInterval(() => GX.postMessage({ t: 'list' }), 10000);

// ---------- objectifs ----------
function gVars(g) { const u = (GK.find(k => k[0] === g.kind) || GK[5])[2], v = { name: g.name || '', cur: +g.cur || 0, target: +g.target || 0, pct: Math.min(100, Math.round((+g.cur || 0) / (+g.target || 1) * 100)), label: nf(g.cur) + ' / ' + nf(g.target) + (u ? ' ' + u : ''), last: g.last || '', left: nf(Math.max(0, (+g.target || 0) - (+g.cur || 0))) + (u ? ' ' + u : '') }, out = {}; Object.keys(g.map || {}).forEach(k => { if (g.map[k]) out[k] = v[g.map[k]] == null ? '' : v[g.map[k]]; }); return out; }
function goalPush(g, action) { if (g.gid) gxRun(g.gid, action || 'set', gVars(g)); OV.postMessage({ t: 'goal', g: { id: g.id, name: g.name, cur: +g.cur || 0, target: +g.target || 0, kind: g.kind } }); }
function feedGoals(a) { let hit = false; P.goals.forEach(g => { const k = a.k === 'gift' ? null : a.k === 'superchat' ? 'don' : a.k; if (g.kind === k && +a.amount) { const before = (+g.cur || 0) < (+g.target || 0); g.cur = Math.round(((+g.cur || 0) + (+a.amount)) * 100) / 100; g.last = a.who || g.last; goalPush(g); hit = true; if (before && g.cur >= +g.target && +g.target) toast('🎉 Objectif atteint : ' + g.name); } }); return hit; }
// ---------- alertes ----------
function pushAlert(a) {

            b.onclick = () => { const sv = document.getElementById('xpj-save'); if (sv) sv.click(); setTimeout(() => { try { XPROJET.close(); } catch (e) { } open(); }, 200); }; (document.getElementById('xck-fiche') || document.getElementById('xmd-fiche') || g).insertAdjacentElement('afterend', b); });

    function card() { const s = st(); if (!s.id) return '<p class="xd-e">Pas de vitrine publiée. Partagez le planning, les intentions et les documents avec votre client, en lecture seule.</p><button class="xd-l" onclick="XVIT.open()">🌐 Créer la vitrine client →</button>'; const id = 'xvtc' + Date.now(); setTimeout(async () => { const el = document.getElementById(id); if (!el) return; const L = await comments(); if (!L) { el.textContent = 'Retours indisponibles'; return; } const nw = L.filter(c => c.id > (s.seen || 0)).length, open_ = L.filter(c => !c.resolved).length; el.innerHTML = '<b>' + L.length + '</b> retour(s) · ' + (nw ? '<b style="color:#64b5f6">' + nw + ' nouveau(x)</b> · ' : '') + open_ + ' à traiter' + (L.length ? '<br><small>Dernier : ' + esc((L[L.length - 1].author || '') + ' — ' + (L[L.length - 1].body || (L[L.length - 1].kind === 'ok' ? 'validé ✓' : ''))).slice(0, 90) + '</small>' : ''); }, 30); return '<div id="' + id + '" style="font-size:13px">…</div><button class="xd-l" onclick="XVIT.open()">🌐 Vitrine & retours du client →</button>'; }
    return { init, open, close, publish, payload, card, addDoc, comments };
