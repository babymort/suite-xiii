const estStep = (k, step, min, max) => 'data-act="est" data-k="' + k + '" data-step="' + step + '" data-min="' + min + '" data-max="' + max + '"';
const chip = (act, attrs, label, on) => '<button type="button" class="m-chip' + (on ? ' on' : '') + '" data-act="' + act + '" ' + attrs + '>' + label + '</button>';

function codecOptions(sel) { return CODECS.map(([g, list]) => '<optgroup label="' + esc(g) + '">' + list.map(([id, label, mode, v, est]) => '<option value="' + id + '"' + (id === sel ? ' selected' : '') + '>' + esc(label) + (est ? ' ≈' : '') + '</option>').join('') + '</optgroup>').join(''); }
function resOptions(sel) { return RES.map(r => '<option value="' + r[0] + '"' + (r[0] === sel ? ' selected' : '') + '>' + esc(r[1]) + '</option>').join(''); }
function brandOptions() { return '<option value="">Choisir un modèle de caméra…</option>' + BRANDS.map(b => '<optgroup label="' + esc(b[1]) + '">' + b[3].map((p, i) => '<option value="' + b[0] + ':' + i + '">' + esc(p[0]) + '</option>').join('') + '</optgroup>').join(''); }
function grpSub(g) {
    const cd = codec(g.codec), audio = cd.mode === 'audio';
    return cd.label + (audio ? ' · ' + g.tracks + ' pistes' : ' · ' + (g.res === 'custom' ? g.w + '×' + g.h : (resOf(g.res) || [0, g.res])[1].split(' ')[0]) + ' · ' + nf(g.fps, g.fps % 1 ? 3 : 0) + ' i/s') + ' · ' + nf(g.hours, g.hours % 1 ? 1 : 0) + ' h/j';
}

function alerts(R) {
    const out = [], E = S.est;
    if (!R.rows.length) return ['<div class="b-alert">Ajoutez une caméra pour obtenir des recommandations.</div>'];
    const offH = R.offloadSec / 3600;
    if (offH > 10) out.push('<div class="b-alert red">⛔ <b>' + fmtDur(R.offloadSec) + ' de déchargement par jour</b> : une seule station ne suivra pas. Prévoyez un 2e poste DIT, des lecteurs plus rapides ou des disques NVMe.</div>');
    else if (offH > 6) out.push('<div class="b-alert warn">⚠️ ' + fmtDur(R.offloadSec) + ' de déchargement par jour : la station sera très chargée. Déchargez au fil de l\'eau.</div>');
    else out.push('<div class="b-alert ok">✅ ' + fmtDur(R.offloadSec) + ' de déchargement par jour à ' + nf(E.stationMBs) + ' Mo/s' + (E.verify ? ' (copie + relecture)' : '') + ' : la station suit.</div>');
    R.rows.forEach(r => {
        const g = r.g, k = r.k;
        if (k.cardMin < 20 && isFinite(k.cardMin)) out.push('<div class="b-alert warn">⚠️ <b>' + esc(g.name) + '</b> : une carte de ' + nf(g.cardGB) + ' Go est pleine en <b>' + fmtMin(k.cardMin) + '</b>. Prévoyez au moins <b>' + k.rotation + ' cartes</b> par caméra en rotation.</div>');
        if (k.MBs > E.stationMBs) out.push('<div class="b-alert red">⛔ <b>' + esc(g.name) + '</b> enregistre à ' + nf(k.MBs) + ' Mo/s, plus vite que la station ne décharge (' + nf(E.stationMBs) + ' Mo/s).</div>');
    });
    if (E.copies < 2) out.push('<div class="b-alert red">⛔ Une seule copie : ne formatez aucune carte avant d\'avoir 2 copies vérifiées sur des supports différents.</div>');
    else if (E.copies === 2) out.push('<div class="b-alert warn">⚠️ 2 copies : c\'est le minimum. La règle 3-2-1 recommande 3 copies, dont 1 hors du plateau.</div>');
    else out.push('<div class="b-alert ok">✅ ' + E.copies + ' copies : règle 3-2-1 respectée si une copie quitte le plateau chaque soir.</div>');
    if (R.rows.some(r => codec(r.g.codec).est && !r.g.mbps)) out.push('<div class="b-alert">≈ Débits RAW indicatifs (±15 %) : forcez le débit constructeur pour une estimation exacte.</div>');
    return out;
}

            '<tr class="tot"><td>Total · ' + nf(R.MBs, 0) + ' Mo/s cumulés</td><td class="r">' + nf(R.MBs * 3.6, 0) + '</td><td class="r">' + fmtGB(R.dayGB) + '</td><td class="r">' + fmtGB(R.totalGB) + '</td></tr></tbody></table>';
        if (R.dayGB > 0) h += '<div class="b-share-bar">' + R.rows.map((r, i) => { const pc = r.k.dayGB * r.n / R.dayGB * 100; return pc > 0 ? '<i style="width:' + pc + '%;background:hsl(' + (i * 57 + 28) + ',62%,55%)" title="' + esc(r.g.name) + ' ' + nf(pc) + ' %"></i>' : ''; }).join('') + '</div><p class="b-sub">Répartition du volume journalier par source.</p>';
    } else h += '<div class="m-hint">Aucune source.</div>';

        DISK_LIST.map(d => { const u = d * (1 - Math.min(90, +E.margin || 0) / 100), per = Math.ceil(R.totalGB / 1000 / u) || 0, pp = E.proxies ? Math.ceil(R.proxyTotalGB / 1000 / u) || 0 : 0, tot = per * R.copies + pp * Math.max(1, +E.proxyCopies || 1); return chip('estset', 'data-k="diskTB" data-v="' + d + '"', d + ' To · <b>×' + tot + '</b>', +E.diskTB === d); }).join('') + '</div></div>';
    // cartes

            alt.map(a => '<tr data-act="gcard" data-v="' + a.c + '" style="cursor:pointer;' + (+g.cardGB === a.c ? 'background:rgba(var(--accent),.12)' : '') + '"><td>' + cardLbl(a.c) + (+g.cardGB === a.c ? ' ✓' : '') + '</td><td class="r">' + a.k.cycles + '</td><td class="r">' + a.k.rotation + '</td></tr>').join('') + '</tbody></table>' +

    }
    h += '<div class="m-card"><h3>🧭 Points de vigilance</h3>' + alerts(R).join('') + '</div>';
    return h;
}

// ---------- résumé texte ----------
function summaryText() {
    const R = calc(S), E = S.est;
    let t = '💾 BACKUPO XIII — Estimatif express' + (S.name ? ' · ' + S.name : '') + '\n';
    t += R.nSrc + ' source' + (R.nSrc > 1 ? 's' : '') + ' · ' + dayLbl(R.days) + ' · ' + R.copies + ' copie' + (R.copies > 1 ? 's' : '') + ' · marge libre ' + E.margin + ' % · lecteur ' + nf(E.stationMBs) + ' Mo/s' + (E.verify ? ' (relecture ×2)' : '') + '\n\n';
    R.rows.forEach(r => { t += '• ' + (r.n > 1 ? r.n + ' × ' : '') + (r.g.name || 'Source') + ' — ' + grpSub(r.g) + ' → ' + fmtGB(r.k.dayGB * r.n) + '/j\n'; });
    t += '\nRushes par jour : ' + fmtGB(R.dayGB) + '\nTotal tournage (1 copie) : ' + fmtGB(R.totalGB) + '\nVolume total à prévoir (' + R.copies + ' copie' + (R.copies > 1 ? 's' : '') + (E.proxies ? ' + proxys' : '') + ') : ' + fmtGB(R.allGB) + '\n';
    t += 'Disques de ' + nf(E.diskTB, E.diskTB % 1 ? 1 : 0) + ' To : ' + R.disksTotal + ' (' + R.disksPerCopy + ' par copie' + (E.proxies ? ' + ' + R.proxyDisks + ' proxy' : '') + ')\n';
    t += 'Cartes en rotation : ' + R.cardsRot + ' (' + R.cardsDay + ' remplie' + (R.cardsDay > 1 ? 's' : '') + ' par jour)\nDéchargement : ' + fmtDur(R.offloadSec) + ' par jour\n';
    if (E.proxies) t += 'Proxys : ' + fmtGB(R.proxyDayGB) + ' par jour, ' + fmtGB(R.proxyTotalGB) + ' au total\n';
    t += '\nEstimation indicative' + (R.rows.some(r => codec(r.g.codec).est && !r.g.mbps) ? ' (débits RAW ±15 %)' : '') + ', unités décimales — BACKUPO XIII.';
    return t;
}
async function doCopy() { toast(await XM.copy(summaryText()) ? '📋 Résumé copié' : '⚠️ Copie impossible'); }
function toast(m, ms) { XM.toast(m, ms); }
async function doShare() {
    const text = summaryText(), title = 'BACKUPO XIII — ' + (S.name || 'Estimatif express');
    if (navigator.share) { try { await navigator.share({ title, text }); } catch (e) { } return; }
    toast(await XM.copy(text) ? '📋 Partage indisponible ici : résumé copié' : '⚠️ Partage impossible');
}

// ---------- saisie d'un nom ----------
function askName(title, value, label) {
    return new Promise(res => {
        const s = XM.sheet('<label class="m-field"><span>Nom</span><input type="text" id="b-pn" value="' + esc(value) + '" autocomplete="off"></label><div class="m-actions" style="margin-top:0"><button class="m-btn primary" id="b-pok">' + esc(label || 'Valider') + '</button></div>', { title: esc(title), onClose: () => res(null) });
        const inp = $('#b-pn', s), ok = () => { const v = inp.value.trim(); const ov = $('#m-ov'); if (ov) ov._onClose = null; XM.closeSheet(); res(v || value); };
        $('#b-pok', s).onclick = ok; inp.onkeydown = e => { if (e.key === 'Enter') ok(); }; setTimeout(() => { try { inp.focus(); inp.select(); } catch (e) { } }, 60);
    });
}

// ---------- liste des estimatifs ----------
const savedSummary = s => { const R = calc(normState(s)); return R.nSrc + ' src · ' + dayLbl(R.days) + ' · ' + fmtGB(R.allGB) + ' · ' + R.disksTotal + ' disque' + (R.disksTotal > 1 ? 's' : ''); };
async function saveCurrent(as) {
    let item = !as && ST.saved.find(x => x.id === S.savedId);
    if (!item) {
        const name = await askName('Enregistrer l\'estimatif', S.name || 'Estimatif ' + (ST.saved.length + 1), 'Enregistrer'); if (name == null) return;
        S.name = name; item = { id: uid() }; ST.saved.unshift(item); S.savedId = item.id;
    }
    item.name = S.name || 'Estimatif'; item.ts = Date.now(); item.state = JSON.parse(JSON.stringify(S));
    ST.lastSig = sig(S); persist(); render(); toast('💾 « ' + item.name + ' » enregistré');
}
function openList() {
    const fmt = ts => new Date(ts).toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' }) + ' ' + new Date(ts).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
    const s = XM.sheet('<div class="b-saved">' + (ST.saved.length ? '<div class="m-list" style="margin:0">' + ST.saved.map(x => '<div class="m-item" data-id="' + x.id + '"><span class="ico">' + (x.id === S.savedId ? '📌' : '💾') + '</span><span class="grow" data-open="' + x.id + '"><b>' + esc(x.name) + '</b><small>' + esc(savedSummary(x.state)) + ' · ' + fmt(x.ts) + '</small></span><button class="m-ibtn" data-ret="' + x.id + '" aria-label="Renvoyer au bureau" title="Renvoyer au bureau">🖥️</button><button class="m-ibtn" data-del="' + x.id + '" aria-label="Supprimer" title="Supprimer">🗑</button></div>').join('') + '</div>' : '<div class="m-empty" style="padding:20px"><b>📋</b>Aucun estimatif enregistré.<br>Réglez un estimatif puis touchez « Enregistrer ».</div>') +
        '<div class="m-actions"><button class="m-btn" id="b-new">＋ Nouvel estimatif</button><button class="m-btn primary" id="b-saveas">💾 Enregistrer l\'actuel</button></div></div>', { title: '📋 Mes estimatifs' });
    $$('[data-open]', s).forEach(el => el.onclick = async () => {
        const x = ST.saved.find(y => y.id === el.dataset.open); if (!x) return;
        if (!(await guardDirty())) return;
        XM.closeSheet(); S = normState(JSON.parse(JSON.stringify(x.state))); S.savedId = x.id; ST.lastSig = sig(S); persist(); render(false); window.scrollTo(0, 0); toast('📂 « ' + x.name + ' » ouvert');
    });
    $$('[data-del]', s).forEach(el => el.onclick = async () => {
        const x = ST.saved.find(y => y.id === el.dataset.del); if (!x) return;
        const i = await XM.ask('Supprimer « ' + x.name + ' » ?', 'Cet estimatif sera retiré de la liste de ce téléphone.', [{ label: 'Supprimer', danger: true }, 'Annuler']); if (i !== 0) return;
        ST.saved = ST.saved.filter(y => y.id !== x.id); if (S.savedId === x.id) delete S.savedId; persist(); openList();
    });
    $$('[data-ret]', s).forEach(el => el.onclick = () => { const x = ST.saved.find(y => y.id === el.dataset.ret); if (x) { XM.closeSheet(); setTimeout(() => sendReturn(normState(x.state)), 80); } });
    $('#b-new', s).onclick = async () => { if (!(await guardDirty())) return; XM.closeSheet(); S = normState(blankState()); S.sel = S.groups[0].id; ST.lastSig = sig(S); persist(); render(false); window.scrollTo(0, 0); };
    $('#b-saveas', s).onclick = () => { XM.closeSheet(); setTimeout(() => saveCurrent(true), 80); };
}
// évite de perdre un estimatif modifié non enregistré
async function guardDirty() {
    if (!isDirty()) return true;
    const i = await XM.ask('Estimatif non enregistré', 'L\'estimatif en cours a été modifié. Que faire avant de continuer ?', ['Enregistrer puis continuer', { label: 'Continuer sans enregistrer', danger: true }, 'Annuler']);
    if (i === 0) { await saveCurrent(); return !isDirty(); }
    return i === 1;
}

// ---------- échange avec le bureau ----------
function retData(s) {
    const R = calc(s), E = s.est;
    return {
        name: s.name || '', est: Object.assign({}, E),
        groups: s.groups.map(g => { const o = { n: Math.max(1, Math.round(+g.n || 1)), name: g.name, codec: g.codec, res: g.res, fps: g.fps, hours: g.hours, cardGB: g.cardGB, tracks: g.tracks }; if (g.res === 'custom') { o.w = g.w; o.h = g.h; } if (g.mbps) o.mbps = g.mbps; if (g.ids && g.ids.length) o.ids = g.ids; return o; }),
        res: { dayGB: Math.round(R.dayGB * 10) / 10, totalGB: Math.round(R.totalGB), allGB: Math.round(R.allGB), disksTotal: R.disksTotal, disksPerCopy: R.disksPerCopy, diskTB: E.diskTB, offloadSec: Math.round(R.offloadSec), cards: R.cardsRot }
    };
}
function sendReturn(s) {
    s = s || S;
    if (!s.groups.length) { toast('Ajoutez au moins une source avant de renvoyer'); return; }
    XM.send({ app: APP, page: 'backupo.html', title: 'BACKUPO', kind: 'return', name: s.name || 'Estimatif express', make: () => retData(s), file: 'BACKUPO_estimatif_' + XM.safe(s.name || 'express') + '.xiii-m.json',
        heading: 'Renvoyer au bureau', note: 'Sur l\'ordinateur, ouvrez BACKUPO XIII, touchez 📱 puis « Importer » (ou ouvrez ce lien) : vous choisirez d\'ajouter ces caméras au dispositif ou de ne reprendre que les paramètres.' });
}
function onEnv(env, via) {
    if (env.kind === 'return') { toast('Ce fichier est un retour mobile : à ouvrir sur le bureau'); return; }
    const d = env.data || {};
    const groups = Array.isArray(d.cams) ? d.cams.map(c => mkGroup({ n: 1, ids: c.id ? [c.id] : undefined, name: c.name || '', codec: CODEC_MAP[c.codec] ? c.codec : 'custom', res: c.res || 'hd', w: c.w, h: c.h, fps: c.fps, hours: c.hours, cardGB: c.cardGB, mbps: c.mbps || null, tracks: c.tracks || 2 })) : [];
    const next = normState({ name: env.name || d.name || 'Projet du bureau', est: d.est || {}, groups });
    return (async () => {
        if (!(await guardDirty())) return;
        S = next; if (S.groups.length) S.sel = S.groups[0].id; ST.lastSig = sig(S); ST.intro = false; persist(); render(false); window.scrollTo(0, 0);
        toast('📥 « ' + (S.name || 'Projet') + ' » reçu : ' + S.groups.length + ' source' + (S.groups.length > 1 ? 's' : '') + ' · ' + dayLbl(+S.est.days || 1), 4500);
    })();
}
function openRecv() {
    const s = XM.sheet('<p style="margin:0 0 12px;color:var(--text-muted)">Sur l\'ordinateur, ouvrez <b>BACKUPO XIII</b> avec votre projet, touchez <b>📱</b> dans la barre d\'outils puis <b>Envoyer vers le mobile</b>.</p><div class="m-list" style="margin:0 0 4px"><div class="m-item" style="cursor:default"><span class="ico">📷</span><span class="grow"><b>Scanner le QR code</b><small>Avec l\'appareil photo : la page s\'ouvre déjà remplie</small></span></div></div>' +
        '<div class="m-actions"><button class="m-btn" id="b-rl">🔗 Coller un lien</button><button class="m-btn" id="b-rf">📂 Importer un fichier</button></div>', { title: '📥 Recevoir un projet' });
    $('#b-rl', s).onclick = () => { XM.closeSheet(); setTimeout(() => XM.importLink(APP, onEnv), 80); };
    $('#b-rf', s).onclick = () => { XM.closeSheet(); XM.importFile(APP, onEnv); };
}

// ---------- ajout d'une source ----------
let addBrand = 'sony';
function openAdd() {
    const draw = () => {
        const b = BRANDS.find(x => x[0] === addBrand);
        $('#b-addbody').innerHTML = '<div class="m-chips">' + BRANDS.map(x => '<button type="button" class="m-chip' + (x[0] === addBrand ? ' on' : '') + '" data-b="' + x[0] + '">' + esc(x[1]) + '</button>').join('') + '</div><div class="m-list" style="margin:0">' +
            b[3].map((p, i) => '<button class="m-item" data-p="' + i + '"><span class="grow"><b>' + esc(p[0]) + '</b><small>' + esc(codec(p[1]).label + (resOf(p[2]) ? ' · ' + resOf(p[2])[1].split(' ')[0] : '') + ' · ' + p[5]) + '</small></span><span class="go">＋</span></button>').join('') + '</div>';
        $$('[data-b]', $('#b-addbody')).forEach(el => el.onclick = () => { addBrand = el.dataset.b; draw(); });
        $$('[data-p]', $('#b-addbody')).forEach(el => el.onclick = () => { const g = fromBrand(addBrand, b[3][+el.dataset.p][0]); addGroup(g); XM.closeSheet(); });
    };
    XM.sheet('<div id="b-addbody"></div><button class="m-btn block" id="b-addc" style="margin-top:10px">＋ Source personnalisée</button>', { title: 'Ajouter une source' });
    $('#b-addc').onclick = () => { addGroup(mkGroup({ name: 'Caméra' })); XM.closeSheet(); };
    draw();
}
function addGroup(g) { S.groups.push(g); S.sel = g.id; changed(); render(); toast('🎥 ' + g.name + ' ajoutée'); }

// ---------- événements ----------
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const pnum = v => parseFloat(String(v).replace(',', '.')) || 0;
function setGroupField(g, f, v) {
    if (['fps', 'hours', 'cardGB', 'w', 'h', 'tracks'].includes(f)) v = Math.max(0, pnum(v));
    if (f === 'mbps') v = String(v).trim() === '' ? null : Math.max(0, pnum(v)) || null;
    g[f] = v;
    if (f === 'res') { const r = resOf(v); if (r && r[0] !== 'custom') { g.w = r[2]; g.h = r[3]; } }
    if (f === 'codec') { g.mbps = null; if (codec(v).mode === 'audio' && !g.tracks) g.tracks = 8; }
}
$('#b-main').addEventListener('click', async e => {
    const t = e.target.closest('[data-act]'); if (!t) return;
    const a = t.dataset.act, g = selG(), d = +t.dataset.d || 0;
    if (a === 'sel') { if (S.sel !== t.dataset.id) { S.sel = t.dataset.id; changed(); render(); } return; }
    if (a === 'gn') { const x = S.groups.find(q => q.id === t.dataset.id); if (x) { x.n = clamp((+x.n || 1) + d, 1, 99); S.sel = x.id; changed(); render(); } return; }
    if (a === 'est') { const k = t.dataset.k, step = +t.dataset.step; S.est[k] = clamp(Math.round(((+S.est[k] || 0) + d * step) * 100) / 100, +t.dataset.min, +t.dataset.max); changed(); render(); return; }
    if (a === 'estset') { S.est[t.dataset.k] = +t.dataset.v; changed(); render(); return; }
    if (a === 'gstep' && g) { const f = t.dataset.f; g[f] = clamp(Math.round(((+g[f] || 0) + d * +t.dataset.step) * 100) / 100, +t.dataset.min, +t.dataset.max); changed(); render(); return; }
    if (a === 'gfps' && g) { g.fps = +t.dataset.v; changed(); render(); return; }
    if (a === 'gcard' && g) { g.cardGB = +t.dataset.v; changed(); render(); return; }
    if (a === 'gadd') { openAdd(); return; }
    if (a === 'gdup' && g) { const c = Object.assign({}, g, { id: uid(), ids: undefined, name: g.name + ' (copie)' }); S.groups.splice(S.groups.indexOf(g) + 1, 0, c); S.sel = c.id; changed(); render(); return; }
    if (a === 'gdel' && g) {
        const i = await XM.ask('Retirer « ' + (g.name || 'cette source') + ' » ?', 'Cette source ne sera plus comptée dans l\'estimatif.', [{ label: 'Retirer', danger: true }, 'Annuler']); if (i !== 0) return;
        const k = S.groups.indexOf(g); S.groups.splice(k, 1); S.sel = S.groups.length ? S.groups[Math.min(k, S.groups.length - 1)].id : null; changed(); render(); return;
    }
    if (a === 'preset') {
        const p = PRESETS.find(x => x.k === t.dataset.k); if (!p) return;
        if (!(await guardDirty())) return;
        S = presetState(p); ST.lastSig = sig(S); persist(); render(false); toast(p.ico + ' ' + p.label + ' chargé : ajustez à votre tournage'); return;
    }
    if (a === 'example') { const p = PRESETS.find(x => x.k === 'concert'); if (!(await guardDirty())) return; S = presetState(p); ST.lastSig = sig(S); ST.intro = false; persist(); render(false); window.scrollTo(0, 0); toast('🎸 Exemple chargé : concert 6 caméras'); return; }
    if (a === 'intro-x') { ST.intro = false; persist(); render(); return; }
    if (a === 'recv') { openRecv(); return; }
    if (a === 'copy') { doCopy(); return; }
    if (a === 'share') { doShare(); return; }
    if (a === 'save') { saveCurrent(); return; }
    if (a === 'ret') { sendReturn(); return; }
});
$('#b-main').addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.b-src')) { e.preventDefault(); e.target.click(); } });
$('#b-main').addEventListener('input', e => {
    const t = e.target;
    if (t.id === 'b-name') { S.name = t.value; changed(); $('#b-sub').textContent = (S.name || 'Estimatif express') + ' · ' + calc(S).nSrc + ' src · ' + dayLbl(calc(S).days); return; }
    const g = selG();
    if (t.dataset.gf && g && (t.dataset.live !== undefined || t.type === 'text')) { setGroupField(g, t.dataset.gf, t.value); changed(); if (t.dataset.gf === 'name') { const m = $('.b-src.on .mid b'); if (m) m.textContent = (g.name || 'Source') + (g.n > 1 ? ' ×' + g.n : ''); const h = $('.b-edit h4'); if (h) h.textContent = 'Réglages · ' + (g.name || 'source'); } renderRes(); return; }
    if (t.dataset.ef && t.dataset.live !== undefined) { S.est[t.dataset.ef] = Math.max(0, pnum(t.value)); changed(); renderRes(); }
});
$('#b-main').addEventListener('change', e => {
    const t = e.target, g = selG();
    if (t.dataset.act === 'brand' && g && t.value) { const [b, i] = t.value.split(':'), br = BRANDS.find(x => x[0] === b), p = br[3][+i], n = g.n, ids = g.ids, id = g.id; const ng = fromBrand(b, p[0], { id, n, ids }); S.groups[S.groups.indexOf(g)] = ng; changed(); render(); return; }
    if (t.dataset.gf && g) { setGroupField(g, t.dataset.gf, t.value); changed(); render(); return; }
    if (t.dataset.ef) { const k = t.dataset.ef; if (t.type === 'checkbox') S.est[k] = t.checked; else if (k === 'proxyCodec') S.est[k] = t.value; else S.est[k] = Math.max(0, pnum(t.value)); changed(); render(); }
});
$('#b-sum').onclick = () => { const r = $('#b-results'); if (r) r.scrollIntoView({ behavior: 'smooth', block: 'start' }); };
$('#b-list').onclick = openList;
$('#b-menu').onclick = () => XM.menu({
    app: APP, deskPage: 'backupo.html', onImport: onEnv, sendReturn: () => sendReturn(),
    items: [
        { icon: '📋', label: 'Mes estimatifs', sub: ST.saved.length + ' enregistré' + (ST.saved.length > 1 ? 's' : ''), run: openList },
        { icon: '💾', label: 'Enregistrer sous…', sub: 'Garder une copie nommée', run: () => saveCurrent(true) },
        { icon: '📋', label: 'Copier le résumé', run: doCopy },
        { icon: '↺', label: 'Nouvel estimatif', sub: 'Repartir de zéro', run: async () => { if (!(await guardDirty())) return; S = normState(blankState()); S.sel = S.groups[0].id; ST.lastSig = sig(S); persist(); render(false); window.scrollTo(0, 0); } },
        { icon: '📥', label: 'Recevoir un projet du bureau', sub: 'QR code, lien ou fichier', run: openRecv }]
});
// réception par lien (#mx=…), puis premier affichage
render(false);
XM.fromHash(APP, onEnv);

</script>
</body>
