<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>SUITE XIII — Document partagé</title>
<style>
:root{--bg:#f3f1ee;--panel:#fff;--fg:#1d1b19;--dim:#6d675f;--line:#ddd7cf;--acc:#b8651f}
@media (prefers-color-scheme:dark){:root{--bg:#161618;--panel:#1f1f23;--fg:#f1ece6;--dim:#a39b91;--line:#34343b;--acc:#f0b378}}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header .t{flex:1;min-width:200px}header small{display:block;color:var(--dim);font-size:12px;letter-spacing:.06em}
header b{font-size:17px}
.ro{font-size:11px;border:1px solid var(--line);border-radius:99px;padding:2px 9px;color:var(--dim);white-space:nowrap}
button,a.btn{font:inherit;font-size:14px;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;text-decoration:none}
.msg{margin:12px 16px 0;padding:10px 14px;border-left:4px solid var(--acc);background:var(--panel);border-radius:6px;white-space:pre-wrap}
main{flex:1;display:flex;padding:12px 16px 16px;min-height:0}
iframe{flex:1;width:100%;border:1px solid var(--line);border-radius:8px;background:#fff;min-height:70vh}
.img{max-width:100%;margin:auto;display:block;border-radius:6px}
.err{margin:15vh auto;max-width:460px;text-align:center;color:var(--dim)}
footer{text-align:center;color:var(--dim);font-size:12px;padding:8px}
@media print{header,footer,.msg{display:none}main{padding:0}iframe{border:0;min-height:100vh}}
</style>
<link rel="icon" type="image/png" href="xiii-icon-192.png">
</head>
<body>
<header><div class="t"><small id="h-app">SUITE XIII</small><b id="h-t">Document partagé</b></div><span class="ro">🔒 Lecture seule</span><a class="btn" id="h-dl" hidden>⬇️ Télécharger</a><button onclick="window.print()">🖨️ Imprimer</button></header>
<div id="msg" class="msg" hidden></div>
<main id="m"><p class="err">Chargement…</p></main>
<footer id="ft">Document partagé avec la SUITE XIII — application développée par Matthieu Lamotte</footer>
<script>
/*XSH_EMBED*/
(async function () {
    const m = document.getElementById('m'), err = t => { m.innerHTML = '<div class="err"><p style="font-size:40px;margin:0">🔗</p><p>' + t + '</p></div>'; };
    const code = window.XSH_EMBED || decodeURIComponent((location.hash || '').slice(1));
    if (!code) { err('Ce lien ne contient aucun document. Demandez à l\'expéditeur de le renvoyer.'); return; }
    const u8 = s => { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; return Uint8Array.from(atob(s), c => c.charCodeAt(0)); };
    let D;
    try {
        const kind = code.slice(0, 2), data = u8(code.slice(2));
        let txt; if (kind === 'z.') { if (typeof DecompressionStream !== 'function') throw new Error('Navigateur trop ancien'); txt = await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text(); } else txt = new TextDecoder().decode(data);
        D = JSON.parse(txt);
    } catch (e) { err('Lien incomplet ou abîmé (il a peut-être été coupé par la messagerie). Demandez un nouveau lien ou la page autonome.'); return; }
    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    document.title = D.t + (D.p ? ' — ' + D.p : '');
    document.getElementById('h-app').textContent = (D.a || 'SUITE XIII') + (D.d ? ' · ' + new Date(D.d).toLocaleString('fr-FR', { dateStyle: 'medium', timeStyle: 'short' }) : '');
    document.getElementById('h-t').textContent = D.t + (D.p ? ' — ' + D.p : '');
    if (D.m) { const g = document.getElementById('msg'); g.hidden = false; g.textContent = D.m; }
    if (D.k === 'h') {
        // contenu affiché dans un cadre isolé : aucun script, aucun accès aux données de ce site
        const f = document.createElement('iframe'); f.setAttribute('sandbox', 'allow-popups allow-modals'); f.title = D.t;
        f.srcdoc = '<!doctype html><meta charset="utf-8"><base target="_blank"><style>body{font:14px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif;color:#1d1b19;margin:20px;max-width:1100px}table{border-collapse:collapse;width:100%;margin:8px 0 16px}th,td{border:1px solid #ddd;padding:5px 8px;text-align:left;vertical-align:top}th{background:#f4f1ec}h1{font-size:22px}h2{font-size:17px;border-bottom:2px solid #b8651f;padding-bottom:3px;margin-top:22px}img{max-width:100%}</style>' + D.h;
        m.innerHTML = ''; m.appendChild(f);
        const dl = document.getElementById('h-dl'); dl.hidden = false; dl.download = (D.t || 'document') + '.html'; dl.href = URL.createObjectURL(new Blob(['<!doctype html><meta charset="utf-8"><title>' + esc(D.t) + '</title>' + D.h], { type: 'text/html' }));
    } else {
        const blob = new Blob([u8(D.b.replace(/\+/g, '-').replace(/\//g, '_'))], { type: D.y || 'application/octet-stream' }), url = URL.createObjectURL(blob);
        const dl = document.getElementById('h-dl'); dl.hidden = false; dl.href = url; dl.download = D.n || 'document';
        if (D.k === 'p') { m.innerHTML = '<iframe title="' + esc(D.t) + '" src="' + url + '#view=FitH"></iframe>'; }
        else if (D.k === 'i') { m.innerHTML = '<img class="img" alt="' + esc(D.t) + '" src="' + url + '">'; }
        else m.innerHTML = '<div class="err"><p>📎 ' + esc(D.n) + '</p><p><a class="btn" href="' + url + '" download="' + esc(D.n) + '">⬇️ Télécharger le fichier</a></p></div>';
    }
})();
</script>
<script>
// 📱 XIII Équipe : une fois dans l'application, on y reste (l'accueil ramène à l'application, pas au site)
(function () {
    if (window.__xinapp) return; window.__xinapp = 1;
    var page = (location.pathname.split('/').pop() || 'index.html').toLowerCase();
    try { if (page === 'equipe.html' && (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (window.matchMedia && matchMedia('(display-mode: standalone)').matches))) sessionStorage.setItem('xiii.inapp', '1'); } catch (e) { }
    function inApp() { try { return sessionStorage.getItem('xiii.inapp') === '1'; } catch (e) { return false; } }
    if (!inApp()) return;
    if (page === 'index.html' || page === '') { location.replace('equipe.html'); return; }
    document.addEventListener('click', function (e) {
        var a = e.target.closest && e.target.closest('a[href]'); if (!a) return;
        var u; try { u = new URL(a.getAttribute('href'), location.href); } catch (er) { return; }
        if (u.origin !== location.origin) return;
        var f = (u.pathname.split('/').pop() || 'index.html').toLowerCase();
        if (f === 'index.html' || f === '') { e.preventDefault(); e.stopPropagation(); location.href = 'equipe.html'; return; }
        if (a.target === '_blank') { a.removeAttribute('target'); }
    }, true);
})();
</script>
</body>
</html>
