<script>// =====================================================================
//  XANN — liaison régie ⇄ équipe sans serveur à installer :
//  • canal commun chiffré (AES-GCM, clé dans le lien) : annonces, planning de l'équipe (état « retenu »)
//  • échanges privés (ECDH P-256) : chaque membre a sa propre clé avec la régie pour ses demandes et ses infos
//  Relais : serveurs MQTT publics gratuits (WebSocket). Plusieurs relais de secours.
// =====================================================================
const XANN = (() => {
    const BROKERS = ['wss://broker.emqx.io:8084/mqtt', 'wss://broker.hivemq.com:8884/mqtt', 'wss://test.mosquitto.org:8081/mqtt'];
    const te = new TextEncoder(), td = new TextDecoder();
    const b64u = u8 => { let s = ''; for (let i = 0; i < u8.length; i += 32768) s += String.fromCharCode.apply(null, u8.subarray(i, i + 32768)); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
    const ub64 = s => { s = String(s || '').replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; return Uint8Array.from(atob(s), c => c.charCodeAt(0)); };
    const rnd = n => crypto.getRandomValues(new Uint8Array(n));
    const newChannel = () => ({ room: b64u(rnd(12)), key: b64u(rnd(16)) });
    async function keyOf(k) { return crypto.subtle.importKey('raw', ub64(k), 'AES-GCM', false, ['encrypt', 'decrypt']); }
    async function z(u8, inv) { if (typeof CompressionStream !== 'function') return null; const s = new Blob([u8]).stream().pipeThrough(inv ? new DecompressionStream('deflate-raw') : new CompressionStream('deflate-raw')); return new Uint8Array(await new Response(s).arrayBuffer()); }
    async function seal(key, obj) { let pt = te.encode(JSON.stringify(obj)), f = 0; if (pt.length > 600) { const c = await z(pt); if (c) { pt = c; f = 1; } } const iv = rnd(12), ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, pt)), out = new Uint8Array(13 + ct.length); out[0] = f; out.set(iv, 1); out.set(ct, 13); return out; }
    async function open(key, u8) { let pt = new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u8.slice(1, 13) }, key, u8.slice(13))); if (u8[0] === 1) pt = await z(pt, true); return JSON.parse(td.decode(pt)); }
    // ---------- clés personnelles (ECDH) ----------
    const EC = { name: 'ECDH', namedCurve: 'P-256' };
    async function newPair() { const k = await crypto.subtle.generateKey(EC, true, ['deriveKey']); return { pub: b64u(new Uint8Array(await crypto.subtle.exportKey('raw', k.publicKey))), priv: await crypto.subtle.exportKey('jwk', k.privateKey) }; }
    const SH = {};
    async function shared(privJwk, pubB64) { const k = pubB64 + '|' + privJwk.d; if (SH[k]) return SH[k]; const priv = await crypto.subtle.importKey('jwk', privJwk, EC, false, ['deriveKey']), pub = await crypto.subtle.importKey('raw', ub64(pubB64), EC, false, []); return SH[k] = await crypto.subtle.deriveKey({ name: 'ECDH', public: pub }, priv, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']); }
    async function uidOf(pubB64) { return b64u(new Uint8Array(await crypto.subtle.digest('SHA-256', ub64(pubB64)))).slice(0, 16); }
    // ---------- client MQTT 3.1.1 minimal (WebSocket) ----------
    const str = s => { const b = te.encode(s); return [b.length >> 8, b.length & 255, ...b]; };
    const varint = n => { const o = []; do { let d = n % 128; n = Math.floor(n / 128); if (n > 0) d |= 128; o.push(d); } while (n > 0); return o; };
    function pkt(h, head, payload) { const p = payload || new Uint8Array(0), vl = varint(head.length + p.length), out = new Uint8Array(1 + vl.length + head.length + p.length); out[0] = h; out.set(vl, 1); out.set(head, 1 + vl.length); out.set(p, 1 + vl.length + head.length); return out; }
    function Mqtt(url, onMsg, onState) {
        let ws = null, buf = new Uint8Array(0), pid = 1, ping = null, subs = [], up = false, closed = false, retry = 0, queue = [];
        const send = u8 => { try { if (ws && ws.readyState === 1) { ws.send(u8); return true; } } catch (e) { } return false; };
        function connect() {
            if (closed) return; onState('wait');
            try { ws = new WebSocket(url, 'mqtt'); } catch (e) { onState('ko'); return later(); }
            ws.binaryType = 'arraybuffer';
            ws.onopen = () => send(pkt(0x10, [...str('MQTT'), 4, 0x02, 0, 60, ...str('xiii' + b64u(rnd(9)))]));
            ws.onmessage = e => { const d = new Uint8Array(e.data), n = new Uint8Array(buf.length + d.length); n.set(buf); n.set(d, buf.length); buf = n; parse(); };
            ws.onclose = () => { up = false; clearInterval(ping); onState('ko'); later(); };
            ws.onerror = () => { };
        }
        function later() { if (!closed) setTimeout(connect, Math.min(20000, 1500 * ++retry)); }
        function parse() {
            for (;;) {
                if (buf.length < 2) return; let m = 1, len = 0, i = 1, b; do { if (i >= buf.length) return; b = buf[i++]; len += (b & 127) * m; m *= 128; } while (b & 128);
                if (buf.length < i + len) return; const h = buf[0], body = buf.slice(i, i + len); buf = buf.slice(i + len); const t = h >> 4;
                if (t === 2) { if (body[1] === 0) { up = true; retry = 0; onState('ok'); subs.forEach(s => sub(s)); queue.splice(0).forEach(q => send(q)); clearInterval(ping); ping = setInterval(() => send(new Uint8Array([0xC0, 0])), 30000); } else onState('ko'); }
                else if (t === 3) { const tl = (body[0] << 8) | body[1], topic = td.decode(body.slice(2, 2 + tl)), q = (h >> 1) & 3; let p = 2 + tl; if (q) p += 2; onMsg(topic, body.slice(p), !!(h & 1)); }
            }
        }
        function sub(topic) { const id = (pid++ & 0xffff) || 1; send(pkt(0x82, [id >> 8, id & 255, ...str(topic), 0])); }
        connect();
        return {
            sub(t) { if (subs.indexOf(t) < 0) subs.push(t); if (up) sub(t); },
            pub(t, u8, retain, keep) { const p = pkt(0x30 | (retain ? 1 : 0), str(t), u8); if (up && send(p)) return true; if (keep) queue.push(p); return false; },
            close() { closed = true; clearInterval(ping); try { ws && ws.close(); } catch (e) { } },
            get up() { return up; }, url
        };
    }
    // ---------- canal ----------
    async function join(ch, role, h) {
        const key = await keyOf(ch.key), base = 'xiii-ann/' + ch.room, list = ch.brokers && ch.brokers.length ? ch.brokers : BROKERS, conns = [], st = {};
        const me = ch.pair || null; let peer = null, myUid = me ? await uidOf(me.pub) : null; const pending = [];
        const state = () => { const v = Object.values(st); h.state && h.state(v.includes('ok') ? 'ok' : v.includes('wait') ? 'wait' : 'ko', conns.filter(c => c.up).length); };
        const onMsg = async (topic, u8, ret) => {
            try {
                if (topic === base + '/s') { const o = await open(key, u8); if (role === 'equipe' && o.rp && o.rp !== peer) { peer = o.rp; pending.splice(0).forEach(x => onMsg(x[0], x[1], x[2])); } h.state_msg && h.state_msg(o, ret); }
                else if (topic.indexOf(base + '/p/') === 0) { h.prof && h.prof(await open(key, u8)); }
                else if (topic.indexOf(base + '/cl/') === 0) { h.clog && h.clog(await open(key, u8)); }
                else if (topic === base + '/a') h.ack && h.ack(await open(key, u8));
                else if (topic === base + '/q' && role === 'regie') { const o = await open(key, u8); if (!o.pub || !o.box) return; const k = await shared(ch.pair.priv, o.pub); h.req && h.req(await open(k, ub64(o.box)), o.pub, await uidOf(o.pub)); }
                else if (topic === base + '/u/' + myUid && role === 'equipe') { if (!peer) { pending.push([topic, u8, ret]); return; } const k = await shared(me.priv, peer); h.mine && h.mine(await open(k, u8)); }
            } catch (e) { }
        };
        function add(url) { const c = Mqtt(url, onMsg, s => { st[url] = s; state(); }); c.sub(base + '/s'); if (h.clog) { c.sub(base + '/p/+'); c.sub(base + '/cl/+'); } if (role === 'regie') { c.sub(base + '/a'); c.sub(base + '/q'); } else if (myUid) c.sub(base + '/u/' + myUid); conns.push(c); return c; }
        if (role === 'regie') list.forEach(add);
        else { let i = 0; const tryNext = () => { const c = add(list[i]); setTimeout(() => { if (!c.up && conns.every(x => !x.up) && i < list.length - 1) { i++; tryNext(); } }, 6000); }; tryNext(); }
        const pubAll = (t, u8, ret, keep) => { let n = 0; conns.forEach(c => { if (c.pub(t, u8, ret, keep)) n++; }); return n; };
        return {
            async publishState(o) { return pubAll(base + '/s', await seal(key, o), true); },
            async ack(o) { return pubAll(base + '/a', await seal(key, o), false, true); },
            // équipe → régie (privé)
            async send(o) { if (!peer) return -1; const k = await shared(me.priv, peer); return pubAll(base + '/q', await seal(key, { pub: me.pub, box: b64u(await seal(k, o)) }), false, true); },
            // régie → un membre (privé, retenu)
            async reply(pub, o) { const k = await shared(ch.pair.priv, pub); return pubAll(base + '/u/' + await uidOf(pub), await seal(k, o), true, true); },
            get peer() { return peer; },
            // 💭 chat : fiche de chacun (retenue) et journal des messages de chacun (retenu, 80 derniers)
            uid: myUid,
            async pubProfile(o) { return pubAll(base + '/p/' + myUid, await seal(key, o), true, true); },
            async pubLog(o) { return pubAll(base + '/cl/' + myUid, await seal(key, o), true, true); },
            async sealFor(pub, o) { return b64u(await seal(await shared(me.priv, pub), o)); },
            async openFrom(pub, b) { return open(await shared(me.priv, pub), ub64(b)); },
            close() { conns.forEach(c => c.close()); },
            get count() { return conns.filter(c => c.up).length; }
        };
    }
    const DEPTS = [['', 'Toute l\'équipe'], ['prod', 'Production'], ['real', 'Réalisation'], ['image', 'Image'], ['elec', 'Électro'], ['machino', 'Machinerie'], ['son', 'Son'], ['deco', 'Décoration'], ['cost', 'Costumes'], ['hmc', 'Maquillage / Coiffure'], ['regie', 'Régie'], ['cast', 'Comédiens / Talents'], ['fig', 'Figuration'], ['secu', 'Sécurité / Secours'], ['transport', 'Transport'], ['cantine', 'Cantine / Catering'], ['post', 'DIT / Post-prod'], ['autre', 'Autre']];
    const deptName = k => (DEPTS.find(d => d[0] === k) || [k, k || ''])[1];
    const LVL = { info: ['Info', '#64b5f6'], imp: ['Important', '#ffb74d'], urg: ['URGENT', '#ef5350'] };
    const REQ = [['retard', '⏰ Retard'], ['absence', '🚫 Absence / indisponibilité'], ['question', '❓ Question'], ['transport', '🚗 Transport / parking'], ['materiel', '🧰 Matériel'], ['repas', '🍽 Repas / régime'], ['hebergement', '🛏 Hébergement'], ['admin', '📄 Administratif / paie'], ['autre', '✏️ Autre']];
    const RST = { new: ['Envoyée', '#64b5f6'], seen: ['Lue', '#90a4ae'], wip: ['En cours', '#ffb74d'], ok: ['Traitée', '#66bb6a'], no: ['Refusée', '#ef5350'] };
    const fold = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
    // ---------- 💭 CHAT de tournage : général, par équipe, privé (chiffré de bout en bout entre deux personnes) ----------
    function Chat(CH, o) { // o : { pair, store: {get,set}, me: () => ({name, dept, role}), onNew(msg), onChange() }
        const myUid = CH.uid, D = o.store.get('dir', {}), M = o.store.get('msgs', []), R = o.store.get('read', {}); let LOG = o.store.get('log', []);
        const ids = new Set(M.map(m => m.id)); let timer = null;
        const save = () => { o.store.set('dir', D); o.store.set('msgs', M.slice(-600)); o.store.set('read', R); o.store.set('log', LOG); };
        const changed = () => { clearTimeout(timer); timer = setTimeout(() => { save(); o.onChange && o.onChange(); }, 120); };
        async function profile() { const m = o.me(); if (!m || !m.name) return; D[myUid] = { uid: myUid, pub: o.pair.pub, name: m.name, dept: m.dept || '', role: m.role || 'equipe', at: Date.now() }; await CH.pubProfile(D[myUid]); changed(); }
        function prof(p) { if (!p || !p.uid || !p.pub) return; const old = D[p.uid]; if (!old || (p.at || 0) >= (old.at || 0)) { D[p.uid] = p; changed(); } }
        async function clog(x) {
            if (!x || !x.uid || !Array.isArray(x.log)) return; const from = D[x.uid] || (x.prof && x.prof.pub ? (D[x.uid] = x.prof) : null); let n = 0;
            for (const e of x.log) {
                if (!e || !e.id || ids.has(e.id)) continue;
                let txt = e.txt;
                if (e.c === 'dm') { if (e.to !== myUid && e.from !== myUid) { ids.add(e.id); continue; } try { const peer = e.from === myUid ? D[e.to] : from; if (!peer) continue; txt = (await CH.openFrom(peer.pub, e.box)).txt; } catch (er) { continue; } }
                const m = { id: e.id, ts: e.ts, from: e.from, name: e.name, dept: e.dept, c: e.c === 'dm' ? 'dm:' + (e.from === myUid ? e.to : e.from) : e.c, txt };
                ids.add(e.id); M.push(m); n++; if (e.from !== myUid && o.onNew) o.onNew(m);
            }
            if (n) { M.sort((a, b) => a.ts - b.ts); changed(); }
        }
        async function send(conv, txt) {
            txt = String(txt || '').trim().slice(0, 2000); if (!txt) return false; const m = o.me() || {};
            const e = { id: 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), ts: Date.now(), from: myUid, name: m.name || '?', dept: m.dept || '' };
            if (conv.indexOf('dm:') === 0) { const to = conv.slice(3), peer = D[to]; if (!peer) return false; e.c = 'dm'; e.to = to; e.box = await CH.sealFor(peer.pub, { txt }); }
            else { e.c = conv; e.txt = txt; }
            LOG.push(e); LOG = LOG.slice(-80);
            M.push({ id: e.id, ts: e.ts, from: myUid, name: e.name, dept: e.dept, c: conv, txt }); ids.add(e.id); R[conv] = Date.now(); changed();
            return (await CH.pubLog({ uid: myUid, prof: D[myUid], log: LOG })) > 0;
        }
        const unread = conv => M.filter(m => m.c === conv && m.from !== myUid && m.ts > (R[conv] || 0)).length;
        function convs() { // conversations visibles pour moi
            const me = o.me() || {}, regie = me.role === 'regie', out = [{ k: 'all', t: '📢 Toute l\'équipe' }];
            const depts = new Set(); Object.values(D).forEach(p => p.dept && depts.add(p.dept)); M.forEach(m => m.c.indexOf('team:') === 0 && depts.add(m.c.slice(5)));
            (regie ? [...depts] : (me.dept ? [me.dept] : [])).forEach(d => out.push({ k: 'team:' + d, t: '👥 ' + deptName(d) }));

        $('m').querySelectorAll('[data-ack]').forEach(b => b.onclick = async () => { const id = b.dataset.ack; if (CH) await CH.ack({ id, n: (me && me.n) || 'Anonyme', d: myDept(), at: Date.now() }); acked[id] = 1; SV('acks', acked); draw(); });
        const bn = $('b-notif'); if (bn) bn.onclick = () => Notification.requestPermission().then(draw);
        const ics = $('b-ics'); if (ics) ics.onclick = makeIcs;
        const sel = $('me-sel'); if (sel) sel.onchange = () => { $('me-nl').hidden = sel.value !== '__'; if (sel.value && sel.value !== '__') $('me-n').value = sel.value; else if (sel.value === '__') $('me-n').value = ''; };
        const ok = $('me-ok'); if (ok) ok.onclick = async () => { const sv = $('me-sel') ? $('me-sel').value : '__', n = sv && sv !== '__' ? sv : $('me-n').value.trim(); if (!n) { toast('Indiquez votre nom'); return; } me = { n, d: $('me-d').value, ph: $('me-ph').value.trim(), em: $('me-em').value.trim(), food: $('me-food').value.trim(), car: $('me-car').value, ice: $('me-ice').value.trim(), note: $('me-note').value.trim() }; SV('me', me); await hello('profile'); toast('✅ Infos enregistrées'); setTab('plan'); };
        const go = $('rq-go'); if (go) go.onclick = async () => { const t = $('rq-t').value.trim(); if (!t) { $('rq-t').focus(); return; } const r = { id: XANN.b64u(crypto.getRandomValues(new Uint8Array(6))), k: $('rq-k').value, t, at: Date.now(), st: 'new', rep: [] }; reqs.push(r); SV('reqs', reqs); const n = await CH.send({ t: 'req', r: { id: r.id, k: r.k, t: r.t, at: r.at }, me }); r.sent = n > 0; SV('reqs', reqs); toast(n > 0 ? '📨 Demande envoyée à la régie' : '⏳ Envoi dès le retour du réseau'); draw(); };
        $('m').querySelectorAll('[data-fs]').forEach(b => b.onclick = async () => { const id = b.dataset.fs, inp = $('m').querySelector('[data-fu="' + id + '"]'), t = inp.value.trim(); if (!t) return; const r = reqs.find(x => x.id === id); const x = { at: Date.now(), t, by: 'moi' }; (r.rep = r.rep || []).push(x); SV('reqs', reqs); await CH.send({ t: 'msg', id, m: x, me }); draw(); });
    }
    async function hello(kind) { if (C && me) C.profile(); if (!CH || !CH.peer || !me) return; await CH.send({ t: kind || 'hello', me, at: Date.now(), ua: navigator.userAgent.slice(0, 80) }); }
    function makeIcs() {
        const E = myEntries(), esc2 = s => String(s || '').replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/[,;]/g, m => '\\' + m), loc = d => { const l = (d.locs || [])[0]; return l ? [l.name, l.address].filter(Boolean).join(', ') : ''; };
        const out = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//SUITE XIII//EQUIPE//FR'];
        E.forEach(({ d, c }) => { const call = (c.call || (d.times || {}).general || '08:00').replace(/[h:]/, ''), wrap = ((d.times || {}).wrap || '').replace(/[h:]/, ''); out.push('BEGIN:VEVENT', 'UID:eq-' + d.id + '-' + F(me.n).replace(/\W/g, '') + '@suite-xiii', 'DTSTAMP:' + new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, ''), 'DTSTART:' + d.date.replace(/-/g, '') + 'T' + call.padStart(4, '0') + '00', wrap && wrap > call ? 'DTEND:' + d.date.replace(/-/g, '') + 'T' + wrap.padStart(4, '0') + '00' : 'DURATION:PT10H', 'SUMMARY:' + esc2('🎬 ' + (S.p || 'Tournage') + ' — ' + (d.name || '')), 'LOCATION:' + esc2(loc(d)), 'DESCRIPTION:' + esc2((c.r ? c.r + '\n' : '') + 'Convocation ' + (c.call || (d.times || {}).general || '') + (c.hmc ? '\nHMC ' + c.hmc : '')), 'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:Convocation', 'TRIGGER:-PT2H', 'END:VALARM', 'END:VEVENT'); });
        out.push('END:VCALENDAR'); const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([out.filter(Boolean).join('\r\n')], { type: 'text/calendar' })); a.download = 'planning-' + F(me.n).replace(/\W+/g, '-') + '.ics'; document.body.appendChild(a); a.click(); a.remove();
    }
    // ---------- alertes ----------
    let actx = null; document.addEventListener('pointerdown', () => { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); } catch (e) { } }, { once: true });
    function ring(lvl) { try { if (!actx) return; const n = lvl === 'urg' ? 3 : lvl === 'imp' ? 2 : 1; for (let i = 0; i < n; i++) { const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + i * .32; o.frequency.value = lvl === 'urg' ? 1046 : 880; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.4, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + .25); o.connect(g).connect(actx.destination); o.start(t); o.stop(t + .27); } } catch (e) { } }
    function notify(title, body, lvl, tag) { ring(lvl); try { navigator.vibrate && navigator.vibrate(lvl === 'urg' ? [300, 120, 300, 120, 500] : [200, 100, 200]); } catch (e) { } if (document.visibilityState !== 'visible' && 'Notification' in window && Notification.permission === 'granted') { try { new Notification(title, { body, tag, renotify: true, requireInteraction: lvl === 'urg' }); } catch (e) { } } }
    $('b-wake').onclick = async () => { try { await navigator.wakeLock.request('screen'); $('b-wake').style.background = 'rgba(102,187,106,.3)'; toast('💡 L\'écran reste allumé'); } catch (e) { toast('Indisponible sur cet appareil'); } };
    // ---------- connexion ----------
    const brokers = q.get('b') ? q.get('b').split(',') : null;
    try {
        CH = await XANN.join({ room, key, brokers, pair }, 'equipe', {
            state: s => { $('dot').className = 'dot ' + (s === 'ok' ? 'ok' : s === 'ko' ? 'ko' : ''); if (s === 'ok') resend(); },
            state_msg: o => {
                const old = {}; S.list.forEach(a => old[a.id] = 1); const hadPeer = !!S.rp;
                S = { p: o.p || S.p, list: Array.isArray(o.list) ? o.list : [], sheet: o.sheet || S.sheet, rp: o.rp };
                $('pj').textContent = S.p || 'Tournage'; $('hs').textContent = me && me.n ? me.n : 'Équipe de tournage';
                const fresh = first ? [] : S.list.filter(a => !old[a.id] && mine(a)); first = false;
                fresh.forEach(a => { notify((a.lvl === 'urg' ? '🚨 ' : '📣 ') + (S.p || 'Régie'), a.t, a.lvl, a.id); if (a.lvl === 'urg') { const f = $('flash'); f.textContent = '🚨 ' + a.t; f.classList.add('on'); f.onclick = () => f.classList.remove('on'); } });
                if (!hadPeer && S.rp) { hello(); resend(); }
                if (!(tab === 'me' && document.activeElement && document.activeElement.closest && document.activeElement.closest('.set')) && !(tab === 'req' && document.activeElement && /TEXTAREA|INPUT/.test(document.activeElement.tagName))) draw(); else badges();
            },
            prof: p => C && C.prof(p), clog: x => C && C.clog(x),
            mine: o => {
                if (!o || !Array.isArray(o.reqs)) return; let news = 0;
                o.reqs.forEach(sr => { let r = reqs.find(x => x.id === sr.id); if (!r) { r = Object.assign({}, sr); reqs.push(r); } const before = (r.rep || []).filter(x => x.by === 'regie').length; r.st = sr.st; r.sent = true; r.rep = sr.rep || r.rep || []; if (r.rep.filter(x => x.by === 'regie').length > before) news++; });
                SV('reqs', reqs); if (news) notify('💬 Réponse de la régie', (S.p || ''), 'imp', 'rep');
                if (o.note && o.note.at && o.note.at !== LS('note', 0)) { SV('note', o.note.at); notify('📌 Message de la régie', o.note.t, 'imp', 'note'); }
                if (!(document.activeElement && /TEXTAREA|INPUT|SELECT/.test(document.activeElement.tagName))) draw(); else badges();
            }
        });
    } catch (e) { $('m').innerHTML = '<div class="empty">⚠️ Navigateur trop ancien pour les échanges chiffrés.</div>'; return; }
    document.getElementById('xc-css').textContent = XANN.CHAT_CSS;
    C = XANN.Chat(CH, { pair, store: { get: (k, d) => LS('chat.' + k, d), set: (k, v) => SV('chat.' + k, v) }, me: () => me && me.n ? { name: me.n, dept: myDept(), role: 'equipe' } : null,
        onNew: m => { if (m.ts < T0) return; if (!(tab === 'chat' && CV === m.c && document.visibilityState === 'visible')) { if (m.c === 'all' || m.c === 'team:' + myDept() || m.c.indexOf('dm:') === 0) notify('💭 ' + m.name, m.txt.slice(0, 120), m.c.indexOf('dm:') === 0 ? 'imp' : 'info', m.id); } },
        onChange: () => { if (tab === 'chat' && !(document.activeElement && document.activeElement.id === 'xc-t' && document.activeElement.value)) draw(); else badges(); } });
    if (me) C.profile();
    async function resend() { for (const r of reqs.filter(x => x.sent === false)) { const n = await CH.send({ t: 'req', r: { id: r.id, k: r.k, t: r.t, at: r.at }, me }); if (n > 0) r.sent = true; } SV('reqs', reqs); }
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { draw(); hello(); } });
    setInterval(() => { if (tab === 'plan') draw(); }, 60000);
    draw();
})();
</script>
<script>
// 📱 XIII Équipe : une fois dans l'application, on y reste (l'accueil ramène à l'application, pas au site)
(function () {
    if (window.__xinapp) return; window.__xinapp = 1;
    var page = (location.pathname.split('/').pop() || 'index.html').toLowerCase();
    try { if (page === 'equipe.html' && (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (window.matchMedia && matchMedia('(display-mode: standalone)').matches))) sessionStorage.setItem('xiii.inapp', '1'); } catch (e) { }
    function inApp() { try { return sessionStorage.getItem('xiii.inapp') === '1'; } catch (e) { return false; } }
    if (!inApp()) return;
    if (page === 'index.html' || page === '') { location.replace('equipe.html'); return; }
    document.addEventListener('click', function (e) {
        var a = e.target.closest && e.target.closest('a[href]'); if (!a) return;
        var u; try { u = new URL(a.getAttribute('href'), location.href); } catch (er) { return; }
        if (u.origin !== location.origin) return;
        var f = (u.pathname.split('/').pop() || 'index.html').toLowerCase();
        if (f === 'index.html' || f === '') { e.preventDefault(); e.stopPropagation(); location.href = 'equipe.html'; return; }
        if (a.target === '_blank') { a.removeAttribute('target'); }
    }, true);
})();
</script>
