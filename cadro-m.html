    else if (UI.tab === 'vf') { const fresh = !(keepVf && $('vf-box')); if (fresh) { m.innerHTML = formViseur(); wireViseur(); } else { /* garde le flux vidéo : met à jour les champs seulement */ const cards = m.querySelectorAll('.cd-card'); } vfDraw(); }
    else m.innerHTML = formCap(), wireCap();
    if (UI.tab === 'vf' && keepVf) { /* rafraîchit les valeurs des champs sans recréer la vidéo */ $$('#cd-main [data-k]').forEach(el => { if (document.activeElement !== el && S[el.dataset.k] != null) el.value = S[el.dataset.k]; }); }
    badge(); if (UI.tab !== 'vf') window.scrollTo(0, sc);
}
function upd() {
    const o = $('cd-out'); if (!o) { if (UI.tab === 'vf') vfDraw(); return; }
    o.innerHTML = UI.tab === 'cadre' ? outCadre() : outMoire(); if (UI.tab === 'moire') CDV.sim($('moire-sim'), CD.moire(S), S);
    if (UI.tab === 'cadre') { const sm = document.querySelector('[data-ex="sens"] summary'); if (sm) { const u = CD.used(S); sm.textContent = 'Capteur : ' + nf(S.sw, 2) + ' × ' + nf(S.sh, 2) + ' mm · ' + S.srw + ' × ' + S.srh + ' · pas ' + nf(u.p * 1000, 2) + ' µm — modifier'; } }
}

// ---------- transfert bureau ↔ mobile ----------
function sendReturn() {
    XM.send({ app: APP, page: 'cadro.html', title: 'CADRO', kind: 'return', name: D.name, empty: 'Aucun changement à renvoyer',
        make: () => changes() ? { my: newMy(), plans: chPlans().map(p => ({ id: p.id, name: p.name, notes: p.notes || '', ts: p.ts, S: p.S })) } : null,
        note: 'Seuls les capteurs et plans créés ou modifiés sur le téléphone sont renvoyés.' });
}
function onEnv(env) {
    if (!env || env.app !== APP || env.kind !== 'project' || !env.data) { XM.toast('⚠️ Ce fichier n\'est pas un envoi CADRO du bureau'); return; }
    const d = env.data; D.S = S = Object.assign(CD.defaults(), d.S || {}); D.plans = (d.plans || []).map(clone); D.my = (d.my || []).map(clone); D.name = d.name || env.name || 'Mon plan';
    D.base = {}; D.my.forEach(m => D.base['m:' + m.id] = 1); D.plans.forEach(p => D.base['p:' + p.id] = sig(p));
    persist(); render(); XM.toast('📥 « ' + D.name + ' » reçu : ' + plural(D.plans.length, 'plan') + ', ' + plural(D.my.length, 'capteur'), 4000);
}
function menu() {
    XM.menu({ app: APP, deskPage: 'cadro.html', onImport: onEnv, sendReturn: changes() ? sendReturn : () => XM.toast('Aucun changement à renvoyer : ajoutez un capteur ou un plan'),
        items: [{ icon: '🔄', label: 'Réinitialiser le plan', sub: 'Valeurs par défaut (plans et capteurs conservés)', run: async () => { if ((await XM.ask('Réinitialiser ?', 'Le réglage actuel revient aux valeurs par défaut.', ['Annuler', 'Réinitialiser'])) === 1) { S = D.S = CD.defaults(); persist(); render(); } } }] });
}

// ---------- démarrage ----------
function boot() {
    const sv = XM.load(APP); if (sv && sv.S) { D = Object.assign(D, sv); D.base = D.base || {}; S = D.S = Object.assign(CD.defaults(), sv.S); }
    $('cd-tabs').onclick = e => { const b = e.target.closest('button[data-tab]'); if (!b || b.dataset.tab === UI.tab) return; UI.tab = b.dataset.tab; render(); window.scrollTo(0, 0); };
    $('cd-menu').onclick = menu; $('cd-ret').onclick = sendReturn;
    $('cd-photo').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) importFile(f); }; $('cd-pfile').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) importFile(f); };
    const main = $('cd-main');
    main.addEventListener('change', e => { const el = e.target; if (el.dataset && el.dataset.k && el.tagName === 'SELECT') setK(el.dataset.k, el.value); else if (el.dataset && el.dataset.k) setK(el.dataset.k, el.value); else if (el.dataset && el.dataset.cf) { const c = UI.cand[+el.closest('[data-ci]').dataset.ci]; c[el.dataset.cf] = el.type === 'number' ? parseFloat(el.value) : el.value; } else if (el.dataset && el.dataset.pn != null) { D.plans[+el.dataset.pn].notes = el.value; persist(); } });
    main.addEventListener('input', e => { const el = e.target; if (el.dataset && el.dataset.k && el.type === 'number') setK(el.dataset.k, el.value); });
    main.addEventListener('toggle', e => { const el = e.target; if (el.dataset && el.dataset.ex) UI.open[el.dataset.ex] = el.open; }, true);
    main.addEventListener('click', e => {
        const t = e.target.closest('button,a'); if (!t) return;
        if (t.dataset.seg) { S[t.dataset.seg] = isNaN(+t.dataset.v) ? t.dataset.v : +t.dataset.v; persist(); render(); }
        else if (t.dataset.f) { setK('f', t.dataset.f); $$('[data-k="f"]').forEach(i => i.value = S.f); }
        else if (t.dataset.pitch) { setK('pitch', t.dataset.pitch); render(); }
        else if (t.dataset.takedb) { e.preventDefault(); const c = UI.cand[+t.dataset.takedb], m = c.match.sensor; c.w = m.w; c.h = m.h; c.rw = m.rw; c.rh = m.rh; c.cfa = m.cfa; c.name = m.name; render(); }
        else if (t.dataset.ca) { const i = +t.closest('[data-ci]').dataset.ci, c = UI.cand[i]; if (t.dataset.ca === 'x') { UI.cand.splice(i, 1); render(); } else if (candUse(c, t.dataset.ca === 'save')) { UI.cand.splice(i, 1); UI.tab = t.dataset.ca === 'use' ? 'cadre' : 'cap'; render(); } }
        else if (t.dataset.my) { const i = +t.dataset.i, m = D.my[i]; if (t.dataset.my === 'use') { applySensor(m); persist(); UI.tab = 'cadre'; render(); } else { D.my.splice(i, 1); if (S.sid === m.id) S.sid = 'custom'; persist(); render(); } }
        else if (t.dataset.pl) { const i = +t.dataset.i; if (t.dataset.pl === 'use') { S = D.S = Object.assign(CD.defaults(), clone(D.plans[i].S)); persist(); UI.tab = 'cadre'; render(); XM.toast('Plan chargé'); } else { D.plans.splice(i, 1); persist(); render(); } }
    });
    window.addEventListener('pagehide', vfStop);
    document.addEventListener('visibilitychange', () => { if (document.hidden) vfStop(); else if (UI.tab === 'vf') render(); });
    XM.fromHash(APP, onEnv); render();
}
boot();
})();

</script>
