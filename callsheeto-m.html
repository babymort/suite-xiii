<!DOCTYPE html>
<html lang="fr">
<head>

<title>CALL SHEETO XIII · Mobile</title>
<style>
/* SUITE XIII — socle mobile (partagé par toutes les pages *-m.html) */
:root { color-scheme: dark; --bg-main:#1e1e1e; --bg-panel:#2d2d2d; --bg-panel-alt:#252525; --bg-header:#1a1a1a; --bg-topbar:#222; --bg-input:#3a3a3a; --bg-menu:#2d2d2d; --border-color:#444; --border-soft:#333; --text-main:#fff; --text-muted:#aaa; --text-dim:#888; --row-bg:#262626; --row-alt:#2a2a2a;
  --accent:240,179,120; --accent-text:rgb(240,179,120); --btn-bg:rgba(var(--accent),.12); --btn-border:rgba(var(--accent),.35); --blue:#007acc; --danger:#e53935; --warn:#ffa726; --ok:#66bb6a;
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px); }
body.light-theme { color-scheme: light; --bg-main:#eef0f2; --bg-panel:#fff; --bg-panel-alt:#f5f6f7; --bg-header:#e4e6e8; --bg-topbar:#fff; --bg-input:#e9ebed; --bg-menu:#fff; --border-color:#d5d8db; --border-soft:#ddd; --text-main:#1a1a1a; --text-muted:#555; --text-dim:#777; --row-bg:#fff; --row-alt:#f8f9fa; --accent-text:#b8651f; --ok:#2e7d32; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body.xm { margin: 0; min-height: 100dvh; background: var(--bg-main); color: var(--text-main); font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif; font-size: 15px; line-height: 1.4; overscroll-behavior-y: none; }
body.xm a { color: var(--accent-text); }
.xm button { font-family: inherit; }
/* barre du haut */
.m-top { position: sticky; top: 0; z-index: 40; display: flex; align-items: center; gap: 8px; padding: calc(8px + var(--sat)) calc(10px + var(--sar)) 8px calc(10px + var(--sal)); background: var(--bg-topbar); border-bottom: 1px solid var(--border-soft); min-height: 56px; }
.m-top .m-title { flex: 1; min-width: 0; line-height: 1.15; }
.m-top .m-title b { display: block; font-size: 16px; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.m-top .m-title b i { font-style: normal; color: var(--accent-text); }
.m-top .m-title small { display: block; font-size: 11.5px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.m-ibtn { flex: 0 0 auto; width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; font-size: 20px; border-radius: 12px; border: 1px solid var(--btn-border); background: var(--btn-bg); color: var(--text-main); cursor: pointer; text-decoration: none; padding: 0; }
.m-ibtn:active { background: rgba(var(--accent), .35); }
.m-ibtn.plain { border-color: transparent; background: transparent; }
/* contenu */
.m-main { padding: 12px calc(14px + var(--sar)) calc(128px + var(--sab)) calc(14px + var(--sal)); max-width: 760px; margin: 0 auto; }
.m-main.no-tabs { padding-bottom: calc(28px + var(--sab)); }
.m-sec { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); margin: 18px 4px 8px; }
.m-card { background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
.m-card > h3 { margin: 0 0 10px; font-size: 14px; display: flex; align-items: center; gap: 8px; }
.m-card > h3 .grow { flex: 1; }
.m-card.accent { border-color: rgba(var(--accent), .6); background: linear-gradient(180deg, rgba(var(--accent), .12), var(--bg-panel)); }
.m-kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 14px; }
.m-kv dt { color: var(--text-dim); } .m-kv dd { margin: 0; text-align: right; font-weight: 600; word-break: break-word; }
.m-row { display: flex; align-items: center; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--border-soft); } .m-row:last-child { border-bottom: 0; }
.m-row .grow { flex: 1; min-width: 0; } .m-row small { display: block; color: var(--text-dim); font-size: 12.5px; }
.m-list { background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 14px; overflow: hidden; margin-bottom: 12px; }
.m-item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; min-height: 56px; border-bottom: 1px solid var(--border-soft); color: inherit; text-decoration: none; cursor: pointer; background: transparent; width: 100%; text-align: left; border-left: 0; border-right: 0; border-top: 0; font-size: 15px; }
.m-item:last-child { border-bottom: 0; } .m-item:active { background: rgba(var(--accent), .12); }
.m-item .ico { font-size: 22px; flex: 0 0 auto; width: 30px; text-align: center; } .m-item .grow { flex: 1; min-width: 0; } .m-item b { display: block; font-weight: 600; } .m-item small { display: block; color: var(--text-dim); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.m-item .go { color: var(--text-dim); font-size: 18px; }
.m-chip { display: inline-flex; align-items: center; gap: 5px; padding: 5px 11px; border-radius: 99px; font-size: 13px; background: var(--btn-bg); border: 1px solid var(--btn-border); color: var(--text-main); white-space: nowrap; }
.m-chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 8px; scrollbar-width: none; } .m-chips::-webkit-scrollbar { display: none; }
.m-chip.on { background: rgba(var(--accent), .4); border-color: rgba(var(--accent), .95); font-weight: 600; }
.m-pill { display: inline-block; padding: 2px 9px; border-radius: 99px; font-size: 12px; font-weight: 600; border: 1px solid var(--border-color); background: var(--bg-panel-alt); }
.m-pill.ok { color: var(--ok); border-color: rgba(102,187,106,.5); } .m-pill.warn { color: var(--warn); border-color: rgba(255,167,38,.5); } .m-pill.danger { color: #ef5350; border-color: rgba(229,57,53,.5); }
/* boutons */
.m-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 10px 18px; font-size: 15px; font-weight: 600; border-radius: 12px; border: 1px solid var(--btn-border); background: var(--btn-bg); color: var(--text-main); cursor: pointer; text-decoration: none; }
.m-btn:active { background: rgba(var(--accent), .35); }
.m-btn.primary { background: rgba(var(--accent), .3); border-color: rgba(var(--accent), .9); }
.m-btn.danger { border-color: rgba(229,57,53,.55); background: rgba(229,57,53,.14); }
.m-btn.block { display: flex; width: 100%; } .m-btn.sm { min-height: 36px; padding: 6px 12px; font-size: 13.5px; border-radius: 10px; }
.m-btn:disabled { opacity: .45; }
.m-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; } .m-actions > * { flex: 1 1 140px; }
.m-fab { position: fixed; right: calc(16px + var(--sar)); bottom: calc(120px + var(--sab)); z-index: 35; width: 58px; height: 58px; border-radius: 50%; font-size: 26px; border: 1px solid rgba(var(--accent), .95); background: rgba(var(--accent), .92); color: #1a1a1a; box-shadow: 0 6px 18px rgba(0,0,0,.45); cursor: pointer; display: flex; align-items: center; justify-content: center; }
.m-fab.no-tabs { bottom: calc(64px + var(--sab)); }
/* champs */
.m-field { display: block; margin-bottom: 12px; } .m-field > span { display: block; font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-dim); margin-bottom: 4px; }
.xm input[type=text], .xm input[type=number], .xm input[type=date], .xm input[type=time], .xm input[type=tel], .xm input[type=email], .xm input[type=search], .xm input[type=url], .xm select, .xm textarea { width: 100%; min-height: 46px; padding: 10px 12px; font-size: 16px; font-family: inherit; border: 1px solid var(--border-color); border-radius: 10px; background: var(--bg-input); color: var(--text-main); appearance: none; -webkit-appearance: none; }
.xm select { background-image: linear-gradient(45deg, transparent 50%, var(--text-dim) 50%), linear-gradient(135deg, var(--text-dim) 50%, transparent 50%); background-position: calc(100% - 18px) 20px, calc(100% - 13px) 20px; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 32px; }
.xm textarea { min-height: 90px; resize: vertical; line-height: 1.4; }
.xm input:focus, .xm select:focus, .xm textarea:focus { outline: none; border-color: rgba(var(--accent), .9); box-shadow: 0 0 0 2px rgba(var(--accent), .25); }
.xm input[type=checkbox], .xm input[type=radio] { width: 24px; height: 24px; accent-color: rgb(var(--accent)); flex: 0 0 auto; }
.m-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; } .m-grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.m-seg { display: flex; border: 1px solid var(--btn-border); border-radius: 12px; overflow: hidden; margin-bottom: 12px; } .m-seg button { flex: 1; min-height: 44px; border: 0; border-right: 1px solid var(--btn-border); background: var(--btn-bg); color: var(--text-main); font-size: 14px; font-weight: 600; cursor: pointer; } .m-seg button:last-child { border-right: 0; } .m-seg button.on { background: rgba(var(--accent), .45); }
.m-progress { height: 8px; border-radius: 99px; background: var(--bg-input); overflow: hidden; } .m-progress > i { display: block; height: 100%; background: rgb(var(--accent)); border-radius: 99px; transition: width .25s; }
.m-empty { text-align: center; color: var(--text-dim); padding: 34px 18px; font-size: 14px; } .m-empty b { display: block; font-size: 38px; margin-bottom: 8px; }
.m-hint { font-size: 12.5px; color: var(--text-dim); line-height: 1.45; }
/* onglets du bas */
.m-tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; display: flex; background: var(--bg-topbar); border-top: 1px solid var(--border-soft); padding: 4px calc(4px + var(--sar)) calc(48px + var(--sab)) calc(4px + var(--sal)); } /* au-dessus du badge Netlify */
.m-tabs button { flex: 1; min-width: 0; min-height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border: 0; background: transparent; color: var(--text-dim); font-size: 11px; font-weight: 600; cursor: pointer; border-radius: 10px; }
.m-tabs button .ti { font-size: 21px; line-height: 1; } .m-tabs button.on { color: var(--accent-text); background: rgba(var(--accent), .12); }
/* fenêtres du bas */
.m-ov { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,.62); display: flex; align-items: flex-end; justify-content: center; animation: mfade .15s; }
.m-sheet { width: 100%; max-width: 640px; max-height: 92dvh; overflow-y: auto; background: var(--bg-menu); border: 1px solid var(--border-color); border-bottom: 0; border-radius: 18px 18px 0 0; padding: 8px 16px calc(18px + var(--sab)); animation: mup .2s; }
.m-sheet .grab { width: 44px; height: 5px; border-radius: 3px; background: var(--border-color); margin: 4px auto 10px; }
.m-sheet h2 { font-size: 17px; margin: 4px 0 12px; display: flex; align-items: center; gap: 8px; } .m-sheet h2 .grow { flex: 1; }
@keyframes mup { from { transform: translateY(40px); opacity: .4; } } @keyframes mfade { from { opacity: 0; } }
.m-toast { position: fixed; left: 50%; bottom: calc(86px + var(--sab)); transform: translate(-50%, 20px); z-index: 200; max-width: 90vw; padding: 11px 18px; border-radius: 12px; background: #111; color: #fff; border: 1px solid rgba(var(--accent), .6); font-size: 14px; opacity: 0; pointer-events: none; transition: .2s; text-align: center; }
.m-toast.show { opacity: 1; transform: translate(-50%, 0); }
.m-qr { background: #fff; border-radius: 12px; padding: 6px; width: min(86vw, 380px); margin: 6px auto; } .m-qr svg { display: block; width: 100%; height: auto; }
.m-credit { text-align: center; color: var(--text-dim); font-size: 11.5px; margin: 22px 0 6px; }
@media (min-width: 761px) { body.xm { max-width: 520px; margin: 0 auto; border-left: 1px solid var(--border-soft); border-right: 1px solid var(--border-soft); } .m-tabs { max-width: 520px; left: 50%; transform: translateX(-50%); } }
@media print { .m-top, .m-tabs, .m-fab { display: none !important; } }

/* CALL SHEETO XIII — mobile */
.cs-days { position: sticky; top: calc(61px + var(--sat)); z-index: 30; display: flex; gap: 8px; overflow-x: auto; padding: 8px calc(12px + var(--sar)) 6px calc(12px + var(--sal)); background: var(--bg-main); border-bottom: 1px solid var(--border-soft); scrollbar-width: none; }
.cs-days::-webkit-scrollbar { display: none; }
.cs-days[hidden], #cs-ret[hidden], #cs-fab[hidden], #cs-tabs[hidden] { display: none !important; }
.cs-day { flex: 0 0 auto; min-height: 44px; padding: 4px 14px; border-radius: 12px; border: 1px solid var(--btn-border); background: var(--btn-bg); color: var(--text-main); font-size: 15px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.15; cursor: pointer; }
.cs-day small { font-size: 11px; font-weight: 500; color: var(--text-muted); }
.cs-day.on { background: rgba(var(--accent), .4); border-color: rgba(var(--accent), .95); }
.cs-hero h2 { margin: 0 0 2px; font-size: 19px; line-height: 1.2; }
.cs-hero .sub { color: var(--text-muted); font-size: 14px; }
.cs-hero .meta { color: var(--text-dim); font-size: 12.5px; margin-top: 6px; }
.cs-edit { position: absolute; top: 8px; right: 8px; }
.cs-rel { position: relative; }
.cs-keys { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-bottom: 12px; }
.cs-key { min-width: 0; overflow: hidden; background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 14px; padding: 8px 10px 6px; display: block; }
.cs-key span { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--text-dim); }
.xm .cs-key input[type=time] { background: transparent; border: 0; padding: 0; min-height: 44px; font-size: clamp(20px, 6vw, 26px); font-weight: 700; color: var(--accent-text); width: 100%; min-width: 0; box-shadow: none; letter-spacing: .02em; }
.xm .cs-key input[type=time]:focus { box-shadow: none; }
.cs-key.main { border-color: rgba(var(--accent), .6); background: linear-gradient(180deg, rgba(var(--accent), .14), var(--bg-panel)); }
.cs-wx { display: flex; align-items: center; gap: 14px; }
.cs-wx .ico { font-size: 44px; line-height: 1; }
.cs-wx .t { font-size: 28px; font-weight: 700; } .cs-wx .t small { font-size: 16px; color: var(--text-dim); font-weight: 500; }
.cs-wx .l { color: var(--text-muted); font-size: 13.5px; }
.cs-chips { display: flex; flex-wrap: wrap; gap: 6px 8px; margin-top: 10px; }
.cs-sun { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
.cs-sun div { background: var(--bg-panel-alt); border: 1px solid var(--border-soft); border-radius: 10px; padding: 7px 10px; }
.cs-sun span { display: block; font-size: 11.5px; color: var(--text-dim); } .cs-sun b { font-size: 18px; } .cs-sun small { display: block; font-size: 11px; color: var(--text-dim); }
.cs-bar { position: relative; margin: 30px 6px 28px; }
.cs-bar .b { height: 14px; border-radius: 7px; }
.cs-bar .mk { position: absolute; top: -4px; bottom: -4px; width: 2px; background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.5); }
.cs-bar .mk span { position: absolute; bottom: calc(100% + 2px); left: 50%; transform: translateX(-50%); font-size: 10.5px; white-space: nowrap; color: var(--text-muted); font-weight: 600; }
.cs-bar .mk.lo span { bottom: auto; top: calc(100% + 2px); }
.cs-bar .ax { display: flex; justify-content: space-between; font-size: 10px; color: var(--text-dim); margin-top: 20px; }
.cs-alert { padding: 9px 12px; border-radius: 10px; margin-bottom: 8px; font-size: 13.5px; background: rgba(255,167,38,.12); border: 1px solid rgba(255,167,38,.45); }
.cs-alert.red { background: rgba(229,57,53,.13); border-color: rgba(229,57,53,.5); } .cs-alert.ok { background: rgba(102,187,106,.12); border-color: rgba(102,187,106,.45); }
.cs-pre { white-space: pre-wrap; word-break: break-word; font-size: 14.5px; line-height: 1.5; }
.cs-pre:empty::before { content: attr(data-empty); color: var(--text-dim); }

.cs-sch:last-child { border-bottom: 0; }

.cs-sch .body b { display: block; } .cs-sch .body small { display: block; color: var(--text-dim); font-size: 12.5px; }
.cs-sch.ev { background: rgba(var(--accent), .08); } .cs-sch.ev .body b { font-weight: 600; color: var(--accent-text); }
.cs-seq { display: inline-block; min-width: 28px; text-align: center; padding: 1px 7px; border-radius: 8px; background: rgba(var(--accent), .22); font-weight: 700; margin-right: 6px; font-size: 13px; }
.cs-ie { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 99px; border: 1px solid var(--border-color); color: var(--text-muted); margin-right: 6px; }
/* équipe */
.cs-band { display: flex; align-items: center; gap: 8px; margin: 16px 4px 6px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--text-muted); }
.cs-band i { width: 12px; height: 12px; border-radius: 4px; display: inline-block; }
.cs-p { display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 12px; border-bottom: 1px solid var(--border-soft); }
.cs-p:last-child { border-bottom: 0; }
.cs-p .body { flex: 1; min-width: 0; text-align: left; background: transparent; border: 0; color: inherit; padding: 2px 0; font-size: 15px; cursor: pointer; }
.cs-p .body b { display: block; } .cs-p .body small { display: block; color: var(--text-dim); font-size: 12.5px; }
.cs-p .tm { display: inline-block; font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 99px; background: rgba(var(--accent), .2); margin: 3px 4px 0 0; }

.cs-loc .m-actions > * { flex: 1 1 100px; }

.cs-sos a { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 70px; border-radius: 14px; background: rgba(229,57,53,.15); border: 1px solid rgba(229,57,53,.6); color: var(--text-main); text-decoration: none; text-align: center; padding: 6px; }
.cs-sos a b { font-size: 26px; line-height: 1.1; color: #ef5350; } .cs-sos a span { font-size: 11.5px; color: var(--text-muted); line-height: 1.15; }
.cs-sos a.sm { grid-column: span 1; }
.cs-who { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border-soft); } .cs-who:last-child { border-bottom: 0; }
.cs-who .grow { flex: 1; min-width: 0; } .cs-who small { display: block; color: var(--text-dim); font-size: 12.5px; }
.cs-risk { padding: 8px 0; border-bottom: 1px solid var(--border-soft); font-size: 14px; } .cs-risk:last-child { border-bottom: 0; } .cs-risk b { display: block; }
.cs-rk { display: flex; align-items: flex-start; gap: 12px; padding: 10px 2px; border-bottom: 1px solid var(--border-soft); } .cs-rk:last-child { border-bottom: 0; } .cs-rk small { display: block; color: var(--text-dim); font-size: 12.5px; }
.cs-nav { display: grid; grid-template-columns: 1fr; gap: 8px; }
.cs-home p { color: var(--text-muted); }
.cs-steps { counter-reset: s; list-style: none; margin: 0 0 6px; padding: 0; } .cs-steps li { counter-increment: s; position: relative; padding: 6px 0 6px 34px; font-size: 14.5px; } .cs-steps li::before { content: counter(s); position: absolute; left: 0; top: 5px; width: 24px; height: 24px; border-radius: 50%; background: rgba(var(--accent), .3); text-align: center; line-height: 24px; font-weight: 700; font-size: 13px; }

.cs-key input[type=time]::-webkit-calendar-picker-indicator { display: none; }

// ---------- Différences par rapport à l'envoi du bureau (= le patch de retour) ----------
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
function diffList(list, b, c) {
    const keys = LIST_KEYS[list], bm = new Map(b.map(x => [x.id, x])), cm = new Map(c.map(x => [x.id, x]));
    const out = { mod: {}, add: [], del: [] };
    c.forEach(it => {
        const o = bm.get(it.id);
        if (!o) { out.add.push(clone(it)); return; }
        const ch = {}; keys.forEach(k => { if (!same(o[k], it[k])) ch[k] = it[k]; });
        if (Object.keys(ch).length) out.mod[it.id] = ch;
    });
    b.forEach(o => { if (!cm.has(o.id)) out.del.push(o.id); });
    const ids = c.map(x => x.id), expect = b.filter(o => cm.has(o.id)).map(o => o.id).concat(out.add.map(x => x.id));
    if (!same(ids, expect)) out.order = ids;
    if (!Object.keys(out.mod).length && !out.add.length && !out.del.length && !out.order) return null;
    return out;
}
function diffDay(b, c) {
    const out = {}; let n = 0;
    const set = {}; DAY_KEYS.forEach(k => { if (!same(b[k], c[k])) { set[k] = c[k]; n++; } });
    const times = {}; Object.keys(c.times).forEach(k => { if (!same(b.times[k], c.times[k])) { times[k] = c.times[k]; n++; } });
    const safety = {}; SAFE_KEYS.forEach(k => { if (!same(b.safety[k], c.safety[k])) { safety[k] = c.safety[k]; n++; } });
    const lists = {};
    Object.keys(LIST_KEYS).forEach(l => { const r = diffList(l, b[l], c[l]); if (r) { lists[l] = r; n += Object.keys(r.mod).length + r.add.length + r.del.length + (r.order ? 1 : 0); } });
    if (Object.keys(set).length) out.set = set; if (Object.keys(times).length) out.times = times; if (Object.keys(safety).length) out.safety = safety; if (Object.keys(lists).length) out.lists = lists;
    return n ? { patch: out, n } : null;
}
function buildPatch() {
    if (!S) return null; const days = {}; let n = 0;
    S.days.forEach(c => { const b = byId(S.base, c.id); if (!b) return; const r = diffDay(b, c); if (r) { days[c.id] = r.patch; n += r.n; } });
    return n ? { v: 1, project: S.meta.name || S.name, sent: S.ts, count: n, days } : null;
}
function countChanges() { const p = buildPatch(); return p ? p.count : 0; }

// ---------- Météo (Open-Meteo, facultative : nécessite du réseau) ----------
async function refreshWx() {
    const d = D(), l = wxLoc(d); if (!l) return; if (!d.date) { XM.toast('Définissez la date de la journée'); return; }
    const diff = daysBetween(todayISO(), d.date);
    if (diff > 15) { UI.wx = { msg: 'Prévision disponible à partir du ' + fmtDateShort(addDays(d.date, -15)) }; render(); return; }
    const archive = diff < -60;
    UI.wx = { busy: true }; render();
    try {
        const dv = archive ? 'weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,wind_speed_10m_max,wind_gusts_10m_max' : 'weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,wind_speed_10m_max,wind_gusts_10m_max,uv_index_max';
        const url = `https://${archive ? 'archive-api' : 'api'}.open-meteo.com/v1/${archive ? 'archive' : 'forecast'}?latitude=${l.lat}&longitude=${l.lon}&timezone=auto&start_date=${d.date}&end_date=${d.date}&daily=${dv}&wind_speed_unit=kmh`;
        const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 12000);
        const r = await fetch(url, { signal: ctl.signal }); clearTimeout(to); const j = await r.json(); if (j.error) throw new Error(j.reason);
        const Dy = j.daily || {}, g = k => Dy[k] ? Dy[k][0] : null;
        if (g('temperature_2m_max') == null) throw new Error('Réponse vide');
        d.weather = { date: d.date, tz: j.timezone || '', fetchedAt: Date.now(), src: archive ? 'archive' : 'forecast', daily: { code: g('weather_code'), tmax: g('temperature_2m_max'), tmin: g('temperature_2m_min'), psum: g('precipitation_sum'), pp: g('precipitation_probability_max'), wind: g('wind_speed_10m_max'), gust: g('wind_gusts_10m_max'), uv: g('uv_index_max') } };
        UI.wx = {}; persist(); XM.toast('🌦️ Météo actualisée');
    } catch (e) { UI.wx = { msg: 'Météo indisponible (pas de connexion ?)' }; }
    render();
}
function computeAlerts(d) {
    const out = [], w = d.weather && d.weather.date === d.date ? d.weather.daily : null, s = sunInfo(d), R = d.safety.risks, e = tmin(d.times.wrap);
    if (w) {
        if (w.pp != null && w.pp >= 60) out.push(['red', `🌧️ Pluie probable (${w.pp} %) : bâches, parapluies, housses matériel, plan de repli intérieur.`]);
        else if (w.pp != null && w.pp >= 35) out.push(['', `🌦️ Risque d'averses (${w.pp} %) : protections pluie à portée de main.`]);
        else if (w.pp == null && w.psum >= 0.5) out.push(['', `🌧️ Précipitations relevées (${w.psum} mm).`]);
        if (w.gust >= 60) out.push(['red', `💨 Rafales jusqu'à ${Math.round(w.gust)} km/h : lester pieds et cadres, pas de nacelle, drone interdit.`]);
        else if (w.gust >= 40) out.push(['', `💨 Vent soutenu (rafales ${Math.round(w.gust)} km/h) : lester pieds et cadres${R.includes('drone') ? ', vol drone à valider' : ''}.`]);
        else if (w.gust >= 30 && R.includes('drone')) out.push(['', `🚁 Rafales ${Math.round(w.gust)} km/h : vol drone à valider par le télépilote.`]);
        if (w.code >= 95) out.push(['red', "⛈️ Orage prévu : arrêt des travaux en hauteur et en extérieur, mise à l'abri, matériel électrique protégé."]);
        if (w.tmax >= 30) out.push(['red', `🌡️ Forte chaleur (${Math.round(w.tmax)}°) : eau en continu, ombre, pauses, protection solaire.`]);
        if (w.tmin <= 3) out.push(['', `🥶 Froid (${Math.round(w.tmin)}°${w.tmin <= 0 ? ', risque de verglas' : ''}) : vêtements chauds, boissons chaudes, abri chauffé.`]);
        if (w.uv != null && w.uv >= 6) out.push(['', `🕶️ Indice UV élevé (${Math.round(w.uv)}) : crème solaire, casquettes, ombre.`]);
        if (w.code === 45 || w.code === 48) out.push(['', '🌫️ Brouillard : prudence sur la route.']);
    }
    if (s && s.set && e != null) { const setM = Math.round(localH(s.set, s.tz) * 60); if (e > setM + 20) out.push(['', `🌙 Fin prévue après le coucher du soleil (${fmtT(s.set, s.tz)}) : éclairer circulations et parking.`]); }
    return out;
}

function fieldHTML(f, v) {

    else inp = `<input id="${id}" type="${f.t || 'text'}"${f.t === 'tel' ? ' inputmode="tel"' : ''}${f.t === 'number' ? ' inputmode="numeric"' : ''}${ph} value="${esc(v)}" autocomplete="off">`;

}
function formHTML(fields, get) {

// ouvre une feuille d'édition ; extra : [{label, cls, run(sh)}]
function editor(o) {

    $('#ed-ok', sh).onclick = () => { const v = readForm(sh, o.fields); if (o.save(v) !== false) { XM.closeSheet(); persist(); render(); } };
    (o.extra || []).forEach((x, i) => { const b = $(`[data-x="${i}"]`, sh); if (b) b.onclick = () => x.run(sh, () => readForm(sh, o.fields)); });

}

    if (!d || !Array.isArray(d.days) || !d.days.length) throw new Error('Envoi vide : aucune journée');
    if (S && !S.example) { const n = countChanges(); if (n) { const i = await XM.ask('Remplacer la feuille ?', `Le téléphone contient <b>${n} modification(s)</b> non renvoyée(s). La nouvelle feuille les remplacera.`, [{ label: 'Remplacer', danger: true }, 'Annuler']); if (i !== 0) return; } }
    adopt(d, env.name, false); render(); XM.toast('✓ Feuille reçue : ' + (S.meta.name || S.name || 'projet') + ' (' + S.days.length + ' journée' + (S.days.length > 1 ? 's' : '') + ')', 3500);

    const L1 = { id: uid(), type: 'decor', name: 'Quai de Valmy — passerelle', address: 'Quai de Valmy, 75010 Paris', lat: 48.8721, lon: 2.3637, tz: 'Europe/Paris', access: 'Métro Jacques Bonsergent (L5). Accès piéton uniquement côté quai.', contact: 'Régisseur adjoint', phone: '06 00 00 00 02', code: '' };
    const L2 = { id: uid(), type: 'base', name: 'Base régie', address: 'Rue de Lancry, 75010 Paris', lat: 48.8703, lon: 2.3610, tz: 'Europe/Paris', access: 'Local au rez-de-chaussée, code porte 4512B.', contact: '', phone: '', code: 'RDC — 4512B' };
    const L3 = { id: uid(), type: 'park_tech', name: 'Parking camions', address: 'Boulevard de Magenta, 75010 Paris', lat: 48.8738, lon: 2.3590, tz: 'Europe/Paris', access: 'Emplacements réservés par arrêté, côté pair.', contact: '', phone: '', code: '' };
    d.locations = [L1, L2, L3]; d.wxLocId = L1.id;
    d.schedule = [
        { id: uid(), ev: true, time: '07:30', desc: 'Convocation — petit-déjeuner à la cantine' },

        { id: uid(), ev: false, time: '10:30', seq: '13', ie: 'EXT / JOUR', loc: L1.id, desc: 'Hugo court le long du quai.', roles: 'Hugo', pages: '4/8' },
        { id: uid(), ev: true, time: '13:00', desc: 'REPAS' },
        { id: uid(), ev: false, time: '14:00', seq: '27', ie: 'EXT / JOUR', loc: L1.id, desc: 'Retrouvailles sur l’écluse.', roles: 'Léa, Hugo', pages: '2' },
        { id: uid(), ev: false, time: '17:30', seq: '28', ie: 'EXT / JOUR', loc: L1.id, desc: 'Plan drone du canal, lumière de fin de journée.', roles: '—', pages: '1/8' }];
    d.crew = [['prod', 'Directrice de production', 'Camille Martin', '06 00 00 00 01', 'camille@exemple.fr'], ['regie', 'Régisseur général', 'Julien Petit', '06 00 00 00 02', 'julien@exemple.fr'], ['real', 'Réalisatrice', 'Sarah Leroy', '06 00 00 00 03', ''], ['real', '1er assistant réal.', 'Nicolas Roux', '06 00 00 00 04', 'nicolas@exemple.fr'],
        ['image', 'Chef opérateur', 'Thomas Moreau', '06 00 00 00 05', ''], ['image', '1er assistant caméra', 'Inès Garnier', '06 00 00 00 06', ''], ['elec', 'Chef électricien', 'Karim Benali', '06 00 00 00 07', ''], ['son', 'Chef opérateur son', 'Lucie Faure', '06 00 00 00 08', ''],
        ['cast', 'Léa', 'Emma Dubois', '06 00 00 00 09', '', '08:00', '07:15'], ['cast', 'Hugo', 'Paul Bernard', '06 00 00 00 10', '', '10:00', '09:15'], ['secu', 'Télépilote drone', 'Marc Vidal', '06 00 00 00 11', '']
    ].map(r => ({ id: uid(), dept: r[0], role: r[1], name: r[2], phone: r[3], email: r[4], call: r[5] || '', hmc: r[6] || '', note: '' }));
    d.safety = Object.assign(blankSafety(), { risks: ['voie', 'eau', 'drone'], referent: 'Julien Petit', referentPhone: '06 00 00 00 02', firstAid: 'Nicolas Roux (SST)', firstAidPhone: '06 00 00 00 04', assembly: 'Trousse de secours et extincteur à la base régie — rassemblement square Villemin', hospital: { name: 'Hôpital Lariboisière (urgences)', address: '2 Rue Ambroise Paré, 75010 Paris', phone: '01 49 95 65 65', lat: 48.8829, lon: 2.3527 } });
    d.practical = 'Parking équipe impossible sur place : venir en transports.\nTenue : chaussures fermées, vêtements chauds pour la fin de journée.';

    d.weather = { date: d.date, tz: 'Europe/Paris', fetchedAt: Date.now(), src: 'forecast', daily: { code: 2, tmax: 19, tmin: 11, psum: 0.2, pp: 20, wind: 18, gust: 35, uv: 3 } };
    const d2 = clone(d); d2.id = uid(); d2.name = 'J4'; d2.dayNum = 4; d2.date = addDays(d.date, 1); d2.title = 'Studio — int. jour'; d2.weather = null;

// ---------- Événements ----------
document.addEventListener('click', e => {
    const dayBtn = e.target.closest('[data-day]'); if (dayBtn && S) { S.cur = +dayBtn.dataset.day; UI.wx = {}; persist(); render(); window.scrollTo(0, 0); return; }
    const tab = e.target.closest('#cs-tabs [data-tab]'); if (tab) { UI.tab = tab.dataset.tab; render(); window.scrollTo(0, 0); return; }
    const a = e.target.closest('[data-act]'); if (!a) return;
    const act = a.dataset.act, id = a.dataset.id;
    if (act === 'homeLink') XM.importLink(APP, onEnv); else if (act === 'homeFile') XM.importFile(APP, onEnv);
    else if (act === 'example') { const x = exampleData(); adopt(x, x.meta.name, true); render(); XM.toast('📐 Exemple chargé : explorez les onglets du bas'); }
    else if (!S) return;
    else if (act === 'editInfo') editInfo(); else if (act === 'editText') editText(a.dataset.k);
    else if (act === 'wx') refreshWx(); else if (act === 'sortSched') { D().schedule.sort((p, q) => (tmin(p.time) ?? 9999) - (tmin(q.time) ?? 9999)); persist(); render(); XM.toast('⇅ Programme trié par heure'); }
    else if (act === 'addSched') schEdit(null, true, !!a.dataset.ev); else if (act === 'schEdit') schEdit(id);
    else if (act === 'crewEdit') crewEdit(id); else if (act === 'locEdit') locEdit(id);
    else if (act === 'nav') navSheet(byId(D().locations, id)); else if (act === 'navPoi') navSheet(D().safety[a.dataset.k] || {});
    else if (act === 'editPeople') editPeople(); else if (act === 'poiEdit') poiEdit(a.dataset.k); else if (act === 'extraEdit') extraEdit(+a.dataset.i); else if (act === 'editRisks') editRisks();
});
document.addEventListener('change', e => {
    const t = e.target; if (!S) return;
    if (t.dataset.set) { const p = t.dataset.set.split('.'); D()[p[0]][p[1]] = t.value; persist(); render(); }
    else if (t.dataset.li) { const it = byId(D()[t.dataset.li], t.dataset.id); if (it) { it[t.dataset.k] = t.value; persist(); render(); } }
});
document.addEventListener('input', e => { if (e.target.id === 'cs-q') { UI.q = e.target.value; $('#cs-crewlist').innerHTML = crewList(D()); } });
$('#cs-fab').onclick = () => {
    if (!S) return;
    if (UI.tab === 'crew') crewEdit(null, true); else if (UI.tab === 'loc') locEdit(null, true);
    else if (UI.tab === 'prog') { const sh = XM.sheet(`<div class="m-actions" style="margin-top:0"><button class="m-btn primary block" id="a-seq">🎬 Séquence</button><button class="m-btn block" id="a-ev">⏱ Événement (repas, déplacement…)</button></div>`, { title: '➕ Ajouter au programme' }); $('#a-seq', sh).onclick = () => { XM.closeSheet(); schEdit(null, true, false); }; $('#a-ev', sh).onclick = () => { XM.closeSheet(); schEdit(null, true, true); }; }
};
$('#cs-ret').onclick = sendReturn;
$('#cs-menu').onclick = openMenu;

// ---------- Démarrage ----------
(async function start() {
    const saved = XM.load(APP); if (saved && Array.isArray(saved.days) && saved.days.length) { S = saved; S.days = S.days.map(normDay); S.cur = Math.min(S.cur || 0, S.days.length - 1); }
    const got = await XM.fromHash(APP, onEnv); void got;
    render();
})();
window.CSM = { get S() { return S; }, buildPatch, normDay, adopt, render, UI };
})();

</script>
