            (sizeK > 6e6 ? '<p class="xvt-w">⚠️ Documents lourds (' + Math.round(sizeK * 0.75 / 1048576) + ' Mo) : la publication peut être lente.</p>' : '') + '</section>' +
            '<section><h4>⚙️ Options</h4><label class="xvt-k" style="display:block">Message d’accueil pour le client<textarea data-msg rows="2" placeholder="Ex. Bonjour Isabelle, voici le planning et les intentions pour le tournage du 12. Vos retours sont les bienvenus !">' + esc(s.msg) + '</textarea></label>' +
            '<label class="xvt-k"><input type="checkbox" data-com' + (s.comments ? ' checked' : '') + '> Autoriser les commentaires et validations du client</label><label class="xvt-k">Lien valable <select data-days>' + [30, 90, 180, 365].map(n => '<option' + (n === (s.days || 180) ? ' selected' : '') + ' value="' + n + '">' + n + ' jours</option>').join('') + '</select> après la dernière mise à jour</label></section>' +
            '<section><h4>🚀 Publication</h4><div data-pubzone>' + (s.id ? '<div class="xvt-pub"><div><p class="xvt-d" style="margin:0">Publiée le ' + new Date(s.at).toLocaleString('fr-FR', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) + '. Republiez après chaque modification : le lien ne change pas.</p><div class="xvt-link"><input readonly value="' + esc(s.url || urlOf(s)) + '"><button data-copy>📋</button></div><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="p" data-pub>🔄 Mettre à jour</button><button data-open>↗ Ouvrir</button>' + (navigator.share ? '<button data-share>📤 Partager…</button>' : '') + '<button data-unpub>🗑️ Dépublier</button></div></div>' + (typeof XQRS !== 'undefined' ? '<div class="xvt-qr">' + XQRS.svg(s.url || urlOf(s), { ecl: 'M', border: 2 }) + '</div>' : '') + '</div>' : '<button class="p" data-pub>🌐 Publier la vitrine</button> <button data-local>⬇️ Page .html autonome (sans commentaires)</button>') + '</div><div data-pubmsg></div></section>' +
            (s.id ? '<section><h4>💬 Retours du client <button data-refresh>↻</button></h4><div data-com-list><p class="xvt-d">Chargement…</p></div></section>' : '') + '</div>';
        const q = x => ov.querySelector(x), qa = x => ov.querySelectorAll(x), save = () => { const n = st(); qa('[data-s]').forEach(c => n.sec[c.dataset.s] = c.checked ? 1 : 0); n.contacts = q('[data-contacts]').checked; n.comments = q('[data-com]').checked; n.msg = q('[data-msg]').value; n.days = +q('[data-days]').value; qa('[data-on]').forEach(c => { const d = n.docs.find(x => x.id === c.dataset.on); if (d) d.on = c.checked ? 1 : 0; }); W(KS, n); };

        q('[data-prev]').onclick = async () => { save(); try { const code = await packed(); const w = window.open(base() + 'projet.html#' + code, '_blank'); if (!w) alert('Autorisez les fenêtres pour l’aperçu'); } catch (e) { alert('Aperçu impossible : ' + e.message); } };
        qa('[data-del]').forEach(b => b.onclick = async () => { const n = st(); n.docs = n.docs.filter(d => d.id !== b.dataset.del); W(KS, n); await dput(b.dataset.del, null); open(); });
        qa('[data-up]').forEach(b => b.onclick = () => { const n = st(), i = n.docs.findIndex(d => d.id === b.dataset.up); if (i > 0) { const t = n.docs[i]; n.docs[i] = n.docs[i - 1]; n.docs[i - 1] = t; W(KS, n); open(); } });
        q('[data-collect]').onclick = () => collectUI();
        const msg = h => { q('[data-pubmsg]').innerHTML = h; };
        qa('[data-pub]').forEach(b => b.onclick = async () => { save(); b.disabled = true; b.textContent = '⏳ Publication…'; try { const r = await publish(); open(); setTimeout(() => { const m = document.querySelector('#xvt [data-pubmsg]'); if (m) m.innerHTML = '<p class="xvt-d">✅ Vitrine publiée (' + Math.round(r.size / 1024) + ' Ko).</p>'; }, 30); } catch (e) { b.disabled = false; b.textContent = '🌐 Publier la vitrine';
            msg(e.message === 'serveur' ? '<p class="xvt-w">⚠️ Le service de vitrines n’est pas encore activé sur le serveur XIII. En attendant : « 👁 Aperçu » donne un lien qui contient toute la vitrine (sans commentaires), ou la page .html autonome.</p><div style="display:flex;gap:6px"><button data-fb-link>🔗 Lien sans serveur</button><button data-local2>⬇️ Page .html autonome</button></div>' : '<p class="xvt-w">⚠️ ' + esc(e.message) + '</p>');
            const fb = q('[data-fb-link]'); if (fb) fb.onclick = async () => { const code = await packed(), url = base() + 'projet.html#' + code; try { await navigator.clipboard.writeText(url); fb.textContent = '📋 Lien copié (' + Math.round(url.length / 1024) + ' Ko)'; } catch (x) { prompt('Lien de la vitrine', url); } };
            const l2 = q('[data-local2]'); if (l2) l2.onclick = local; } });
        const lc = q('[data-local]'); if (lc) lc.onclick = local;
        const cp = q('[data-copy]'); if (cp) cp.onclick = async () => { const i = q('.xvt-link input'); try { await navigator.clipboard.writeText(i.value); cp.textContent = '✓'; } catch (e) { i.select(); document.execCommand('copy'); } };
        const op = q('[data-open]'); if (op) op.onclick = () => window.open(st().url || urlOf(st()), '_blank');
        const sh = q('[data-share]'); if (sh) sh.onclick = () => navigator.share({ title: (f.title || 'Projet') + ' — vitrine', text: s.msg || 'La vitrine du projet', url: st().url || urlOf(st()) }).catch(() => { });
        const up = q('[data-unpub]'); if (up) up.onclick = async () => { if (!confirm('Dépublier la vitrine ? Le lien ne fonctionnera plus et les commentaires du client seront supprimés.')) return; await unpublish(); open(); };

        async function local() { save(); try { const code = await packed(); const v = await (await fetch(base() + 'projet.html', { cache: 'no-store' })).text(); const page = v.replace('/*XVT_EMBED*/', 'window.XVT_EMBED=' + JSON.stringify(code) + ';'); const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([page], { type: 'text/html' })); a.download = ('Vitrine ' + (f.title || 'projet')).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\w.-]+/g, '_') + '.html'; document.body.appendChild(a); a.click(); a.remove(); } catch (e) { alert('Page impossible : ' + e.message); } }
    }
    async function loadComments(ov) {
        const box = ov.querySelector('[data-com-list]'); if (!box) return; const L = await comments();
        if (L == null) { box.innerHTML = '<p class="xvt-w">Commentaires indisponibles (serveur injoignable).</p>'; return; }
        const s = st(); const maxId = L.reduce((a, c) => Math.max(a, c.id), 0); if (maxId > (s.seen || 0)) { s.seen = maxId; W(KS, s); }
        const SN = { fiche: 'Le projet', plan: 'Planning', mood: 'Intentions & moodboard' }; s.docs.forEach(d => SN[d.id] = d.title);
        box.innerHTML = L.length ? L.slice().reverse().map(c => '<div class="xvt-c ' + c.kind + (c.resolved ? ' res' : '') + '"><b>' + (c.kind === 'ok' ? '✅ Validé' : c.kind === 'change' ? '✏️ Modification demandée' : '💬') + ' · ' + esc(c.author) + '</b> <small>' + esc(SN[c.section] || c.section || 'Général') + ' · ' + new Date(c.at).toLocaleString('fr-FR', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) + '</small>' + (c.body ? '<div>' + esc(c.body) + '</div>' : '') + (c.reply ? '<div class="rp">↪ ' + esc(c.reply) + '</div>' : '') + '<div class="a"><button data-rep="' + c.id + '">↪ Répondre</button><button data-res="' + c.id + '" data-v="' + (c.resolved ? 0 : 1) + '">' + (c.resolved ? '↺ Rouvrir' : '✓ Traité') + '</button></div></div>').join('') : '<p class="xvt-d">Pas encore de retour du client.</p>';
        box.querySelectorAll('[data-rep]').forEach(b => b.onclick = async () => { const c = L.find(x => x.id == b.dataset.rep), t = prompt('Réponse visible par le client', c.reply || ''); if (t == null) return; try { await answer(c.id, null, t); loadComments(ov); } catch (e) { alert(e.message); } });
        box.querySelectorAll('[data-res]').forEach(b => b.onclick = async () => { try { await answer(+b.dataset.res, b.dataset.v === '1', null); loadComments(ov); } catch (e) { alert(e.message); } });
    }

        css(); const ov = document.getElementById('xvt'); const box = ov.querySelector('.xvt-box'), s = st();
        const has = a => { const k = { storyboardo: 'storyboardoXIII.project', moodo: 'moodoXIII.project', plano: 'planoXIII.project', syno: 'synoptique_projects', conduco: 'conducoXIII.project', decoup: 'decoupXIII.project', repero: 'reperoXIII.project', callsheeto: 'callsheetoXIII.project', deviso: 'devisoXIII.project', posto: 'postoXIII.project', casto: 'castoXIII.project' }[a]; return (localStorage.getItem(k) || '').length > 300; };
        const DEF = { storyboardo: 1, plano: 1, moodo: 0, syno: 0, conduco: 1, decoup: 0, repero: 1, callsheeto: 0, deviso: 0, posto: 0, casto: 0 };

    return { init, open, close, publish, payload, card, addDoc, comments };
